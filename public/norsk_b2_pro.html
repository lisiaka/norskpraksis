<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>B2 Norsk Trening</title>
<!-- B2 Norsk design system (see specs/DESIGN-RULES.md in the monorepo root) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="b2-norsk.css"/>
<style>
:root{--color-primary:#1a6b4a;--color-primary-hover:#2d9e6b;--color-border-light:#eee;--color-border:#ccc;--color-text-muted:#888;--color-danger:#c0392b;--color-warning:#e8901a;--radius-sm:4px;--radius-md:12px;--radius-lg:24px;--font-xs:11px;--font-sm:13px;--font-base:15px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;color:#1a1a1a;font-size:var(--font-base);line-height:1.5;}
button{cursor:pointer;font-family:inherit;transition:all .15s;}
button:hover{opacity:.88;}
button:active{transform:scale(.98);}
input,select,textarea{font-family:inherit;outline:none;}
input:focus,select:focus,textarea:focus{border-color:#2d9e6b!important;box-shadow:0 0 0 3px rgba(45,158,107,.15);}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#c8d4f8;border-radius:var(--radius-sm);}
#app{max-width:none;margin:0;padding:0 32px 40px 252px;min-height:100vh;}
.header{background:transparent;border:none;border-radius:0;padding:16px 0;margin-bottom:20px;color:#1a1a1a;}
.header h1,.header p{display:none;}
.header-top{display:flex;justify-content:flex-end;align-items:center;gap:12px;}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e0e4ec;border-radius:var(--radius-lg);padding:6px 14px;font-size:var(--font-sm);font-weight:600;color:#444;white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0;}
.user-badge:hover{border-color:#1a6b4a;color:#1a6b4a;background:#f0fdf8;}
.user-badge .ub-icon{font-size:var(--font-base);}
/* ── Login screen ── */
#login-screen{position:fixed;inset:0;background:var(--canvas);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-dialog);padding:40px 36px;max-width:380px;width:100%;box-shadow:var(--shadow-dialog);text-align:center;}
.login-card .login-logo{width:56px;height:56px;margin-bottom:16px;}
.login-card h2{font-size:var(--t-page);font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:-.01em;}
.login-card p{font-size:var(--t-sm);color:var(--ink-3);margin-bottom:var(--s-4);line-height:1.6;}
.login-input{width:100%;height:var(--h-field);padding:0 14px;border-radius:var(--r-btn);border:1px solid var(--line-strong);font-size:var(--t-base);text-align:center;font-family:inherit;margin-bottom:var(--s-2);box-sizing:border-box;background:var(--surface);color:var(--ink);}
.login-input:focus{border-color:var(--green)!important;border-width:1.5px;outline:none;}
.login-btn{width:100%;height:var(--h-field);background:var(--green);color:#fff;border:none;border-radius:var(--r-btn);font-size:var(--t-base);font-weight:600;cursor:pointer;transition:background .15s;}
.login-btn:hover{background:var(--green-hover);}
.login-btn:disabled{opacity:.4;cursor:default;}
.login-hint{font-size:var(--t-sm);color:var(--ink-3);margin-top:var(--s-2);}
/* ── Sidebar navigation ── */
.tabs{position:fixed;top:0;left:0;bottom:0;width:236px;background:#fff;border-right:1px solid #e0e4ec;display:flex;flex-direction:column;padding:0;overflow-y:auto;z-index:100;border-radius:0;box-shadow:none;margin:0;gap:0;}
.card{background:#fff;border-radius:var(--radius-md);padding:22px 24px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid #e8ecf0;margin-bottom:14px;}
.card h2{font-size:var(--font-base);color:#1a6b4a;font-weight:800;margin-bottom:14px;letter-spacing:-.1px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-row2{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:flex-end;margin-bottom:10px;}
.field-label{font-size:var(--font-xs);color:#777;display:block;margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.text-input{width:100%;padding:10px 13px;border-radius:var(--radius-md);border:1.5px solid #e0e4ec;font-size:var(--font-base);background:#fff;}
.sel{padding:10px 13px;border-radius:var(--radius-md);border:1.5px solid #e0e4ec;font-size:var(--font-base);background:#fff;width:100%;}
/* Primary variant — main call-to-action. See app/CLAUDE.md § Button, chip, and icon conventions. */
.btn-primary{padding:10px 22px;background:#1a6b4a;color:#fff;border:none;border-radius:var(--radius-md);font-size:var(--font-base);font-weight:700;white-space:nowrap;}
.btn-primary:hover{background:#155c3d;}
.btn-primary:disabled{background:#c3d6cc;cursor:not-allowed;}
/* Secondary variant — neutral/secondary action. See app/CLAUDE.md § Button, chip, and icon conventions. */
.btn-secondary{padding:9px 18px;background:#f5f7fa;border:1.5px solid #e0e4ec;border-radius:var(--radius-md);font-size:var(--font-sm);color:#555;font-weight:500;}
.btn-secondary:hover{border-color:#2d9e6b;color:#1a6b4a;}
.btn-secondary:disabled{opacity:.5;cursor:not-allowed;}
.hint{font-size:var(--font-xs);color:var(--color-text-muted);margin-top:6px;}
.io-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
/* Feature 025: color/border/typography now come from .btn-secondary (added at every
   call site alongside this class) — .btn-io only supplies its own padding. */
.btn-io{padding:8px 16px;}
.io-hint{font-size:var(--font-xs);color:var(--color-text-muted);margin-left:4px;}
.search-box{width:100%;padding:10px 14px;border-radius:var(--radius-md);border:1.5px solid #e0e4ec;font-size:var(--font-base);background:#fff;margin-bottom:14px;}
.topic-filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:12px;background:#fff;border-radius:var(--radius-md);border:1px solid #e8ecf0;align-items:center;}
.topic-chip{padding:6px 14px;border-radius:var(--radius-lg);font-size:var(--font-sm);font-weight:600;background:#f5f7fa;border:1.5px solid #e0e4ec;color:#555;cursor:pointer;transition:all .2s;}
.topic-chip:hover{border-color:#2d9e6b;background:#e8f5ee;}
.topic-chip.active{background:#1a6b4a;color:#fff;border-color:#1a6b4a;}
/* Feature 026: filter-block collapse toggle. Deliberately plain (no border, no
   background) so it reads as a small utility control above the filter block, not
   as another chip or button competing with the filters it hides/shows. */
.filter-toggle-btn{background:none;border:none;padding:2px 0 8px;margin:0;font-size:var(--font-xs);font-weight:700;color:var(--color-text-muted);cursor:pointer;text-transform:uppercase;letter-spacing:.5px;}
.filter-toggle-btn:hover{color:#1a6b4a;}
.word-topic-tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:var(--radius-md);font-size:var(--font-xs);font-weight:700;background:#f0e68c;color:#776;}
.cat-section{background:#fff;border-radius:var(--radius-md);padding:18px;margin-bottom:12px;border:1px solid #e8ecf0;}
.cat-title{font-size:var(--font-xs);color:var(--color-text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.word-chip{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 12px;background:#f8fdf9;border-radius:var(--radius-md);border-left:3px solid #ddd;}
.word-chip .wn{font-weight:600;color:#222;font-size:var(--font-base);word-break:break-word;}
.word-chip .wm{color:var(--color-text-muted);font-size:var(--font-xs);margin-top:2px;word-break:break-word;}
.word-chip .w-forklaring{color:#4a7a62;font-size:var(--font-xs);font-style:italic;margin-top:3px;word-break:break-word;}
.btn-del{background:none;border:none;color:var(--color-border);font-size:18px;padding:0 3px;line-height:1;flex-shrink:0;margin-left:6px;}
.btn-del:hover{color:var(--color-danger);opacity:1;}
.btn-learnt{background:none;border:none;color:var(--color-border);font-size:var(--font-base);padding:0 3px;line-height:1;flex-shrink:0;margin-left:6px;cursor:pointer;}
.btn-learnt:hover{color:#2d9e6b;}
.btn-learnt.on{color:#1a6b4a;font-weight:700;}
.empty-state{text-align:center;padding:56px 20px;background:#fff;border-radius:var(--radius-md);color:var(--color-text-muted);}
.empty-state .big{font-size:48px;margin-bottom:12px;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.topic-card{background:#fff;border-radius:var(--radius-md);padding:22px 20px;border:1px solid #e8ecf0;cursor:pointer;transition:border-color .15s;text-align:left;}
.topic-card:hover{border-color:#2d9e6b;}
.topic-emoji{font-size:36px;margin-bottom:10px;}
.topic-name{font-weight:700;font-size:var(--font-base);color:#222;margin-bottom:4px;}
.topic-count{font-size:var(--font-sm);color:var(--color-text-muted);margin-bottom:14px;}
.topic-badge{display:inline-block;padding:5px 14px;border-radius:var(--radius-lg);font-size:var(--font-sm);font-weight:600;}
.prompt-panel{margin-top:20px;background:#fff;border-radius:var(--radius-lg);border:2px solid #e8e8e8;overflow:hidden;}
.prompt-panel-header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #f0f0f0;font-weight:700;font-size:var(--font-base);}
.prompt-list-item{display:flex;align-items:flex-start;gap:12px;padding:13px 18px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .15s;}
.prompt-list-item:last-child{border-bottom:none;}
.prompt-list-item:hover{background:#f8f8ff;}
.prompt-list-item-title{font-weight:700;font-size:var(--font-base);margin-bottom:3px;}
.prompt-list-item-text{font-size:var(--font-sm);color:#555;line-height:1.5;}
.prompt-list-arrow{flex-shrink:0;font-size:18px;margin-top:2px;color:var(--color-text-muted);}
.custom-oppgave-box{padding:16px 18px;background:#f9f9ff;border-top:2px dashed #dde;}
.custom-oppgave-box textarea{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:var(--radius-md);border:1.5px solid #ccd;font-size:var(--font-base);font-family:inherit;line-height:1.6;resize:vertical;min-height:80px;}
.write-layout{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start;}
@media(max-width:720px){.write-layout{grid-template-columns:1fr;}}
.prompt-box{border-radius:var(--radius-md);padding:20px;margin-bottom:14px;}
.prompt-box .prompt-tag{font-size:var(--font-xs);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.prompt-box .prompt-text{font-size:var(--font-base);line-height:1.7;color:#2a2a2a;}
.prompt-box .hint-bar{margin-top:12px;padding:8px 12px;background:#fff;border-radius:var(--radius-md);font-size:var(--font-sm);color:#444;}
.progress-wrap{margin-bottom:10px;}
.progress-meta{display:flex;justify-content:space-between;font-size:var(--font-sm);margin-bottom:4px;color:#666;}
.progress-track{background:#e8eef0;border-radius:var(--radius-sm);height:7px;overflow:hidden;}
.progress-fill{height:100%;border-radius:var(--radius-sm);transition:width .4s;}
.success-msg{text-align:center;color:#2d9e6b;font-size:var(--font-sm);margin-top:6px;font-weight:600;}
.essay-area{width:100%;min-height:340px;padding:18px;border-radius:var(--radius-md);border:1.5px solid #dde;font-size:var(--font-base);line-height:1.8;resize:vertical;background:#fff;}
.essay-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:var(--font-sm);color:var(--color-text-muted);}
.action-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
/* Primary call-to-action — used for the bank save/assign actions, which were
   previously easy to miss against the form fields above them. */
/* Feature 025: color/border/typography now come from .btn-primary (added at every
   call site alongside this class) — .btn-cta only supplies the centered block layout. */
.btn-cta{display:block;width:100%;max-width:320px;margin:0 auto;padding:11px 24px;cursor:pointer;box-shadow:0 2px 8px rgba(26,107,74,.22);transition:background .15s,box-shadow .15s,transform .05s;}
.btn-cta:hover:not(:disabled){box-shadow:0 5px 16px rgba(26,107,74,.32);}
.btn-cta:active:not(:disabled){transform:translateY(1px);}
.btn-cta:disabled{box-shadow:none;cursor:not-allowed;}
.sidebar{position:sticky;top:16px;}
.sidebar .card{margin-bottom:12px;}
.sidebar .card h3{font-size:var(--font-base);color:#1a6b4a;font-weight:700;margin-bottom:12px;}
.sidebar-chips{max-height:440px;overflow-y:auto;padding-right:2px;display:grid;gap:5px;}
.wb-chip{padding:7px 10px;border-radius:var(--radius-md);border-left:3px solid #ddd;background:#f9f9f9;}
.wb-chip.used{background:#edfaf3;border-left-color:#2d9e6b;}
.wb-chip.used .wn{color:#1a6b4a;font-weight:700;}
.wb-chip .wn{font-size:var(--font-sm);font-weight:600;color:#444;}
.wb-chip .wm{font-size:var(--font-xs);color:var(--color-text-muted);margin-top:1px;}
.essay-word-list{max-height:300px;overflow-y:auto;padding-right:2px;display:grid;gap:4px;font-size:var(--font-xs);}
.essay-word-item{padding:6px 8px;border-radius:var(--radius-sm);background:#f8fdf9;border-left:3px solid #2d9e6b;}
.essay-word-item .wn{font-weight:600;color:#1a6b4a;margin-bottom:2px;}
.essay-word-item .wm{color:var(--color-text-muted);font-size:var(--font-xs);}
.essay-word-item .sent{color:#555;font-size:var(--font-xs);margin-top:3px;font-style:italic;max-height:40px;overflow-y:auto;}
.tips-box{background:#fffdf0;border-radius:var(--radius-md);padding:14px;border:1px solid #f0e68c;}
.tips-title{font-size:var(--font-xs);font-weight:700;color:var(--color-warning);margin-bottom:8px;}
.tip-item{font-size:var(--font-xs);color:#776;margin-bottom:4px;display:flex;gap:6px;}
.tip-dot{color:#f0c040;flex-shrink:0;}
/* Settings card */
.settings-card{background:#fff;border-radius:var(--radius-md);padding:14px 18px;margin-bottom:14px;border:1.5px dashed #e0e4ec;}
.settings-card h3{font-size:var(--font-sm);color:var(--color-text-muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.key-row{display:flex;gap:8px;align-items:center;}
.key-input{flex:1;padding:8px 12px;border-radius:var(--radius-md);border:1.5px solid #dde;font-size:var(--font-sm);font-family:monospace;background:#fafafa;letter-spacing:.5px;}
.key-input:focus{border-color:#2d9e6b!important;box-shadow:0 0 0 3px rgba(45,158,107,.1);}
.btn-save-key{padding:8px 16px;background:#1a6b4a;color:#fff;border:none;border-radius:var(--radius-md);font-size:var(--font-sm);font-weight:700;white-space:nowrap;flex-shrink:0;}
.key-status{font-size:var(--font-xs);margin-top:6px;min-height:16px;}
/* Grammar / Claude result */
.grammar-result{margin-top:14px;}
.grammar-ok{padding:10px 14px;background:#edfaf3;border-left:4px solid #2d9e6b;color:#1a6b4a;border-radius:var(--radius-md);font-weight:600;font-size:var(--font-sm);}
.grammar-error{background:#fff5f5;border-left:3px solid var(--color-danger);padding:8px 10px;margin-bottom:6px;border-radius:var(--radius-sm);font-size:var(--font-xs);color:#555;}
.grammar-error .em{color:var(--color-danger);font-weight:700;}
.claude-result{border-radius:var(--radius-md);overflow:hidden;border:1px solid #e0e8e0;}
.claude-header{padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--font-base);}
.claude-header.ok{background:#edfaf3;color:#1a6b4a;}
.claude-header.err{background:#fff5f5;color:var(--color-danger);}
.claude-header.warn{background:#fffdf0;color:var(--color-warning);}
.claude-body{padding:14px 16px;background:#fff;}
.claude-overall{font-size:var(--font-sm);color:#444;margin-bottom:10px;line-height:1.55;}
.claude-error-card{background:#fff5f5;border-left:3px solid var(--color-danger);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:7px;}
.claude-error-text{font-weight:700;color:var(--color-danger);font-size:var(--font-xs);margin-bottom:2px;}
.claude-error-issue{font-size:var(--font-xs);color:#666;margin-bottom:3px;}
.claude-error-fix{font-size:var(--font-xs);color:#2d9e6b;font-weight:600;}
.grammar-error .sug{color:#2d9e6b;margin-left:4px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 24px;border-radius:var(--radius-md);font-size:var(--font-base);font-weight:500;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;}
.toast.show{opacity:1;}
.word-input-row{display:flex;gap:6px;}
.btn-lookup{padding:10px 13px;background:#f0f4f8;border:1.5px solid #dde;border-radius:var(--radius-md);font-size:var(--font-base);flex-shrink:0;color:#555;line-height:1;}
.btn-lookup:hover{background:#e8f5ee;border-color:#2d9e6b;}
.btn-lookup:disabled{opacity:.45;cursor:default;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{display:inline-block;animation:spin .8s linear infinite;}
/* ── Essay bank ── */
.essay-bank-empty{font-size:var(--t-sm);color:var(--ink-3);text-align:center;padding:var(--s-4) 0;}
.saved-essay-row{background:var(--surface);border-radius:var(--r-btn);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;transition:border-color .15s,background .15s;cursor:pointer;}
.saved-essay-row:hover{border-color:var(--green);background:var(--green-tint-2);}
.saved-essay-info{flex:1;min-width:0;}
.saved-essay-title{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-weight:600;font-size:var(--t-base);color:var(--ink);margin-bottom:3px;}
.saved-essay-meta{font-size:var(--t-sm);color:var(--ink-3);line-height:1.5;}
.saved-essay-level{display:inline-block;padding:2px 8px;border-radius:var(--r-tag);font-size:var(--t-mono);font-weight:700;}
/* Destructive variant — delete/remove action. See app/CLAUDE.md § Button, chip, and icon conventions. */
.btn-destructive{padding:5px 10px;background:#fff5f5;border:1.5px solid var(--danger);border-radius:var(--r-btn);font-size:var(--t-sm);color:var(--danger);font-weight:600;}
/* ── Lesing reader layout ── */
.lesing-reader-layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start;}
@media(max-width:780px){.lesing-reader-layout{grid-template-columns:1fr;}}
.lesing-lookup-panel{position:sticky;top:16px;}
.lesing-lookup-panel .card{margin-bottom:10px;}
.lesing-lookup-panel .card h3{font-size:var(--font-sm);color:#1a6b4a;font-weight:700;margin-bottom:10px;}
.lookup-word-input{width:100%;padding:9px 12px;border-radius:var(--radius-md);border:1.5px solid #dde;font-size:var(--font-base);font-family:inherit;margin-bottom:8px;}
.lookup-word-input:focus{border-color:#2d9e6b!important;outline:none;box-shadow:0 0 0 3px rgba(45,158,107,.13);}
.lookup-result-box{background:#f8fdf9;border-radius:var(--radius-md);padding:10px 12px;margin-bottom:8px;font-size:var(--font-sm);line-height:1.6;min-height:36px;}
.lookup-in-bank{background:#edfaf3;border-left:3px solid #2d9e6b;border-radius:var(--radius-md);padding:8px 12px;font-size:var(--font-sm);margin-bottom:8px;}
.lookup-in-bank .wn{font-weight:700;color:#1a6b4a;}
.lookup-in-bank .wm{color:#777;font-size:var(--font-xs);}
/* ── Tekst til tale ── */
.tts-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;background:#f8fdf9;border:1.5px solid #d4edda;border-radius:var(--radius-md);margin-bottom:16px;}
.btn-tts-main{display:flex;align-items:center;gap:6px;padding:7px 14px;background:#2d9e6b;border:none;border-radius:var(--radius-md);color:#fff;font-size:var(--font-sm);font-weight:700;font-family:inherit;}
.btn-tts-main:hover{background:#268a5c;}
.btn-tts-stop{padding:7px 11px;background:#fff;border:1.5px solid #dde;border-radius:var(--radius-md);font-size:var(--font-sm);color:#666;font-family:inherit;}
.btn-tts-stop:hover{border-color:var(--color-danger);color:var(--color-danger);}
.btn-tts-stop:disabled{opacity:.4;}
.tts-rate{margin-left:auto;display:flex;gap:4px;}
.tts-rate button{padding:5px 10px;background:#fff;border:1.5px solid #dde;border-radius:var(--radius-sm);font-size:var(--font-xs);color:#666;font-family:inherit;font-weight:600;}
.tts-rate button.active{background:#edfaf3;border-color:#2d9e6b;color:#1a6b4a;}
/* A real icon-button footprint (was 2px/6px padding + no border/background —
   effectively invisible next to any other control on the page). Sized a step
   above the standard 24px .icon-btn since this one needs to read as a clearly
   clickable target on its own, not just inside a toolbar. */
.btn-tts{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;flex-shrink:0;background:var(--surface);border:1px solid var(--line-pill);border-radius:6px;color:var(--ink-2);cursor:pointer;}
.btn-tts:hover{border-color:var(--green);color:var(--green);background:var(--green-tint);}
.btn-tts.speaking{border-color:var(--green);color:var(--green);background:var(--green-tint);animation:ttsPulse 1s ease-in-out infinite;}
@keyframes ttsPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.22);}}
.tts-word{border-radius:var(--radius-sm);transition:background .08s linear;}
.tts-word.tts-now{background:#ffe9a8;box-shadow:0 0 0 2px #ffe9a8;}
/* ── Word Sort (Setningsbygging) game ── */
.ws-pool-area{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:12px;background:var(--surface-sunk);border-radius:var(--r-btn);border:1.5px dashed var(--line-strong);margin-bottom:12px;align-content:flex-start;}
.ws-answer-area{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;background:var(--surface);border-radius:var(--r-btn);border:2px solid var(--green);margin-bottom:14px;align-items:flex-start;align-content:flex-start;}
.ws-answer-area.empty{border-color:var(--line);background:var(--surface-sunk);}
.ws-token{padding:8px 14px;border-radius:var(--r-pill);background:var(--green-tint);border:1.5px solid var(--green);color:var(--green);font-size:var(--t-base);font-weight:600;cursor:pointer;transition:all .15s;user-select:none;line-height:1.3;}
.ws-token:hover{background:var(--green-tint-2);}
.ws-token.in-pool{background:var(--surface-head);border-color:var(--line-strong);color:var(--ink-2);}
.ws-token.in-pool:hover{background:var(--surface-sunk);border-color:var(--green);color:var(--green);}
.ws-token.selected{background:var(--green);color:#fff;border-color:var(--green);}
.ws-correct-box{background:var(--green-tint);border-left:4px solid var(--green);border-radius:var(--r-btn);padding:12px 16px;font-size:var(--t-base);color:var(--green);font-weight:700;margin-top:14px;line-height:1.6;}
.ws-wrong-box{background:var(--tema-helse-bg);border-left:4px solid var(--danger);border-radius:var(--r-btn);padding:12px 16px;font-size:var(--t-base);color:var(--ink-2);margin-top:14px;line-height:1.6;}
.ws-wrong-original{color:var(--green);font-style:italic;margin-top:6px;font-size:var(--t-sm);}
/* ── Read indicator on text cards ── */
.lesing-read-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-md);font-size:var(--font-xs);font-weight:700;background:#edfaf3;color:#2d9e6b;border:1px solid #b6e8ce;margin-bottom:8px;}
.lesing-unread-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-md);font-size:var(--font-xs);font-weight:700;background:#f5f5f5;color:var(--color-text-muted);border:1px solid #e0e0e0;margin-bottom:8px;}
/* ── Paywall overlay ── */
.paywall-overlay{position:absolute;inset:0;border-radius:var(--radius-md);background:rgba(255,255,255,.92);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;z-index:2;}
.paywall-overlay .paywall-icon{font-size:28px;}
.paywall-overlay .paywall-title{font-weight:800;font-size:var(--font-base);color:#1a1a1a;}
.paywall-overlay .paywall-sub{font-size:var(--font-xs);color:#666;line-height:1.4;}
.paywall-overlay .paywall-btn{margin-top:4px;padding:8px 18px;background:#1a6b4a;color:#fff;border:none;border-radius:var(--radius-md);font-size:var(--font-sm);font-weight:700;cursor:pointer;}
.paywall-overlay .paywall-btn:hover{background:#15573c;}
/* Subscription status badge in Innstillinger */
.sub-status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-md);font-size:var(--font-xs);font-weight:700;}
.sub-status-badge.active{background:#edfaf3;color:#2d9e6b;border:1px solid #b6e8ce;}
.sub-status-badge.inactive{background:#f5f5f5;color:var(--color-text-muted);border:1px solid #e0e0e0;}
.sub-status-badge.grace{background:#fff8e1;color:#e6a817;border:1px solid #ffe082;}
.sub-status-badge.cancelled{background:#ffeaea;color:var(--color-danger);border:1px solid #f5b7b1;}
/* ── Statistics tab ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.stat-box{background:var(--surface, #fff);border-radius:var(--radius-md);padding:20px 18px;border:1px solid var(--line, #e8ecf0);text-align:center;}
.stat-box .stat-val{font-size:36px;font-weight:800;color:var(--green, #1a6b4a);line-height:1;}
.stat-box .stat-lbl{font-size:var(--font-xs);color:var(--color-text-muted);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.stat-box .stat-sub{font-size:var(--font-sm);color:var(--ink-2, #555);margin-top:4px;}
.stat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.stat-bar-label{font-size:var(--font-sm);color:var(--ink-2, #444);min-width:120px;font-weight:600;}
.stat-bar-track{flex:1;background:var(--color-border-light);border-radius:var(--radius-sm);height:10px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:var(--radius-sm);background:var(--green, #2d9e6b);transition:width .4s;}
.stat-bar-count{font-size:var(--font-xs);color:var(--color-text-muted);min-width:30px;text-align:right;}
.stat-word-row{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-radius:var(--radius-md);margin-bottom:4px;font-size:var(--font-sm);}
.stat-word-row.wrong{background:var(--tema-helse-bg, #fff5f5);color:var(--color-danger);}
.stat-word-row.right{background:#f0fdf4;color:var(--green, #1a6b4a);}
.stat-missed-list{max-height:340px;overflow-y:auto;border:1px solid var(--line, #f5e0e0);border-radius:var(--radius-md);padding:6px;}
/* ── Donut chart ── */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:8px;}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:150px;}
.donut-legend-row{display:flex;align-items:center;gap:8px;font-size:var(--font-sm);}
.donut-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.donut-legend-label{color:var(--ink-2, #555);flex:1;}
.donut-legend-val{font-weight:700;color:var(--ink, #222);}
/* ── FC error-only toggle ── */
.fc-toggle-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff5f5;border-radius:var(--radius-md);border:1.5px solid #f5cece;margin-bottom:8px;}
.fc-toggle-label{font-size:var(--font-sm);color:var(--color-danger);font-weight:600;flex:1;}
.toggle-btn{padding:5px 14px;border-radius:var(--radius-lg);border:1.5px solid #dde;background:#f0f4f8;font-size:var(--font-xs);font-weight:700;color:#666;cursor:pointer;}
.toggle-btn.on{background:var(--color-danger);border-color:var(--color-danger);color:#fff;}
/* ── Plan tab ──
   .plan-nav/-btn/-center, .plan-week-card/-hdr/-num/-topic/-dates/-body,
   .plan-summary-grid/-box/-val/-lbl, .plan-done-badge, .plan-go-btn(.sec) and
   .plan-chip(-row) were deleted here — buildPlanView() now builds those parts
   from .card/.btn/.stat-grid/.stat-box/tokens directly, the same components
   every other redesigned tab uses, rather than a Plan-only twin of each. */
.plan-session{padding:12px 0;border-top:1px solid var(--line-soft);}
.plan-session:first-child{border-top:none;padding-top:10px;}
.plan-session-title{font-weight:600;font-size:var(--t-sm);color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.plan-text-link{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface-sunk);border:1px solid var(--line-soft);border-radius:var(--r-btn);margin-bottom:5px;cursor:pointer;transition:background .15s,border-color .15s;text-decoration:none;}
.plan-text-link:hover{background:var(--green-tint-2);border-color:var(--green);}
.plan-text-link-title{flex:1;font-weight:600;color:var(--ink);font-size:var(--t-sm);}
.plan-text-read{opacity:.6;text-decoration:line-through;}
.plan-prog-wrap{background:var(--line);border-radius:var(--r-pill);height:7px;margin-bottom:3px;overflow:hidden;}
.plan-prog-fill{height:7px;border-radius:var(--r-pill);background:var(--green);transition:width .4s;}
/* "Alle uker" mini-overview — topic identity is a swatch dot (.plan-week-mini-swatch),
   same as everywhere else topic-is-colour, not the emoji this used to carry. */
.plan-week-mini{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:var(--r-btn);cursor:pointer;transition:background .15s;font-size:var(--t-sm);}
.plan-week-mini:hover{background:var(--surface-sunk);}
.plan-week-mini.cur{background:var(--green-tint);font-weight:700;}
.plan-week-mini-num{min-width:26px;font-size:var(--t-sm);color:var(--ink-3);font-weight:700;}
.plan-week-mini-swatch{width:9px;height:9px;border-radius:var(--r-pill);flex:none;}
.plan-week-mini-topic{flex:1;font-weight:600;color:var(--ink);}
.plan-week-mini-dots{display:flex;gap:3px;}
.plan-week-mini-dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);}
.plan-week-mini-dot.done{background:var(--green);}
/* ── Print / PDF export ── */
#pdf-print-area{display:none;}
@media print{
  body>*{display:none!important;}
  #pdf-print-area{display:block!important;font-family:'Georgia',serif;max-width:720px;margin:0 auto;padding:20px;}
  #pdf-print-area .pdf-header{border-bottom:2px solid #1a6b4a;padding-bottom:12px;margin-bottom:20px;}
  #pdf-print-area .pdf-app-name{font-size:var(--font-xs);color:var(--color-text-muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
  #pdf-print-area .pdf-title{font-size:22px;font-weight:bold;color:#1a1a1a;margin-bottom:4px;}
  #pdf-print-area .pdf-topic{font-size:var(--font-sm);color:#555;}
  #pdf-print-area .pdf-prompt{background:#f5f5f5;border-left:4px solid #1a6b4a;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:var(--font-sm);line-height:1.6;color:#333;}
  #pdf-print-area .pdf-body{font-size:var(--font-base);line-height:1.9;color:#222;white-space:pre-wrap;}
  #pdf-print-area .pdf-footer{border-top:1px solid #ddd;margin-top:24px;padding-top:10px;font-size:var(--font-xs);color:var(--color-text-muted);display:flex;justify-content:space-between;}
}
.lookup-status{font-size:var(--font-xs);margin-top:5px;min-height:16px;line-height:1.5;}
.lookup-status a{color:#1a6b4a;text-decoration:none;font-weight:600;}
.lookup-status a:hover{text-decoration:underline;}
/* ── Sentence practice ──
   Setninger itself is redesigned onto the b2-norsk.css component system —
   only the two classes still shared with (not yet redesigned) Flashcards
   remain here. See app/CLAUDE.md's design-system note. */
.sent-cat{display:inline-block;padding:3px 12px;border-radius:var(--radius-lg);font-size:var(--font-xs);font-weight:700;}
.sent-topic-badge{display:inline-block;padding:4px 10px;border-radius:var(--radius-lg);font-size:var(--font-xs);font-weight:700;background:#f0e68c;color:#776;}
.btn-skip{padding:10px 16px;background:#f5f7fa;border:1.5px solid #e0e4ec;border-radius:var(--radius-md);font-size:var(--font-sm);color:#666;font-weight:500;}
/* ── Flashcards ── the setup/header/filter chrome now lives on the
   b2-norsk.css component system; only the bespoke centered-card/option-grid
   layout below stays a purpose-built class, retokenized. */
.fc-card{background:var(--surface);border-radius:var(--r-dialog);padding:36px 28px 28px;text-align:center;border:1px solid var(--line);margin-bottom:var(--s-4);}
.fc-word{font-size:38px;font-weight:800;color:var(--green);margin-bottom:8px;word-break:break-word;line-height:1.2;}
.fc-sub{font-size:var(--t-base);color:var(--ink-3);margin-bottom:6px;font-style:italic;}
.fc-question{font-size:var(--t-sm);font-weight:600;color:var(--ink-3);margin-top:10px;text-transform:uppercase;letter-spacing:.4px;}
.fc-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:var(--s-3);}
@media(max-width:520px){.fc-options{grid-template-columns:1fr;}}
.fc-opt{padding:14px 16px;border-radius:var(--r-btn);border:1.5px solid var(--line-strong);background:var(--surface);font-size:var(--t-base);font-weight:600;color:var(--ink);text-align:center;cursor:pointer;transition:all .15s;line-height:1.4;}
.fc-opt:hover:not([disabled]){border-color:var(--green);background:var(--green-tint);color:var(--green);}
.fc-opt.correct{border-color:var(--green)!important;background:var(--green-tint)!important;color:var(--green)!important;}
.fc-opt.wrong{border-color:var(--danger)!important;background:var(--tema-helse-bg)!important;color:var(--danger)!important;}
.fc-opt.reveal{border-color:var(--green);background:var(--green-tint-2);color:var(--green);opacity:.65;}
.fc-opt[disabled]{cursor:default;}
.fc-feedback{text-align:center;margin-bottom:var(--s-3);min-height:48px;}
.fc-feedback-ok{font-size:20px;font-weight:800;color:var(--green);margin-bottom:4px;}
.fc-feedback-err{font-size:20px;font-weight:800;color:var(--danger);margin-bottom:4px;}
.fc-correct-hint{font-size:var(--t-sm);color:var(--ink-3);}
.fc-nav{display:flex;gap:var(--s-2);justify-content:center;flex-wrap:wrap;}
.fc-done{background:var(--surface);border-radius:var(--r-card);padding:50px 30px;text-align:center;border:1px solid var(--line);}
.fc-done-score{font-size:28px;font-weight:800;color:var(--green);margin-bottom:6px;}
.fc-done-pct{font-size:17px;color:var(--ink-3);margin-bottom:var(--s-4);}
</style>
</head>
<body>
<div id="login-screen" style="display:none">
  <div class="login-card">

    <h2>B2 Norsk Treningsverktøy</h2>

    <input id="reg-name" class="login-input" type="text" placeholder="Ditt navn" autocomplete="name" style="display:none;margin-bottom:var(--s-2)"/>
    <div id="reg-role" style="display:none;margin-bottom:var(--s-3);text-align:left;font-size:var(--t-base);color:var(--ink-2)">
      <div style="margin-bottom:6px;font-weight:600">Jeg er:</div>
      <label style="margin-right:20px;cursor:pointer"><input type="radio" name="reg-role-choice" value="student" checked style="margin-right:5px"/>Elev</label>

    <button id="login-btn" class="login-btn" style="margin-top:var(--s-2)" disabled>Logg inn →</button>
    <div style="text-align:center;margin-top:var(--s-3);font-size:var(--t-sm);color:var(--ink-3)">
      <span id="login-toggle-text">Ny bruker? </span><a id="login-toggle" href="#" style="color:var(--green);font-weight:600;text-decoration:none">Registrer deg</a>
    </div>

</div>

<div id="admin-screen" style="display:none;padding:24px;max-width:1200px;margin:0 auto;font-family:system-ui,sans-serif"></div>

  <div class="header" id="main-header">
    <h1>🇳🇴 B2 Prøve i Norsk — Treningsverktøy</h1>

<script>
// ── DATA ──────────────────────────────────────────────────────────────
const CATS = [
  {key:"enkeltord",   label:"Enkeltord",        color:"#4f6ef7"},
  {key:"uttrykk",    label:"Uttrykk / fraser",  color:"#2d9e6b"},
  {key:"koblingsord",label:"Koblingsord",        color:"#e8901a"},
];
const CAT_MAP = Object.fromEntries(CATS.map(c => [c.key, c]));

const TOPICS = {
  arbeid:        {name:"Arbeid",                emoji:"💼", color:"#e8901a"},
  demokrati:     {name:"Demokrati",             emoji:"⚖️", color:"#4f6ef7"},
  familie:       {name:"Familie",               emoji:"👨‍👩‍👧", color:"#e05c5c"},
  helse:         {name:"Helse",                 emoji:"🏥", color:"#c0392b"},
  integrering:   {name:"Integrering og kultur", emoji:"🤝", color:"#1a9ec4"},
  internasjonalt:{name:"Internasjonalt",         emoji:"🌍", color:"#2980b9"},
  miljo:         {name:"Miljø og klima",         emoji:"🌿", color:"#2d9e6b"},
  natur:         {name:"Natur",                 emoji:"🏔️", color:"#27ae60"},
  politikk:      {name:"Politikk",              emoji:"🏛️", color:"#8e44ad"},
  sprak:         {name:"Språk",                 emoji:"🗣️", color:"#16a085"},
  teknologi:     {name:"Teknologi",             emoji:"💻", color:"#7c4dff"},
  utdanning:     {name:"Utdanning",             emoji:"🎓", color:"#d35400"},
};

// Feature 026: the one canonical topic-icon lookup, for topic filter chips elsewhere
// (Ordbank, Setninger, Flashcards, Lesing, Setningsbygging). Bridges VALID_TOPIC_LIST's
// real-character spelling (miljø, språk) to TOPICS' ASCII keys (miljo, sprak) — same
// conversion already used when navigating to Skriv. "" (Alle) and "generelt" have no
// TOPICS entry by design and resolve to no icon, not a missing one.
function topicIcon(topic){
  if(!topic) return "";
  const key = TOPICS[topic] ? topic : topic.replace(/ø/g,"o").replace(/å/g,"a").replace(/æ/g,"ae");
  return TOPICS[key]?.emoji || "";
}

// Feature 026: {emoji, color} lookup for text-card topic badges, same TOPICS source
// and same key-bridging as topicIcon() above. Falls back to a generic document icon
// for a topic TOPICS doesn't cover (e.g. "generelt"), never a guessed default.
function topicMeta(topic){
  if(!topic) return {emoji:"📄", color:"var(--color-text-muted)"};
  const key = TOPICS[topic] ? topic : topic.replace(/ø/g,"o").replace(/å/g,"a").replace(/æ/g,"ae");
  return TOPICS[key] || {emoji:"📄", color:"var(--color-text-muted)"};
}

// B2 Norsk design system (specs/DESIGN-RULES.md): tema is colour, never emoji.
// The --tema-*-bg/-fg custom properties in b2-norsk.css use the same ASCII keys
// as TOPICS (miljo, sprak), so the bridge is identical to topicIcon()'s.
function topicKeyAscii(topic){
  if(!topic) return "";
  return TOPICS[topic] ? topic : topic.replace(/ø/g,"o").replace(/å/g,"a").replace(/æ/g,"ae");
}
function topicTema(topic){
  const key = topicKeyAscii(topic) || "generelt";
  return {bg:`var(--tema-${key}-bg)`, fg:`var(--tema-${key}-fg)`};
}

// 13 canonical topic values used across word bank, flashcards, setninger, and lesing.
// Must stay in step with VALID_TOPICS in backend/app/schemas/word.py — a value known
// to one tier but not the other makes the affected rows invisible here rather than
// merely mislabelled, which is how 117 rows went missing before feature 013.
const VALID_TOPIC_LIST = [
  "arbeid","demokrati","familie","helse",
  "integrering","internasjonalt","miljø","natur",
  "politikk","språk","teknologi","utdanning",
  // General-purpose topic for words with no natural theme (roughly 62% of the bank:
  // "dessverre", "gi opp", "verdig"). A real member of the list, so words filed here
  // are filterable — not a sentinel and not a dumping ground for uncertain guesses.
  "generelt"
];

// Written where a topic is required but genuinely unknown. Never write a bare literal:
// that is exactly how "annet" entered the database.

// Maps common near-match strings to a canonical topic, or "" if unrecognised
function normalizeTopic(str){
  if(!str) return "";
  const s=str.trim().toLowerCase();
  const map={
    "arbeid":"arbeid","jobb":"arbeid","økonomi":"arbeid","yrke":"arbeid",
    "demokrati":"demokrati",
    "familie":"familie","barn":"familie",
    "helse":"helse","medisin":"helse","psykisk helse":"helse",
    "integrering":"integrering","innvandring":"integrering","kultur":"integrering","mangfold":"integrering",
    "internasjonalt":"internasjonalt","globalisering":"internasjonalt","internasjonal":"internasjonalt",
    "miljo":"miljø","miljø":"miljø","klima":"miljø","miljøvern":"miljø","natur og klima":"miljø",
    "natur":"natur","friluftsliv":"natur","dyr":"natur",
    "politikk":"politikk","politisk":"politikk",
    "sprak":"språk","språk":"språk","norsk":"språk","dialekt":"språk",
    "teknologi":"teknologi","digitalt":"teknologi","ai":"teknologi","data":"teknologi",
    "utdanning":"utdanning","skole":"utdanning","studie":"utdanning",
    "generelt":"generelt","generell":"generelt","annet":"generelt",
    // Legacy values from before the canonical list was enforced. Mapping them here
    // means an old export or a stale client re-imports as "generelt" rather than
    // silently becoming "" and disappearing from every filter.
    "rettsstat":"generelt","samfunn":"generelt",
  };
  return map[s]||"";
}

// Deep link into Bokmålsordboka. The old `bm,nn/search?q=` form now 404s, and their
// SPA turns that into a mangled `/bm,nn/undefined/bm,nn/<word>` route rather than an
// error page — so a stale URL here looks like our bug, not theirs.
//
// The infinitive marker is stripped because the dictionary is keyed on the bare
// headword: "å fremme" resolves, but only as a near match, while "fremme" lands on the
// article itself. Feature 013 stores verbs with the marker, so this is now the common
// case rather than an edge one.
function ordbokeneUrl(word){
  const headword=(word||"").trim().replace(/^å\s+/i,"");
  return `https://ordbokene.no/nob/bm,nn/${encodeURIComponent(headword)}`;
}

// A manual mark is terminal against the automatic threshold, in both directions — the
// server records which of the two manual states was chosen, so unmarking survives any
// number of further correct answers.
//
// Applied optimistically: marking words learnt is a sweep down a list, and waiting for
// a round trip per click turns that into a stutter. A failure reverts the card and says
// so, which is a rarer and more visible outcome than a laggy one.
async function setWordLearnt(wordId, learnt){
  const idx=state.words.findIndex(x=>x.id===wordId);
  if(idx<0)return false;
  const before=state.words[idx].learnt_state;
  state.words[idx]={...state.words[idx],learnt_state:learnt?"learnt_manual":"not_learnt_manual"};
  renderWordList();

  const r=await api(`/api/words/${encodeURIComponent(wordId)}/learnt`,
    {method:"PATCH",body:JSON.stringify({learnt})}).catch(()=>null);
  const cur=state.words.findIndex(x=>x.id===wordId);
  if(cur<0)return false; // deleted while the request was in flight
  if(!r||!r.ok){
    state.words[cur]={...state.words[cur],learnt_state:before};
    renderWordList();
    toast("Kunne ikke lagre. Prøv igjen.");
    return false;
  }
  const sv=await r.json();
  state.words[cur]={...state.words[cur],learnt_state:sv.learnt_state,learnt_at:sv.learnt_at};
  saveStorage();
  return true;
}

// ── Word provenance ────────────────────────────────────────────────────────
// A word added while reading records the text it came from. The two kinds live in
// separate id spaces: `builtin` ids index lesing-tekster.json, `custom` ids are the
// `asgn-<item_id>` handles minted in Mine oppgaver for teacher-written texts.
//
// The index is built once per session and only when a word actually has an origin —
// most learners have none, and neither fetch is worth making on their behalf. It is
// deliberately never invalidated: a text's body does not change under a learner.
const sourceTextIndex = {map:null, loading:null};

async function loadSourceTextIndex(){
  if(sourceTextIndex.map) return sourceTextIndex.map;
  if(sourceTextIndex.loading) return sourceTextIndex.loading;
  sourceTextIndex.loading = (async()=>{
    const map={};
    const texts = await loadLesingTexts().catch(()=>[]);
    (texts||[]).forEach(t=>{ map[`builtin:${t.id}`]={...t,isCustom:false}; });
    // Custom texts are only reachable through the assignment that delivered them, so
    // that request is made only when a word actually points into the custom id space —
    // otherwise a built-in origin would wait on a round trip that cannot resolve it.
    const r = state.words.some(w=>w.source_text_kind==="custom")
      ? await api("/api/assignments/mine").catch(()=>null) : null;
    if(r?.ok){
      const assignments = await r.json().catch(()=>[]);
      (assignments||[]).forEach(a=>(a.items||[]).forEach(it=>{
        if(it.item_type!=="reading_text" || it.content?.source==="bank") return;
        map[`custom:asgn-${it.item_id}`]={
          id:`asgn-${it.item_id}`, title:it.content?.title||"Egen tekst",
          topic:it.content?.topic||"", text:it.content?.body||"", isCustom:true,
        };
      }));
    }
    sourceTextIndex.map=map;
    sourceTextIndex.loading=null;
    return map;
  })();
  return sourceTextIndex.loading;
}

// Returns the originating text, or null when the word has no origin or the reference
// no longer resolves — a deleted assignment or a retired text id. Both are silent:
// provenance is a convenience, and an error where a learner expects a word is worse
// than the missing link (FR-041).
function resolveSourceText(w){
  if(!w || !w.source_text_id || !sourceTextIndex.map) return null;
  const kind = w.source_text_kind || "builtin";
  return sourceTextIndex.map[`${kind}:${w.source_text_id}`] || null;
}

/**
 * Master switch for the paywall. While false every user is treated as an active
 * subscriber: all reading texts are open, the free-tier counters are inert and
 * the payment UI in Innstillinger is replaced by a "full tilgang" note.
 * Set back to true to re-enable Vipps/PayPal gating — no other code changes needed.
 */
const SUBSCRIPTION_ENABLED = false;

const skFreeAccess = id => `b2_free_access_${id}`;

function loadFreeAccess(userId){
  try{
    const raw=localStorage.getItem(skFreeAccess(userId));
    if(raw) state.freeAccess=JSON.parse(raw);
    else state.freeAccess={openedTexts:[],topicsUsed:[]};
  }catch{ state.freeAccess={openedTexts:[],topicsUsed:[]}; }
}

function saveFreeAccess(userId){
  try{ localStorage.setItem(skFreeAccess(userId), JSON.stringify(state.freeAccess)); }catch{}
}

/**
 * Returns true if the current user can open a text.
 * Subscribers: always true.
 * Free users: max 3 texts total, max 1 per topic (already-opened texts are always accessible).
 */
function canOpenText(textId, topicKey){
  // Active subscriber — unrestricted
  if(isActiveSubscriber()) return true;
  // Already opened this text — allow re-read
  if(state.freeAccess.openedTexts.includes(textId)) return true;
  // Enforce limits
  if(state.freeAccess.openedTexts.length >= 3) return false;
  if(state.freeAccess.topicsUsed.includes(topicKey)) return false;
  return true;
}

/**
 * Record that a free user has opened a text.
 */
function recordTextOpened(textId, topicKey){
  if(isActiveSubscriber()) return; // subscribers don't need tracking
  if(!state.freeAccess.openedTexts.includes(textId)){
    state.freeAccess.openedTexts.push(textId);
  }
  if(!state.freeAccess.topicsUsed.includes(topicKey)){
    state.freeAccess.topicsUsed.push(topicKey);
  }
  saveFreeAccess(state.userId);
}

/**
 * Returns true if state.subscription grants active subscriber status.
 * Active = status "active", "grace", or "cancelled" with renewalDate still in future.
 */
function isActiveSubscriber(){
  if(!SUBSCRIPTION_ENABLED) return true; // paywall disabled — everyone has full access
  const sub=state.subscription;
  if(!sub) return false;
  if(sub.status==="active"||sub.status==="grace") return true;
  if(sub.status==="cancelled"&&sub.renewalDate){
    return new Date(sub.renewalDate)>new Date();
  }
  return false;
}

/**
 * Load subscription status from the backend.
 * Sets state.subscription (or null if not subscribed / on error).
 */
async function loadSubscription(userId){
  try{
    const r=await api(`/api/subscription/${encodeURIComponent(userId)}`);
    if(r&&r.ok){
      const data=await r.json();
      state.subscription=data&&data.status?data:null;
    } else {
      state.subscription=null;
    }
  }catch{ state.subscription=null; }
}

const IS_PROD_HOST = (_host === "norsk-b2-pro.pages.dev" || _host === "norsk.innovate-learning.no");
const API_BASE = IS_PROD_HOST
  ? "https://norskb2-backend-production.up.railway.app"
  : "https://norskb2-backend-staging.up.railway.app";

// The technical panel under an AI error is developer output, so teachers should not
// meet it. It shows automatically off production, and on production only after
// localStorage.setItem("b2_debug","1") — so support can enable it on one session
// when a failure is reported instead of debugging blind.
function diagEnabled(){
  if(!IS_PROD_HOST) return true;
  try{ return localStorage.getItem("b2_debug")==="1"; }catch(e){ return false; }
}
async function api(path, opts = {}){
  const headers = {"Content-Type":"application/json", ...(opts.headers||{})};
  if(state.sessionToken) headers["Authorization"] = `Bearer ${state.sessionToken}`;
  return fetch(`${API_BASE}${path}`, {...opts, headers});
}

// A Claude response can arrive as several text blocks. Reading only content[0]
// silently drops the rest, which shows up as a JSON parse error on a response
// that was actually complete — always concatenate.
function claudeText(data){
  const t = (data?.content||[]).filter(b=>b&&b.type==="text").map(b=>b.text||"").join("");
  return t || "{}";
}

// Snapshot of what Claude actually returned, captured before parsing so a failure
// can be reported precisely.
// `sysLen` is always null (feature 021): the browser no longer composes the
// system prompt, so it has no length to report. `appendClaudeDiag` and
// `reportAiFailure` both already treat a missing/non-number sysLen as "not
// available" rather than as zero.
function claudeDiag(data, userMsg){
  return {stop:data.stop_reason, usage:data.usage,
    blocks:(data.content||[]).map(b=>b.type).join(","),
    raw:claudeText(data), sysLen:null, userLen:userMsg.length};
}

// Collapsible technical panel shown after a Claude failure, so the exact stop_reason,
// token counts and response tail can be reported without opening DevTools.
function appendClaudeDiag(container, diag){
  if(!diag || !diagEnabled()) return;
  const det=el("details",{style:{marginTop:"8px",fontSize:"var(--font-xs)",color:"#666"}});
  det.appendChild(el("summary",{style:{cursor:"pointer"}},"Teknisk info (kopier denne ved feilrapport)"));
  const sysLenText = typeof diag.sysLen === "number" ? `${diag.sysLen} tegn` : "satt sammen på serveren";
  const info=`stop_reason: ${diag.stop}\nblokker: ${diag.blocks}\ntokens inn/ut: ${diag.usage?.input_tokens}/${diag.usage?.output_tokens}\nsystemprompt: ${sysLenText}\nbrukermelding: ${diag.userLen} tegn\nsvarlengde: ${diag.raw.length} tegn\n\nSISTE 400 TEGN AV SVARET:\n${diag.raw.slice(-400)}`;
  det.appendChild(el("pre",{style:{whiteSpace:"pre-wrap",wordBreak:"break-word",background:"#faf9f7",padding:"8px",borderRadius:"var(--radius-sm)",marginTop:"6px"}},info));
  container.appendChild(det);
}

// ── AI feedback transport (feature 015) ───────────────────────────────────
// The three feedback surfaces used to POST straight to /api/proxy/claude, a
// Cloudflare Function that forwarded the body verbatim — model, max_tokens,
// system and messages all the caller's choice, under the operator's credential.
// They now go to the backend, which picks the model and the answer length itself.
// ⚠️ **We no longer compose the wording at all (feature 021).** The three
// Norwegian prompt bodies moved server-side — see `app/services/report_prompts.py`
// and `app/services/report_block_defaults.py` in the backend — so a per-student
// report configuration can be generated by code that isn't served from a
// learner's own browser. `AI_TEMPLATE`/`AI_TEMPLATE_VERSION`, which named which
// prompt body a request declared, are gone with it — the server now declares its
// own template identity.

// Canonical vocabulary, mirroring AiSurface in backend/app/schemas/ai.py. Both
// literals are spelled the same on purpose — the backend rejects anything else
// with a 422 rather than defaulting, so a typo here fails loudly.
const AI_SURFACE={SENTENCE:"sentence",ESSAY:"essay",READING_SUMMARY:"reading_summary"};

// A learner cannot act on the difference between a missing credential, a rejected
// one and an exhausted quota — all three mean "carry on without it". The operator
// gets the distinction from the backend log; the learner gets one honest sentence.
function aiFailureMessage(status, reason, truncatedHint){
  if(status===401) return "Sesjonen er utløpt. Logg inn på nytt.";
  if(reason==="unusable_response" && truncatedHint) return truncatedHint;
  if(status===503) return reason==="quota_exhausted"
    ? "AI-hjelp er midlertidig utilgjengelig. Prøv igjen om litt."
    : "AI-hjelp er ikke tilgjengelig akkurat nå. Du kan fortsette uten den.";
  if(status===502) return "AI-hjelp svarte ikke som forventet. Prøv igjen om litt.";
  return `AI-hjelp feilet (${status}). Prøv igjen om litt.`;
}

// ── Failure reporting (019) ───────────────────────────────────────────────
// The backend records the five failures it classifies itself. This covers the
// ones it cannot see — above all a response that arrives *successfully* and
// then fails to parse, which the server counts as a success and which,
// before this, left no trace anywhere.
//
// Fire-and-forget, exactly like trackEvent: the learner already has an error on
// screen, and a second one caused by the reporting would be strictly worse than
// no report at all.
// A truncated answer and an unparseable one are both "the JSON did not parse",
// but they are different problems: one says ask for less, the other says the
// model returned the wrong shape. `stop_reason` is what tells them apart.
function aiFailureReasonFor(diag){
  return diag && diag.stop === "max_tokens" ? "unusable_response" : "unparseable_response";
}

function reportAiFailure(surface, reason, diag){
  try{
    const body = {surface, reason};
    if(diag){
      // Shape only. `raw` is the model's own answer and is capped here as a
      // courtesy — the backend truncates again, and that is the real limit.
      if(diag.stop) body.stop_reason = String(diag.stop).slice(0,32);
      if(diag.usage){
        body.input_tokens = diag.usage.input_tokens;
        body.output_tokens = diag.usage.output_tokens;
      }
      if(typeof diag.sysLen === "number") body.system_len = diag.sysLen;
      if(typeof diag.userLen === "number") body.user_len = diag.userLen;
      if(typeof diag.raw === "string"){
        body.response_len = diag.raw.length;
        body.response_excerpt = diag.raw.slice(-400);
      }
    }
    return api("/api/ai/failures", {method:"POST", body:JSON.stringify(body)})
      .then(()=>null).catch(()=>null);
  }catch(e){ return Promise.resolve(null); }
}

// Throws an Error whose message is already learner-ready Norwegian, flagged with
// `aiHandled` so the catch block prints it as-is instead of wrapping a raw
// technical string in "❌ Feil: ...".
// ⚠️ **The browser no longer composes the prompt at all (feature 021).** Until
// 020 this sent `system_base` (the prompt body minus the teacher steering
// block); the server now builds the entire base template itself — including
// any per-student report configuration a teacher has saved — so the request
// carries only `surface`, the learner's own message, and a content reference.
// `meta` carries `contentKind` and, where one exists, that reference.
//
// ⚠️ `meta.contentKind` is required by convention; a content **id** is not, and
// usually cannot be given. All three surfaces ask for feedback before the thing
// being assessed is saved — an essay lives in localStorage until after the reply
// arrives — so "essay, no id" is the ordinary case, not a gap to fill in.
//
// ⚠️ This shape needs a backend from 2026-09-05 or later (feature 021). Deploy
// the backend first; an older one still accepts this shape (`system`/`system_base`
// are optional there too, not required), so no coordination window is needed —
// but the report-configuration capability only exists once the new backend does.
async function requestAiFeedback(surface, userMsg, truncatedHint, meta){
  meta = meta || {};
  const res=await api("/api/ai/feedback",{
    method:"POST",
    body:JSON.stringify({
      surface,
      content_kind: meta.contentKind,
      essay_id: meta.essayId || null,
      sentence_id: meta.sentenceId || null,
      word_id: meta.wordId || null,
      reading_text_id: meta.readingTextId || null,
      messages:[{role:"user",content:userMsg}],
    }),
  });
  if(!res.ok){
    const body=await res.json().catch(()=>({}));
    const err=new Error(aiFailureMessage(res.status, body?.detail?.reason||"", truncatedHint));
    err.aiHandled=true;
    throw err;
  }
  return res.json();
}

async function fetchMyClass(force){
  if(state.myClass && !force) return state.myClass;
  try{
    const res = await api("/api/me/class");
    state.myClass = res.ok ? await res.json() : {class:null, classmates:[]};
  }catch(e){ state.myClass = {class:null, classmates:[]}; }

}

async function fetchSharedInbox(force){

  try{

    state.sharedInbox = res.ok ? await res.json() : {pending_count:0, items:[]};
  }catch(e){ state.sharedInbox = {pending_count:0, items:[]}; }
  return state.sharedInbox;
}

async function refreshSharing(){

// ── STATS / TRACKING ─────────────────────────────────────────────────
let statsCache = null;

async function loadStats(){
  try{
    const r = await api("/api/stats");
    if(!r.ok) return {events:[]};
    const raw = await r.json();
    // Normalize to flat event shape: {type, ts, ...payload}
    const events = (raw.events||[]).map(e=>({
      type: e.event_type,
      ts: e.created_at,
      ...(e.payload||{}),
    }));
    statsCache = {events};
    return statsCache;
  }catch(e){ return {events:[]}; }
}

// Returns the response body for callers that need it (the flashcard session reads
// `auto_learnt` back), but never rejects — tracking must not break the app.
function trackEvent(type, data){
  statsCache = null; // invalidate so next stats view re-fetches
  return api("/api/stats", {
    method:"POST",
    body:JSON.stringify({event_type:type, payload:data||{}}),
  }).then(r=>r.ok?r.json():null).catch(()=>null);
}

const skSents = id => `b2_sentences_${id}`;

  }).catch(()=>{});

async function syncWordsFromServer(){
  try{
    const r = await api("/api/words");
    if(!r.ok) return;
    const serverWords = await r.json();
    if(!Array.isArray(serverWords)) return;
    // Normalize server words: map created_at → createdAt timestamp
    state.words = serverWords.map(w=>({...w, createdAt: new Date(w.created_at).getTime()}));
    try{ localStorage.setItem(SK, JSON.stringify(state.words)); }catch{}
    renderWordList(); renderTabs();
  }catch(e){}
}

const SK_ESSAYS = "b2_essay_bank_v1";
const skEssays = id => `b2_essays_${id}`;
function loadEssayBank(){ try{ return JSON.parse(localStorage.getItem(skEssays(state.userId))||localStorage.getItem(SK_ESSAYS)||"[]"); }catch{ return []; } }
function saveEssayBank(bank){
  // Local cache only — server updated via individual create/delete calls
  try{ if(state.userId) localStorage.setItem(skEssays(state.userId), JSON.stringify(bank)); }catch{}
}
async function syncEssaysFromServer(){
  try{
    const r = await api("/api/essays");
    if(!r.ok){
      console.warn("[essays] sync failed, status:", r.status);
      return;
    }
    const serverEssays = await r.json();
    if(!Array.isArray(serverEssays)){
      console.warn("[essays] unexpected response:", serverEssays);
      return;
    }
    // Merge with any locally-only entries (those without a server-style UUID id)
    const serverIds = new Set(serverEssays.map(e=>e.id));
    const localOnly = loadEssayBank().filter(e=>!serverIds.has(e.id));
    const merged = [...serverEssays.map(e=>({
      id: e.id, title: e.title, text: e.text, topic: e.topic,
      promptId: e.prompt_id, claudeLevel: e.claude_level,
      claudeFeedback: e.claude_feedback||null,
      teacherReview: e.teacher_review||null,
      savedAt: new Date(e.created_at).getTime(),
    })), ...localOnly];
    saveEssayBank(merged);
    refreshEssayBank();
  }catch(e){ console.error("[essays] sync error:", e); }
}

async function saveCurrentEssay(){
  const ta=$("essay-ta");
  const essayText=(ta?ta.value:state.essay).trim();
  if(!essayText){toast("Ingen tekst å lagre – skriv noe først!");return;}
  const bank=loadEssayBank();
  const promptId=state.currentPrompt?.id||"";
  const snippet=essayText.substring(0,80);
  const existIdx=bank.findIndex(e=>e.promptId===promptId&&e.text.substring(0,80)===snippet);
  const entry={
    id: existIdx>=0?bank[existIdx].id:"essay_"+Date.now(),
    title: state.currentPrompt?.title||"Uten tittel",
    topic: state.currentTopic||"",
    topicName: state.currentTopic?(TOPICS[state.currentTopic]?.name||state.currentTopic):"",
    promptId,
    promptText: state.currentPrompt?.text||"",
    text: essayText,
    wordCount: wcCount(essayText),
    savedAt: new Date().toISOString(),
    claudeLevel: null,
  };
  if(existIdx>=0){ bank[existIdx]=entry; }else{ bank.unshift(entry); }
  saveEssayBank(bank);
  // Sync to server (fire-and-forget; on success update local id with server id)
  try{
    const r = await api("/api/essays",{method:"POST",body:JSON.stringify({
      title:entry.title, text:entry.text,
      topic:entry.topic||"annet",
      prompt_id:entry.promptId||null,
      claude_level:entry.claudeLevel||null,
      claude_feedback:entry.claudeFeedback||null,
    })});
    if(r.ok){
      const sv=await r.json();
      const b=loadEssayBank();
      const i=b.findIndex(e=>e.id===entry.id);
      if(i>=0){b[i].id=sv.id; saveEssayBank(b);}
    }
  }catch{}
  trackEvent("essay_saved",{title:entry.title,topic:entry.topic,topicName:entry.topicName,wordCount:entry.wordCount,promptId:entry.promptId});
  toast("✅ Stilen er lagret!");
  refreshEssayBank();
}

function deleteEssay(id){
  const bank=loadEssayBank().filter(e=>e.id!==id);
  saveEssayBank(bank);
  refreshEssayBank();
  api(`/api/essays/${encodeURIComponent(id)}`,{method:"DELETE"}).catch(()=>{});
}

async function loadEssayIntoEditor(entry){
  state.essay=entry.text;
  state.loadedEssayReview=entry.teacherReview||null;
  const ta=$("essay-ta"); if(ta) ta.value=entry.text;
  // Restore topic/prompt if different
  if(entry.topic && TOPICS[entry.topic]){
    state.currentTopic=entry.topic;
    const prompts=PROMPTS[entry.topic]||[];
    const found=prompts.find(p=>p.id===entry.promptId||p.text===entry.promptText);
    if(found) state.currentPrompt=found; else if(prompts.length) state.currentPrompt=prompts[0];
  }
  updateWritePanel();
  renderTabs(); renderContent();

  // Restore saved Claude feedback if available
  if(entry.claudeFeedback){
    try{
      const result = typeof entry.claudeFeedback==="string" ? JSON.parse(entry.claudeFeedback) : entry.claudeFeedback;
      const container=$("essay-grammar-result");
      if(container){ container.style.display="block"; renderEssayClaudeResult(result, container); }
    }catch{}
  }

  // If no teacher review cached, fetch fresh from server in case it was added since last sync
  if(!entry.teacherReview && entry.id && !entry.id.startsWith("essay_")){
    const r = await api("/api/essays").catch(()=>null);
    if(r?.ok){
      const essays = await r.json().catch(()=>null);
      const fresh = Array.isArray(essays) && essays.find(e=>e.id===entry.id);
      if(fresh?.teacher_review){
        state.loadedEssayReview = fresh.teacher_review;
        renderContent();
      }
    }
  }

  toast("📂 Stil lastet inn!");
}

function exportEssayPDF(){
  const ta=$("essay-ta");
  const essayText=(ta?ta.value:state.essay).trim();
  if(!essayText){toast("Ingen tekst å eksportere!");return;}
  const title=state.currentPrompt?.title||"Stil";
  const topicMeta=state.currentTopic?TOPICS[state.currentTopic]:null;
  const topicLabel=topicMeta?`${topicMeta.emoji} ${topicMeta.name}`:"";
  const promptTxt=state.currentPrompt?.text||"";
  const wc=wcCount(essayText);
  const dateStr=new Date().toLocaleDateString("nb-NO",{year:"numeric",month:"long",day:"numeric"});
  // Fill the hidden print area
  const pdfTitle=$("pdf-title"); if(pdfTitle) pdfTitle.textContent=title;
  const pdfTopic=$("pdf-topic"); if(pdfTopic) pdfTopic.textContent=topicLabel;
  const pdfPrompt=$("pdf-prompt-text"); if(pdfPrompt) pdfPrompt.textContent=promptTxt?`Oppgave: ${promptTxt}`:"";
  const pdfBody=$("pdf-body"); if(pdfBody) pdfBody.textContent=essayText;
  const pdfDate=$("pdf-date"); if(pdfDate) pdfDate.textContent=dateStr;
  const pdfWc=$("pdf-wordcount"); if(pdfWc) pdfWc.textContent=`${wc} ord · B2`;
  trackEvent("skriv.pdf_exported",{wordCount:(state.essay||"").trim().split(/\s+/).filter(Boolean).length});
  window.print();
}

// Takes an explicit container rather than looking one up by id, so it works
// whether or not that container is attached to the document yet — a plain
// document.getElementById lookup silently found nothing (and rendered an empty
// list) the first time a screen with this panel opened, before its own markup
// had been appended to #content. renderEssayRows() is used both for that first
// render and by refreshEssayBank() (id lookup, for the three already-attached
// call sites: syncEssaysFromServer, saveCurrentEssay, deleteEssay).
function renderEssayRows(panel){
  if(!panel) return;
  panel.innerHTML="";
  const bank=loadEssayBank();
  if(bank.length===0){
    panel.appendChild(el("div",{class:"essay-bank-empty"},"Ingen lagrede stiler ennå."));
    return;
  }
  bank.forEach(entry=>{
    const row=el("div",{class:"saved-essay-row",click(){loadEssayIntoEditor(entry);}});
    const info=el("div",{class:"saved-essay-info"});
    const titleDiv=el("div",{class:"saved-essay-title"});
    titleDiv.appendChild(document.createTextNode(entry.title));
    if(entry.claudeLevel){
      // CEFR level — a fixed, meaningful set of values, not decoration, so it keeps
      // its own colour per level rather than folding into a single status token.
      const LEVEL_COLORS={"A1":"#e74c3c","A2":"#e67e22","B1":"#f39c12","B2":"#2ecc71","C1":"#27ae60","C2":"#1abc9c"};
      const lv=el("span",{class:"saved-essay-level",style:{background:(LEVEL_COLORS[entry.claudeLevel]||"#ccc")+"22",color:(LEVEL_COLORS[entry.claudeLevel]||"var(--ink-3)")}},entry.claudeLevel);
      titleDiv.appendChild(lv);
    }
    if(entry.teacherReview?.liked){
      const st=el("span",{class:"status status--learned"}); st.appendChild(el("span",{class:"status__dot"})); st.appendChild(document.createTextNode("godkjent av lærer")); titleDiv.appendChild(st);
    } else if(entry.teacherReview?.comment){
      titleDiv.appendChild(el("span",{class:"tag"},"kommentar fra lærer"));
    }
    info.appendChild(titleDiv);
    const metaDiv=el("div",{class:"saved-essay-meta"});
    const dateStr=new Date(entry.savedAt).toLocaleDateString("nb-NO",{day:"numeric",month:"short",year:"numeric"});
    metaDiv.textContent=`${entry.topicName||entry.topic||"–"} · ${entry.wordCount} ord · ${dateStr}`;
    info.appendChild(metaDiv);
    row.appendChild(info);
    const delBtn=el("button",{class:"icon-btn",title:"Slett stil",click(e){
      e.stopPropagation();
      if(confirm("Slette denne stilen?")) deleteEssay(entry.id);
    }},icon("trash"));
    row.appendChild(delBtn);
    panel.appendChild(row);
  });
}
function refreshEssayBank(){ renderEssayRows($("essay-bank-list")); }

// ── MINI DOM HELPER ───────────────────────────────────────────────────
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class") e.className=v;
    else if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(typeof v==="function") e.addEventListener(k,v);
    else if(v!==null&&v!==undefined&&v!==false) e.setAttribute(k,v);
  }
  kids.flat(3).forEach(c=>{ if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}

let toastTimer;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2800);

// ── DIALOG (specs/DESIGN-RULES.md § "Forms live in dialogs") ───────────
// Every create/edit/share form is a .dialog over a .scrim — never a form pinned
// above a list. `buildBody(close)` returns the .dialog element's content; call
// `close()` from inside it (e.g. after a successful save) to dismiss.
function openDialog(buildBody){
  closeDialog();
  const scrim = el("div",{class:"scrim", id:"active-scrim",
    click(e){ if(e.target===scrim) closeDialog(); }});
  const close = ()=>closeDialog();
  scrim.appendChild(buildBody(close));
  document.body.appendChild(scrim);
  document.addEventListener("keydown", dialogEscHandler);
}
function dialogEscHandler(e){ if(e.key==="Escape") closeDialog(); }
function closeDialog(){
  const s=$("active-scrim");
  if(s){ s.remove(); document.removeEventListener("keydown", dialogEscHandler); }
}
// Standard dialog chrome: title, optional consequence line, body slot, footer
// with Avbryt (outline) left and one filled primary right.
function buildDialog({title, sub, body, primaryLabel, onPrimary, close, wide}){
  const dlg = el("div",{class:"dialog", style: wide?{width:"720px"}:null});
  const head = el("div",{class:"dialog__head"});
  const headText = el("div",{});
  headText.appendChild(el("div",{class:"dialog__title"},title));
  if(sub) headText.appendChild(el("div",{class:"dialog__sub"},sub));
  head.appendChild(headText);
  head.appendChild(el("button",{class:"icon-btn",title:"Lukk",click:close},icon("close")));
  dlg.appendChild(head);
  const bodyEl = el("div",{class:"dialog__body"});
  (Array.isArray(body)?body:[body]).forEach(b=>b && bodyEl.appendChild(b));
  dlg.appendChild(bodyEl);
  const foot = el("div",{class:"dialog__foot"});
  foot.appendChild(el("button",{class:"btn",click:close},"Avbryt"));
  if(primaryLabel){
    const actions=el("div",{class:"actions"});
    actions.appendChild(el("button",{class:"btn btn--primary",click:onPrimary},primaryLabel));
    foot.appendChild(actions);
  }
  dlg.appendChild(foot);

// Field: label above input, never placeholder-as-label (§ "Inputs").

// AND, same as every other filter-chip combination in this app)
function getSentWords(){
  let words = state.sentTopicFilter
    ? state.words.filter(w=>w.topic===state.sentTopicFilter)
    : state.words;
  if(state.tagFilter) words = words.filter(w=>(w.tags||[]).includes(state.tagFilter));

function allWordTags(words){
  const tags = new Set();
  (words||state.words).forEach(w=>(w.tags||[]).forEach(t=>tags.add(t)));
  return Array.from(tags).sort();
}

// Nav item: a nav-item styled <button> (the design system's own component is an
// <a>, but every destination here is a JS tab switch, not a URL). aria-current
// drives the active look; the count, when given, sits right-aligned in mono.
function buildNavItem({iconName, label, count, badge, active, indent, bold, click}){
  // Only paddingLeft is inline (a per-instance override); everything else that
  // would otherwise conflict with .nav-item[aria-current="page"]'s background
  // lives in the stylesheet — inline styles always beat a CSS rule regardless
  // of selector specificity, so a background reset here would permanently
  // block the active-state highlight.
  const btn=el("button",{style:{paddingLeft:indent?"36px":"10px"},class:"nav-item",click});
  if(active) btn.setAttribute("aria-current","page");
  if(iconName) btn.appendChild(icon(iconName));
  btn.appendChild(el("span",{style:{flex:"1",fontWeight:bold?"600":null}},label));
  // Plain mono count (e.g. bank size) vs. a filled badge (unread/pending) are
  // two different meanings — matches specs/Web app redesign consultation.zip's
  // Ord/Setninger (count) vs. Min uke/Skrive (badge) items.
  if(count!==undefined && count!==null && count!=="") btn.appendChild(el("span",{class:"nav-item__count"},String(count)));
  if(badge) btn.appendChild(el("span",{style:{display:"inline-flex",alignItems:"center",justifyContent:"center",minWidth:"18px",height:"18px",padding:"0 5px",borderRadius:"4px",background:"var(--green)",color:"#fff",fontFamily:"var(--mono)",fontSize:"10.5px",marginLeft:"auto"}},String(badge)));
  return btn;
}

function setTab(tab){
  state.tab=tab;
  // Feature 026: a filter block's collapsed state is a same-visit convenience, not a
  // saved preference — reset to expanded every time its tab is (re-)entered, per spec
  // FR-003. Deleting the field (not just setting true) keeps `?? true`'s default path
  // exercised identically to a tab that was never touched.
  if(tab==="ordbank") delete state.ordbankFiltersOpen;
  if(tab==="setninger") delete state.sentFiltersOpen;
  if(tab==="flashcards") delete fc.filtersOpen;
  if(tab==="lesing") delete lesingState.filtersOpen;
  if(tab==="ordstilling") delete ws.filtersOpen;
  if(tab==="statistik"||tab==="plan"||tab==="mineoppgaver"||tab==="minuke") statsCache=null;
  // Opening Statistikk is the only "use" that tab has — there is nothing to
  // submit — so the tab switch is the event.
  if(tab==="statistik") trackEvent("statistikk.viewed",{});
  renderTabs(); renderContent();
  // Opening Ordbank re-reads the bank from the server. Words can arrive without the
  // learner doing anything — a teacher pushing a word list, or a classmate's shared
  // word being accepted — and before this the only refresh was at login, so a
  // teacher-assigned list stayed invisible until the student logged out and back in.
  if(tab==="ordbank" && state.sessionToken){
    syncWordsFromServer();
    if(state.userRole !== "teacher") refreshSharing().then(()=>{
      // The inbox is rendered inline in Ordbank rather than behind a click, so
      // arriving here with pending offers *is* opening it. Recorded on the tab
      // switch, not in the panel builder — that runs on every re-render.
      const pending = pendingShareCount();
      if(pending) trackEvent("ordbank.inbox_opened",{pending});
      renderContent();
    });
  }
}

function renderContent(){
  // Any re-render discards the word spans the reading highlight points at, so speech
  // that survived one would go on talking against detached nodes. Stopping here covers
  // every route out of a text at once — tab switch, back button, answering a question.
  ttsStop();
  const c=$("content"); c.innerHTML="";
  if(state.tab==="ordbank")     c.appendChild(buildOrdbank());
  if(state.tab==="setninger")   c.appendChild(buildSetninger());
  if(state.tab==="flashcards")  c.appendChild(buildFlashcards());
  if(state.tab==="oppgaver")    c.appendChild(buildOppgaver());
  if(state.tab==="skriv")       c.appendChild(buildSkriv());
  if(state.tab==="lesing")      c.appendChild(buildLesing());
  if(state.tab==="ordstilling") c.appendChild(buildOrdstilling());
  if(state.tab==="mineoppgaver") c.appendChild(buildMineOppgaver());
  if(state.tab==="plan")        c.appendChild(buildPlan());
  if(state.tab==="minuke")       c.appendChild(buildMinUke());
  if(state.tab==="statistik")     c.appendChild(buildStatistik());
  if(state.tab==="innstillinger") c.appendChild(buildInnstillinger());

// ── ORDBANK TAB ───────────────────────────────────────────────────────
// Pending words a classmate has offered. Nothing here has touched the learner's
// bank: an offer becomes a word only when they press "Legg til".
function buildSharedInboxPanel(){
  const inbox = state.sharedInbox;
  if(!inbox || !inbox.items || !inbox.items.length) return null;

  const card = el("div",{class:"card",style:{borderLeft:"4px solid #1a6b4a"}});
  const hdr = el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",marginBottom:"10px"}});
  hdr.appendChild(el("h2",{style:{margin:0,fontSize:"18px"}},
    `📬 Delte ord fra klassen (${inbox.items.length})`));
  hdr.appendChild(el("span",{style:{flex:"1"}}));

  async function bulk(action){
    const label = action==="accept" ? "Legge til alle i ordbanken?" : "Forkaste alle?";
    if(!confirm(label)) return;
    const r = await api("/api/me/shared-words/bulk",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({action})}).catch(()=>null);
    if(!r?.ok){ toast("Kunne ikke oppdatere"); return; }
    const res = await r.json();
    if(action==="accept"){
      const dup = res.duplicates ? ` (${res.duplicates} hadde du fra før)` : "";
      toast(`La til ${res.accepted} ord${dup}`);
    } else toast(`Forkastet ${res.discarded} ord`);
    await syncWordsFromServer();
    await refreshSharing();
    renderContent();
  }
  hdr.appendChild(el("button",{style:{fontSize:"var(--font-xs)",padding:"4px 10px"},
    click:()=>bulk("accept")},"Legg til alle"));
  hdr.appendChild(el("button",{style:{fontSize:"var(--font-xs)",padding:"4px 10px"},
    click:()=>bulk("discard")},"Forkast alle"));
  card.appendChild(hdr);

  inbox.items.forEach(item=>{
    const row = el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",
      padding:"8px 0",borderBottom:"1px solid #f0f0f0"}});
    const info = el("div",{style:{flex:"1",minWidth:"180px"}});
    const title = el("div",{style:{fontWeight:"600"}},$esc(item.word));
    if(item.already_in_bank){
      title.appendChild(el("span",{style:{marginLeft:"8px",fontSize:"var(--font-xs)",color:"#8a6d3b",
        background:"#fcf8e3",padding:"2px 6px",borderRadius:"var(--radius-md)"}},"allerede i ordbanken din"));
    }
    info.appendChild(title);
    info.appendChild(el("div",{style:{fontSize:"var(--font-sm)",color:"var(--color-text-muted)"}},
      `${$esc(item.meaning||"")} · ${$esc(item.topic||"")} · fra ${$esc(item.sender_name)}`));
    row.appendChild(info);

    async function resolve(action){
      const r = await api(`/api/me/shared-words/${encodeURIComponent(item.id)}/${action}`,
        {method:"POST"}).catch(()=>null);
      if(!r?.ok){
        // 409 means the sender is no longer a classmate — the offer lapsed while the
        // list was on screen. Say so plainly rather than showing a generic failure.
        toast(r?.status===409 ? "Dette ordet er ikke lenger tilgjengelig" : "Kunne ikke oppdatere");
        await refreshSharing(); renderContent(); return;
      }
      if(action==="accept"){
        const res = await r.json();
        toast(res.duplicate ? "Du hadde dette ordet fra før" : "Lagt til i ordbanken");
        await syncWordsFromServer();
      }
      await refreshSharing();
      renderContent();
    }
    row.appendChild(el("button",{class:"btn-cta btn-primary",style:{fontSize:"var(--font-xs)",padding:"4px 10px"},
      click:()=>resolve("accept")},"Legg til"));
    row.appendChild(el("button",{style:{fontSize:"var(--font-xs)",padding:"4px 10px"},
      click:()=>resolve("discard")},"Forkast"));
    card.appendChild(row);
  });
  return card;
}

// Filter chips call renderWordList() but not renderContent(), so the share row —
// which lives in the filter block — has to refresh itself rather than wait for a
// full rebuild. Rebuilding the whole Ordbank here would also wipe whatever the
// learner had typed into the add-word form.
function refreshShareBar(){
  const old = document.getElementById("share-bar");
  if(old) old.replaceWith(buildShareBar());
}

// The filters propose a selection; the learner disposes. Opening the share row ticks
// everything the filters currently show, and each word can then be unticked (or a
// hidden one is simply not in play). Changing a filter re-seeds, because a new filter
// is a new intention — otherwise stale ticks from a previous topic would ride along
// invisibly.
function shareFilterKey(){
