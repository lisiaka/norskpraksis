  return [state.topicFilter,state.search,state.practicedFilter,state.learntFilter,state.timeFilter].join("|");
}

// The per-send cap exists to stop one classmate filling another's inbox. A teacher
// writes into a bank, not into an inbox, so nothing there needs capping.
function shareCap(){
  return state.userRole === "teacher" ? Infinity : MAX_SHARE_WORDS;
}

function shareSeedIfNeeded(){
  const key = shareFilterKey();
  if(state.shareSelected && state.shareSeedKey === key) return;
  state.shareSeedKey = key;
  state.shareSelected = new Set(getFilteredWords().slice(0,shareCap()).map(w=>w.id));
}

// What would actually be sent: ticked *and* currently visible, so the request can
// never include a word the learner cannot see.
function shareSelectedVisible(){
  if(!state.shareOpen || !state.shareSelected) return [];
  return getFilteredWords().filter(w=>state.shareSelected.has(w.id)).slice(0,shareCap());
}

function toggleShareWord(id){
  if(!state.shareSelected) return;
  if(state.shareSelected.has(id)) state.shareSelected.delete(id);
  else {
    if(state.shareSelected.size >= shareCap()){
      toast(`Maks ${MAX_SHARE_WORDS} ord per sending`);
      return;
    }
    state.shareSelected.add(id);
  }
  renderWordList();
}

// FastAPI returns a plain string `detail` for our own errors but a list of objects for
// a schema rejection. Rendering the latter straight into a toast prints "[object
// Object]" and hides the actual complaint.
function apiErrorText(detail, fallback){
  if(typeof detail === "string") return detail;
  if(Array.isArray(detail) && detail[0]?.msg) return detail[0].msg;
  return fallback;
}

// One share bar, two verbs. Picking the words is the same act for both roles, so the
// selection UI is shared; what happens on send is not, and the wording must not
// pretend otherwise. A student *offers* — nothing reaches the recipient's bank until
// they press "Legg til". A teacher *writes* — straight into the bank, no accept step.
// That asymmetry is authority versus suggestion, and is deliberate; do not collapse it
// by giving both roles the same button label.
function shareModeConfig(){
  if(state.userRole === "teacher"){
    const students = teacherState.students;
    if(students === null) return null;              // roster not loaded yet
    return {
      teacher: true,
      kicker: "SEND:",
      blocked: students.length ? "" :
        "Du har ingen elever ennå — legg dem til under «Klassen min».",
      recipients: students,
      openLabel: "Send ord til elevene",
      closeLabel: "Avbryt sending",
      allLabel: "Alle elever",
      sendLabel: "Send til ordbank",
      nothingToSend: "Ingen ord matcher filtrene dine, så det er ingenting å sende.",
      nonePicked: "Ingen ord er valgt. Klikk på ordene du vil sende, eller bruk «Velg alle».",
      send: sendWordsAsTeacher,
    };
  }
  const mine = state.myClass;
  if(!mine) return null;                            // not loaded yet
  return {
    teacher: false,
    kicker: "DEL:",
    // Both empty states are explained rather than hidden. A control that simply
    // vanishes is unexplainable to a learner whose teacher can change the situation.
    blocked: !mine.class ? "Du er ikke i en klasse ennå — da har du ingen å dele med."
           : !mine.classmates.length ? `Du er alene i «${$esc(mine.class.name)}» akkurat nå.`
           : "",
    recipients: mine.classmates,
    openLabel: "Del ord med klassen",
    closeLabel: "Avbryt deling",
    allLabel: "Hele klassen",
    sendLabel: "Send",
    nothingToSend: "Ingen ord matcher filtrene dine, så det er ingenting å dele.",
    nonePicked: "Ingen ord er valgt. Klikk på ordene du vil dele, eller bruk «Velg alle».",
    send: shareWordsWithClassmates,
  };
}

// Both senders return {ok, message} so buildShareBar never has to know which endpoint
// it just called.
async function shareWordsWithClassmates(words, recipientIds, _includeTranslation, _tagLabels){
  // Tags are teacher-only (spec Assumptions) — a classmate share ignores the 4th
  // argument buildShareBar's send button now always passes.
  const r = await api("/api/me/shared-words",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({word_ids:words.map(w=>w.id), recipient_ids:recipientIds})
  }).catch(()=>null);
  if(!r?.ok){
    const d = await r?.json().catch(()=>null);
    return {ok:false, message: apiErrorText(d?.detail,"Kunne ikke dele ordene")};
  }
  const res = await r.json();
  // Report the parts separately: a full inbox refuses one classmate while the rest
  // succeeds, and a bare "sent" would hide that.
  let msg = `Delte ${res.sent} ord`;
  if(res.skipped_duplicates) msg += ` · ${res.skipped_duplicates} var sendt fra før`;
  if(res.refused?.length) msg += ` · ${res.refused.length} har full innboks`;
  return {ok:true, message:msg};
}

// The words travel with the category and topic they already carry in the teacher's own
// bank, so one send can span several topics. The form this replaced could not: it
// stamped a single topic onto every word in the send.
async function sendWordsAsTeacher(words, studentIds, includeTranslation, tagLabels){
  const payload = words.map(w=>({
    word: w.word,
    meaning: w.meaning || "",
    // The backend rejects a category or topic outside its own valid set rather than
    // defaulting to one, after teacher-pushed words with an unknown category landed in
    // student banks and were never rendered. Legacy bank rows — category "temaord", a
    // blank topic — are mapped here so they stay sendable.
    category: CAT_MAP[w.category] ? w.category : "enkeltord",
    topic: VALID_TOPIC_LIST.includes(w.topic) ? w.topic : FALLBACK_TOPIC,
  }));
  const r = await api("/api/teacher/students/words/bulk",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({student_ids:studentIds, all_students:false,
      include_translation:includeTranslation, words:payload,
      tag_labels: tagLabels||[]})
  }).catch(()=>null);
  if(!r?.ok){
    const d = await r?.json().catch(()=>null);
    return {ok:false, message: apiErrorText(d?.detail,"Kunne ikke sende ordene")};
  }
  const d = await r.json();
  let msg = `Ord sendt til ${d.student_count} elev${d.student_count===1?"":"er"} (${d.inserted} nye)`;
  if(d.skipped_duplicates) msg += ` · ${d.skipped_duplicates} hadde dem fra før`;
  // Feature 023. Names the tag in the confirmation so the teacher can tell a tagged
  // send from an ordinary one without opening the student's bank.
  if(tagLabels && tagLabels.length) msg += ` · merket «${tagLabels.join(", ")}»`;
  return {ok:true, message:msg};
}

// Feature 026: one collapse/expand toggle per filter block, shared across every tab
// that has one. `stateObj[key]` is read as `?? true` (expanded) so no existing state
// object needs a migration — the field simply doesn't exist until first toggled.
// `onToggle` is the tab's own re-render function (usually `renderContent`), not a
// hardcoded call, since different tabs re-render at different granularity.
function buildFilterToggle(tab, stateObj, key, onToggle){
  const isOpen = stateObj[key] ?? true;
  return el("button",{class:"filter-toggle-btn",
    click(){
      const next = !(stateObj[key] ?? true);
      stateObj[key] = next;
      trackEvent("filters.toggled",{tab, state: next ? "expanded" : "collapsed"});
      onToggle();
    }
  }, isOpen ? "▾ Skjul filtre" : "▸ Vis filtre");
}

// Sharing lives with the filters, because the filters are what propose the selection:
// whatever the Ordbank is showing is what gets ticked. There is no second word list,
// so nothing can disagree with what is on screen.
function buildShareBar(){
  // Always an element, never null. refreshShareBar() replaces this node in place, so a
  // bar that returned nothing while its recipients were still loading could never
  // appear once they arrived — there would be no node left to replace.
  const bar = el("div",{id:"share-bar",style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}});
  const cfg = shareModeConfig();
  if(!cfg){ bar.style.display="none"; return bar; }
  const cap = shareCap();

  if(cfg.blocked){
    bar.appendChild(el("span",{class:"card__note"},cfg.blocked));
    return bar;
  }

  const visible = getFilteredWords();

  // § "One primary action per screen": important but not the main thing here,
  // so accent (tinted + bordered), never filled — filled is reserved for Nytt ord.
  bar.appendChild(el("button",{class:"btn btn--accent",click(){
      state.shareOpen=!state.shareOpen;
      if(state.shareOpen){
        shareSeedIfNeeded();
        // Feature 023. Tags are teacher-only (per spec Assumptions) — a classmate
        // share never needs the picker, so only fetch when this role can use it.
        if(cfg.teacher) ensureWordTags().then(renderWordList);
      }
      renderWordList();
    }},icon("share"),
    state.shareOpen ? cfg.closeLabel : cfg.openLabel));

  if(!state.shareOpen){
    if(visible.length){
      bar.appendChild(el("span",{class:"card__note"},
        `${Math.min(visible.length,cap)} ord klare — filtrene bestemmer utvalget`));
    }
    return bar;
  }

  shareSeedIfNeeded();
  const chosen = shareSelectedVisible();

  bar.appendChild(el("span",{class:"card__note"},
    `${chosen.length} av ${visible.length} valgt`));

  // Velg alle / Fjern alle over the filtered set. Clicking a word card toggles it
  // individually — see renderWordList().
  const allOn = visible.length>0 && chosen.length >= Math.min(visible.length,cap);
  bar.appendChild(el("button",{class:"topic-chip",
    click(){
      if(allOn) state.shareSelected = new Set();
      else state.shareSelected = new Set(visible.slice(0,cap).map(w=>w.id));
      renderWordList();
    }}, allOn ? "Fjern alle" : "Velg alle"));

  if(visible.length > cap){
    // Say both numbers. Not silent truncation — the cap is what stops one classmate
    // filling another's inbox, and hiding it would make the result confusing.
    bar.appendChild(el("span",{style:{fontSize:"var(--font-xs)",color:"#8a6d3b",alignSelf:"center"}},
      `⚠ maks ${cap} av ${visible.length}`));
  }

  const panel = el("div",{style:{width:"100%",marginTop:"8px",padding:"10px",
    background:"#f7faf9",border:"1px solid #dde",borderRadius:"var(--radius-md)"}});

  if(!visible.length){
    panel.appendChild(el("p",{style:{margin:0,fontSize:"var(--font-sm)",color:"var(--color-text-muted)"}},cfg.nothingToSend));
    bar.appendChild(panel);
    return bar;
  }
  if(!chosen.length){
    panel.appendChild(el("p",{style:{margin:0,fontSize:"var(--font-sm)",color:"var(--color-text-muted)"}},cfg.nonePicked));
    bar.appendChild(panel);
    return bar;
  }

  // Sending without the translations makes the student look each word up — a real
  // teaching choice, and the one control the old Gi oppgave form had that the bank
  // words do not carry themselves.
  let transCb = null;
  if(cfg.teacher){
    transCb = el("input",{type:"checkbox",id:"share-trans"}); transCb.checked = true;
    const transRow = el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px"}});
    transRow.appendChild(transCb);
    transRow.appendChild(el("label",{for:"share-trans",style:{fontSize:"var(--font-sm)",cursor:"pointer"}},
      "Inkluder oversettelse"));
    panel.appendChild(transRow);

    // Feature 023. A brand-new label is not created here — it's collected and sent
    // to bulk_push_words as tag_labels, which resolves (get-or-create) it as part
    // of the same send. See specs/023-word-tags/research.md D4.
    const tagPanel = el("div",{style:{marginBottom:"10px"}});
    tagPanel.appendChild(el("div",{style:{fontWeight:"600",fontSize:"var(--font-sm)",marginBottom:"6px"}},
      "Merk med tagg (valgfritt):"));
    const chipRow = el("div",{style:{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"6px"}});
    (teacherState.wordTags||[]).forEach(t=>{
      chipRow.appendChild(el("button",{class:"topic-chip"+(state.shareTagSelection.has(t.label)?" active":""),
        click(){
          if(state.shareTagSelection.has(t.label)) state.shareTagSelection.delete(t.label);
          else state.shareTagSelection.add(t.label);
          renderWordList();
        }},t.label));
    });
    tagPanel.appendChild(chipRow);

    const newTagRow = el("div",{style:{display:"flex",gap:"6px",alignItems:"center"}});
    const newTagInput = el("input",{type:"text",placeholder:"Ny tagg, f.eks. Uke 36",value:state.shareNewTagInput,
      style:{padding:"6px 10px",border:"1px solid var(--color-border)",borderRadius:"var(--radius-sm)",fontSize:"var(--font-sm)",flex:"1"},
      input(e){state.shareNewTagInput=e.target.value;}});
    function addTypedTag(){
      const label=state.shareNewTagInput.trim();
      if(!label) return;
      state.shareTagSelection.add(label);
      state.shareNewTagInput="";
      renderWordList();
    }
    newTagInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTypedTag();}});
    newTagRow.appendChild(newTagInput);
    // Only shown once a tag is already committed — that's the one case the send-time
    // auto-pickup (buildShareBar's send handler) doesn't cover: a second tag typed
    // over the first would otherwise overwrite it. For a single tag, this button
    // did nothing but look like a required step, which is exactly what caused it to
    // be skipped and the tag lost silently before the auto-pickup fix.
    if(state.shareTagSelection.size){
      newTagRow.appendChild(el("button",{class:"btn-secondary",style:{padding:"6px 12px",fontSize:"var(--font-sm)"},
        click:addTypedTag},"+ Legg til enda en"));
    }
    tagPanel.appendChild(newTagRow);

    if(state.shareTagSelection.size){
      tagPanel.appendChild(el("div",{style:{marginTop:"6px",fontSize:"var(--font-xs)",color:"#1a6b4a"}},
        "Merkes med: "+Array.from(state.shareTagSelection).join(", ")));
    }
    panel.appendChild(tagPanel);
  }

  panel.appendChild(el("div",{style:{fontWeight:"600",fontSize:"var(--font-sm)",marginBottom:"6px"}},"Send til:"));
  const allCb = el("input",{type:"checkbox",id:"share-all"});
  const mateCbs = [];
  function picked(){
    return allCb.checked ? cfg.recipients.map(m=>m.id)
                         : mateCbs.filter(({cb})=>cb.checked).map(({id})=>id);
  }
  function sync(){ sendBtn.disabled = picked().length===0; }

  const allRow = el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"4px"}});
  allCb.addEventListener("change",()=>{ mateCbs.forEach(({cb})=>{cb.checked=allCb.checked;}); sync(); });
  allRow.appendChild(allCb);
  allRow.appendChild(el("label",{for:"share-all",style:{fontSize:"var(--font-sm)",fontWeight:"600",cursor:"pointer"}},cfg.allLabel));
  panel.appendChild(allRow);

  // A teacher may have several classes; a student sees only their own classmates and
  // so has nothing to narrow down.
  if(cfg.teacher){
    const classRow = buildClassQuickSelect(cfg.recipients,(ids)=>{
      const want = new Set(ids);
      mateCbs.forEach(({cb,id})=>{ cb.checked = want.has(id); });
      allCb.checked = cfg.recipients.length>0 && cfg.recipients.every(s=>want.has(s.id));
      sync();
    });
    if(classRow) panel.appendChild(classRow);
  }

  cfg.recipients.forEach(m=>{
    const id="share-m-"+m.id.replace(/[^a-z0-9]/gi,"-");
    const cb=el("input",{type:"checkbox",id});
    cb.addEventListener("change",()=>{
      allCb.checked = mateCbs.every(({cb:c})=>c.checked);
      sync();
    });
    mateCbs.push({cb,id:m.id});
    const row=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"4px"}});
    row.appendChild(cb);
    row.appendChild(el("label",{for:id,style:{fontSize:"var(--font-sm)",cursor:"pointer"}},$esc(m.name)));
    panel.appendChild(row);
  });

  const sendBtn = el("button",{class:"btn-cta btn-primary",style:{marginTop:"10px"},disabled:true,
    click: async ()=>{
      const recipients = picked();
      if(!recipients.length) return;
      // Re-read at click time: both the filters and the ticks may have changed since
      // the panel opened, and what is marked on screen is what the sender means.
      const words = shareSelectedVisible();
      if(!words.length) return;
      sendBtn.disabled=true; sendBtn.textContent="Sender…";
      // A typed-but-not-yet-confirmed tag must still count — requiring the separate
      // "+ Legg til" click before send was a silent trap: nothing indicated the send
      // would ignore it, so the natural "type then send" motion lost the tag with no
      // error, only a toast quietly missing its "merket" clause.
      const typedTag = state.shareNewTagInput.trim();
      const tagLabels = cfg.teacher
        ? Array.from(new Set([...state.shareTagSelection, ...(typedTag ? [typedTag] : [])]))
        : [];
      const res = await cfg.send(words, recipients, transCb ? transCb.checked : true, tagLabels);
      sendBtn.textContent=cfg.sendLabel;
      if(!res.ok){
        toast(res.message);
        sendBtn.disabled=false;
        return;
      }
      toast(res.message);
      state.shareOpen=false;
      state.shareSelected=null; state.shareSeedKey=null;   // next open re-seeds
      state.shareTagSelection=new Set(); state.shareNewTagInput="";
      teacherState.wordTags=null; // a newly-typed tag may now exist server-side
      renderContent(); renderWordList();
    }},cfg.sendLabel);
  panel.appendChild(sendBtn);
  bar.appendChild(panel);
  return bar;
}

// B2 Norsk design system § "Forms live in dialogs": Nytt ord is a .dialog, not a
// form pinned above the list. Field ids are unchanged (fi-word, fi-meaning,
// fi-cat, fi-topic, fi-explanation, lookup-status, btn-lookup) so the existing
// addWord()/lookupWord()/applyProposalToForm() keep working without their own
// rewrite — only the chrome around them changed.
// Field layout and copy match specs/Web app redesign consultation.zip § Runde 3,
// id 3b, byte-for-byte where practical: "Oversett" is a text button (not an
// icon), Betydning/Kategori sit side by side, and Tema is a colour-swatch chip
// picker — never a plain <select> — since tema "bestemmer fargen i ordbanken".
function openNewWordDialog(){
  openDialog(close=>{
    const wIn=el("input",{id:"fi-word",class:"input",type:"text",placeholder:"f.eks. imidlertid",autofocus:true,
      input(e){form.word=e.target.value;},
      keydown(e){if(e.key==="Enter"){e.preventDefault();submit();}}});
    const wRow=el("div",{style:{display:"flex",gap:"8px"}});
    wRow.appendChild(el("div",{style:{flex:"1"}},wIn));
    wRow.appendChild(el("button",{id:"btn-lookup",class:"btn",
      title:"Slå opp ordet — henter oversettelse, forklaring, tema og eksempler",click:lookupWord},"Oversett"));

    const mIn=el("input",{id:"fi-meaning",class:"input",type:"text",placeholder:"f.eks. however / likevel",
      input(e){form.meaning=e.target.value;}, keydown(e){if(e.key==="Enter"){e.preventDefault();submit();}}});
    const eIn=el("input",{id:"fi-explanation",class:"input",type:"text",placeholder:"f.eks. å bevege seg til fots",
      input(e){form.explanation=e.target.value;}, keydown(e){if(e.key==="Enter"){e.preventDefault();submit();}}});

    const catSel=el("select",{id:"fi-cat",class:"select",change(e){form.category=e.target.value;}});
    CATS.forEach(c=>{ const o=el("option",{value:c.key},c.label); if(c.key===form.category)o.selected=true; catSel.appendChild(o); });

    const catTopicRow=el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}});
    catTopicRow.appendChild(buildField({label:"Betydning",hint:false,inputEl:mIn}));
    catTopicRow.appendChild(buildField({label:"Kategori",hint:false,inputEl:catSel}));

    // Hidden input (not a <select>) keeps addWord()'s `form.topic` read/write
    // contract unchanged — only the picker in front of it is new.
    const topicHidden=el("input",{id:"fi-topic",type:"hidden",value:form.topic||""});
    const topicOpts=el("div",{style:{display:"flex",flexWrap:"wrap",gap:"6px"}});
    function renderTopicOpts(){
      topicOpts.innerHTML="";
      VALID_TOPIC_LIST.filter(t=>t!=="generelt").forEach(t=>{
        const tema=topicTema(t);
        const selected=form.topic===t;
        const p=el("span",{class:"pill","aria-pressed":selected?"true":"false",style:{cursor:"pointer"},
          click(){ form.topic = selected ? "" : t; topicHidden.value=form.topic; renderTopicOpts(); }});
        p.appendChild(el("span",{class:"pill__swatch",style:{background:tema.bg}}));
        p.appendChild(document.createTextNode(t));
        topicOpts.appendChild(p);
      });
    }
    renderTopicOpts();

    function submit(){
      if(!form.word.trim()){ wIn.focus(); return; }
      addWord();
      close();
      // addWord() only refreshes the list + sidebar count — the topbar count and
      // TEMA facet counts live in the chrome around it, so a full re-render is
      // needed to keep them in step with the word just added.
      renderContent();
    }
    function submitAndAddAnother(){
      if(!form.word.trim()){ wIn.focus(); return; }
      addWord();
      renderContent();
      // Fields are cleared by addWord() itself; just return focus to the dialog.
      wIn.focus();
    }

    const dlg = buildDialog({
      title:"Nytt ord",
      sub:"Legges i din ordbank. Du kan dele det etterpå.",
      primaryLabel:"Lagre",
      onPrimary:submit,
      close,
      body:[
        buildField({label:"Norsk ord eller uttrykk",req:true,inputEl:wRow}),
        el("div",{id:"lookup-status",class:"field__hint"}),
        catTopicRow,
        buildField({label:"Forklaring på norsk",inputEl:eIn}),
        buildField({label:"Tema",inputEl:topicOpts,hintText:"valgfritt · bestemmer fargen i ordbanken"}),
        topicHidden,
      ],
    });
    // Second footer action ("Lagre og legg til nytt") + the Enter-key hint, laid
    // out as [hint] ······ [Avbryt] [Lagre og legg til nytt] [Lagre] to match
    // the reference exactly — Avbryt moves into the same button group as the
    // rest so `.dialog__foot`'s space-between puts only two groups on the row.
    const foot = dlg.querySelector(".dialog__foot");
    const avbrytBtn = foot.querySelector(".btn");
    const actionsDiv = foot.querySelector(".actions");
    foot.insertBefore(el("span",{style:{fontSize:"13px",color:"var(--ink-3)"}},"Enter lagrer og tømmer feltene"), avbrytBtn);
    actionsDiv.insertBefore(el("button",{class:"btn",click:submitAndAddAnother},"Lagre og legg til nytt"), actionsDiv.firstChild);
    actionsDiv.insertBefore(avbrytBtn, actionsDiv.firstChild);
    return dlg;
  });
}

// Flashcards/Setninger/Setningsbygging are not destinations, they are things you
// do to a filtered word set (specs/Web app redesign consultation.zip § Runde 3)
// — the current Ordbank filters travel with the learner into whichever practice
// mode they pick, instead of being re-applied from scratch there.
//
// This only forwards a filter where the destination has a genuine equivalent —
// it used to forward topic alone (a bug: the panel promised "Filtrene følger
// med", plural, but only one of Ordbank's five filters actually did). The two
// still not forwarded, on purpose:
//  - practicedFilter ("Ikke øvd ennå") has no destination equivalent. It hides
//    words used in a sentence *or* correct in flashcards — a cross-exercise
//    definition neither exercise's own filter vocabulary can express (Flashcards'
//    closest concept, excluding learnt words, is already its default pool).
//  - Setningsbygging only has a topic filter at all, because it doesn't draw
//    from the word bank — it extracts sentences from reading texts by *text*
//    topic. Tag/time/learnt-status describe word-bank entries, which this game
//    never touches, so there is nothing to forward them into.
function launchPracticeWithFilter(mode){
  if(mode==="flashcards"){
    fc.topicFilter=state.topicFilter;
    fc.tagFilter=state.ordTagFilter||"";
    fc.timeFilter=state.timeFilter||0;
    fc.includeLearnt=state.learntFilter!=="hide_learnt";
    setTab("flashcards");
  }
  else if(mode==="setninger"){
    state.sentTopicFilter=state.topicFilter;
    state.tagFilter=state.ordTagFilter||"";
    setTab("setninger");
  }
  else if(mode==="ordstilling"){ ws.topicFilter=state.topicFilter; setTab("ordstilling"); }
}

// Generic multi-select ("Merk ord" — specs/Web app redesign consultation.zip
// § filtre-valg screen), independent of the classmate/teacher share flow above:
// it additionally supports bulk delete and bulk export. Sharing a selection made
// here hands the same id set to the existing share flow rather than duplicating it.
function buildWordSelectionBar(){
  const visible=getFilteredWords();
  const chosen=visible.filter(w=>state.wordSelection.has(w.id));
  const bar=el("div",{class:"selection-bar",style:{marginBottom:"var(--s-3)"}});
  const left=el("div",{style:{display:"flex",alignItems:"center",gap:"14px"}});
  left.appendChild(el("span",{style:{fontWeight:"600",color:"var(--ink)"}},`${chosen.length} ord merket`));
  left.appendChild(el("button",{class:"btn--link",click(){ state.wordSelection=new Set(visible.map(w=>w.id)); renderContent(); }},`Merk alle ${visible.length}`));
  left.appendChild(el("button",{class:"btn--link",click(){ state.wordSelectMode=false; state.wordSelection=null; renderContent(); }},"Avbryt"));
  bar.appendChild(left);
  const right=el("div",{class:"actions"});
  right.appendChild(el("button",{class:"btn btn--danger",disabled:!chosen.length,click(){
    if(!confirm(`Slette ${chosen.length} ord fra ordbanken?`)) return;
    const ids=new Set(chosen.map(w=>w.id));
    chosen.forEach(w=>{ trackEvent("ordbank.word_deleted",{topic:w.topic}); api(`/api/words/${encodeURIComponent(w.id)}`,{method:"DELETE"}).catch(()=>{}); });
    state.words=state.words.filter(w=>!ids.has(w.id));
    state.wordSelectMode=false; state.wordSelection=null;
    saveStorage(); renderContent(); renderTabs();
  }},"Slett"));
  right.appendChild(el("button",{class:"btn",disabled:!chosen.length,click(){
    const data=JSON.stringify(chosen.map(({word,meaning,category,topic,createdAt})=>({word,meaning,category,topic:topic||"",createdAt:createdAt||Date.now()})),null,2);
    const a=el("a",{href:URL.createObjectURL(new Blob([data],{type:"application/json"})),download:"ordbank-utvalg.json"});
    a.click(); URL.revokeObjectURL(a.href);
    trackEvent("ordbank.export",{count:chosen.length,format:"json"});
    toast(`${chosen.length} ord eksportert`);
  }},"Eksporter"));
  right.appendChild(el("button",{class:"btn btn--accent",disabled:!chosen.length,click(){
    // Hands the id set to the existing share flow rather than re-implementing it.
    // shareSeedKey is set to the real shareFilterKey() so buildShareBar()'s own
    // unconditional shareSeedIfNeeded() call sees this selection as already
    // seeded for the current filters and does not overwrite it.
    state.wordSelectMode=false;
    state.shareOpen=true;
    state.shareSelected=new Set(chosen.map(w=>w.id));
    state.shareSeedKey=shareFilterKey();
    renderContent();
  }},icon("share"),"Del med klassen"));
  bar.appendChild(right);
  return bar;
}

function buildOrdbank(){
  const frag=document.createDocumentFragment();

  // Feature 022: a teacher's Ordbank toggles between their own bank ("Mine ord",
  // unchanged below) and a roster-wide, deduplicated view of their students'
  // words ("Elevenes ord") — not a separate sidebar tab. Students never see
  // this toggle; teacherState.ordbankMode only matters when userRole is teacher.
  if(state.userRole==="teacher"){
    frag.appendChild(buildOrdbankModeToggle());
    if(teacherState.ordbankMode==="elever"){
      frag.appendChild(buildTeacherWordAggregatePanel());
      return frag;
    }
  }

  const inboxPanel = buildSharedInboxPanel();
  if(inboxPanel) frag.appendChild(inboxPanel);

  // ── Topbar (§ "One primary action per screen"): Nytt ord is the only filled
  // button here. Everything else is outline; Del ord/Send ord (via buildShareBar's
  // own toggle, restyled) is the accent — important, not primary.
  const topbar=el("div",{class:"topbar",style:{borderRadius:"var(--r-card)",marginBottom:"var(--s-4)"}});
  const topbarTitle=el("div",{});
  topbarTitle.appendChild(el("div",{class:"topbar__title"},"Ordbank"));
  topbarTitle.appendChild(el("div",{class:"topbar__meta"},`${state.words.length} ord`));
  topbar.appendChild(topbarTitle);
  const actions=el("div",{class:"actions",style:{flexWrap:"wrap",justifyContent:"flex-end"}});
  if(state.words.length>0){
    actions.appendChild(el("button",{class:"btn",click(){printWords("list");}},icon("printer"),"Skriv ut"));
    actions.appendChild(el("button",{class:"btn",click:exportWords},icon("download"),"Eksporter"));
  }
  const fileIn=el("input",{id:"import-file",type:"file",accept:".json,.csv,.txt",style:{display:"none"},
    change(e){const f=e.target.files[0];if(f)importWords(f);e.target.value="";}});
  actions.appendChild(fileIn);
  actions.appendChild(el("button",{class:"btn",click(){$("import-file").click();}},icon("upload"),"Importer"));
  actions.appendChild(el("button",{class:"btn btn--primary",click:openNewWordDialog},icon("plus"),"Nytt ord"));
  topbar.appendChild(actions);
  frag.appendChild(topbar);

  // ── Search ──
  if(state.words.length>5){
    const searchWrap=el("div",{class:"search",style:{marginBottom:"var(--s-3)"}});
    searchWrap.appendChild(icon("search",""));
    searchWrap.lastChild.style.cssText="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;";
    const srch=el("input",{class:"input",type:"text",placeholder:"Søk i ordbanken…",
      input(e){state.search=e.target.value; renderWordList();}});
    srch.value=state.search;
    searchWrap.appendChild(srch);
    frag.appendChild(searchWrap);
  }

  // ── Filter panel (§ "Filters") ──
  if(state.words.length>0){
    const isOpen = state.ordbankFiltersOpen ?? true;
    const activeCount = [state.topicFilter,state.practicedFilter,state.learntFilter,state.timeFilter,state.ordTagFilter].filter(Boolean).length;
    const panel=el("div",{class:"filter-panel",style:{marginBottom:"var(--s-4)"}});
    if(!isOpen) panel.setAttribute("data-collapsed","");

    const head=el("div",{class:"filter-panel__head"});
    const headLeft=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}});
    headLeft.appendChild(icon("filter"));
    headLeft.lastChild.style.color="var(--ink-3)";
    headLeft.appendChild(el("span",{class:"label-mono"},"Filtre"));
    if(activeCount) headLeft.appendChild(el("span",{class:"badge-count"},String(activeCount)));
    // Collapsed panel still shows active filters as removable chips — a hidden
    // filter that is still filtering is the bug this fixes.
    if(!isOpen){
      if(state.topicFilter) headLeft.appendChild(buildRemovablePill(state.topicFilter, ()=>{state.topicFilter="";renderContent();}));
      if(state.practicedFilter==="not_practiced") headLeft.appendChild(buildRemovablePill("ikke øvd", ()=>{state.practicedFilter="";renderContent();}));
      if(state.learntFilter==="hide_learnt") headLeft.appendChild(buildRemovablePill("lærte skjult", ()=>{state.learntFilter="";renderContent();}));
      if(state.timeFilter) headLeft.appendChild(buildRemovablePill(({7:"siste 7 dager",30:"siste 30 dager",90:"siste 3 måneder"})[state.timeFilter], ()=>{state.timeFilter=0;renderContent();}));
      if(state.ordTagFilter) headLeft.appendChild(buildRemovablePill(state.ordTagFilter, ()=>{state.ordTagFilter="";renderContent();}));
    }
    head.appendChild(headLeft);
    const headRight=el("div",{style:{display:"flex",alignItems:"center",gap:"14px"}});
    if(activeCount) headRight.appendChild(el("button",{class:"btn--link",click(){
      state.topicFilter="";state.practicedFilter="";state.learntFilter="";state.timeFilter=0;state.ordTagFilter="";
      renderContent();
    }},"Nullstill"));
    // Plain text + ▼, not an icon button — matches the reference mockup exactly
    // (specs/Web app redesign consultation.zip § Runde 4, id 4a).
    headRight.appendChild(el("button",{style:{background:"none",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:"6px",fontSize:"13px",color:"var(--ink-2)",fontWeight:"500"},
      click(){ state.ordbankFiltersOpen=!isOpen; trackEvent("filters.toggled",{tab:"ordbank",state:isOpen?"collapsed":"expanded"}); renderContent(); }
    },(isOpen?"Skjul filtre":"Vis filtre")+" ",el("span",{style:{fontSize:"10px"}},"▼")));
    head.appendChild(headRight);
    panel.appendChild(head);

    const body=el("div",{class:"filter-panel__body"});

    // TEMA facet — tema colour swatch on every pill, never emoji.
    const activeTopics=VALID_TOPIC_LIST.filter(t=>state.words.some(w=>w.topic===t));
    if(activeTopics.length>0){
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Tema"));
      const opts=el("div",{class:"facet__options"});
      opts.appendChild(buildFacetPill("Alle",state.topicFilter===""&&true,()=>{state.topicFilter="";renderContent();},null,state.words.length));
      activeTopics.forEach(t=>{
        const count=state.words.filter(w=>w.topic===t).length;
        opts.appendChild(buildFacetPill(t,state.topicFilter===t,()=>{state.topicFilter=t;renderContent();},topicTema(t).bg,count));
      });
      facet.appendChild(opts);
      body.appendChild(facet);
    }

    // ØVELSE facet
    {
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Øvelse"));
      const opts=el("div",{class:"facet__options"});
      const notPracticedCount=getFilteredWordsExcept("practicedFilter").filter(w=>{
        const lastAnswers=buildLastAnswerMap();
        return !(state.sentences[w.id]?.trim())&&lastAnswers[w.word.toLowerCase()]!==true;
      }).length;
      opts.appendChild(buildFacetPill("Alle ord",!state.practicedFilter,()=>{state.practicedFilter="";renderContent();}));
      opts.appendChild(buildFacetPill("Ikke øvd ennå",state.practicedFilter==="not_practiced",()=>{state.practicedFilter="not_practiced";loadStats().then(renderContent);},null,notPracticedCount));
      facet.appendChild(opts);
      body.appendChild(facet);
    }

    // LÆRT facet
    {
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Lært"));
      const opts=el("div",{class:"facet__options"});
      opts.appendChild(buildFacetPill("Alle ord",!state.learntFilter,()=>{state.learntFilter="";renderContent();}));
      opts.appendChild(buildFacetPill("Skjul lærte",state.learntFilter==="hide_learnt",()=>{state.learntFilter="hide_learnt";renderContent();}));
      facet.appendChild(opts);
      body.appendChild(facet);
    }

    // TID facet
    {
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Lagt til"));
      const opts=el("div",{class:"facet__options"});
      [[0,"Alle"],[7,"Siste 7 dager"],[30,"Siste 30 dager"],[90,"Siste 3 måneder"]].forEach(([val,label])=>{
        opts.appendChild(buildFacetPill(label,state.timeFilter===val,()=>{state.timeFilter=val;renderContent();}));
      });
      facet.appendChild(opts);
      body.appendChild(facet);
    }

    // TAGG facet (feature 023) — only when at least one word actually carries a
    // tag, mirroring TEMA's own visibility rule. Tags are named by a teacher and
    // applied to a specific student's words; this facet has nothing to show for a
    // student none of whose words have been tagged, so it stays hidden rather
    // than rendering an always-empty row.
    const tagsPresent=allWordTags(state.words);
    if(tagsPresent.length>0){
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Tagg"));
      const opts=el("div",{class:"facet__options"});
      opts.appendChild(buildFacetPill("Alle",!state.ordTagFilter,()=>{state.ordTagFilter="";renderContent();}));
      tagsPresent.forEach(tag=>{
        const count=state.words.filter(w=>(w.tags||[]).includes(tag)).length;
        opts.appendChild(buildFacetPill(tag,state.ordTagFilter===tag,()=>{state.ordTagFilter=tag;renderContent();},null,count));
      });
      facet.appendChild(opts);
      body.appendChild(facet);
    }

    panel.appendChild(body);
    frag.appendChild(panel);

    // "Øv med disse N ordene" (specs/Web app redesign consultation.zip § Runde 3):
    // Flashcards/Setninger/Setningsbygging are not destinations, they are things
    // you do to the word set just filtered — the filter selection travels with
    // them instead of being re-built from scratch after a tab switch.
    const filteredCount=getFilteredWords().length;
    if(filteredCount>0){
      const practiceRow=el("div",{class:"card",style:{background:"var(--surface-sunk)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"16px",flexWrap:"wrap",marginBottom:"var(--s-3)"}});
      const practiceText=el("div",{});
      practiceText.appendChild(el("div",{style:{fontSize:"14.5px",fontWeight:"600",color:"var(--ink)"}},`Øv med disse ${filteredCount} ordene`));
      practiceText.appendChild(el("div",{class:"card__note"},"Filtrene følger med inn i øvingen"));
      practiceRow.appendChild(practiceText);
      const practiceActions=el("div",{class:"actions"});
      practiceActions.appendChild(el("button",{class:"btn",click(){launchPracticeWithFilter("flashcards");}},"Flashcards"));
      practiceActions.appendChild(el("button",{class:"btn",click(){launchPracticeWithFilter("setninger");}},"Setninger"));
      practiceActions.appendChild(el("button",{class:"btn",click(){launchPracticeWithFilter("ordstilling");}},"Setningsbygging"));
      practiceRow.appendChild(practiceActions);
      frag.appendChild(practiceRow);
    }

    // Result line restates the filters in words, plus Merk ord (bulk select) and
    // sorting (§ "Filters").
    const resultRow=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"8px",marginBottom:"var(--s-3)"}});
    resultRow.appendChild(el("span",{style:{fontSize:"13.5px",color:"var(--ink-2)"}},resultLineText()));
    const resultRight=el("div",{style:{display:"flex",alignItems:"center",gap:"16px"}});
    if(!state.wordSelectMode) resultRight.appendChild(el("button",{class:"btn--link",click(){
      state.wordSelectMode=true; state.wordSelection=new Set(); renderContent();
    }},"Merk ord"));
    const sortLabel={recent:"sist lagt til",alpha:"alfabetisk"}[state.ordbankSort||"recent"];
    resultRight.appendChild(el("button",{style:{background:"none",border:"none",cursor:"pointer",fontSize:"13px",color:"var(--ink-3)"},
      click(){ state.ordbankSort = state.ordbankSort==="alpha" ? "recent" : "alpha"; renderWordList(); }
    },"Sortering: ",el("b",{style:{color:"var(--ink)"}},sortLabel)," ▼"));
    resultRow.appendChild(resultRight);
    frag.appendChild(resultRow);

    if(state.wordSelectMode){
      frag.appendChild(buildWordSelectionBar());
    } else {
      // Share row (feature 018) — its own toggle chip is restyled to .btn--accent
      // ("important, not the main thing") in buildShareBar() itself.
      const shareWrap=el("div",{style:{marginBottom:"var(--s-3)"}});
      shareWrap.appendChild(buildShareBar());
      frag.appendChild(shareWrap);
      if(state.userRole==="teacher") ensureTeacherRoster().then(refreshShareBar);
    }
  }

  // ── Word list container (populated separately so the topbar/panel are never
  // re-rendered on every filter change) ──
  const wlDiv=el("div",{id:"word-list"});
  frag.appendChild(wlDiv);
  requestAnimationFrame(()=>renderWordList());

  return frag;
}

// Facet pill: tema swatch (if colour given) + label + result count, aria-pressed
// drives the selected look (outline+tint+✓, never filled — § "Filters").
function buildFacetPill(label,active,onClick,swatchColor,count){
  const p=el("button",{class:"pill","aria-pressed":active?"true":"false",click:onClick});
  if(swatchColor) p.appendChild(el("span",{class:"pill__swatch",style:{background:swatchColor}}));
  p.appendChild(document.createTextNode(label));
  if(count!==undefined && count!==null) p.appendChild(el("span",{class:"pill__count"},String(count)));
  return p;
}
// Removable chip shown in a collapsed filter-panel header for one active filter.
function buildRemovablePill(label,onRemove){
  const p=el("span",{class:"pill pill--removable","aria-pressed":"true"});
  p.appendChild(document.createTextNode(label));
  p.appendChild(el("button",{class:"icon-btn",style:{width:"16px",height:"16px",border:"0",background:"none"},
    title:"Fjern filter",click(e){e.stopPropagation();onRemove();}},icon("close")));
  return p;
}
// getFilteredWords() minus one named filter, so a facet can show "how many
// results would THIS option give" without that option's own current value
// narrowing the count it's describing.
function getFilteredWordsExcept(skip){
  const saved=state[skip]; state[skip]="";
  const out=getFilteredWords();
  state[skip]=saved;
  return out;
}
// "57 ord · tema miljø · ikke øvd" — restates the active filters in words,
// under the panel (§ "Filters").
function resultLineText(){
  const n=getFilteredWords().length;
  const parts=[`${n} ord`];
  if(state.topicFilter) parts.push(`tema ${state.topicFilter}`);
  if(state.practicedFilter==="not_practiced") parts.push("ikke øvd");
  if(state.learntFilter==="hide_learnt") parts.push("lærte skjult");
  if(state.timeFilter) parts.push(({7:"siste 7 dager",30:"siste 30 dager",90:"siste 3 måneder"})[state.timeFilter]);
  if(state.ordTagFilter) parts.push(`tagg "${state.ordTagFilter}"`);
  if(state.search) parts.push(`søk «${state.search}»`);
  return parts.join(" · ");
}

// ── "Elevenes ord" — teacher's roster-wide word aggregate, in Ordbank (022) ──

function buildOrdbankModeToggle(){
  const mode = teacherState.ordbankMode || "mine";
  // A toggle maps onto the same selected-pill treatment as every other
  // exclusive-choice control in the app (AI-fokus scope, report-layout surface,
  // Gi oppgaver's mode switch) — never a filled primary/accent colour.
  const row = el("div",{style:{display:"flex",gap:"var(--s-2)",marginBottom:"var(--s-4)"}});
  row.appendChild(el("button",{class:"pill","aria-pressed":mode==="mine"?"true":"false",
    click(){ teacherState.ordbankMode="mine"; renderContent(); }}, "Mine ord"));
  row.appendChild(el("button",{class:"pill","aria-pressed":mode==="elever"?"true":"false",
    click(){ teacherState.ordbankMode="elever"; renderContent(); }}, "Elevenes ord"));
  return row;
}

// Same facet/pill look as "Mine ord"'s own filter panel (`.facet`/`.facet__label`/
// `.facet__options`/`.pill`) — the point of this view is to read as the same
// feature from a different angle, not a bespoke chip row. Manages its own
// aria-pressed state on click rather than going through a full renderContent(),
// since this panel loads its data asynchronously instead of re-rendering the tab.
function _aggFilterChipRow(label, options, currentValue, onPick){
  const facet = el("div",{class:"facet"});
  facet.appendChild(el("div",{class:"facet__label"},label));
  const opts = el("div",{class:"facet__options"});
  options.forEach(([val,text])=>{
    opts.appendChild(el("button",{class:"pill","aria-pressed":currentValue===val?"true":"false",
      click(e){
        onPick(val);
        opts.querySelectorAll(".pill").forEach(b=>b.setAttribute("aria-pressed","false"));
        e.currentTarget.setAttribute("aria-pressed","true");
      }}, text));
  });
  facet.appendChild(opts);
  return facet;
}

function buildTeacherWordAggregatePanel(){
  const frag = document.createDocumentFragment();
  frag.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-3)"}},
    "Alle ord elevene dine har i ordbanken, samlet på tvers av elever."));

  const filterCard = el("div",{class:"filter-panel"});
  const filterBody = el("div",{class:"filter-panel__body"});
  filterBody.appendChild(_aggFilterChipRow("Tema", [["","Alle"],...VALID_TOPIC_LIST.map(t=>[t,t])],
    teacherState.aggTopicFilter, v=>{ teacherState.aggTopicFilter=v; loadAggregate().then(()=>trackFilterChange("topic")); }));
  filterBody.appendChild(_aggFilterChipRow("Lært", [["","Alle ord"],["hide_learnt","Skjul lærte"]],
    teacherState.aggLearntFilter, v=>{ teacherState.aggLearntFilter=v; loadAggregate().then(()=>trackFilterChange("learnt")); }));
  filterBody.appendChild(_aggFilterChipRow("Lagt til", [[0,"Alle"],[7,"Siste 7 dager"],[30,"Siste 30 dager"],[90,"Siste 3 måneder"]],
    teacherState.aggTimeFilter, v=>{ teacherState.aggTimeFilter=v; loadAggregate().then(()=>trackFilterChange("time")); }));

  const classBarWrap = el("div",{});
  filterBody.appendChild(classBarWrap);

  const sourceFacet = el("div",{class:"facet"});
  sourceFacet.appendChild(el("div",{class:"facet__label"},"Tekst"));
  const sourceSel = el("select",{class:"select",style:{width:"auto"},
    change(){ teacherState.aggSourceFilter = sourceSel.value; loadAggregate().then(()=>trackFilterChange("source_text")); }});
  sourceFacet.appendChild(sourceSel);
  filterBody.appendChild(sourceFacet);
  filterCard.appendChild(filterBody);
  frag.appendChild(filterCard);

  // Print bar — same buttons and labels as "Mine ord" (printWords), wired to the
  // aggregate-specific print function: cloud sizing is student count, not random.
  const printBar = el("div",{class:"actions",style:{margin:"var(--s-3) 0"}});
  printBar.appendChild(el("button",{class:"btn",click(){
    printAggregateWords("cloud",currentWords,filterDesc());
    trackEvent("teacher.word_cloud_viewed",{word_count:currentWords.length});
  }},icon("printer"),"Skriv ut ordsky"));
  printBar.appendChild(el("button",{class:"btn",click(){printAggregateWords("list",currentWords,filterDesc());}},icon("printer"),"Skriv ut ordliste"));
  frag.appendChild(printBar);

  const resultWrap = el("div",{});
  frag.appendChild(resultWrap);

  let currentWords = [];
  let viewedTracked = false;

  function trackFilterChange(filterType){
    trackEvent("teacher.word_aggregate_filtered",{filter_type:filterType, word_count:currentWords.length});
  }

  function filterDesc(){
    const parts=[];
    if(teacherState.aggTopicFilter) parts.push("Tema: "+teacherState.aggTopicFilter);
    if(teacherState.aggLearntFilter==="hide_learnt") parts.push("Skjuler lærte ord");
    if(teacherState.aggTimeFilter) parts.push("Siste "+teacherState.aggTimeFilter+" dager");
    return parts.length ? parts.join(" · ") : "Alle ord";
  }

  function renderResult(){
    resultWrap.innerHTML = "";
    if(!currentWords.length){
      resultWrap.appendChild(el("p",{class:"card__note"},
        "Ingen ord funnet — elevene dine har ingen ord som passer filteret over."));
      return;
    }
    const table = el("div",{style:{display:"grid",gridTemplateColumns:"1fr auto",gap:"6px 20px",fontSize:"var(--t-base)",maxWidth:"600px"}});
    currentWords.forEach(w=>{
      table.appendChild(el("div",{},$esc(w.word)));
      table.appendChild(el("div",{class:"card__note",style:{textAlign:"right"}}, `${w.count} elev${w.count===1?"":"er"}`));
    });
    resultWrap.appendChild(table);
  }

  // builtin source-text titles come from the already-loaded reading-text catalog —
  // resolving them here avoids the backend duplicating that catalog (research.md D3).
  let builtinTitles = null;
  async function resolveBuiltinTitles(){
    if(builtinTitles) return builtinTitles;
    const texts = await loadLesingTexts().catch(()=>[]);
    builtinTitles = Object.fromEntries((texts||[]).map(t=>[t.id, t.title]));
    return builtinTitles;
  }

  function scopeParams(){
    const params = new URLSearchParams();
    if(teacherState.aggClassFilter) params.set("class_id", teacherState.aggClassFilter);
    return params;
  }

  async function loadSources(){
    const params = scopeParams();
    const r = await api("/api/teacher/words/sources?"+params.toString()).catch(()=>null);
    const sources = r?.ok ? (await r.json()).sources : [];
    const titles = await resolveBuiltinTitles();
    const prevValue = sourceSel.value;
    sourceSel.innerHTML = "";
    sourceSel.appendChild(el("option",{value:""},"Alle kildetekster"));
    sources.forEach(s=>{
      const label = s.source_text_id==="none" ? "Ingen kildetekst"
        : s.source_text_kind==="custom" ? (s.title||"Egen tekst")
        : (titles[s.source_text_id] || s.source_text_id);
      const value = s.source_text_id==="none" ? "none" : `${s.source_text_id}|${s.source_text_kind}`;
      sourceSel.appendChild(el("option",{value}, `${label} (${s.count})`));
    });
    if([...sourceSel.options].some(o=>o.value===prevValue)) sourceSel.value = prevValue;
    else teacherState.aggSourceFilter = "";
  }

  async function loadAggregate(){
    resultWrap.innerHTML = "";
    resultWrap.appendChild(el("p",{class:"card__note"},"Laster…"));
    const params = scopeParams();
    if(teacherState.aggTopicFilter) params.set("topic", teacherState.aggTopicFilter);
    if(teacherState.aggLearntFilter==="hide_learnt") params.set("hide_learnt","true");
    if(teacherState.aggTimeFilter) params.set("days", teacherState.aggTimeFilter);
    if(teacherState.aggSourceFilter === "none"){
      params.set("source_text_id","none");
    } else if(teacherState.aggSourceFilter){
      const [id,kind] = teacherState.aggSourceFilter.split("|");
      params.set("source_text_id", id);
      params.set("source_text_kind", kind);
    }
    const r = await api("/api/teacher/words/aggregate?"+params.toString()).catch(()=>null);
    if(!r?.ok){
      resultWrap.innerHTML = "";
      resultWrap.appendChild(el("p",{class:"card__note",style:{color:"var(--danger)"}},"Kunne ikke laste ord."));
      return;
    }
    const data = await r.json();
    currentWords = data.words;
    if(!viewedTracked){ viewedTracked=true; trackEvent("teacher.word_aggregate_viewed",{word_count:currentWords.length}); }
    renderResult();
  }

  function renderClassBar(){
    classBarWrap.innerHTML = "";
    if(!(teacherState.classes||[]).length) return;
    classBarWrap.appendChild(_aggFilterChipRow(
      "Klasse",
      [["","Alle klasser"],...teacherState.classes.map(c=>[c.id,c.name])],
      teacherState.aggClassFilter,
      v=>{ teacherState.aggClassFilter=v; teacherState.aggSourceFilter=""; loadSources().then(loadAggregate).then(()=>trackFilterChange("class")); }
    ));
  }

  (async ()=>{
    await ensureTeacherRoster();
    renderClassBar();
    await loadSources();
    await loadAggregate();
  })();

  return frag;
}

// Returns words matching current topic + time + practiced + search filters
function getFilteredWords(){
  let filtered=state.words;
  if(state.topicFilter) filtered=filtered.filter(w=>w.topic===state.topicFilter);
  if(state.timeFilter){
    const cutoff=Date.now()-state.timeFilter*24*60*60*1000;
    filtered=filtered.filter(w=>(w.createdAt||0)>=cutoff);
  }
  if(state.practicedFilter==="not_practiced"){
    const lastAnswers=buildLastAnswerMap();
    filtered=filtered.filter(w=>{
      const hasSentence=!!(state.sentences[w.id]?.trim());
      const wasCorrect=lastAnswers[w.word.toLowerCase()]===true;
      return !hasSentence&&!wasCorrect;
    });
  }
  // Learnt is a separate axis from practised — a word can be practised but not learnt,
  // or marked learnt without ever being practised — so this filter stacks with the one
  // above rather than replacing it. Unlike flashcards, the bank shows everything by
  // default: this is the learner's record of what they know, not a practice pool.
  if(state.learntFilter==="hide_learnt") filtered=filtered.filter(w=>!isLearnt(w));
  if(state.ordTagFilter) filtered=filtered.filter(w=>(w.tags||[]).includes(state.ordTagFilter));
  if(state.search) filtered=filtered.filter(w=>
    w.word.toLowerCase().includes(state.search.toLowerCase())||
    w.meaning.toLowerCase().includes(state.search.toLowerCase()));
  return filtered;
}

// Side panel for a single word — opened by clicking its card in the grid
// (state.openWordId), rendered into the sticky right column renderWordList()
// builds. Lives on the side rather than inline under the card so opening one
// word never pushes the cards below it down (§ "Ordbank word-card sizing").
function buildWordDetailPanel(w){
  const panel=el("div",{class:"card"});

  const head=el("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:"var(--s-2)",marginBottom:"var(--s-3)"}});
  head.appendChild(el("div",{class:"card__title"},w.word));
  head.appendChild(el("button",{class:"icon-btn",title:"Lukk",
    click(){ state.openWordId=null; renderWordList(); }
  },icon("close")));
  panel.appendChild(head);

  const fields=el("div",{style:{display:"flex",flexDirection:"column",gap:"var(--s-2)",marginBottom:"var(--s-3)"}});
  const wordIn=el("input",{id:"dp-word",class:"input",type:"text",value:w.word||""});
  fields.appendChild(buildField({label:"Ord",hint:false,inputEl:wordIn}));
  // Textarea, not a single-line input: both fields are AI-generated and can run
  // longer than a field's width — a single line would just hide the rest of them.
  const meaningIn=el("textarea",{id:"dp-meaning",class:"textarea"});
  meaningIn.value=w.meaning||"";
  fields.appendChild(buildField({label:"Betydning",hint:false,inputEl:meaningIn}));
  const explanationIn=el("textarea",{id:"dp-explanation",class:"textarea"});
  explanationIn.value=w.explanation||"";
  fields.appendChild(buildField({label:"Forklaring på norsk",hint:false,inputEl:explanationIn}));
  const topicSel=el("select",{id:"dp-topic",class:"select"});
  topicSel.appendChild(el("option",{value:""},"— Ingen tema —"));
  VALID_TOPIC_LIST.forEach(t=>{
    const o=el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1));
    if(t===(w.topic||"")) o.selected=true;
    topicSel.appendChild(o);
  });
  fields.appendChild(buildField({label:"Tema",hint:false,inputEl:topicSel}));
  const formsIn=el("input",{id:"dp-forms",class:"input",type:"text",value:(w.forms||[]).join(", ")});
  fields.appendChild(buildField({label:"Bøyningsformer (kommaseparert)",hint:false,inputEl:formsIn}));
  const distractorsIn=el("input",{id:"dp-distractors",class:"input",type:"text",value:(w.flashcard_options||[]).join(", ")});
  fields.appendChild(buildField({label:"Distraktorer – flervalg-svar (kommaseparert)",hint:false,inputEl:distractorsIn}));
  panel.appendChild(fields);

  // Example sentences — read-only. They are generated to use the word in context,
  // and there is nothing for the learner to correct in them (FR-005, FR-010).
  const ex=(w.examples||[]).filter(e=>typeof e==="string"&&e.trim());
  if(ex.length){
    panel.appendChild(el("div",{class:"field__label",style:{marginBottom:"var(--s-1)"}},"Eksempler"));
    const list=el("ul",{style:{margin:"0 0 var(--s-3)",paddingLeft:"18px",color:"var(--ink-2)",lineHeight:"1.6",fontSize:"var(--t-sm)"}});
    ex.forEach(s=>list.appendChild(el("li",{},s)));
    panel.appendChild(list);
  }

  // Where the word was met. Absent for words typed straight into the bank, and
  // absent again when the text no longer resolves — neither is an error state,
  // so nothing at all is rendered in either case (FR-041).
  if(w.source_text_id && !sourceTextIndex.map) loadSourceTextIndex().then(renderWordList);
  const src=resolveSourceText(w);
  if(src){
    panel.appendChild(el("div",{class:"field__label",style:{marginBottom:"var(--s-1)"}},"Møtt i teksten"));
    panel.appendChild(el("span",{class:"btn--link",style:{display:"block",marginBottom:"var(--s-3)",cursor:"pointer"},
      click(){ setLesingText(src); setTab("lesing"); window.scrollTo(0,0); }
    },`${src.title} →`));
  }

  // Learnt toggle. The label states who set the current state, because an
  // automatic mark and a deliberate one are undone for different reasons (FR-037).
  const learnt=isLearnt(w);
  panel.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-1)"}},learntOriginLabel(w)));
  panel.appendChild(el("button",{class:"btn",style:{width:"100%",marginBottom:"var(--s-3)"},
    click(){setWordLearnt(w.id,!learnt);} // re-renders on its own
  },learnt?"Marker som ikke lært":"Marker som lært"));

  const actionsRow=el("div",{class:"actions"});
  const saveBtn=el("button",{class:"btn btn--primary",
    async click(){
      const upd={
        word:panel.querySelector("#dp-word").value.trim()||w.word,
        meaning:panel.querySelector("#dp-meaning").value.trim()||w.meaning,
        topic:panel.querySelector("#dp-topic").value.trim()||w.topic,
        explanation:panel.querySelector("#dp-explanation").value.trim()||null,
        forms:panel.querySelector("#dp-forms").value.split(",").map(s=>s.trim()).filter(Boolean),
        flashcard_options:panel.querySelector("#dp-distractors").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,4),
      };
      const r=await api(`/api/words/${encodeURIComponent(w.id)}`,{method:"PATCH",body:JSON.stringify(upd)});
      if(r.ok){const sv=await r.json();const idx=state.words.findIndex(x=>x.id===w.id);if(idx>=0)state.words[idx]={...state.words[idx],...sv,createdAt:new Date(sv.created_at).getTime()};saveStorage();}
      renderWordList();
    }
  },"Lagre");
  const aiBtn=el("button",{class:"btn",
    async click(){
      aiBtn.disabled=true; aiBtn.textContent="Genererer…";
      const ok=await enrichWord(w.id);
      // The learner pressed this, so silence would read as a broken button —
      // unlike the automatic paths, where failing quietly is right.
      if(!ok){ toast("AI-hjelp er ikke tilgjengelig akkurat nå. Prøv igjen om litt."); }
      renderWordList();
    }
  },"Generer med AI");
  actionsRow.appendChild(saveBtn); actionsRow.appendChild(aiBtn);
  panel.appendChild(actionsRow);

  return panel;
}

// Renders only the word-list section — never touches the form inputs
function renderWordList(){
  const container=$("word-list"); if(!container)return;
  refreshShareBar();          // filters changed -> re-seed and re-count
  container.innerHTML="";
  const filtered=getFilteredWords();

  if(state.words.length===0){
    container.appendChild(el("div",{class:"empty-state"},
      el("p",{class:"card__title",style:{marginBottom:"6px"}},"Ingen ord ennå"),
      el("p",{class:"card__sub"},"Legg til ord fra boken din ovenfor, eller importer en fil.")));
    return;
  }
  // Status dot (§ "Colour with a job"): derived, informational only — never
  // changes which words a filter returns, only how a card's dot reads.
  const lastAnswers=buildLastAnswerMap();
  const wordStatus=w=>{
    if(isLearnt(w)) return "learned";
    const practiced=!!(state.sentences[w.id]?.trim())||lastAnswers[w.word.toLowerCase()]===true;
    return practiced ? "doing" : "new";
  };
  const STATUS_LABEL={learned:"lært",doing:"under arbeid",new:"ikke øvd"};

  // Sortering (§ "Filters" result line): "sist lagt til" (default, newest first)
  // or "alfabetisk" — applied within each category group, not across the whole
  // bank, so the category sections above stay stable.
  const sortWords=list=>{
    const sorted=list.slice();
    if(state.ordbankSort==="alpha") sorted.sort((a,b)=>a.word.localeCompare(b.word,"nb"));
    else sorted.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    return sorted;
  };

  // Two-column layout: word grid + a side detail panel, opened by clicking a
  // card. Same grid/sticky-column technique as Lesing's reader + lookup panel
  // (.lesing-reader-layout/.lesing-lookup-panel) — the point is a second
  // instance of a pattern the app already has, not a new one. Only one word
  // can be open at a time (state.openWordId is a single id, not a set), so
  // there is at most one side panel.
  const layout=el("div",{class:"ordbank-layout"});
  const mainCol=el("div",{});
  layout.appendChild(mainCol);
  container.appendChild(layout);
  let openWord=null;

  let anyShown=false;
  CATS.forEach(cat=>{
    const cw=sortWords(filtered.filter(w=>(w.category===cat.key || (w.category==="temaord" && cat.key==="enkeltord"))));
    if(!cw.length)return;
    anyShown=true;
    const sec=el("div",{class:"cat-section"});
    const title=el("div",{class:"label-mono",style:{marginBottom:"8px"}},`${cat.label} (${cw.length})`);
    sec.appendChild(title);
    const grid=el("div",{class:"word-grid word-grid--fixed"});
    cw.forEach(w=>{
      if(w.id===state.openWordId) openWord=w;
      const wrap=el("div",{style:{gridColumn:"span 1"}});

      // Two independent entry points share one selection look (aria-selected +
      // checkbox, § "Colour with a job" — no separate colour language invented
      // for "this card is picked"): the classmate/teacher share flow, and the
      // generic "Merk ord" bulk-select (specs/Web app redesign consultation.zip).
      // Only one is ever active at a time — buildOrdbank() renders the selection
      // bar XOR the share bar depending on which mode is on.
      const sharing = state.shareOpen && state.shareSelected;
      const selecting = state.wordSelectMode && state.wordSelection;
      const picked = sharing ? state.shareSelected.has(w.id) : selecting ? state.wordSelection.has(w.id) : false;
      const chip=el("div",{class:"card", style:{cursor:"pointer"}});
      if((sharing||selecting) && picked) chip.setAttribute("aria-selected","true");
      if(sharing || selecting){
        chip.addEventListener("click",(e)=>{
          // Let the row's own buttons (lyd, lært, slett) win.
          if(e.target.closest("button")) return;
          e.preventDefault();
          // stopImmediatePropagation, not stopPropagation: the card carries a second
          // click listener further down that expands the word. It is on the *same*
          // element, so only the immediate form suppresses it — and this works only
          // because this listener is registered first.
          e.stopImmediatePropagation();
          if(sharing) toggleShareWord(w.id);
          else { selecting && (state.wordSelection.has(w.id) ? state.wordSelection.delete(w.id) : state.wordSelection.add(w.id)); renderContent(); }
        });
      }

      const topRow=el("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:"8px"}});
      const leftTop=el("div",{style:{display:"flex",alignItems:"flex-start",gap:"8px",flex:"1",minWidth:"0"}});
      if(sharing || selecting){
        const cb=el("span",{class:"checkbox","aria-checked":picked?"true":"false",style:{marginTop:"3px",flexShrink:"0"}});
        if(picked) cb.appendChild(icon("check"));
        leftTop.appendChild(cb);
      }
      const info=el("div",{style:{flex:"1",minWidth:"0"}});
      info.appendChild(el("div",{class:"card__title"},w.word));
      if(w.meaning)info.appendChild(el("div",{class:"card__sub"},w.meaning));
      // The Norwegian explanation sits directly under the English translation, so the
      // learner meets the word in the language they are learning it in (FR-010).
      if(w.explanation)info.appendChild(el("div",{class:"card__note"},w.explanation));
      leftTop.appendChild(info);
      topRow.appendChild(leftTop);
      // Pronunciation is the half of a word the bank cannot show in writing — a
      // small bordered square top-right of the card, matching the reference
      // mockup exactly (specs/Web app redesign consultation.zip § Runde 4, 4a).
      const wordSpeak=ttsButton(()=>w.word,`Hør uttalen av «${w.word}»`);
      if(wordSpeak){ topRow.appendChild(wordSpeak); }
      chip.appendChild(topRow);

      // Divider row: tema tag left, status right (§ "Colour with a job") —
      // matches the reference mockup's card footer exactly.
      const footRow=el("div",{class:"card__foot"});
      if(w.topic){ const tema=topicTema(w.topic); footRow.appendChild(el("span",{class:"tag",style:{background:tema.bg,color:tema.fg}},w.topic)); }
      else footRow.appendChild(el("span",{}));
      const st=wordStatus(w);
      const statusEl=el("div",{class:"status status--"+st});
      statusEl.appendChild(el("span",{class:"status__dot"}));
      statusEl.appendChild(document.createTextNode(STATUS_LABEL[st]));
      footRow.appendChild(statusEl);
      chip.appendChild(footRow);

      const rightFoot=el("div",{class:"card__foot",style:{borderTop:"none",paddingTop:"0",marginTop:"0"}});
      const spacer=el("div",{});
      rightFoot.appendChild(spacer);
      const actionsFoot=el("div",{style:{display:"flex",gap:"4px"}});
      // Marking a word learnt is a sweep across many words, so it has to be one click
      // on the card — opening the detail panel first would make it a three-click job.
      actionsFoot.appendChild(el("button",{
        class:"icon-btn"+(isLearnt(w)?" btn--accent":""),
        title:learntOriginLabel(w)+" Klikk for å endre.",
        click(e){e.stopPropagation();setWordLearnt(w.id,!isLearnt(w));}
      },icon("check")));
      actionsFoot.appendChild(el("button",{class:"icon-btn btn--danger",title:"Fjern",
        click(e){
          e.stopPropagation();
          if(!confirm(`Slette «${w.word}» fra ordbanken?`)) return;
          const wid=w.id;const wtopic=w.topic;state.words=state.words.filter(x=>x.id!==wid);if(state.openWordId===wid)state.openWordId=null;saveStorage();renderWordList();renderTabs();trackEvent("ordbank.word_deleted",{topic:wtopic});api(`/api/words/${encodeURIComponent(wid)}`,{method:"DELETE"}).catch(()=>{});
        }
      },icon("trash")));
      rightFoot.appendChild(actionsFoot);
      chip.appendChild(rightFoot);
      chip.addEventListener("click",()=>{state.openWordId=state.openWordId===w.id?null:w.id;renderWordList();});
      wrap.appendChild(chip);

      grid.appendChild(wrap);
    });
    sec.appendChild(grid); mainCol.appendChild(sec);
  });
  if(!anyShown){
    // "Empty because filtered" (§ "Empty and loading states") names the filter that
    // produced it and offers Nullstill — distinct from "empty because new" above.
    const empty=el("div",{class:"empty-state"});
    empty.appendChild(el("p",{class:"card__sub"},state.search?`Ingen ord matcher søket "${state.search}"`:state.topicFilter?`Ingen ord med tema "${state.topicFilter}"`:"Ingen ord med disse filtrene"));
    if(state.topicFilter||state.practicedFilter||state.learntFilter||state.timeFilter||state.search){
      empty.appendChild(el("button",{class:"btn--link",style:{marginTop:"6px"},click(){
        state.topicFilter="";state.practicedFilter="";state.learntFilter="";state.timeFilter=0;state.search="";
        renderContent();
      }},"Nullstill"));
    }
    mainCol.appendChild(empty);
  }

  if(openWord){
    const sideCol=el("div",{class:"ordbank-detail-col"});
    sideCol.appendChild(buildWordDetailPanel(openWord));
    layout.appendChild(sideCol);
    layout.classList.add("has-detail");
  }
}

// ── WORD LOOKUP ──────────────────────────────────────────────────────
// Replaces the old MyMemory call. The backend searches every user's bank first
// and only generates when nothing is found, so the same word gets the same
// description across learners and a hit costs nothing.
async function lookupWord(){
  const word=($("fi-word")?.value||form.word).trim();
  if(!word){$("fi-word")?.focus();return;}

  const btn=$("btn-lookup"), status=$("lookup-status");
  if(!status)return;
  btn.disabled=true;
  btn.style.opacity=".5";
  status.innerHTML='<span style="color:var(--color-text-muted)">Slår opp ordet…</span>';
  const orbUrl=ordbokeneUrl(word);

  try{
    const body={term:word};
    if(form.sourceTextId){body.source_text_id=form.sourceTextId;body.source_text_kind=form.sourceTextKind||"builtin";}
    const r=await api("/api/words/lookup",{method:"POST",body:JSON.stringify(body)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const p=await r.json();

    applyProposalToForm(p);
    // `hit` is what makes this worth counting: a lookup that never returns
    // anything useful is a different story from one that does.
    trackEvent("ordbank.lookup",{hit:p.origin!=="unavailable"});

    if(p.origin==="unavailable"){
      // Not an error: the word is still saveable, just without classification.
      // It is marked so it can be completed later rather than silently left thin.
      status.innerHTML=`<span style="color:var(--color-warning)">Kunne ikke hente forslag nå — du kan fylle ut selv og lagre.</span>&ensp;<a href="${orbUrl}" target="_blank">Slå opp i Bokmålsordboka →</a>`;
    } else {
      const bits=[];
      if(p.meaning) bits.push(`<strong>${escapeHtml(p.meaning)}</strong>`);
      if(p.normalised && p.word) bits.push(`oppslagsform: <strong>${escapeHtml(p.word)}</strong>`);
      const src=p.origin==="shared_bank"?"fra ordbanken":"foreslått";
      let html=`<span style="color:#2d9e6b">✓ ${bits.join("&ensp;·&ensp;")} <span style="color:#8a8a8a">(${src})</span></span>`;
      // The learner typed an inflected form and the headword changed under them.
      // Say so explicitly rather than silently swapping the field (US1 scenario 2).
      if(p.normalised){
        html+=`<div style="color:#8a6d1a;margin-top:3px">Lagres som <strong>${escapeHtml(p.word)}</strong> — «${escapeHtml(p.original_term)}» er tatt vare på som bøyningsform.</div>`;
      }
      if(p.already_in_bank){
        html+=`<div style="color:#8a6d1a;margin-top:3px">Du har allerede dette ordet i ordbanken.</div>`;
      }
      html+=`&ensp;·&ensp;<a href="${orbUrl}" target="_blank">Se i Bokmålsordboka →</a>`;
      status.innerHTML=html;
    }
  }catch{
    form.classificationStatus="unclassified";
    status.innerHTML=`<span style="color:var(--color-warning)">Ingen forbindelse — du kan fylle ut selv og lagre.</span>&ensp;<a href="${orbUrl}" target="_blank">Slå opp i Bokmålsordboka →</a>`;
  }
  btn.disabled=false; btn.style.opacity="";
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Fill the form from a proposal. Every field stays editable afterwards.
function applyProposalToForm(p){
  form.originalTerm=p.original_term||form.word;
  form.normalised=!!p.normalised;
  form.baseForm=p.base_form||"";
  form.forms=Array.isArray(p.forms)?p.forms.slice():[];
  form.examples=Array.isArray(p.examples)?p.examples.slice():[];
  // Feature 015: the proposal now carries flashcard distractors, generated by the
  // same classifier call that produced `forms` — or copied from the source record
  // on a shared-bank hit. Previously the client fired a second AI request straight
  // after saving to regenerate what it had just been handed.
  form.flashcardOptions=Array.isArray(p.flashcard_options)?p.flashcard_options.slice():[];
  form.classificationStatus=p.origin==="unavailable"?"unclassified":(p.origin==="shared_bank"?"reused":"classified");

  if(p.word){form.word=p.word;const wi=$("fi-word");if(wi)wi.value=p.word;}
  if(p.meaning){form.meaning=p.meaning;const mi=$("fi-meaning");if(mi)mi.value=p.meaning;}
  if(p.explanation){form.explanation=p.explanation;const ei=$("fi-explanation");if(ei)ei.value=p.explanation;}
  if(p.category){form.category=p.category;const ci=$("fi-cat");if(ci)ci.value=p.category;}
  // The topic is proposed rather than chosen by the learner — the main reason the
  // existing bank was mis-classified. The dropdown remains for override.
  if(p.topic){form.topic=p.topic;const ti=$("fi-topic");if(ti)ti.value=p.topic;}
}

async function addWord(){
  const word=form.word.trim(); if(!word){$("fi-word")?.focus();return;}
  const tempId="tmp_"+Date.now();
  const entry={
    id:tempId, word, meaning:form.meaning.trim(), category:form.category,
    topic:form.topic.trim()||FALLBACK_TOPIC, createdAt:Date.now(),
    forms:form.forms.slice(), flashcard_options:form.flashcardOptions.slice(),
    explanation:form.explanation.trim()||null,
    examples:form.examples.slice(),
    base_form:form.baseForm||null,
    source_text_id:form.sourceTextId||null,
    source_text_kind:form.sourceTextKind||null,
    classification_status:form.classificationStatus,
  };
  state.words.push(entry);
  const savedForms=entry.forms, savedExamples=entry.examples;
  const savedOptions=entry.flashcard_options;
  const payloadTopic=entry.topic, payloadStatus=entry.classification_status;
  const payloadExplanation=entry.explanation, payloadBase=entry.base_form;
  const payloadSrcId=entry.source_text_id, payloadSrcKind=entry.source_text_kind;
  resetWordForm();
  saveStorage();
  const wi=$("fi-word"),mi=$("fi-meaning"),ti=$("fi-topic"),ei=$("fi-explanation");
  if(wi){wi.value="";wi.focus();} if(mi)mi.value=""; if(ti)ti.value=""; if(ei)ei.value="";
  const st=$("lookup-status"); if(st)st.innerHTML="";
  renderWordList(); renderTabs();
  // Persist to server and swap temp ID with server UUID
  try{
    const r=await api("/api/words",{method:"POST",body:JSON.stringify({
      word:entry.word, meaning:entry.meaning||"-", category:entry.category,
      topic:payloadTopic, forms:savedForms, flashcard_options:savedOptions,
      explanation:payloadExplanation, examples:savedExamples,
      base_form:payloadBase, source_text_id:payloadSrcId,
      source_text_kind:payloadSrcKind, classification_status:payloadStatus,
    })});
    if(r.ok){
      const sv=await r.json();
      const idx=state.words.findIndex(w=>w.id===tempId);
      if(idx>=0){state.words[idx]={...state.words[idx],...sv,createdAt:new Date(sv.created_at).getTime()};}
      saveStorage(); renderWordList();
      // Recorded here rather than at the optimistic insert above: a word that
      // never reached the server is not a use (FR-017).
      trackEvent("ordbank.word_added",{topic:payloadTopic,category:entry.category,source:payloadSrcKind||"manual"});
      // No follow-up AI call: the distractors travelled with the proposal.
    }
  }catch{}
}

// ── IMPORT / EXPORT ───────────────────────────────────────────────────
function exportWords(){
  if(!state.words.length){toast("Ingen ord å eksportere.");return;}
  const data=JSON.stringify(state.words.map(({word,meaning,category,topic,createdAt})=>({word,meaning,category,topic:topic||"",createdAt:createdAt||Date.now()})),null,2);
  const a=el("a",{href:URL.createObjectURL(new Blob([data],{type:"application/json"})),download:"ordbank.json"});
  a.click(); URL.revokeObjectURL(a.href);
  trackEvent("ordbank.export",{count:state.words.length,format:"json"});
  toast(`✓ ${state.words.length} ord eksportert som ordbank.json`);
}

function importWords(file){
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result; let imported=[];
    try{
      if(file.name.endsWith(".json")){
        const p=JSON.parse(text);
        if(Array.isArray(p)) imported=p.filter(w=>w.word).map(w=>({
          word:String(w.word).trim(),
          meaning:String(w.meaning||"").trim(),
          category:CAT_MAP[w.category]?w.category:"enkeltord",
          topic:normalizeTopic(String(w.topic||"")),
          createdAt:w.createdAt||Date.now(),
        }));
      } else {
        text.split(/\r?\n/).filter(l=>l.trim()&&!l.startsWith("#")).forEach(line=>{
          const parts=line.split(/[,;\t]/).map(s=>s.trim());
          if(parts[0]){
            let word=parts[0], meaning=parts[1]||"", category=parts[2]||"enkeltord", topic=parts[3]||"";
            if(parts.length===1){
              const m=line.match(/^(.+?)\s*[-:]\s*(.+)$/);
              if(m){word=m[1].trim();meaning=m[2].trim();}
            }
            if(!CAT_MAP[category])category="enkeltord";
            imported.push({word,meaning,category,topic:normalizeTopic(topic),createdAt:Date.now()});
          }
        });
      }
    }catch{toast("Kunne ikke lese filen. Sjekk formatet.");return;}
    if(!imported.length){toast("Ingen ord funnet i filen.");return;}
    const existing=new Set(state.words.map(w=>w.word.toLowerCase()));
    const toAdd=imported.filter(w=>!existing.has(w.word.toLowerCase()));
    const skipped=imported.length-toAdd.length;
    if(!toAdd.length){toast(`Ingen nye ord (${skipped} duplikater hoppet over)`);return;}
    // Assign temp IDs and add to local state immediately
    const tempEntries=toAdd.map(w=>({id:"tmp_"+Date.now()+Math.random()*9999,...w,forms:[],flashcard_options:[]}));
    tempEntries.forEach(e=>state.words.push(e));
    saveStorage(); renderWordList(); renderTabs();
    trackEvent("ordbank.import",{count:toAdd.length,format:file.name.endsWith(".json")?"json":"text"});
    toast(`✓ ${toAdd.length} nye ord importert! (${skipped} duplikater hoppet over)`);
    // Persist to backend in background
    api("/api/words/batch",{method:"POST",body:JSON.stringify(toAdd.map(w=>({
      word:w.word, meaning:w.meaning||"-", category:w.category||"enkeltord",
      topic:w.topic||FALLBACK_TOPIC, forms:[], flashcard_options:[],
    })))}).then(async r=>{
      if(!r.ok){console.error("Batch import failed",r.status);return;}
      const saved=await r.json();
      saved.forEach((sv,i)=>{
        const idx=state.words.findIndex(w=>w.id===tempEntries[i].id);
        if(idx>=0) state.words[idx]={...state.words[idx],...sv,createdAt:new Date(sv.created_at).getTime()};
      });
      saveStorage();
      // Generate forms+distractors for up to first 5 imported words (sequential to avoid rate limits).
      // Imported words never pass through the lookup form, so nothing else fills these in.
      const toGenerate=saved.slice(0,5);
      (async()=>{for(const sv of toGenerate) await enrichWord(sv.id); renderWordList();})();
    }).catch(()=>{});
  };
  reader.readAsText(file,"UTF-8");
}

// ── SETNINGER TAB ────────────────────────────────────────────────────
function buildSetninger(){
  const frag=document.createDocumentFragment();

  if(state.words.length===0){
    frag.appendChild(el("div",{class:"empty-state"},
      el("p",{class:"card__title",style:{marginBottom:"6px"}},"Ingen ord i ordbanken ennå"),
      el("p",{class:"card__sub",style:{marginBottom:"var(--s-3)"}},"Legg til ord først, så kan du øve på å bruke dem i setninger."),
      el("button",{class:"btn btn--primary",click(){setTab("ordbank");}},icon("plus"),"Legg til ord")));
    return frag;
  }

  // ── Filter panel (§ "Filters") — same facet/pill component as Ordbank ──
  const topics=VALID_TOPIC_LIST.filter(t=>state.words.some(w=>w.topic===t));
  const sentTags=allWordTags(state.words);
  if(topics.length>0 || sentTags.length>0){
    const isOpen=state.sentFiltersOpen ?? true;
    const activeCount=[state.sentTopicFilter,state.tagFilter].filter(Boolean).length;
    const panel=el("div",{class:"filter-panel",style:{marginBottom:"var(--s-4)"}});
    if(!isOpen) panel.setAttribute("data-collapsed","");

    const head=el("div",{class:"filter-panel__head"});
    const headLeft=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}});
    headLeft.appendChild(icon("filter"));
    headLeft.lastChild.style.color="var(--ink-3)";
    headLeft.appendChild(el("span",{class:"label-mono"},"Filtre"));
    if(activeCount) headLeft.appendChild(el("span",{class:"badge-count"},String(activeCount)));
    if(!isOpen){
      if(state.sentTopicFilter) headLeft.appendChild(buildRemovablePill(state.sentTopicFilter, ()=>{state.sentTopicFilter="";state.wordIdx=0;renderContent();}));
      if(state.tagFilter) headLeft.appendChild(buildRemovablePill(state.tagFilter, ()=>{state.tagFilter="";state.wordIdx=0;renderContent();}));
    }
    head.appendChild(headLeft);
    const headRight=el("div",{style:{display:"flex",alignItems:"center",gap:"14px"}});
    if(activeCount) headRight.appendChild(el("button",{class:"btn--link",click(){
      state.sentTopicFilter="";state.tagFilter="";state.wordIdx=0;renderContent();
    }},"Nullstill"));
