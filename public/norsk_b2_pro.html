    headRight.appendChild(el("button",{style:{background:"none",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:"6px",fontSize:"13px",color:"var(--ink-2)",fontWeight:"500"},
      click(){ state.sentFiltersOpen=!isOpen; trackEvent("filters.toggled",{tab:"setninger",state:isOpen?"collapsed":"expanded"}); renderContent(); }
    },(isOpen?"Skjul filtre":"Vis filtre")+" ",el("span",{style:{fontSize:"10px"}},"▼")));
    head.appendChild(headRight);
    panel.appendChild(head);

    const body=el("div",{class:"filter-panel__body"});
    if(topics.length>0){
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Tema"));
      const opts=el("div",{class:"facet__options"});
      opts.appendChild(buildFacetPill("Alle",state.sentTopicFilter==="",()=>{state.sentTopicFilter="";state.wordIdx=0;renderContent();},null,state.words.length));
      topics.forEach(t=>{
        const count=state.words.filter(w=>w.topic===t).length;
        opts.appendChild(buildFacetPill(t,state.sentTopicFilter===t,()=>{state.sentTopicFilter=t;state.wordIdx=0;renderContent();},topicTema(t).bg,count));
      });
      facet.appendChild(opts);
      body.appendChild(facet);
    }
    // Tag facet (feature 023) — only rendered when at least one word carries a tag.
    if(sentTags.length>0){
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Tagg"));
      const opts=el("div",{class:"facet__options"});
      opts.appendChild(buildFacetPill("Alle",!state.tagFilter,()=>{state.tagFilter="";state.wordIdx=0;renderContent();}));
      sentTags.forEach(tag=>{
        opts.appendChild(buildFacetPill(tag,state.tagFilter===tag,()=>{
          state.tagFilter=tag; state.wordIdx=0;
          trackEvent("setninger.tag_filter_used",{tag});
          renderContent();
        }));
      });
      facet.appendChild(opts);
      body.appendChild(facet);
    }
    panel.appendChild(body);
    frag.appendChild(panel);
  }

  const sentWords=getSentWords();
  if(sentWords.length===0){
    const parts=[];
    if(state.sentTopicFilter) parts.push(`tema "${state.sentTopicFilter}"`);
    if(state.tagFilter) parts.push(`tagg "${state.tagFilter}"`);
    frag.appendChild(el("p",{class:"card__note"},
      parts.length ? `Ingen ord med ${parts.join(" og ")}.` : "Ingen ord."));
    return frag;
  }

  // Clamp index
  if(state.wordIdx>=sentWords.length) state.wordIdx=0;
  const word=sentWords[state.wordIdx];
  const actualCat=word.category==="temaord"?"enkeltord":word.category;
  const cat=CAT_MAP[actualCat]||CATS[0];
  const total=sentWords.length;
  const doneCount=sentWords.filter(w=>state.sentences[w.id]?.trim()).length;
  const currentSentence=state.sentences[word.id]||"";

  // ── Navigation bar ──
  const nav=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"var(--s-3)",flexWrap:"wrap",gap:"var(--s-2)"}});
  nav.appendChild(el("button",{class:"btn",disabled:state.wordIdx===0?"":null,
    click(){state.wordIdx--;renderContent();}
  },"← Forrige"));
  nav.appendChild(el("div",{class:"card__note"},
    el("b",{style:{color:"var(--ink)"}},`${state.wordIdx+1} / ${total}`),` ord · ${doneCount} setninger skrevet`));
  nav.appendChild(el("button",{class:"btn",disabled:state.wordIdx===total-1?"":null,
    click(){state.wordIdx++;renderContent();}
  },"Neste →"));
  frag.appendChild(nav);

  // ── Word card ──
  const card=el("div",{class:"card",style:{marginBottom:"var(--s-3)"}});
  card.appendChild(el("div",{style:{fontSize:"32px",fontWeight:"800",color:"var(--green)",marginBottom:"var(--s-2)",wordBreak:"break-word",lineHeight:"1.2"}},word.word));
  const meta=el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",marginBottom:"var(--s-3)",flexWrap:"wrap"}});
  meta.appendChild(el("span",{class:"tag"},cat.label));
  if(word.topic){ const tema=topicTema(word.topic); meta.appendChild(el("span",{class:"tag",style:{background:tema.bg,color:tema.fg}},word.topic)); }
  if(word.meaning) meta.appendChild(el("span",{class:"card__note",style:{fontStyle:"italic"}},word.meaning));
  card.appendChild(meta);

  const hints={
    enkeltord:`Bruk ordet "${word.word}" i en fullstendig setning. Tenk på riktig bøyning!`,
    uttrykk:`Bruk uttrykket "${word.word}" naturlig i en setning. Jobb med kontekst og flyt.`,
    koblingsord:`Koble to tanker med "${word.word}". Koblingsord skaper logisk sammenheng mellom setningsdeler.`,
  };
  card.appendChild(el("p",{style:{fontSize:"var(--t-base)",fontWeight:"600",color:"var(--ink)",marginBottom:"var(--s-2)"}},hints[actualCat]||`Lag en setning med "${word.word}".`));

  const ta=el("textarea",{id:"sent-ta",class:"textarea",style:{minHeight:"88px",marginBottom:"var(--s-2)"},
    placeholder:`Skriv én setning med "${word.word}" her…`,
    input:onSentenceInput});
  ta.value=currentSentence;
  card.appendChild(ta);

  const fb=el("div",{id:"sent-feedback",style:{display:"flex",alignItems:"center",gap:"var(--s-2)",minHeight:"20px"}});
  fillSentenceFeedback(fb,currentSentence,word);
  card.appendChild(fb);

  const grammarDiv=el("div",{id:"grammar-result",style:{display:"none",marginTop:"var(--s-3)"}});
  card.appendChild(grammarDiv);

  // Action buttons
  const actions=el("div",{class:"actions",style:{marginTop:"var(--s-3)",flexWrap:"wrap"}});
  actions.appendChild(el("button",{class:"btn btn--primary",
    click(){
      const t=$("sent-ta"); if(t) state.sentences[word.id]=t.value;
      saveSentences();
      // Find the next word without a sentence (prefer higher index, then wrap)
      const unwritten=sentWords.map((w,i)=>({w,i})).filter(({w})=>!state.sentences[w.id]?.trim());
      if(unwritten.length){
        const after=unwritten.find(x=>x.i>state.wordIdx);
        state.wordIdx=(after||unwritten[0]).i;
      }
      renderContent();
    }
  },sentWords.some((w,i)=>i!==state.wordIdx&&!state.sentences[w.id]?.trim())?"Lagre og neste ord →":"Lagre"));

  actions.appendChild(el("button",{class:"btn",title:"Grammatikksjekk via Claude AI",
    click:()=>checkGrammar(word.word, $("sent-ta")?.value||currentSentence, word.id)},"Sjekk med Claude"));

  if(currentSentence.trim()){
    actions.appendChild(el("button",{class:"btn",
      click(){
        const t=$("sent-ta"); if(t){t.value="";state.sentences[word.id]="";}
        saveSentences(); updateSentencePanel();
      }
    },"Slett setning"));
  }
  actions.appendChild(el("button",{class:"btn",
    click(){
      const unwritten=sentWords.map((w,i)=>({w,i})).filter(({w})=>!state.sentences[w.id]?.trim());
      if(unwritten.length){state.wordIdx=unwritten[Math.floor(Math.random()*unwritten.length)].i;renderContent();}
      else toast("Alle ord har setninger!");
    }
  },"Tilfeldig ord"));
  card.appendChild(actions);
  frag.appendChild(card);

  // ── Previously written sentences ──
  const written=sentWords.filter(w=>state.sentences[w.id]?.trim()&&w.id!==word.id);
  if(written.length){
    const prev=el("div",{style:{marginTop:"var(--s-4)"}});
    prev.appendChild(el("div",{class:"label-mono",style:{marginBottom:"var(--s-2)"}},"Setninger du har skrevet"));
    written.slice().reverse().forEach(w=>{
      const item=el("div",{class:"card",style:{marginBottom:"var(--s-2)",cursor:"pointer",borderLeft:"3px solid var(--green)"},
        click(){state.wordIdx=sentWords.indexOf(w);renderContent();}});
      item.appendChild(el("div",{style:{fontSize:"var(--t-mono)",color:"var(--green)",fontWeight:"700",marginBottom:"3px"}},w.word));
      item.appendChild(el("div",{style:{fontSize:"var(--t-base)",color:"var(--ink)",lineHeight:"1.5"}},state.sentences[w.id]));
      prev.appendChild(item);
    });
    frag.appendChild(prev);
  }

  frag.appendChild(el("button",{class:"btn",style:{marginTop:"var(--s-3)"},
    click:exportSentencesByTopic},icon("download"),"Eksporter setninger"));
  return frag;
}

async function checkGrammar(word, sentence, wordId){
  if(!sentence.trim()){toast("Skriv en setning først.");return;}
  const grammarDiv=$("grammar-result");
  if(!grammarDiv)return;
  grammarDiv.innerHTML='';
  grammarDiv.style.display="block";

  // Loading indicator
  const loading=el("p",{class:"card__note",style:{padding:"8px 0"}},"Spør Claude…");
  grammarDiv.appendChild(loading);

  await checkWithClaude(word, sentence, grammarDiv, wordId);
}

// ── Claude API grammar check ──────────────────────────────────────────
async function checkWithClaude(word, sentence, container, wordId){
  // Claude API is blocked from file:// by browser CORS rules.
  // Must be served via localhost — run start_server.py.
  if(window.location.protocol==="file:"){
    container.innerHTML="";
    const box=el("div",{class:"card",style:{borderLeft:"4px solid var(--status-doing)",fontSize:"var(--t-sm)",lineHeight:"1.7"}});
    box.appendChild(el("div",{style:{fontWeight:"700",marginBottom:"6px",color:"var(--status-doing)"}},"Kan ikke nå Claude API fra en lokal fil"));
    box.appendChild(document.createTextNode("Nettleseren blokkerer API-kall fra "));
    box.appendChild(el("code",{style:{background:"var(--surface-head)",padding:"2px 6px",borderRadius:"var(--r-btn)"}},"file://"));
    box.appendChild(document.createTextNode(" av sikkerhetsgrunner. Løsningen er enkel:"));
    box.appendChild(el("ol",{style:{marginTop:"8px",marginLeft:"18px",lineHeight:"2"}},
      el("li",{},"Åpne en terminal i samme mappe som HTML-filen"),
      el("li",{},el("span",{},"Kjør: "),el("code",{style:{background:"var(--surface-head)",padding:"2px 8px",borderRadius:"var(--r-btn)",fontWeight:"700"}},"python3 start_server.py")),
      el("li",{},"Åpne ",el("a",{href:"http://localhost:8080/norsk_b2_pro.html",target:"_blank",style:{color:"var(--green)",fontWeight:"700"}},"http://localhost:8080/norsk_b2_pro.html"))
    ));
    container.appendChild(box);
    return;
  }
  // The prompt is composed entirely server-side now (feature 021) — the
  // browser sends only the learner's own message and a content reference.
  const userMsg=`Jeg er en norsk-elev og øver på ordet/uttrykket: "${word}"\n\nVennligst vurder denne setningen:\n"${sentence}"`;

  let diag=null;
  try{
    const data=await requestAiFeedback(AI_SURFACE.SENTENCE, userMsg,
      "Svaret ble avkuttet fordi det ble for langt. Prøv med en kortere setning.",
      // The one surface where a real reference exists at call time: the word is
      // already in the bank. The sentence itself is not saved by this flow.
      {contentKind:"sentence", wordId});
    diag=claudeDiag(data,userMsg);
    // Truncated responses produce invalid JSON — report it as a length problem, not a parse error
    if(data.stop_reason==="max_tokens") throw new Error("Svaret ble avkuttet fordi det ble for langt. Prøv med en kortere setning.");
    const rawText=claudeText(data);
    // Strip any accidental markdown fences
    const jsonText=rawText.replace(/```json?\n?/gi,"").replace(/```/g,"").trim();
    const result=JSON.parse(jsonText);
    renderClaudeResult(result, container);

  }catch(err){
    container.innerHTML="";
    container.appendChild(el("p",{class:"card__note",style:{color:"var(--danger)",padding:"10px 14px",borderLeft:"3px solid var(--danger)"}},
      err.aiHandled ? err.message : `Feil: ${err.message}. Prøv igjen om litt.`
    ));
    // Only the failures the backend cannot see. `aiHandled` means the request
    // itself failed, and the server already recorded that — reporting it again
    // here would double-count it.
    if(!err.aiHandled) reportAiFailure(AI_SURFACE.SENTENCE, aiFailureReasonFor(diag), diag);
    appendClaudeDiag(container, diag);
  }
}

// Fill in inflected forms and flashcard distractors for a word already saved.
//
// Feature 015 replaced `generateFormsAndDistractors()` here: that function built its
// own prompt, asked Claude through the Cloudflare proxy, and PATCHed the answer back.
// The classifier already generates `forms` for the same word, so half of it was
// duplicated work — and it was the reason the edge platform needed its own copy of
// the API key. The prompt now lives in `word_classifier`; this is one authenticated
// POST to our own backend.
//
// Words added through the lookup form no longer come here at all: their distractors
// arrive with the proposal. This covers the two paths a proposal cannot reach — bulk
// import, and the "✨ Generer med AI" button on an existing word.
//
// Returns true on success so the button can report failure. The automatic callers
// ignore the result: enrichment is a bonus, and a learner who imported 40 words
// should not be shown an error about the fifth.
async function enrichWord(wordId){
  try{
    const r=await api(`/api/words/${encodeURIComponent(wordId)}/enrich`,{method:"POST"});
    if(!r.ok) return false;
    const sv=await r.json();
    const idx=state.words.findIndex(w=>w.id===wordId);
    if(idx>=0){state.words[idx]={...state.words[idx],forms:sv.forms,flashcard_options:sv.flashcard_options};}
    saveStorage();
    return true;
  }catch{ return false; }
}

function renderClaudeResult(r, container){
  container.innerHTML="";
  const isOk=r.correct&&r.natural;
  const isPartial=r.correct&&!r.natural;
  const statusColor = isOk?"var(--status-learned)":isPartial?"var(--status-doing)":"var(--danger)";

  const resultBox=el("div",{class:"card"});

  // Header
  const hdr=el("div",{class:"status",style:{fontSize:"var(--t-base)",fontWeight:"700",color:statusColor,marginBottom:"var(--s-2)"}});
  hdr.appendChild(el("span",{class:"status__dot",style:{background:statusColor}}));
  hdr.appendChild(document.createTextNode(
    isOk?"Korrekt og naturlig!":isPartial?"Grammatisk riktig, men litt unaturlig":"Feil funnet"
  ));
  resultBox.appendChild(hdr);

  if(r.overall) resultBox.appendChild(el("p",{style:{fontSize:"var(--t-sm)",color:"var(--ink-2)",marginBottom:"var(--s-2)",lineHeight:"1.55"}},r.overall));

  // Errors
  if(r.errors&&r.errors.length){
    r.errors.forEach(e=>{
      const card=el("div",{style:{background:"var(--tema-helse-bg)",borderRadius:"var(--r-btn)",padding:"8px 12px",marginBottom:"var(--s-1)"}});
      if(e.text)  card.appendChild(el("div",{style:{fontWeight:"700",color:"var(--danger)",fontSize:"var(--t-mono)",marginBottom:"2px"}},`"${e.text}"`));
      if(e.issue) card.appendChild(el("div",{class:"card__note",style:{marginBottom:"3px"}},e.issue));
      if(e.fix)   card.appendChild(el("div",{style:{color:"var(--green)",fontWeight:"600",fontSize:"var(--t-mono)"}},`→ ${e.fix}`));
      resultBox.appendChild(card);
    });
  }

  // Improved sentence
  if(r.improved){
    const imp=el("div",{style:{background:"var(--green-tint)",borderRadius:"var(--r-btn)",padding:"10px 12px",marginTop:"var(--s-2)"}});
    imp.appendChild(el("div",{class:"label-mono",style:{color:"var(--green)",marginBottom:"3px"}},"Forbedret setning"));
    imp.appendChild(el("div",{style:{fontSize:"var(--t-base)",fontStyle:"italic",color:"var(--ink)"}},r.improved));
    resultBox.appendChild(imp);
  }

  // Tip
  if(r.tip) resultBox.appendChild(el("p",{class:"card__note",style:{marginTop:"var(--s-2)"}},r.tip));

  container.appendChild(resultBox);
}

// ── LanguageTool fallback ─────────────────────────────────────────────
async function checkWithLanguageTool(sentence, container){
  try{
    const res=await fetch("https://api.languagetool.org/v2/check",{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:`text=${encodeURIComponent(sentence)}&language=nb`,
    });
    const data=await res.json();
    container.innerHTML="";
    if(!data.matches||data.matches.length===0){
      container.appendChild(el("div",{class:"grammar-ok"},"✓ Ingen grammatikkfeil funnet (LanguageTool)"));
    } else {
      data.matches.forEach(m=>{
        const card=el("div",{class:"grammar-error"});
        card.appendChild(el("div",{},el("span",{class:"em"},m.message)));
        if(m.replacements?.length)
          card.appendChild(el("div",{style:{fontSize:"var(--font-xs)",color:"#2d9e6b",marginTop:"3px"}},
            `Forslag: ${m.replacements.slice(0,3).map(r=>r.value).join(", ")}`));
        container.appendChild(card);
      });
    }
  }catch{
    container.innerHTML='<span style="color:var(--color-warning);font-size:var(--font-sm)">Ingen internettforbindelse. Legg til Claude API-nøkkel for offline-bruk.</span>';
  }
}

function exportSentencesByTopic(){
  const byTopic = {};
  const noTopic = [];

  state.words.forEach(w=>{
    const sent = state.sentences[w.id];
    if(sent && sent.trim()){
      if(w.topic && w.topic.trim()){
        if(!byTopic[w.topic]) byTopic[w.topic] = [];
        byTopic[w.topic].push({word: w.word, sent});
      } else {
        noTopic.push({word: w.word, sent});
      }
    }
  });

  let content = "";
  Object.keys(byTopic).sort().forEach(topic=>{
    content += `=== TEMA: ${topic.charAt(0).toUpperCase() + topic.slice(1)} ===\n\n`;
    byTopic[topic].forEach(({word, sent})=>{
      content += `${word}\n→ ${sent}\n\n`;
    });
  });

  if(noTopic.length>0){
    content += `=== UTEN TEMA ===\n\n`;
    noTopic.forEach(({word, sent})=>{
      content += `${word}\n→ ${sent}\n\n`;
    });
  }

  const a=el("a",{href:URL.createObjectURL(new Blob([content],{type:"text/plain"})),download:"setninger.txt"});
  a.click(); URL.revokeObjectURL(a.href);
  toast("✓ Setninger eksportert som setninger.txt");
}

function onSentenceInput(e){
  const word=getSentWords()[state.wordIdx]; if(!word)return;
  state.sentences[word.id]=e.target.value;
  const fb=$("sent-feedback"); if(fb)fillSentenceFeedback(fb,e.target.value,word);

function fillSentenceFeedback(container,sentence,word){
  container.innerHTML="";
  if(!sentence.trim()){
    container.appendChild(el("span",{class:"card__note"},"Begynn å skrive…"));
    return;
  }
  const low=sentence.toLowerCase();
  const used=[word.word,...(word.forms||[])].some(f=>f.length>=2&&low.includes(f.toLowerCase()));
  const wc=sentence.trim().split(/\s+/).length;
  if(used){
    container.appendChild(el("span",{class:"status status--learned"},el("span",{class:"status__dot"}),"Ordet er brukt!"));
  } else {
    container.appendChild(el("span",{style:{color:"var(--status-doing)",fontSize:"var(--t-sm)"}},`Husk å bruke "${word.word}" i setningen.`));
  }
  container.appendChild(el("span",{class:"card__note",style:{marginLeft:"8px"}},`${wc} ord`));
}

function updateSentencePanel(){
  const word=getSentWords()[state.wordIdx]; if(!word)return;
  const sentence=state.sentences[word.id]||"";
  const fb=$("sent-feedback"); if(fb)fillSentenceFeedback(fb,sentence,word);
  renderTabs();
}

// ── OPPGAVER TAB ──────────────────────────────────────────────────────
function buildOppgaver(){
  const frag=document.createDocumentFragment();
  frag.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"4px"}},"Skrive"));
  frag.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-4)"}},
    "Velg et tema, velg deretter en oppgave – eller skriv din egen."));
  // Topic tiles: tema colour carries the identity, no emoji (§ "Tema is colour").
  // A user report that this grid read as "pale" bumped the colour from a 10px
  // swatch dot to a coloured top border + tinted background wash — still no
  // icon, just more of the same colour doing more work. Selection still wins:
  // the inline tint is skipped on the active tile so [aria-selected]'s own
  // green border+tint (every other card in the app uses it) isn't fought.
  const grid=el("div",{class:"word-grid"});
  Object.entries(TOPICS).forEach(([key,meta])=>{
    const active=state.currentTopic===key;
    const tema=topicTema(key);
    const card=el("div",{
      class:"card",
      style:{cursor:"pointer",borderTop:`3px solid ${tema.fg}`,background:active?"":tema.bg},
      click(){selectTopic(key);},
    });

    card.appendChild(el("div",{class:"card__note",style:{marginBottom:"var(--s-2)"}},PROMPTS[key].length+" oppgaver"));
    card.appendChild(el("div",{class:"status status--"+(active?"learned":"new")},
      el("span",{class:"status__dot"}), active?"valgt":"velg"));
    grid.appendChild(card);
  });
  frag.appendChild(grid);

  // Saved essays — shown on this landing screen (reached directly from the
  // Skrive nav item) so they're findable before picking a topic/prompt, not
  // only after, buried at the bottom of the editor.
  frag.appendChild(el("div",{style:{marginTop:"var(--s-4)"}},buildEssayBankPanel()));

  // Prompt selection panel (shown when a topic is selected)
  if(state.currentTopic){
    const meta=TOPICS[state.currentTopic];
    const prompts=PROMPTS[state.currentTopic];

    hdr.appendChild(el("span",{class:"card__title"},meta.name+" — velg oppgave"));
    hdr.appendChild(el("button",{class:"icon-btn",style:{marginLeft:"auto"},title:"Lukk",
      click(){state.currentTopic=null;renderContent();}
    },icon("close")));
    panel.appendChild(hdr);

    // Prompt list
    prompts.forEach(p=>{
      const row=el("div",{class:"prompt-list-item",click(){goToPrompt(p);}});
      row.appendChild(el("div",{style:{flex:"1"}},
        el("div",{class:"prompt-list-item-title"},p.title),
        el("div",{class:"prompt-list-item-text"},p.text.length>120?p.text.slice(0,120)+"…":p.text)
      ));
      row.appendChild(el("div",{class:"prompt-list-arrow"},"›"));

    // Custom oppgave
    const customBox=el("div",{style:{padding:"var(--s-3) 18px",background:"var(--surface-sunk)",borderTop:"1px solid var(--line-soft)"}});
    customBox.appendChild(el("div",{class:"field__label",style:{marginBottom:"var(--s-2)"}},"Skriv din egen oppgave"));

    frag.appendChild(panel);
  }
  return frag;

function selectTopic(key){
  state.currentTopic=(state.currentTopic===key)?null:key;
  renderContent();
}
function goToPrompt(prompt){
  state.currentPrompt=prompt; state.essay=""; state.tab="skriv";
  renderTabs(); renderContent();
}
function pickPrompt(topicKey){
  state.currentPrompt=pickRandom(PROMPTS[topicKey]);
  state.currentTopic=topicKey; state.essay=""; state.tab="skriv";
  renderTabs(); renderContent();
}
function shufflePrompt(){
  const others=PROMPTS[state.currentTopic].filter(p=>p.text!==state.currentPrompt.text);
  state.currentPrompt=pickRandom(others.length?others:PROMPTS[state.currentTopic]);
  state.essay=""; renderContent();
}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ── Essay Claude check ────────────────────────────────────────────────
async function checkEssayWithClaude(essay, container){
  container.innerHTML="";
  const loading=el("div",{style:{color:"var(--color-text-muted)",fontSize:"var(--font-sm)",padding:"8px 0"}},"🤖 Analyserer teksten din med Claude…");
  container.appendChild(loading);

  if(window.location.protocol==="file:"){
    container.innerHTML="";
    const box=el("div",{style:{background:"#fffdf0",borderLeft:"4px solid #f0c040",borderRadius:"var(--radius-md)",padding:"14px 16px",fontSize:"var(--font-sm)",lineHeight:"1.7",color:"#555"}});
    box.appendChild(el("div",{style:{fontWeight:"700",marginBottom:"6px",color:"var(--color-warning)"}},"⚠️ Kan ikke nå Claude API fra en lokal fil"));
    box.appendChild(document.createTextNode("Kjør "));
    box.appendChild(el("code",{style:{background:"#f0f0f0",padding:"2px 6px",borderRadius:"var(--radius-sm)"}},"python3 start_server.py"));
    box.appendChild(document.createTextNode(" og åpne appen via localhost."));
    container.appendChild(box);
    return;
  }

  // The prompt is composed entirely server-side now (feature 021), including
  // any report-layout configuration a teacher has saved for this student.
  const userMsg=`Please evaluate this Norwegian essay:\n\n${essay}`;

  let diag=null;
  try{
    const data=await requestAiFeedback(AI_SURFACE.ESSAY, userMsg,
      "Svaret ble avkuttet fordi det ble for langt. Prøv med en kortere tekst.",
      // No essay id: the essay is still a draft in localStorage at this point and
      // is only PATCHed to the server *after* this reply arrives. The kind alone
      // is the honest record.
      {contentKind:"essay"});
    diag=claudeDiag(data,userMsg);
    // Truncated responses produce invalid JSON — report it as a length problem, not a parse error
    if(data.stop_reason==="max_tokens") throw new Error("Svaret ble avkuttet fordi det ble for langt. Prøv med en kortere tekst.");
    const rawText=claudeText(data);
    const jsonText=rawText.replace(/```json?\n?/gi,"").replace(/```/g,"").trim();
    const result=JSON.parse(jsonText);
    renderEssayClaudeResult(result, container);
    // Save Claude level + feedback back into the essay bank and to the server
    if(result.level){
      const ta=$("essay-ta");
      const currentText=(ta?ta.value:state.essay).trim();
      const bank=loadEssayBank();
      const idx=bank.findIndex(e=>e.text.trim()===currentText);
      if(idx>=0){
        bank[idx].claudeLevel=result.level;
        bank[idx].claudeFeedback=JSON.stringify(result);
        saveEssayBank(bank);
        refreshEssayBank();
        // Persist feedback to backend if the essay has a server id
        const serverId=bank[idx].id;
        if(serverId && !serverId.startsWith("local-")){
          api(`/api/essays/${encodeURIComponent(serverId)}`,{
            method:"PATCH",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({claude_feedback:JSON.stringify(result)}),
          }).catch(()=>{});
        }
      }
    }
  }catch(err){
    container.innerHTML="";
    container.appendChild(el("div",{style:{background:"#fff5f5",borderLeft:"3px solid var(--color-danger)",borderRadius:"var(--radius-md)",padding:"10px 14px",fontSize:"var(--font-sm)",color:"#555"}},
      err.aiHandled ? `❌ ${err.message}` : `❌ Feil: ${err.message}. Prøv igjen.`
    ));
    if(!err.aiHandled) reportAiFailure(AI_SURFACE.ESSAY, aiFailureReasonFor(diag), diag);
    appendClaudeDiag(container, diag);
  }
}

// ── Report blocks (feature 021) ─────────────────────────────────────────
// A teacher-configured student's reply carries an ordered `blocks` array
// instead of the fixed grammarErrors/strengths/improvements keys — see
// backend/app/services/report_prompts.py. Older stored feedback (FR-011)
// and an unconfigured student's live reply never carry this key, so both
// renderers keep their original flat-key rendering unchanged and only fall
// into this path when `blocks` is present (FR-012, dual shape forever).
const REPORT_BLOCK_META={
  errors:{icon:"✗",label:"Grammatikkfeil",color:"var(--color-danger)"},
  rules:{icon:"📐",label:"Regler",color:"#4f6ef7"},
  strengths:{icon:"✓",label:"Styrker",color:"#1a6b4a",bg:"#edfaf3"},
  improvements:{icon:"💡",label:"Forbedring",color:"var(--color-warning)",bg:"#fffdf0"},
};

function renderReportBlock(block, body){
  const meta=REPORT_BLOCK_META[block.type];
  if(block.type==="errors"||block.type==="rules"){
    const items=block.items||[];
    if(!items.length||!meta) return;
    const sec=el("div",{});
    sec.appendChild(el("div",{style:{fontSize:"var(--font-xs)",fontWeight:"700",color:meta.color,textTransform:"uppercase",letterSpacing:".6px",marginBottom:"6px"}},`${meta.icon} ${meta.label}`));
    if(block.type==="errors"){
      items.forEach(e=>{
        const card=el("div",{class:"claude-error-card"});
        if(e.text)  card.appendChild(el("div",{class:"claude-error-text"},`"${e.text}"`));
        if(e.issue) card.appendChild(el("div",{class:"claude-error-issue"},e.issue));
        if(e.fix)   card.appendChild(el("div",{class:"claude-error-fix"},`→ ${e.fix}`));
        sec.appendChild(card);
      });
    }else{
      items.forEach(s=>sec.appendChild(el("div",{style:{fontSize:"var(--font-xs)",color:"#333",marginBottom:"3px",lineHeight:"1.4"}},"• "+s)));
    }
    body.appendChild(sec);
  }else if(block.type==="strengths"||block.type==="improvements"){
    const items=block.items||[];
    if(!items.length||!meta) return;
    const sec=el("div",{style:{background:meta.bg,borderRadius:"var(--radius-md)",padding:"10px 12px"}});
    sec.appendChild(el("div",{style:{fontSize:"var(--font-xs)",fontWeight:"700",color:meta.color,textTransform:"uppercase",letterSpacing:".6px",marginBottom:"6px"}},`${meta.icon} ${meta.label}`));
    const bullet=block.type==="strengths"?"• ":"→ ";
    items.forEach(s=>sec.appendChild(el("div",{style:{fontSize:"var(--font-xs)",color:"#333",marginBottom:"3px",lineHeight:"1.4"}},bullet+s)));
    body.appendChild(sec);
  }else if(block.type==="prose"){
    const p=block.items||{};
    if(!p.text) return;
    const sec=el("div",{style:{background:"#f8f9fa",borderRadius:"var(--radius-md)",padding:"10px 12px"}});
    if(p.title) sec.appendChild(el("div",{style:{fontSize:"var(--font-xs)",fontWeight:"700",color:"#666",textTransform:"uppercase",letterSpacing:".6px",marginBottom:"5px"}},p.title));
    sec.appendChild(el("div",{style:{fontSize:"var(--font-sm)",color:"#333",lineHeight:"1.6"}},p.text));
    body.appendChild(sec);
  }
  // An unrecognised type is silently skipped rather than dumped raw — the
  // registry is closed (FR-003); a reply naming anything else is a bug
  // upstream of this function, not a shape to guess at rendering.
}

function renderReportBlocks(blocks, body){
  (blocks||[]).forEach(b=>renderReportBlock(b, body));
}

function renderEssayClaudeResult(r, container){
  container.innerHTML="";

  // Level colours
  const levelColors={A1:"var(--color-danger)",A2:"var(--color-warning)",B1:"#f0c040",B2:"#2d9e6b",C1:"#4f6ef7",C2:"#7c4dff"};
  const lv=r.level||"B1";
  const lvColor=levelColors[lv]||"#2d9e6b";

  const box=el("div",{class:"claude-result"});

  // Header with level badge

// ── GJENFORTELL AI FEEDBACK (feature 009) ────────────────────────────────
async function checkGjenfortellWithClaude(text, summary, container){
  container.innerHTML="";
  const loading=el("div",{style:{color:"var(--color-text-muted)",fontSize:"var(--font-sm)",padding:"8px 0"}},"🤖 Analyserer sammendraget ditt…");
  container.appendChild(loading);

  if(window.location.protocol==="file:"){
    container.innerHTML="";
    const box=el("div",{style:{background:"#fffdf0",borderLeft:"4px solid #f0c040",borderRadius:"var(--radius-md)",padding:"14px 16px",fontSize:"var(--font-sm)",lineHeight:"1.7",color:"#555"}});
    box.appendChild(el("div",{style:{fontWeight:"700",marginBottom:"6px",color:"var(--color-warning)"}},"⚠️ Kan ikke nå Claude API fra en lokal fil"));
    box.appendChild(document.createTextNode("Kjør "));
    box.appendChild(el("code",{style:{background:"#f0f0f0",padding:"2px 6px",borderRadius:"var(--radius-sm)"}},"python3 start_server.py"));
    box.appendChild(document.createTextNode(" og åpne appen via localhost."));
    container.appendChild(box);
    return;
  }

  // The prompt is composed entirely server-side now (feature 021); the
  // reading text and the learner's own summary still travel in the user
  // message, since only the server-owned base instructions moved.
  const userMsg=`Originaltekst:\n${text.text}\n\nElevens sammendrag:\n${summary}\n\nVurder sammendraget med tanke på: tekstforståelse, bruk av ord fra originalteksten, grammatikk og språknivå.`;

  let diag=null;
  try{
    const data=await requestAiFeedback(AI_SURFACE.READING_SUMMARY, userMsg,
      "Svaret ble avkuttet fordi det ble for langt. Prøv med et kortere sammendrag.",
      // `text.id` is a reading-corpus id like `lesing_sprak_01` — a static asset
      // key with no table behind it, so it is recorded as a plain identifier
      // rather than a foreign key. The summary row itself is written afterwards.
      {contentKind:"reading_summary", readingTextId:text.id});
    // Captured so the catch below can report what actually came back
    diag=claudeDiag(data,userMsg);
    // Truncated responses produce invalid JSON — report it as a length problem, not a parse error
    if(data.stop_reason==="max_tokens") throw new Error("Svaret ble avkuttet fordi det ble for langt. Prøv med et kortere sammendrag.");
    const rawText=claudeText(data);
    const jsonText=rawText.replace(/```json?\n?/gi,"").replace(/```/g,"").trim();
    const result=JSON.parse(jsonText);
    renderGjenfortellResult(result,container);
    // Persist summary + feedback to backend
    const feedback=JSON.stringify(result);
    api(`/api/reading-summaries/${encodeURIComponent(text.id)}`,{
      method:"PUT",
      body:JSON.stringify({summary_text:summary,claude_feedback:feedback}),
    }).then(async r=>{
      if(r?.ok){
        const saved=await r.json();
        lesingState.savedSummaries[text.id]=saved;
      }
    }).catch(()=>{});
  }catch(err){
    container.innerHTML="";
    const msg=err instanceof Error?err.message:"Ukjent feil";
    container.appendChild(el("div",{style:{background:"#fff5f5",borderLeft:"3px solid var(--color-danger)",borderRadius:"var(--radius-md)",padding:"10px 14px",fontSize:"var(--font-sm)",color:"#555"}},
      err.aiHandled ? msg : `Klarte ikke å hente tilbakemelding. Prøv igjen. (${msg})`));
    if(!err.aiHandled) reportAiFailure(AI_SURFACE.READING_SUMMARY, aiFailureReasonFor(diag), diag);
    appendClaudeDiag(container, diag);
  }
}

function updateWritePanel(){
  const used=detectUsed(state.essay,state.words);
  const wc=wcCount(state.essay);
  const goal=Math.min(5,state.words.length);
  const relTopics=getEssayRelevantTopics();
  const stats=$("write-stats"); if(stats)fillWriteStats(stats,used,wc,goal);
  const meta=$("essay-meta");  if(meta)fillEssayMeta(meta,wc);
  const chips=$("sb-chips");   if(chips)fillSidebarChips(chips,used,relTopics);
  const title=$("sb-title");   if(title)title.textContent=`Ordbank (${used.size}/${state.words.length} brukt)`;
}

function fillWriteStats(el2,used,wc,goal){
  el2.innerHTML="";
  const pm=document.createElement("div"); pm.className="progress-meta";
  const s1=document.createElement("span");
  s1.innerHTML=`Ordbank-ord brukt: <strong style="color:${used.size>=goal?"#1a6b4a":"var(--color-warning)"}">${used.size}</strong> / ${state.words.length}`;
  const s2=document.createElement("span");
  s2.textContent=`${wc} ord${wc>350?" (for lang!)":""}`;
  s2.style.color=wc>=250&&wc<=350?"#1a6b4a":wc>350?"var(--color-danger)":"var(--color-text-muted)";
  pm.appendChild(s1); pm.appendChild(s2); el2.appendChild(pm);
  const track=document.createElement("div"); track.className="progress-track";
  const fill=document.createElement("div"); fill.className="progress-fill";
  fill.style.width=(goal>0?Math.min(100,(used.size/goal)*100):0)+"%";
  fill.style.background=used.size>=goal?"#2d9e6b":"var(--color-warning)";
  track.appendChild(fill); el2.appendChild(track);
  if(used.size>=goal){ const sm=document.createElement("div"); sm.className="success-msg"; sm.textContent="Bra! Du har nådd målet ditt med ordbank-ord."; el2.appendChild(sm); }
}

function fillEssayMeta(el2,wc){
  el2.innerHTML="";
  const s1=document.createElement("span"); s1.textContent="Ord: "+wc; el2.appendChild(s1);
  const s2=document.createElement("span");
  s2.textContent=wc>=250&&wc<=350?"✓ Bra lengde!":wc>350?"For lang – prøv å korte ned":"Mål: 250–350 ord";
  s2.style.color=wc>=250&&wc<=350?"#1a6b4a":wc>350?"var(--color-danger)":"var(--color-text-muted)";

function fillSidebarChips(container, used, relevantTopics){
  container.innerHTML="";
  const relTopics = relevantTopics && relevantTopics.length ? relevantTopics : null;

  function makeUsedChip(w){
    const c=el("div",{class:"wb-chip used"});
    c.appendChild(el("div",{class:"wn"},`✓ ${w.word}`));
    if(w.meaning)c.appendChild(el("div",{class:"wm"},w.meaning));
    container.appendChild(c);
  }
  function makeUnusedChip(w, highlight){
    const actualCat=w.category==="temaord"?"enkeltord":w.category;
    const col=(CAT_MAP[actualCat]||CATS[0]).color;
    const style=highlight
      ?{background:"#f0faf5",borderLeftColor:"#2d9e6b"}
      :{borderLeftColor:col};
    const c=el("div",{class:"wb-chip",style});
    const wn=el("div",{class:"wn",style:highlight?{color:"#1a6b4a"}:{}},w.word);
    c.appendChild(wn);
    if(w.meaning)c.appendChild(el("div",{class:"wm"},w.meaning));
    if(highlight&&w.topic)c.appendChild(el("div",{style:{fontSize:"var(--font-xs)",color:"#2d9e6b",fontWeight:"600",marginTop:"2px"}},w.topic));
    container.appendChild(c);
  }
  function sectionLabel(text, color){
    container.appendChild(el("div",{style:{fontSize:"var(--font-xs)",fontWeight:"700",textTransform:"uppercase",
      letterSpacing:".5px",color:color||"var(--color-text-muted)",margin:"8px 0 4px",
      paddingBottom:"3px",borderBottom:"1px solid "+(color?"#2d9e6b22":"var(--color-border-light)")}},text));
  }

  if(relTopics){
    const relUsed    = state.words.filter(w=>used.has(w.id)   &&  relTopics.includes(w.topic));
    const relUnused  = state.words.filter(w=>!used.has(w.id)  &&  relTopics.includes(w.topic));
    const otherUsed  = state.words.filter(w=>used.has(w.id)   && !relTopics.includes(w.topic));
    const otherUnused= state.words.filter(w=>!used.has(w.id)  && !relTopics.includes(w.topic));

    if(relUsed.length||relUnused.length){
      sectionLabel("Anbefalt for dette temaet","#2d9e6b");
      relUsed.forEach(makeUsedChip);
      relUnused.forEach(w=>makeUnusedChip(w,true));
    }
    if(otherUsed.length||otherUnused.length){
      if(relUsed.length||relUnused.length) sectionLabel("Andre ord i ordbanken",null);
      otherUsed.forEach(makeUsedChip);
      otherUnused.forEach(w=>makeUnusedChip(w,false));
    }
  } else {
    state.words.filter(w=>used.has(w.id)).forEach(makeUsedChip);
    state.words.filter(w=>!used.has(w.id)).forEach(w=>makeUnusedChip(w,false));
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────
function detectUsed(essay,words){
  const used=new Set(); if(!essay.trim())return used;
  const low=essay.toLowerCase();
  words.forEach(w=>{
    const forms=[w.word,...(w.forms||[])];
    if(forms.some(f=>f.length>=2&&low.includes(f.toLowerCase()))) used.add(w.id);
  });
  return used;
}
function wcCount(t){return t.trim()?t.trim().split(/\s+/).length:0;}

function buildFlashcards(){
  const frag=document.createDocumentFragment();
  if(!fc.started) return buildFcSetup(frag);
  if(fc.idx>=fc.queue.length) return buildFcDone(frag);
  return buildFcCard(frag);
}

function buildFcSetup(frag){
  if(state.words.length<2){
    frag.appendChild(el("div",{class:"empty-state"},
      el("p",{class:"card__title",style:{marginBottom:"6px"}},"Trenger minst 2 ord"),
      el("p",{class:"card__sub"},"Legg til ord i ordbanken for å spille.")));
    return frag;
  }

  const card=el("div",{class:"card"});
  card.appendChild(el("div",{class:"card__title",style:{marginBottom:"var(--s-2)"}},"Flashcards"));

  // Description
  const desc=el("div",{style:{background:"var(--surface-head)",borderRadius:"var(--r-btn)",padding:"12px 16px",marginBottom:"var(--s-4)",fontSize:"var(--t-sm)",color:"var(--ink-2)",lineHeight:"1.6"}});
  desc.appendChild(el("div",{style:{fontWeight:"700",marginBottom:"4px",color:"var(--green)"}},"Blandet modus — to typer kort:"));
  desc.appendChild(el("div",{},"Norsk ord vises → velg riktig engelsk oversettelse (flervalg)"));
  desc.appendChild(el("div",{},"Engelsk oversettelse vises → skriv det norske ordet"));
  card.appendChild(desc);

  // Filters — same filter-panel/facet/pill component as Ordbank and Setninger.
  const topics=VALID_TOPIC_LIST.filter(t=>state.words.some(w=>w.topic===t));
  if(topics.length>0||state.words.length>0){
    const isOpen=fc.filtersOpen ?? true;
    const fcTags=allWordTags(state.words);
    const activeCount=[fc.topicFilter,fc.tagFilter,fc.timeFilter,fc.maxWords,fc.learningFilter,fc.includeLearnt].filter(Boolean).length;
    const panel=el("div",{class:"filter-panel",style:{marginBottom:"var(--s-3)"}});
    if(!isOpen) panel.setAttribute("data-collapsed","");

    const head=el("div",{class:"filter-panel__head"});
    const headLeft=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}});
    headLeft.appendChild(icon("filter"));
    headLeft.lastChild.style.color="var(--ink-3)";
    headLeft.appendChild(el("span",{class:"label-mono"},"Filtrer ord"));
    if(activeCount) headLeft.appendChild(el("span",{class:"badge-count"},String(activeCount)));
    head.appendChild(headLeft);
    const headRight=el("div",{style:{display:"flex",alignItems:"center",gap:"14px"}});
    if(activeCount) headRight.appendChild(el("button",{class:"btn--link",click(){
      fc.topicFilter="";fc.tagFilter="";fc.timeFilter=0;fc.maxWords=0;fc.learningFilter="";fc.includeLearnt=false;
      renderContent();
    }},"Nullstill"));
    headRight.appendChild(el("button",{style:{background:"none",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:"6px",fontSize:"13px",color:"var(--ink-2)",fontWeight:"500"},
      click(){ fc.filtersOpen=!isOpen; trackEvent("filters.toggled",{tab:"flashcards",state:isOpen?"collapsed":"expanded"}); renderContent(); }
    },(isOpen?"Skjul filtre":"Vis filtre")+" ",el("span",{style:{fontSize:"10px"}},"▼")));
    head.appendChild(headRight);
    panel.appendChild(head);

    const body=el("div",{class:"filter-panel__body"});
    if(topics.length>0){
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Tema"));
      const opts=el("div",{class:"facet__options"});
      opts.appendChild(buildFacetPill("Alle",fc.topicFilter==="",()=>{fc.topicFilter="";renderContent();}));
      topics.forEach(t=>opts.appendChild(buildFacetPill(t,fc.topicFilter===t,()=>{fc.topicFilter=t;renderContent();},topicTema(t).bg)));
      facet.appendChild(opts);
      body.appendChild(facet);
    }
    // Tag filter (feature 023) — only rendered when the bank has ≥1 tagged word.
    if(fcTags.length>0){
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Tagg"));
      const opts=el("div",{class:"facet__options"});
      opts.appendChild(buildFacetPill("Alle",fc.tagFilter==="",()=>{fc.tagFilter="";renderContent();}));
      fcTags.forEach(t=>opts.appendChild(buildFacetPill(t,fc.tagFilter===t,()=>{
        fc.tagFilter=t; trackEvent("flashcards.tag_filter_used",{tag:t}); renderContent();
      })));
      facet.appendChild(opts);
      body.appendChild(facet);
    }
    {
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Lagt til"));
      const opts=el("div",{class:"facet__options"});
      [[0,"Alle"],[7,"Siste 7 dager"],[30,"Siste 30 dager"],[90,"Siste 3 måneder"]].forEach(([val,label])=>
        opts.appendChild(buildFacetPill(label,fc.timeFilter===val,()=>{fc.timeFilter=val;renderContent();})));
      facet.appendChild(opts);
      body.appendChild(facet);
    }
    {
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Antall ord"));
      const opts=el("div",{class:"facet__options"});
      [[0,"Alle"],[10,"Maks 10"],[20,"Maks 20"],[30,"Maks 30"]].forEach(([val,label])=>
        opts.appendChild(buildFacetPill(label,fc.maxWords===val,()=>{fc.maxWords=val;renderContent();})));
      facet.appendChild(opts);
      body.appendChild(facet);
    }
    // "Ikke lært ennå" is gone: not-learnt is now the default pool, so the chip
    // would have selected everything already shown. "Flest feil" stays — it
    // answers a different question from learnt status (FR-038).
    {
      const facet=el("div",{class:"facet"});
      facet.appendChild(el("div",{class:"facet__label"},"Læring"));
      const opts=el("div",{class:"facet__options"});
      [["","Alle ord"],["error_only","Flest feil"]].forEach(([val,label])=>
        opts.appendChild(buildFacetPill(label,fc.learningFilter===val,()=>{
          fc.learningFilter=val;
          if(val) loadStats().then(()=>renderContent()); else renderContent();
        })));
      opts.appendChild(buildFacetPill("Ta med lærte ord",fc.includeLearnt,()=>{fc.includeLearnt=!fc.includeLearnt;renderContent();}));
      facet.appendChild(opts);
      body.appendChild(facet);
    }
    panel.appendChild(body);
    card.appendChild(panel);
  }

  const avail=getFcWords();
  const learntHidden=fc.includeLearnt?0:state.words.filter(isLearnt).length;
  card.appendChild(el("p",{class:"card__note"},
    `${avail.length} ord tilgjengelig med gjeldende filter`
    +(learntHidden?` (${learntHidden} lærte ord er holdt utenfor)`:"")));

  // An empty pool is nearly always the learnt exclusion doing its job. Say so, and
  // offer the way out in place rather than making the learner find the chip (FR-033).
  if(avail.length<2&&learntHidden){
    const hint=el("div",{style:{marginTop:"var(--s-2)",padding:"12px 14px",background:"var(--tema-integrering-bg)",border:"1px solid var(--line)",borderRadius:"var(--r-btn)",fontSize:"var(--t-sm)",color:"var(--tema-integrering-fg)"}});
    hint.appendChild(el("div",{style:{marginBottom:"var(--s-2)"}},
      "Ingen ord igjen å øve på med disse filtrene — de er markert som lærte."));
    hint.appendChild(el("button",{class:"btn",
      click(){fc.includeLearnt=true;renderContent();}},"Ta med lærte ord"));
    card.appendChild(hint);
  }

  card.appendChild(el("button",{
    class:"btn btn--primary",style:{marginTop:"var(--s-3)"},
    disabled:avail.length<2?"":null,
    click:startFlashcards,
  },avail.length>=2?"Start spill":"Trenger minst 2 ord"));

  frag.appendChild(card);
  return frag;
}
