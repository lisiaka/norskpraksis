  const bar=el("div",{class:"card",style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"var(--s-2)",flexWrap:"wrap",gap:"var(--s-2)"}});
  const nums=el("div",{style:{display:"flex",gap:"var(--s-4)"}});
  nums.appendChild(el("span",{style:{fontSize:"var(--t-base)",fontWeight:"700",color:"var(--status-learned)"}},`✓ ${fc.correct}`));
  nums.appendChild(el("span",{style:{fontSize:"var(--t-base)",fontWeight:"700",color:"var(--danger)"}},`✗ ${fc.wrong}`));
  bar.appendChild(nums);
  bar.appendChild(el("span",{class:"card__note"},`${fc.idx+1} / ${fc.queue.length}`));
  bar.appendChild(el("button",{class:"btn",
    click(){fc.started=false;renderContent();}},"Avslutt"));
  frag.appendChild(bar);
  const prog=el("div",{style:{height:"5px",background:"var(--line)",borderRadius:"var(--r-pill)",marginBottom:"var(--s-4)",overflow:"hidden"}});
  prog.appendChild(el("div",{style:{height:"100%",background:"var(--green)",borderRadius:"var(--r-pill)",transition:"width .35s",width:(fc.idx/fc.queue.length*100)+"%"}}));
  frag.appendChild(prog);
}

function buildFcCard(frag){
  const item=fc.queue[fc.idx];
  buildFcHeader(frag);
  if(item._type==="write") buildFcWriteCard(frag,item);
  else                      buildFcChoiceCard(frag,item);
  return frag;
}

// ── Choice card: show Norwegian word → pick English meaning ──
function buildFcChoiceCard(frag,word){
  const opts=word._options;

  const card=el("div",{class:"fc-card"});
  card.appendChild(el("div",{class:"label-mono",style:{marginBottom:"var(--s-2)"}},"Velg oversettelse"));
  card.appendChild(el("div",{class:"fc-word"},word.word));
  if(word.topic){ const tema=topicTema(word.topic); card.appendChild(el("div",{class:"fc-sub"},el("span",{class:"tag",style:{background:tema.bg,color:tema.fg}},word.topic))); }
  card.appendChild(el("div",{class:"fc-question"},"— Hva betyr dette ordet? —"));
  frag.appendChild(card);

  const grid=el("div",{class:"fc-options"});
  opts.forEach((opt,i)=>{
    let cls="fc-opt";
    if(fc.answered){
      if(opt.correct) cls+=" correct";
      else if(i===fc.chosenIdx) cls+=" wrong";
      else cls+=" reveal";
    }
    grid.appendChild(el("button",{class:cls,disabled:fc.answered?"":null,
      click(){
        if(fc.answered)return;
        fc.answered=true; fc.chosenIdx=i;
        const w=fc.queue[fc.idx];
        if(opt.correct){fc.correct++;fc.log.push({wordId:w.id,word:w.word,meaning:w.meaning,correct:true,mode:"choice"});}
        else{fc.wrong++;fc.log.push({wordId:w.id,word:w.word,meaning:w.meaning,correct:false,mode:"choice",chosen:opt.text});}
        renderContent();
      }
    },opt.text));
  });
  frag.appendChild(grid);

  if(fc.answered){
    const wasOk=opts[fc.chosenIdx]?.correct;
    const fb=el("div",{class:"fc-feedback"});
    fb.appendChild(el("div",{class:wasOk?"fc-feedback-ok":"fc-feedback-err"},wasOk?"✓ Riktig!":"✗ Feil"));
    if(!wasOk){
      const right=opts.find(o=>o.correct);
      fb.appendChild(el("div",{class:"fc-correct-hint"},`Riktig svar: ${right?.text||""}`));
    }
    frag.appendChild(fb);
    frag.appendChild(el("div",{class:"fc-nav"},
      el("button",{class:"btn btn--primary",click(){
        fc.idx++; fc.answered=false; fc.chosenIdx=null; renderContent();
      }},fc.idx<fc.queue.length-1?"Neste →":"Se resultat →")));
  }
}

// ── Write card: show English meaning → type Norwegian word ──
function buildFcWriteCard(frag,word){
  const meaning=word.meaning||"(ingen oversettelse)";
  const actualCat=word.category==="temaord"?"enkeltord":word.category;
  const cat=CAT_MAP[actualCat]||CATS[0];

  const card=el("div",{class:"fc-card"});
  card.appendChild(el("div",{class:"label-mono",style:{marginBottom:"var(--s-2)"}},"Skriv det norske ordet"));
  card.appendChild(el("div",{class:"fc-word",style:{fontSize:"28px",color:"var(--ink)",fontWeight:"700"}},meaning));
  card.appendChild(el("div",{class:"fc-sub"},el("span",{class:"tag"},cat.label)));
  card.appendChild(el("div",{class:"fc-question"},"— Hva er det norske ordet? —"));
  frag.appendChild(card);

  if(!fc.writeChecked){
    // Input row
    const row=el("div",{style:{display:"flex",gap:"var(--s-2)",maxWidth:"520px",margin:"0 auto var(--s-3)"}});
    const inp=el("input",{
      id:"fc-write-inp",class:"input",type:"text",
      placeholder:"Skriv norsk ord her…",
      style:{flex:"1"},
      keydown(e){if(e.key==="Enter")fcCheckWrite(inp.value,word);}
    });
    inp.value=fc.writeInput;
    row.appendChild(inp);
    row.appendChild(el("button",{class:"btn btn--primary",style:{whiteSpace:"nowrap",flexShrink:"0"},
      click(){fcCheckWrite(inp.value,word);}
    },"Sjekk →"));
    frag.appendChild(row);
    requestAnimationFrame(()=>{const i=$("fc-write-inp");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}});
  } else {
    // Result
    const wasOk=fc.writeResult;
    const fb=el("div",{class:"fc-feedback"});
    fb.appendChild(el("div",{class:"card__note",style:{marginBottom:"6px"}},`Du svarte: "${fc.writeInput}"`));
    fb.appendChild(el("div",{class:wasOk?"fc-feedback-ok":"fc-feedback-err"},wasOk?"✓ Riktig!":"✗ Feil"));
    if(!wasOk) fb.appendChild(el("div",{class:"fc-correct-hint"},`Riktig svar: ${word.word}`));
    frag.appendChild(fb);
    frag.appendChild(el("div",{class:"fc-nav"},
      el("button",{class:"btn btn--primary",click(){
        fc.idx++; fc.answered=false; fc.chosenIdx=null;
        fc.writeInput=""; fc.writeChecked=false; fc.writeResult=false;
        renderContent();
      }},fc.idx<fc.queue.length-1?"Neste →":"Se resultat →")));
  }
}

function fcCheckWrite(input,word){
  fc.writeInput=input.trim();
  const normalize=s=>s.toLowerCase().trim().replace(/^å\s+/,"").replace(/\s+/g," ");
  fc.writeResult=normalize(fc.writeInput)===normalize(word.word);
  fc.writeChecked=true;
  // `wordId` is what keeps this answer attached to the word after a rename; `word` is
  // kept because every event logged before feature 013 has only the text (R4).
  if(fc.writeResult){fc.correct++;fc.log.push({wordId:word.id,word:word.word,meaning:word.meaning,correct:true,mode:"write"});}
  else{fc.wrong++;fc.log.push({wordId:word.id,word:word.word,meaning:word.meaning,correct:false,mode:"write",written:fc.writeInput});}
  renderContent();
}

function buildFcDone(frag){
  const total=fc.correct+fc.wrong;
  const pct=total?Math.round(fc.correct/total*100):0;
  if(!fc.tracked){
    fc.tracked=true;
    // The threshold is evaluated server-side on this write (R9), so the ids come back
    // in the response rather than being computed here.
    trackEvent("flashcard_session",{correct:fc.correct,wrong:fc.wrong,total,pct,topicFilter:fc.topicFilter||null,words:fc.log})
      .then(res=>{
        const ids=res?.auto_learnt||[];
        if(!ids.length)return;
        fc.autoLearnt=ids;
        ids.forEach(id=>{const w=state.words.find(x=>x.id===id); if(w) w.learnt_state="learnt_auto";});
        saveStorage();
        if(fc.started)renderContent();
      });
  }
  const msg=pct>=80?"Utmerket!":pct>=60?"Bra jobbet!":"Øv mer – du klarer det!";

  const done=el("div",{class:"fc-done"});
  done.appendChild(el("div",{class:"fc-done-score"},`${fc.correct} / ${total} riktig`));
  done.appendChild(el("div",{class:"fc-done-pct"},`${pct}% — ${msg}`));

  // Say which words this session marked learnt, and where to undo it. An exclusion the
  // learner cannot account for is the failure this notice exists to prevent (FR-037).
  if(fc.autoLearnt.length){
    const names=fc.autoLearnt.map(id=>state.words.find(w=>w.id===id)?.word).filter(Boolean);
    const note=el("div",{style:{margin:"var(--s-3) auto 0",maxWidth:"460px",padding:"12px 14px",background:"var(--green-tint)",border:"1px solid var(--green)",borderRadius:"var(--r-btn)",fontSize:"var(--t-sm)",color:"var(--green)",textAlign:"left"}});
    note.appendChild(el("div",{style:{fontWeight:"700",marginBottom:"4px"}},
      `Markert som lært automatisk: ${names.join(", ")}`));
    note.appendChild(el("div",{},
      "Disse holdes utenfor øvingen framover. Du kan angre i Ordbanken."));
    done.appendChild(note);
  }

  const nav=el("div",{class:"fc-nav",style:{marginTop:"var(--s-4)"}});
  nav.appendChild(el("button",{class:"btn btn--primary",click:startFlashcards},"Spill igjen"));
  nav.appendChild(el("button",{class:"btn",
    click(){fc.started=false;renderContent();}},"Endre innstillinger"));
  done.appendChild(nav);
  frag.appendChild(done);
  return frag;
}

function buildLastAnswerMap(){
  // Returns {wordLower: wasCorrect} for the MOST RECENT answer for each word.
  // Events in statsCache are newest-first, so first occurrence = most recent answer.
  const last={};
  (statsCache?.events||[]).filter(e=>e.type==="flashcard_session").forEach(session=>{
    (session.words||[]).forEach(w=>{
      const key=w.word?.toLowerCase();
      if(key && !(key in last)) last[key]=w.correct;
    });
  });
  return last;
}

function getNetMissedWords(){
  // Returns [{word,meaning,id,...bankWord, netErrors}] from all flashcard sessions
  const wrong={}, correct={}, meanings={};
  (statsCache?.events||[]).filter(e=>e.type==="flashcard_session").forEach(session=>{
    (session.words||[]).forEach(w=>{
      if(!w.correct) wrong[w.word]=(wrong[w.word]||0)+1;
      else           correct[w.word]=(correct[w.word]||0)+1;
      if(w.meaning)  meanings[w.word]=w.meaning;
    });
  });
  return Object.entries(wrong)
    .filter(([word,cnt])=>cnt>(correct[word]||0))
    .sort((a,b)=>(b[1]-(correct[b[0]]||0))-(a[1]-(correct[a[0]]||0)))
    .map(([word,cnt])=>{
      const bankWord=state.words.find(w=>w.word.toLowerCase()===word.toLowerCase());
      return bankWord
        ? {...bankWord, netErrors:cnt-(correct[word]||0), wrong:cnt, rightCount:correct[word]||0}
        : {id:"err_"+word, word, meaning:meanings[word]||"", category:"enkeltord", topic:"", netErrors:cnt-(correct[word]||0), wrong:cnt, rightCount:correct[word]||0};
    });
}

function getFcWords(){
  let w=state.words.slice();
  if(fc.topicFilter) w=w.filter(x=>x.topic===fc.topicFilter);
  if(fc.tagFilter) w=w.filter(x=>(x.tags||[]).includes(fc.tagFilter));
  if(fc.timeFilter){const cut=Date.now()-fc.timeFilter*24*60*60*1000;w=w.filter(x=>(x.createdAt||0)>=cut);}
  // Learnt words are excluded by default (FR-032). This reads the stored flag rather
  // than inferring learnt status from the most recent answer, which was the previous
  // "Ikke lært ennå" filter: an inference over a local stats cache cannot agree
  // across devices, and it could not represent "the learner said this is not learnt".
  if(!fc.includeLearnt) w=w.filter(x=>!isLearnt(x));
  if(fc.learningFilter==="error_only"){
    const missed=new Set(getNetMissedWords().map(x=>x.word.toLowerCase()));
    w=w.filter(x=>missed.has(x.word.toLowerCase()));
  }
  if(fc.maxWords>0) w=shuffle(w).slice(0,fc.maxWords);
  return w;
}

function startFlashcards(){
  const words=getFcWords();
  if(words.length<2){toast("Trenger minst 2 ord med gjeldende filter.");return;}
  // Randomly assign card type and pre-generate options so they never reshuffle on re-render
  fc.queue=shuffle(words).map(w=>{
    const type=Math.random()<0.5?"write":"choice";
    return {...w,_type:type,_options:type==="choice"?fcGetOptions(w):null};
  });
  fc.idx=0; fc.correct=0; fc.wrong=0; fc.log=[]; fc.tracked=false; fc.autoLearnt=[];
  fc.answered=false; fc.chosenIdx=null;
  fc.writeInput=""; fc.writeChecked=false; fc.writeResult=false;
  fc.started=true;
  renderContent();
}

function fcGetOptions(word){
  const correct=word.meaning||word.word;
  const stored=(word.flashcard_options||[]).filter(d=>d&&d.trim());
  const wrongPool=stored.length>=3
    ? shuffle(stored).slice(0,3)
    : (()=>{
        const fromStored=shuffle(stored).slice(0,stored.length);
        const needed=3-fromStored.length;
        const fromBank=shuffle(state.words.filter(w=>w.id!==word.id&&w.meaning&&w.meaning.trim())).slice(0,needed).map(w=>w.meaning);
        const pool=[...fromStored,...fromBank];
        while(pool.length<3) pool.push("—");
        return pool;
      })();
  return shuffle([{text:correct,correct:true},...wrongPool.map(t=>({text:t,correct:false}))]);
}

// ── PRINT ─────────────────────────────────────────────────────────────
// Shared print-document shell for every Ordsky/Ordliste variant (student, error-word,
// teacher-aggregate). The print window is opened via window.open("","_blank") and
// populated with document.write() — a *separate* document that does not inherit the
// parent page's <style> or :root custom properties. Every var(--color-danger)-style
// reference used here used to resolve to nothing in that document (silently rendering
// as black/default), and the 🇳🇴 flag emoji stood in for a "logo" that was never the
// real one — both fixed by building the page from real hex values and no emoji, once,
// in one place, rather than fixing three near-identical templates separately.
const PRINT_CLOUD_COLORS=["#6b4a12","#2c4d7a","#7a3a56","#8a3030","#5f5320","#1a5c41","#2f5d3a","#4a3a7a","#1f5a63","#3d4a7a","#7a4a1f"];
const PRINT_ERROR_COLORS=["#8a3030","#7a3a56","#7a4a1f","#5f5320"];
const PRINT_CLOUD_SIZES=[16,18,20,22,26,30,34,38,44,50];
function buildPrintDoc({title, heading, subtitle, bodyHtml, accent}){
  const c=accent||"#1a5c41";
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Instrument Sans',system-ui,sans-serif;background:#fff;padding:30px;margin:0;color:#14201a;}
  h1{text-align:center;color:${c};font-size:24px;font-weight:700;margin:0 0 6px;}
  .sub{text-align:center;color:#5d6b63;font-size:13px;margin-bottom:28px;}
  .cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;padding:20px 10px;max-width:720px;margin:0 auto;}
  table{width:100%;border-collapse:collapse;}
  th{background:${c};color:#fff;padding:10px 14px;text-align:left;font-size:13px;font-weight:600;}
  td{padding:9px 14px;border-bottom:1px solid #f0f3f1;font-size:14.5px;color:#3d4a43;}
  tr:nth-child(even) td{background:#fbfcfb;}
  .word-cell{font-weight:700;color:${c};}
  .tema-tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;margin-left:7px;}
  @media print{@page{margin:1.5cm;}body{padding:10px;}}
</style></head><body>
<h1>${heading}</h1>
<div class="sub">${subtitle}</div>
${bodyHtml}
<script>window.onload=function(){setTimeout(function(){window.print();},400);}<\/script>
</body></html>`;
}
function printWordCloudHtml(words, colors){
  return `<div class="cloud">${words.map(w=>{
    const size=PRINT_CLOUD_SIZES[Math.floor(Math.random()*PRINT_CLOUD_SIZES.length)];
    const color=colors[Math.floor(Math.random()*colors.length)];
    const rot=Math.floor(Math.random()*26)-13;
    return `<span style="font-size:${size}px;color:${color};transform:rotate(${rot}deg);display:inline-block;font-weight:700;margin:8px 14px;line-height:1.2;white-space:nowrap">${escapeHtml(w.word)}</span>`;
  }).join("")}</div>`;
}

function printWords(mode){
  const filtered=getFilteredWords();
  if(!filtered.length){toast("Ingen ord å skrive ut med gjeldende filter.");return;}

  const parts=[];
  if(state.topicFilter) parts.push("Tema: "+state.topicFilter);
  if(state.timeFilter)  parts.push("Siste "+state.timeFilter+" dager");
  const filterDesc=parts.length?parts.join(" · "):"Alle ord";

  const win=window.open("","_blank");
  if(!win){toast("Popup ble blokkert – tillat popup for å skrive ut.");return;}

  if(mode==="cloud"){
    win.document.write(buildPrintDoc({
      title:"Ordsky", heading:"Norsk Ordsky",
      subtitle:`${filterDesc} &nbsp;·&nbsp; ${filtered.length} ord`,
      bodyHtml:printWordCloudHtml(filtered, PRINT_CLOUD_COLORS),
    }));
    win.document.close();
  } else {
    const rows=filtered.map(w=>{
      const tema=w.topic?topicTema(w.topic):null;
      const tag=tema?`<span class="tema-tag" style="background:${tema.bg};color:${tema.fg}">${escapeHtml(w.topic)}</span>`:"";
      return `<tr><td class="word-cell">${escapeHtml(w.word)}${tag}</td><td>${escapeHtml(w.meaning||"")}</td></tr>`;
    }).join("");
    win.document.write(buildPrintDoc({
      title:"Ordliste", heading:"Norsk Ordliste",
      subtitle:`${filterDesc} &nbsp;·&nbsp; ${filtered.length} ord`,
      bodyHtml:`<table><thead><tr><th>Norsk ord / uttrykk</th><th>Betydning</th></tr></thead><tbody>${rows}</tbody></table>`,
    }));
    win.document.close();
  }
}

function printMissedWords(mode, words){
  if(!words.length){toast("Ingen feilede ord å skrive ut.");return;}
  const win=window.open("","_blank");
  if(!win){toast("Popup ble blokkert – tillat popup for å skrive ut.");return;}
  const subtitle=`${escapeHtml(state.userName||state.userEmail)} · ${words.length} ord med feil`;
  if(mode==="cloud"){
    win.document.write(buildPrintDoc({
      title:"Ordsky – feil", heading:"Vanskelige ord", accent:"#8a3030",
      subtitle,
      bodyHtml:printWordCloudHtml(words, PRINT_ERROR_COLORS),
    }));
    win.document.close();
  } else {
    const rows=words.map(w=>
      `<tr><td class="word-cell">${escapeHtml(w.word)}</td><td>${escapeHtml(w.meaning||"")}</td></tr>`
    ).join("");
    win.document.write(buildPrintDoc({
      title:"Feil-ordliste", heading:"Vanskelige ord", accent:"#8a3030",
      subtitle,
      bodyHtml:`<table><thead><tr><th>Norsk ord / uttrykk</th><th>Betydning</th></tr></thead><tbody>${rows}</tbody></table>`,
    }));
    win.document.close();
  }
}

// Same print output as printWords(), for the teacher's "Elevenes ord" aggregate
// (feature 022) — `words` here are `{word, count, meaning, explanation, forms}`,
// one representative row per deduplicated word (backend picks it via MIN(), see
// word_aggregate.py), not a full bank entry per student. Per the same convention
// this mirrors — printWords for "Mine ord", printMissedWords for flashcard errors
// — this is a third sibling rather than a shared abstraction across three
// different word shapes.
//
// The one deliberate difference from both: cloud font size is driven by `count`
// (how many students hold the word), not random — the size is the information.
// The list print goes the other way: it shows translation/explanation/forms,
// like "Mine ord" does, and leaves `count` out — a headcount isn't a study aid.
function printAggregateWords(mode, words, filterDesc){
  if(!words || !words.length){toast("Ingen ord å skrive ut med gjeldende filter.");return;}
  const win=window.open("","_blank");
  if(!win){toast("Popup ble blokkert – tillat popup for å skrive ut.");return;}

  if(mode==="cloud"){
    const counts=words.map(w=>w.count);
    const maxC=Math.max(...counts), minC=Math.min(...counts);
    const sizeFor=c=>{
      if(maxC===minC) return 30;
      const t=Math.sqrt(c-minC)/Math.sqrt(maxC-minC);
      return Math.round(16 + t*(50-16));
    };
    const wordsHtml=`<div class="cloud">${words.map((w,i)=>{
      const size=sizeFor(w.count);
      const color=PRINT_CLOUD_COLORS[i%PRINT_CLOUD_COLORS.length];
      const rot=Math.floor(Math.random()*26)-13;
      return `<span style="font-size:${size}px;color:${color};transform:rotate(${rot}deg);display:inline-block;font-weight:700;margin:8px 14px;line-height:1.2;white-space:nowrap" title="${w.count} elev${w.count===1?"":"er"}">${escapeHtml(w.word)}</span>`;
    }).join("")}</div>`;
    win.document.write(buildPrintDoc({
      title:"Ordsky", heading:"Norsk Ordsky — elevenes ord",
      subtitle:`${filterDesc} &nbsp;·&nbsp; ${words.length} ord &nbsp;·&nbsp; størrelse = antall elever`,
      bodyHtml:wordsHtml,
    }));
    win.document.close();
  } else {
    // List print shows a translation/description/forms, like "Mine ord" — the
    // student count is the cloud's information (sizing), not the list's.
    const rows=words.map(w=>{
      const meaning=escapeHtml(w.meaning||"");
      const explanation=escapeHtml(w.explanation||"");
      const forms=escapeHtml((w.forms||[]).join(", "));
      return `<tr><td class="word-cell">${escapeHtml(w.word)}</td><td>${meaning}</td><td>${explanation}</td><td>${forms}</td></tr>`;
    }).join("");
    win.document.write(buildPrintDoc({
      title:"Ordliste", heading:"Norsk Ordliste — elevenes ord",
      subtitle:`${filterDesc} &nbsp;·&nbsp; ${words.length} ord`,
      bodyHtml:`<table><thead><tr><th>Norsk ord / uttrykk</th><th>Oversettelse</th><th>Forklaring</th><th>Bøyningsformer</th></tr></thead><tbody>${rows}</tbody></table>`,
    }));
    win.document.close();
  }
}

// ── TEKST TIL TALE ───────────────────────────────────────────────────
// The browser's own speech synthesiser, not a hosted provider: no per-play cost, no
// audio to cache, no second AI credential to keep in sync. Every caller goes through
// `speak()`, so swapping the engine later is a change here and nowhere else.
//
// Voice choice is the one thing that must not degrade quietly. Reading Norwegian with
// an English voice teaches the wrong pronunciation, which is worse for a learner than
// silence — so with no Norwegian voice installed we render no controls at all.
const tts = {
  voice: null,          // resolved Norwegian SpeechSynthesisVoice, or null
  resolved: false,      // getVoices() has returned a non-empty list at least once
  rate: 1,              // 0.7 | 1 — persisted in localStorage
  chunks: [],           // [{text, offset}] queued utterances for the current run
  idx: 0,               // index into chunks
  token: 0,             // bumped on every stop; a stale utterance callback checks it
  onWord: null,         // (absoluteCharIndex) => void, for the reading-text highlight
  onState: null,        // ("playing"|"paused"|"idle") => void, for the control buttons
};

// Chrome stops speaking partway through a long utterance, so the text is split into
// pieces short enough to finish. Splitting on sentence ends keeps the prosody intact;
// the length cap is the fallback for a sentence that has no end in sight.
const TTS_CHUNK_MAX = 180;

const ttsAvailable = () => typeof window.speechSynthesis !== "undefined" && !!tts.voice;

// Feature 019 / FR-019. Read-aloud hides its controls entirely where no
// Norwegian voice is installed. That is deliberate — an English voice reading
// Norwegian is worse for a learner than silence — but it means nobody will ever
// report it as broken, and we cannot currently tell how many learners see no
// button at all. If that fraction turns out to be large, it is the trigger for
// reconsidering pre-generated audio.
//
// ⚠️ Once per session. `renderContent()` runs on every tab switch, every filter
// change and every answered question, so an unguarded call here would make the
// "nobody can hear this" signal the single loudest feature on the page —
// drowning out the very thing it is measuring.
let ttsUnavailableReported = false;
function reportTtsUnavailableOnce(){
  if(ttsUnavailableReported) return;
  ttsUnavailableReported = true;
  let voicesSeen = 0;
  try{ voicesSeen = (window.speechSynthesis?.getVoices() || []).length; }catch(e){}
  trackEvent("lesing.tts_unavailable",{
    voicesSeen,
    hasSpeechSynthesis: typeof window.speechSynthesis !== "undefined",
  });
}

// `getVoices()` is empty on first call in most browsers and fills in asynchronously,
// so this runs again on `voiceschanged`. Nynorsk is accepted as a last resort: it is
// a Norwegian voice reading Bokmål, which is a dialect mismatch rather than a
// language one. Anything else is rejected.
function resolveTtsVoice(){
  if(typeof window.speechSynthesis === "undefined") return;
  const voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return;
  const had = !!tts.voice;
  tts.resolved = true;
  const norwegian = v => /^(nb|nn|no)([-_]|$)/i.test(v.lang || "");
  const pool = voices.filter(norwegian);
  tts.voice = pool.find(v => /^nb/i.test(v.lang) && v.localService)
           || pool.find(v => /^nb/i.test(v.lang))
           || pool.find(v => /^no/i.test(v.lang))
           || pool[0]
           || null;
  // The voice list usually arrives after the first paint. A reader rendered before it
  // did decided there was no voice and left its controls out, so it has to be rebuilt.
  // Only the reader is worth re-rendering for: every other surface here is redrawn on
  // its own within a click or two anyway.
  if(!had && tts.voice && state.tab === "lesing" && lesingState.currentText) renderContent();
}

function initTts(){
  if(typeof window.speechSynthesis === "undefined") return;
  const saved = parseFloat(localStorage.getItem("b2_tts_rate"));
  if(saved === 0.7 || saved === 1) tts.rate = saved;
  resolveTtsVoice();
  window.speechSynthesis.addEventListener("voiceschanged", resolveTtsVoice);
  // A voice talking to a page nobody is looking at is the worst failure mode here,
  // so every way of leaving stops it.
  document.addEventListener("visibilitychange", () => { if(document.hidden) ttsStop(); });
  window.addEventListener("pagehide", ttsStop);
  window.addEventListener("beforeunload", ttsStop);
}

function ttsSetRate(rate){
  tts.rate = rate;
  localStorage.setItem("b2_tts_rate", String(rate));
}

// Invalidating the token first means the `onend` of whatever is currently speaking
// becomes a no-op, so cancelling never advances the old queue into the new one.
function ttsStop(){
  tts.token++;
  tts.chunks = []; tts.idx = 0;
  if(tts.onWord) tts.onWord(null);
  const notify = tts.onState;
  tts.onWord = null; tts.onState = null;
  try{
    window.speechSynthesis.cancel();
    // Cancelling while paused leaves the engine flagged paused with an empty queue, and
    // in that state some builds silently drop the next speak(). The queue is already
    // gone, so resuming here has nothing to say — it only clears the flag.
    if(window.speechSynthesis.paused) window.speechSynthesis.resume();
  }catch(e){}
  if(notify) notify("idle");
}

function ttsChunk(text){
  const out = [];
  // Keep the terminator with its sentence, and keep every character accounted for —
  // the highlight maps a character index back to a word in the rendered text, so the
  // offsets must line up with the original string exactly.
  const parts = String(text).split(/(?<=[.!?…:]["»)]?)\s+|\n+/);
  let cursor = 0;
  for(const part of parts){
    const at = String(text).indexOf(part, cursor);
    const offset = at >= 0 ? at : cursor;
    cursor = offset + part.length;
    if(!part.trim()) continue;
    if(part.length <= TTS_CHUNK_MAX){ out.push({text:part, offset}); continue; }
    // An over-long sentence is broken at a comma or a space rather than mid-word.
    let rest = part, restOffset = offset;
    while(rest.length > TTS_CHUNK_MAX){
      const window_ = rest.slice(0, TTS_CHUNK_MAX);
      let cut = Math.max(window_.lastIndexOf(", "), window_.lastIndexOf("; "));
      if(cut < 40) cut = window_.lastIndexOf(" ");
      if(cut < 40) cut = TTS_CHUNK_MAX;
      out.push({text:rest.slice(0, cut), offset:restOffset});
      restOffset += cut;
      rest = rest.slice(cut).replace(/^\s+/, m => { restOffset += m.length; return ""; });
    }
    if(rest.trim()) out.push({text:rest, offset:restOffset});
  }
  return out;
}

// The single entry point. `opts.onWord` receives a character index into the *original*
// string (not the chunk), so a caller that rendered the text as spans can find the one
// being spoken; it gets null when reading ends.
function speak(text, opts){
  if(!ttsAvailable() || !String(text||"").trim()) return;
  ttsStop();
  const token = tts.token;
  tts.chunks = ttsChunk(text);
  tts.idx = 0;
  tts.onWord = (opts && opts.onWord) || null;
  tts.onState = (opts && opts.onState) || null;
  if(!tts.chunks.length) return;
  if(tts.onState) tts.onState("playing");
  ttsSpeakNext(token);
}

function ttsSpeakNext(token){
  if(token !== tts.token) return;
  const chunk = tts.chunks[tts.idx];
  if(!chunk){ ttsStop(); return; }
  const u = new SpeechSynthesisUtterance(chunk.text);
  u.voice = tts.voice;
  u.lang = tts.voice.lang || "nb-NO";
  u.rate = tts.rate;
  if(tts.onWord){
    u.addEventListener("boundary", e => {
      // Safari does not fire these. FR-007 makes the highlight optional for exactly
      // that reason — everything else works without it.
      if(token !== tts.token || e.name === "sentence") return;
      tts.onWord(chunk.offset + e.charIndex);
    });
  }
  u.addEventListener("end", () => {
    if(token !== tts.token) return;
    tts.idx++;
    ttsSpeakNext(token);
  });
  u.addEventListener("error", () => {
    // "interrupted" and "canceled" are our own cancel() arriving; anything else is a
    // real failure and stopping is the honest response either way.
    if(token !== tts.token) return;
    ttsStop();
  });
  window.speechSynthesis.speak(u);
}

function ttsPause(){
  if(!window.speechSynthesis.speaking || window.speechSynthesis.paused) return;
  window.speechSynthesis.pause();
  if(tts.onState) tts.onState("paused");
}

function ttsResume(){
  if(!window.speechSynthesis.paused) return;
  window.speechSynthesis.resume();
  if(tts.onState) tts.onState("playing");
}

// A speaker button for one short string — a word, or a question with its options.
// Shares the queue with the reader, so pressing one cuts the other off (FR-008).
function ttsButton(getText, title){
  if(!ttsAvailable()) return null;
  const btn = el("button", {class:"btn-tts", type:"button", title:title||"Les høyt",
    click(e){
      e.preventDefault(); e.stopPropagation();
      const wasActive = btn.classList.contains("speaking");
      ttsStop();
      if(wasActive) return;
      btn.classList.add("speaking");
      speak(getText(), {onState(s){ if(s!=="playing") btn.classList.remove("speaking"); }});
    }}, icon("volume"));
  return btn;
}

// Renders `str` into `host` as one span per word, and returns a `mark(charIndex)` that
// highlights the word containing that index — or clears the highlight when passed null.
// Whitespace stays in plain text nodes so the rendered text is character-for-character
// the original, which is what lets a character index from the speech engine be looked
// up here at all.
function fillSpokenText(host, str){
  const tokens=[];
  const text=String(str||"");
  const re=/\S+/g;
  let last=0, m;
  while((m=re.exec(text))!==null){
    if(m.index>last) host.appendChild(document.createTextNode(text.slice(last,m.index)));
    const span=el("span",{class:"tts-word"},m[0]);
    tokens.push({start:m.index, end:m.index+m[0].length, span});
    host.appendChild(span);
    last=m.index+m[0].length;
  }
  if(last<text.length) host.appendChild(document.createTextNode(text.slice(last)));

  let current=null;
  return function mark(charIndex){
    if(current){ current.classList.remove("tts-now"); current=null; }
    if(charIndex==null) return;
    // First token that has not ended yet. A boundary index landing in the space before
    // a word is the common case, and this resolves it to that word.
    let lo=0, hi=tokens.length-1, hit=-1;
    while(lo<=hi){
      const mid=(lo+hi)>>1;
      if(tokens[mid].end>charIndex){ hit=mid; hi=mid-1; } else { lo=mid+1; }
    }
    if(hit<0) return;
    current=tokens[hit].span;
    current.classList.add("tts-now");
    const r=current.getBoundingClientRect();
    if(r.top<70||r.bottom>window.innerHeight-40) current.scrollIntoView({block:"center",behavior:"smooth"});
  };
}

// Play / pause / stop plus the speed choice, for one reading text.
function buildTtsBar(text, onWord){
  const bar=el("div",{class:"tts-bar"});
  const playBtn=el("button",{class:"btn btn--primary",type:"button"},"▶︎ Les høyt");
  const stopBtn=el("button",{class:"btn",type:"button",disabled:true},"⏹ Stopp");
  let playing=false;

  function setState(s){
    playing = s==="playing";
    playBtn.textContent = s==="playing" ? "⏸ Pause" : s==="paused" ? "▶︎ Fortsett" : "▶︎ Les høyt";
    if(s==="idle") stopBtn.setAttribute("disabled",true); else stopBtn.removeAttribute("disabled");
  }

  playBtn.addEventListener("click",()=>{
    if(playing){ ttsPause(); setState("paused"); return; }
    if(window.speechSynthesis.paused && tts.chunks.length){ ttsResume(); setState("playing"); return; }
    // A fresh read, not a resume — resuming the same utterance is not a second use.
    trackEvent("lesing.tts_play",{textId:text.id,speed:tts.rate,scope:"text"});
    speak(text.text, {onWord, onState:setState});
  });
  stopBtn.addEventListener("click",()=>{ ttsStop(); setState("idle"); });

  bar.appendChild(playBtn);
  bar.appendChild(stopBtn);

  const rateWrap=el("div",{class:"tts-rate",style:{display:"flex",alignItems:"center",gap:"6px"}});
  rateWrap.appendChild(el("span",{class:"card__note",style:{marginRight:"2px"}},"Fart:"));
  [[0.7,"Sakte"],[1,"Normal"]].forEach(([val,label])=>{
    const b=el("button",{type:"button",class:"pill","aria-pressed":tts.rate===val?"true":"false",
      click(e){
        ttsSetRate(val);
        rateWrap.querySelectorAll(".pill").forEach(x=>x.setAttribute("aria-pressed","false"));
        e.currentTarget.setAttribute("aria-pressed","true");
        // Rate is fixed for the lifetime of an utterance, so a change mid-read only
        // takes effect if the queue is restarted. Restarting from the top is the
        // predictable reading of "read it slower".
        if(playing) speak(text.text,{onWord,onState:setState});
      }},label);
    rateWrap.appendChild(b);
  });
  bar.appendChild(rateWrap);
  return bar;
}

// ── LESING TAB ───────────────────────────────────────────────────────
const lesingState = { texts:null, topicFilter:"", grammarFilter:"", readFilter:"", search:"", currentText:null, answers:{}, summaryText:"", summaryVisible:false, savedSummaries:{} };

function setLesingText(text){
  lesingState.currentText=text;
  const saved=lesingState.savedSummaries[text.id];
  lesingState.summaryText=saved?saved.summary_text:"";
  lesingState.summaryVisible=!!(saved&&saved.summary_text);
}

async function loadLesingTexts(){
  if(lesingState.texts) return lesingState.texts;
  try{
    const r = await fetch("lesing-tekster.json");
    lesingState.texts = await r.json();
  } catch(e){ lesingState.texts=[]; }
  return lesingState.texts;
}

function buildLesing(){
  const frag=document.createDocumentFragment();

  // If a text is open, show reader view
  if(lesingState.currentText){
    frag.appendChild(buildLesingReader(lesingState.currentText));
    return frag;
  }

  // ── Topbar ──
  const topbar=el("div",{class:"topbar",style:{borderRadius:"var(--r-card)",marginBottom:"var(--s-4)"}});
  const topbarTitle=el("div",{});
  topbarTitle.appendChild(el("div",{class:"topbar__title"},"Lesing"));
  topbarTitle.appendChild(el("div",{class:"topbar__meta"},lesingState.texts?`${lesingState.texts.length} tekster`:""));
  topbar.appendChild(topbarTitle);
  frag.appendChild(topbar);
  frag.appendChild(el("p",{class:"card__note",style:{margin:"-10px 0 var(--s-3)"}},
    "Tekster er 200–300 ord på B2-nivå og trener leddsetninger, som-setninger, konjunksjoner og subjunksjoner."));

  // ── Search ──
  const searchWrap=el("div",{class:"search",style:{marginBottom:"var(--s-3)"}});
  const searchIcon=icon("search"); searchIcon.style.cssText="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;";
  searchWrap.appendChild(searchIcon);
  const searchBox=el("input",{class:"input",type:"text",placeholder:"Søk etter tittel eller nøkkelord…",value:lesingState.search,
    input(e){lesingState.search=e.target.value; refreshLesingList();}});
  searchWrap.appendChild(searchBox);
  frag.appendChild(searchWrap);

  // ── Filter panel (§ "Filters"), mirroring buildOrdbank()'s pattern ──
  const isOpen = lesingState.filtersOpen ?? true;
  const activeCount = [lesingState.topicFilter,lesingState.grammarFilter,lesingState.readFilter].filter(Boolean).length;
  const panel=el("div",{class:"filter-panel",style:{marginBottom:"var(--s-4)"}});
  if(!isOpen) panel.setAttribute("data-collapsed","");

  const head=el("div",{class:"filter-panel__head"});
  const headLeft=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}});
  headLeft.appendChild(icon("filter")); headLeft.lastChild.style.color="var(--ink-3)";
  headLeft.appendChild(el("span",{class:"label-mono"},"Filtre"));
  if(activeCount) headLeft.appendChild(el("span",{class:"badge-count"},String(activeCount)));
  if(!isOpen){
    const GRAMMAR_LABELS={leddsetning:"leddsetning","som-setning":"som-setning",konjunksjon:"konjunksjon",subjunksjon:"subjunksjon",passiv:"passiv"};
    if(lesingState.topicFilter) headLeft.appendChild(buildRemovablePill(lesingState.topicFilter, ()=>{lesingState.topicFilter="";renderContent();}));
    if(lesingState.grammarFilter) headLeft.appendChild(buildRemovablePill(GRAMMAR_LABELS[lesingState.grammarFilter]||lesingState.grammarFilter, ()=>{lesingState.grammarFilter="";renderContent();}));
    if(lesingState.readFilter==="hide_read") headLeft.appendChild(buildRemovablePill("skjul leste", ()=>{lesingState.readFilter="";renderContent();}));
  }
  head.appendChild(headLeft);
  const headRight=el("div",{style:{display:"flex",alignItems:"center",gap:"14px"}});
  if(activeCount) headRight.appendChild(el("button",{class:"btn--link",click(){
    lesingState.topicFilter="";lesingState.grammarFilter="";lesingState.readFilter="";
    renderContent();
  }},"Nullstill"));
  headRight.appendChild(el("button",{style:{background:"none",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:"6px",fontSize:"13px",color:"var(--ink-2)",fontWeight:"500"},
    click(){ lesingState.filtersOpen=!isOpen; trackEvent("filters.toggled",{tab:"lesing",state:isOpen?"collapsed":"expanded"}); renderContent(); }
  },(isOpen?"Skjul filtre":"Vis filtre")+" ",el("span",{style:{fontSize:"10px"}},"▼")));
  head.appendChild(headRight);
  panel.appendChild(head);

  const body=el("div",{class:"filter-panel__body"});

  // TEMA facet — reuses the canonical TOPICS emoji via topicIcon() only where the
  // pill's swatch color comes from; the pill itself uses topicTema()'s colour,
  // never emoji, per the design system's "tema is colour" rule.
  const temaFacet=el("div",{class:"facet"});
  temaFacet.appendChild(el("div",{class:"facet__label"},"Tema"));
  const temaOpts=el("div",{class:"facet__options"});
  temaOpts.appendChild(buildFacetPill("Alle",!lesingState.topicFilter,()=>{lesingState.topicFilter="";renderContent();}));
  VALID_TOPIC_LIST.filter(t=>t!=="generelt").forEach(t=>{
    temaOpts.appendChild(buildFacetPill(t,lesingState.topicFilter===t,()=>{lesingState.topicFilter=t;renderContent();},topicTema(t).bg));
  });
  temaFacet.appendChild(temaOpts);
  body.appendChild(temaFacet);

  // GRAMMATIKK facet
  const gramFacet=el("div",{class:"facet"});
  gramFacet.appendChild(el("div",{class:"facet__label"},"Grammatikk"));
  const gramOpts=el("div",{class:"facet__options"});
  [["","Alle"],["leddsetning","Leddsetning"],["som-setning","Som-setning"],["konjunksjon","Konjunksjon"],["subjunksjon","Subjunksjon"],["passiv","Passiv"]].forEach(([val,label])=>{
    gramOpts.appendChild(buildFacetPill(label,lesingState.grammarFilter===val,()=>{lesingState.grammarFilter=val;renderContent();}));
  });
  gramFacet.appendChild(gramOpts);
  body.appendChild(gramFacet);

  // LEST facet. Applies to the list only — the prev/next navigation inside the
  // reader deliberately ignores it, because opening a text marks it read, and a
  // nav set that dropped the text you are currently in would renumber itself
  // under you.
  const readFacet=el("div",{class:"facet"});
  readFacet.appendChild(el("div",{class:"facet__label"},"Lest"));
  const readOpts=el("div",{class:"facet__options"});
  [["","Alle tekster"],["hide_read","Skjul leste"]].forEach(([val,label])=>{
    readOpts.appendChild(buildFacetPill(label,lesingState.readFilter===val,()=>{lesingState.readFilter=val;renderContent();}));
  });
  readFacet.appendChild(readOpts);
  body.appendChild(readFacet);

  panel.appendChild(body);
  frag.appendChild(panel);

  // Text list container
  const listDiv=el("div",{id:"lesing-list"});
  frag.appendChild(listDiv);

  // Load texts and stats, then render
  Promise.all([loadLesingTexts(), loadStats()]).then(()=>refreshLesingList());

  return frag;
}

function refreshLesingList(){
  const listDiv=$("lesing-list");
  if(!listDiv) return;
  listDiv.innerHTML="";
  if(!lesingState.texts || lesingState.texts.length===0){
    listDiv.appendChild(el("div",{class:"empty-state"},el("p",{class:"card__sub"},"Ingen tekster lastet")));
    return;
  }
  // Same signal that renders the read status below, so the filter means exactly
  // what the status says. Read state is only ever added to, so this is safe to
  // compute once.
  const readIds = new Set((statsCache?.events||[]).filter(e=>e.type==="text_read").map(e=>e.textId));

  let filtered=lesingState.texts.filter(t=>{
    if(lesingState.topicFilter && t.topic!==lesingState.topicFilter) return false;
    if(lesingState.grammarFilter && !t.grammarFocus.some(g=>g.includes(lesingState.grammarFilter.split("-")[0]))) return false;
    if(lesingState.readFilter==="hide_read" && readIds.has(t.id)) return false;
    if(lesingState.search){
      const q=lesingState.search.toLowerCase();
      return t.title.toLowerCase().includes(q)||t.text.toLowerCase().includes(q)||(t.keyWords||[]).some(w=>w.toLowerCase().includes(q));
    }
    return true;
  });

  if(filtered.length===0){
    // With the read filter on, an empty list usually means the learner has finished
    // everything matching, which is a different message from "your search found nothing"
    // (§ "Empty and loading states": name the filters that produced it, offer Nullstill).
    const doneAll = lesingState.readFilter==="hide_read";
    const empty=el("div",{class:"empty-state"});
    empty.appendChild(el("p",{class:"card__sub"},doneAll?"Du har lest alle tekstene som passer filtrene.":"Ingen tekster passer disse filtrene"));
    if(lesingState.topicFilter||lesingState.grammarFilter||lesingState.readFilter||lesingState.search){
      empty.appendChild(el("button",{class:"btn--link",style:{marginTop:"6px"},click(){
        lesingState.topicFilter="";lesingState.grammarFilter="";lesingState.readFilter="";lesingState.search="";
        renderContent();
      }},"Nullstill"));
    }
    listDiv.appendChild(empty);
    return;
  }

  const readCounts = {};
  (statsCache?.events||[]).filter(e=>e.type==="text_read").forEach(e=>{ readCounts[e.textId]=(readCounts[e.textId]||0)+1; });

  // Subscriber sees all texts; free users are subject to plan + free-tier limits
  const subscriber = isActiveSubscriber();
  const hasPlan = planState.weeks && planState.weeks.length > 0;
  const unlockedByPlan = hasPlan ? getUnlockedTextIds() : new Set();

  // If free user with no plan, show a prompt (subscriber sees no prompt)
  const grid=el("div",{class:"word-grid"});

  if(!subscriber && !hasPlan){
    const noPlanBox = el("div",{class:"card",style:{gridColumn:"1/-1",display:"flex",alignItems:"center",gap:"16px",flexWrap:"wrap"}});
    const txt = el("div",{style:{flex:"1",minWidth:"200px"}});
    txt.appendChild(el("div",{class:"card__title",style:{marginBottom:"4px"}},"Ingen studieplan aktivert"));
    txt.appendChild(el("div",{class:"card__sub"},"Lag en studieplan i Min uke for å låse opp tekster. Eller oppgrader til abonnement for ubegrenset tilgang."));
    const btnRow=el("div",{class:"actions",style:{flexShrink:"0"}});
    btnRow.appendChild(el("button",{class:"btn btn--primary",click(){setTab("minuke");}},"Lag plan"));
    btnRow.appendChild(el("button",{class:"btn",click(){setTab("innstillinger");}},"Oppgrader"));
    noPlanBox.appendChild(txt);
    noPlanBox.appendChild(btnRow);
    grid.appendChild(noPlanBox);
  }

  if(!subscriber && hasPlan){
    const used=state.freeAccess.openedTexts.length;
    const remaining=Math.max(0,3-used);
    if(remaining<3){
      const infoBox=el("div",{class:"card",style:{gridColumn:"1/-1"}});
      infoBox.appendChild(el("span",{class:"card__sub"},`Du har ${remaining===0?"brukt alle":`${remaining} av`} 3 gratis tekster igjen. `));
      infoBox.appendChild(el("a",{href:"#",style:{fontWeight:"700"},onclick(e){e.preventDefault();setTab("innstillinger");}},
        "Oppgrader til abonnement for ubegrenset tilgang →"));
      grid.appendChild(infoBox);
    }
  }

  filtered.forEach(text=>{
    const tema=topicTema(text.topic);
    const hasRead = readIds.has(text.id);
    // Determine if text is openable
    const planLocked = !subscriber && !unlockedByPlan.has(text.id);
    const freeLocked  = !subscriber && !canOpenText(text.id, text.topic);
    const isLocked    = planLocked || freeLocked;

    const card = el("div",{class:"card",style:{
      cursor: isLocked ? "default" : "pointer",
      opacity: isLocked ? "0.65" : "1",
      position:"relative",
    }});
    if(!isLocked){
      card.addEventListener("click",()=>{
        recordTextOpened(text.id, text.topic);
        setLesingText(text);
        trackEvent("text_read",{textId:text.id,title:text.title,topic:text.topic,level:text.level||"B2"});
        renderContent();
      });
    }

    const topRow=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"8px",marginBottom:"var(--s-2)",flexWrap:"wrap"}});
    topRow.appendChild(el("span",{class:"tag",style:{background:tema.bg,color:tema.fg}},text.topic));
    // Status: locked reasons are their own label; otherwise read/unread status.
    if(planLocked){
      topRow.appendChild(el("span",{class:"card__note"},"Ikke i planen din"));
    } else if(freeLocked){
      topRow.appendChild(el("span",{style:{fontSize:"12px",color:"var(--danger)",fontWeight:"600"}},"Krever abonnement"));
    } else {
      const times = readCounts[text.id];
      const st=el("div",{class:"status status--"+(hasRead?"learned":"new")});
      st.appendChild(el("span",{class:"status__dot"}));
      st.appendChild(document.createTextNode(hasRead?`lest${times>1?` ${times}×`:""}`:"ikke lest"));
      topRow.appendChild(st);
    }
    card.appendChild(topRow);

    if(!isLocked && lesingState.savedSummaries[text.id]){
      card.appendChild(el("span",{class:"tag",style:{marginBottom:"var(--s-2)",display:"inline-block"}},"Sammendrag skrevet"));
    }

    card.appendChild(el("div",{class:"card__title",style:{marginBottom:"var(--s-1)"}},text.title));
    card.appendChild(el("div",{class:"card__note",style:{marginBottom:"var(--s-2)"}},text.text.substring(0,120)+"…"));
    if(!isLocked){
      const tagRow=el("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap"}});
      (text.grammarFocus||[]).slice(0,3).forEach(g=>{
        const short=g.replace("subjunksjon-","subj: ").replace("konjunksjon-","konj: ");
        tagRow.appendChild(el("span",{class:"tag"},short));
      });
      card.appendChild(tagRow);
    }

    // Paywall overlay for subscription-locked texts (dead code path while
    // SUBSCRIPTION_ENABLED = false, per app/CLAUDE.md — left functional, not
    // deep-restyled, since nothing exercises it today).
    if(freeLocked){
      const overlay=el("div",{class:"paywall-overlay"});
      overlay.appendChild(el("div",{class:"paywall-title"},"Krever abonnement"));
      overlay.appendChild(el("div",{class:"paywall-sub"},"Du har brukt alle 3 gratis tekster.\nOppgrader for ubegrenset tilgang."));
      overlay.appendChild(el("button",{class:"btn btn--primary",click(e){e.stopPropagation();setTab("innstillinger");}},"Oppgrader til abonnement"));
      card.appendChild(overlay);
    }

    grid.appendChild(card);
  });
  listDiv.appendChild(el("div",{class:"card__note",style:{marginBottom:"var(--s-3)"}},`${filtered.length} tekst${filtered.length!==1?"er":""} funnet`));
  listDiv.appendChild(grid);
}

function buildLesingReader(text){
  const tema=topicTema(text.topic);
  const frag=document.createDocumentFragment();

  // Back button
  const backBtn=el("button",{class:"btn",style:{marginBottom:"var(--s-3)"},
    click(){lesingState.currentText=null; lesingState.summaryText=""; lesingState.summaryVisible=false; renderContent();}},
    "← Tilbake til tekstlisten");
  frag.appendChild(backBtn);

  // Two-column layout: reader + lookup panel
  const layout=el("div",{class:"lesing-reader-layout"});

  // Reader card
  const card=el("div",{class:"card"});
  const headRow=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"var(--s-2)"}});
  headRow.appendChild(el("span",{class:"tag",style:{background:tema.bg,color:tema.fg}},text.topic));
  headRow.appendChild(el("span",{class:"card__note"},"B2"));
  card.appendChild(headRow);
  card.appendChild(el("h2",{class:"card__title",style:{fontSize:"22px",marginBottom:"var(--s-3)"}},text.title));

  // Grammar tags
  const tagRow=el("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"var(--s-4)"}});
  (text.grammarFocus||[]).forEach(g=>{
    tagRow.appendChild(el("span",{class:"tag"},g));
  });
  card.appendChild(tagRow);

  // Main text. With a Norwegian voice available it is rendered as one span per word so
  // the word being spoken can be marked; without one it stays a plain text node, so a
  // learner who cannot use the feature sees exactly the page they saw before it existed.
  const textDiv=el("div",{style:{fontSize:"var(--font-base)",lineHeight:"1.85",color:"#333",whiteSpace:"pre-wrap",fontFamily:"Georgia,serif",letterSpacing:".01em"}});
  let markSpokenWord=null;
  if(ttsAvailable()){
    card.appendChild(buildTtsBar(text, idx=>markSpokenWord&&markSpokenWord(idx)));
    markSpokenWord=fillSpokenText(textDiv, text.text);
  } else {
    textDiv.textContent=text.text;
    // The controls are hidden entirely here, which is silent by design — so no
    // learner will ever report it and the size of this group is otherwise
    // unknowable (FR-019). Once per session, never per render: renderContent()
    // runs constantly and would make this the loudest feature on the page.
    reportTtsUnavailableOnce();
  }
  card.appendChild(textDiv);

  // Divider
  card.appendChild(el("hr",{style:{border:"none",borderTop:"1px solid var(--color-border-light)",margin:"20px 0"}}));

  // Key words
  if(text.keyWords && text.keyWords.length>0){
    card.appendChild(el("div",{class:"field__label",style:{marginBottom:"var(--s-2)"}},"Nøkkelord i teksten"));
    const kwRow=el("div",{style:{display:"flex",gap:"7px",flexWrap:"wrap",marginBottom:"var(--s-3)"}});
    text.keyWords.forEach(w=>{
      kwRow.appendChild(el("span",{class:"tag"},w));
    });
    card.appendChild(kwRow);
  }

  // Source
  if(text.source){
    card.appendChild(el("div",{style:{fontSize:"var(--font-xs)",color:"var(--color-text-muted)"}},`Kilde: ${text.source}`));
  }

  // ── Comprehension questions (T004–T008) ──
  if(text.questions && text.questions.length>0){
    const qSection=el("div",{style:{marginTop:"24px"}});
    qSection.appendChild(el("div",{class:"field__label",style:{marginBottom:"var(--s-3)",paddingTop:"var(--s-3)",borderTop:"1px solid var(--line-soft)"}},"Forståelsesspørsmål"));
    const textAnswers=lesingState.answers[text.id]||{};
    text.questions.forEach((q,qi)=>{
      const qBlock=el("div",{style:{marginBottom:"18px"}});
      const qRow=el("div",{style:{display:"flex",alignItems:"flex-start",gap:"6px",marginBottom:"8px"}});
      qRow.appendChild(el("div",{style:{fontSize:"var(--font-base)",fontWeight:"600",color:"#222",lineHeight:"1.5"}},(qi+1)+". "+q.question));
      // The options are read after the question, so a multiple-choice item works as a
      // listening exercise without the learner having to read anything.
      const qSpeak=ttsButton(()=>[q.question,...(q.options||[])].join(". "),"Les spørsmålet høyt");
      if(qSpeak){ qSpeak.style.marginTop="2px"; qRow.appendChild(qSpeak); }
      qBlock.appendChild(qRow);
      if(q.options && q.options.length>0){
        const answered=textAnswers[qi]!==undefined;
        const correct=q.answer;
        const optWrap=el("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
        q.options.forEach((opt,oi)=>{
          const isSelected=textAnswers[qi]===oi;
          const isCorrect=oi===correct;
          let bg="var(--surface)",color="var(--ink)",border="1px solid var(--line-strong)",fw="400";
          if(answered){
            if(isCorrect){bg="var(--green-tint)";color="var(--green)";border="1px solid var(--green)";fw="700";}
            else if(isSelected){bg="#fdf2f2";color="var(--danger)";border="1px solid var(--danger)";}
          }
          const btn=el("button",{style:{textAlign:"left",padding:"8px 12px",borderRadius:"var(--r-btn)",fontSize:"13.5px",fontWeight:fw,background:bg,color,border,cursor:answered?"default":"pointer",pointerEvents:answered?"none":"auto",width:"100%"}});
          btn.textContent=opt;
          if(!answered){
            btn.addEventListener("click",()=>{
              if(!lesingState.answers[text.id]) lesingState.answers[text.id]={};
              lesingState.answers[text.id][qi]=oi;
              trackEvent("lesing.question_answered",{textId:text.id,questionIndex:qi,correct:oi===correct,kind:"mcq"});
              renderContent();
            });
          }
          optWrap.appendChild(btn);
        });
        qBlock.appendChild(optWrap);
      } else {
        // Open-ended question — render a small textarea
        const savedAnswer=typeof textAnswers[qi]==="string"?textAnswers[qi]:"";
        const openTa=el("textarea",{class:"textarea",style:{minHeight:"72px"}});
        openTa.placeholder="Skriv svaret ditt her…";
        openTa.value=savedAnswer;
        openTa.addEventListener("input",e=>{
          if(!lesingState.answers[text.id]) lesingState.answers[text.id]={};
          lesingState.answers[text.id][qi]=e.target.value;
        });
        qBlock.appendChild(openTa);
      }
      qSection.appendChild(qBlock);
    });
    card.appendChild(qSection);
  }

  // ── Gjenfortell area (T009–T012, T013–T017) ──
  const gjArea=el("div",{style:{marginTop:"var(--s-4)"}});
  const gjBtn=el("button",{class:"btn",style:{marginBottom:"var(--s-2)"}});
  gjBtn.textContent="Gjenfortell teksten";
  gjBtn.addEventListener("click",()=>{
    if(!lesingState.summaryVisible || lesingState.summaryText===""){
      lesingState.summaryVisible=!lesingState.summaryVisible;
      renderContent();
    }
  });
  gjArea.appendChild(gjBtn);

  if(lesingState.summaryVisible){
    const ta=el("textarea",{class:"textarea",style:{minHeight:"140px",fontFamily:"Georgia,serif",marginBottom:"var(--s-2)",display:"block"}});
    ta.placeholder="Skriv et sammendrag av teksten her…";
    ta.value=lesingState.summaryText;

    const wcLabel=el("div",{style:{fontSize:"12.5px",marginBottom:"var(--s-2)",color:"var(--ink-3)"}});
    function updateWc(){
      const words=lesingState.summaryText.trim()?lesingState.summaryText.trim().split(/\s+/).filter(Boolean).length:0;
      let color="var(--ink-3)",hint="";
      if(words>=100&&words<=150){color="var(--green)";}
      else if(words>150){color="var(--status-doing)";hint=" — Over maksimumsgrensen (150 ord)";}
      else if(words>0){hint=" — Målet er 100–150 ord";}
      wcLabel.textContent=words+" ord"+hint;
      wcLabel.style.color=color;
    }
    updateWc();
    ta.addEventListener("input",e=>{lesingState.summaryText=e.target.value;updateWc();});
    ta.addEventListener("blur",()=>{
      if(!lesingState.summaryText.trim()) return;
      const textId=lesingState.currentText?.id; if(!textId) return;
      api(`/api/reading-summaries/${encodeURIComponent(textId)}`,{
        method:"PUT",
        body:JSON.stringify({summary_text:lesingState.summaryText}),
      }).then(async r=>{
        if(r?.ok){const saved=await r.json();lesingState.savedSummaries[textId]=saved;}
      }).catch(()=>{});
    });

    const feedbackContainer=el("div",{});

    // Restore previous AI feedback if available
    const prevSaved=lesingState.savedSummaries[text.id];
    if(prevSaved?.claude_feedback){
      try{renderGjenfortellResult(JSON.parse(prevSaved.claude_feedback),feedbackContainer);}catch{}
    }

    const saveBtn=el("button",{class:"btn btn--accent",style:{marginBottom:"var(--s-2)",marginRight:"var(--s-2)"}});
    saveBtn.textContent="Lagre sammendrag";
    saveBtn.addEventListener("click",async()=>{
      if(!lesingState.summaryText.trim()){toast("Skriv et sammendrag først");return;}
      const textId=lesingState.currentText?.id; if(!textId) return;
      saveBtn.disabled=true; saveBtn.textContent="Lagrer…";
      try{
        const r=await api(`/api/reading-summaries/${encodeURIComponent(textId)}`,{
          method:"PUT",
          body:JSON.stringify({summary_text:lesingState.summaryText}),
        });
        if(r?.ok){const saved=await r.json();lesingState.savedSummaries[textId]=saved;toast("Sammendrag lagret");}
        else{toast("Kunne ikke lagre");}
      }catch{toast("Kunne ikke lagre");}
      saveBtn.disabled=false; saveBtn.textContent="Lagre sammendrag";
    });

    const checkBtn=el("button",{class:"btn btn--primary",style:{marginBottom:"var(--s-3)"}});
    checkBtn.textContent="Sjekk med AI";
    checkBtn.addEventListener("click",async()=>{
      if(!lesingState.summaryText.trim()){toast("Skriv et sammendrag først");return;}
      await checkGjenfortellWithClaude(text,lesingState.summaryText,feedbackContainer);
    });

    gjArea.appendChild(ta);
    gjArea.appendChild(wcLabel);
    gjArea.appendChild(saveBtn);
    gjArea.appendChild(checkBtn);
    gjArea.appendChild(feedbackContainer);
  }
  card.appendChild(gjArea);

  layout.appendChild(card);

  // ── Lookup side panel ──
  const panel=el("div",{class:"lesing-lookup-panel"});
  const panelCard=el("div",{class:"card"});
  panelCard.appendChild(el("div",{class:"card__title",style:{marginBottom:"var(--s-2)"}},"Slå opp ord"));

  const lookupInput=el("input",{class:"input lookup-word-input",type:"text",placeholder:"Lim inn eller skriv et ord…"});
  // The speaker reads whatever is in the box, so it answers "how is this said?" before
  // the lookup has run and regardless of which branch the lookup took.
  const lookupSpeak=ttsButton(()=>lookupInput.value.replace(/[.,;:!?()«»"']/g,"").trim(),"Hør uttalen");
  if(lookupSpeak){
    lookupSpeak.classList.add("icon-btn");
    lookupInput.style.marginBottom="0";
    const row=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"var(--s-2)"}});
    row.appendChild(lookupInput);
    row.appendChild(lookupSpeak);
    panelCard.appendChild(row);
  } else {
    panelCard.appendChild(lookupInput);
  }

  const resultBox=el("div",{class:"lookup-result-box card__note"},"Skriv et ord og trykk Slå opp");
  // Shown only when the lookup came back without a translation. The word must still
  // be addable (FR-004), and the backend requires a non-empty meaning, so the
  // learner supplies it here rather than being turned away. They are reading the
  // word in context, which is the best moment to ask.
  const manualWrap=el("div",{style:{display:"none",marginBottom:"var(--s-2)"}});
  manualWrap.appendChild(el("label",{class:"field__label",style:{display:"block",marginBottom:"3px"}},"Skriv betydningen selv"));
  const manualInput=el("input",{class:"input lookup-word-input",type:"text",placeholder:"Hva betyr ordet?",style:{marginBottom:"0"}});
  manualWrap.appendChild(manualInput);
  const addBtn=el("button",{class:"btn btn--primary",style:{width:"100%",marginBottom:"var(--s-2)",display:"none",justifyContent:"center"}});
  const orbLink=el("a",{target:"_blank",style:{fontSize:"12.5px",display:"none",marginBottom:"var(--s-2)"}},"Se i Bokmålsordboka →");

  async function doLookup(){
    const raw=lookupInput.value.trim();
    if(!raw) return;
    // Strip punctuation for lookup
    const word=raw.replace(/[.,;:!?()«»"']/g,"").trim();
    if(!word) return;

    // Check ordbank first
    const inBank=state.words.find(w=>w.word.toLowerCase()===word.toLowerCase());
    if(inBank){
      resultBox.className="lookup-in-bank";
      resultBox.innerHTML=`<div class="wn">✓ ${inBank.word}</div><div class="wm">${inBank.meaning||"(ingen betydning)"}</div><div style="font-size:var(--font-xs);color:#2d9e6b;margin-top:4px">Allerede i ordbanken</div>`;
      manualWrap.style.display="none";
      addBtn.style.display="none";
      orbLink.style.display="block";
      orbLink.href=ordbokeneUrl(word);
      return;
    }

    // Not in bank — look up translation
    resultBox.className="lookup-result-box";
    resultBox.innerHTML='<span style="color:var(--color-text-muted)">Henter oversettelse…</span>';
    manualWrap.style.display="none";
    addBtn.style.display="none";

    // A word met while reading records where it came from, so the learner can get
    // back to the sentence they first saw it in. Teacher-created texts use a
    // different id space from the built-in ones, hence the kind.
    const srcKind = text.isCustom ? "custom" : "builtin";
    const srcId = text.id!=null ? String(text.id) : null;

    let p=null;
    try{
      const body={term:word};
      if(srcId){body.source_text_id=srcId;body.source_text_kind=srcKind;}
      const r=await api("/api/words/lookup",{method:"POST",body:JSON.stringify(body)});
      if(r.ok)p=await r.json();
    }catch(e){}

    orbLink.href=ordbokeneUrl(word);
    orbLink.style.display="block";
    // Looking a word up while reading is a distinct behaviour from the Ordbank
    // lookup — same endpoint, different intent — so it gets its own feature.
    trackEvent("lesing.word_lookup",{textId:text.id});

    // A proposal without a translation is not the same as no proposal: a reused
    // entry from an unrepaired bank row arrives with everything except a meaning.
    // Both still have to end in an addable word, so the add path is shared and the
    // only difference is where the meaning comes from.
    const classified=p&&p.origin!=="unavailable";
    const headword=(classified&&p.word)||word;
    const proposed=classified?(p.meaning||""):"";

    async function addWord(meaning){
      const tempId="tmp_"+Date.now();
      // Prefer the proposal's topic; fall back to the text's own, normalised —
      // a teacher's custom text may carry a value that is not canonical, and
      // writing it raw is what stranded 117 rows.
      const topicVal=(classified&&p.topic)||normalizeTopic(text.topic)||FALLBACK_TOPIC;
      const payload={
        word:headword, meaning, category:(classified&&p.category)||"enkeltord", topic:topicVal,
        forms:(classified&&p.forms)||[], flashcard_options:[],
        explanation:(classified&&p.explanation)||null, examples:(classified&&p.examples)||[],
        base_form:(classified&&p.base_form)||null,
        source_text_id:srcId, source_text_kind:srcId?srcKind:null,
        // A learner-supplied meaning is not a classification. Marking it
        // unclassified is what lets the repair pass find it later (FR-004).
        classification_status:!proposed?"unclassified":(p.origin==="shared_bank"?"reused":"classified"),
      };
      state.words.push({id:tempId,createdAt:Date.now(),...payload});
      saveStorage(); renderTabs();
      resultBox.className="lookup-in-bank";
      resultBox.innerHTML=`<div class="wn">✓ ${escapeHtml(headword)}</div><div class="wm">${escapeHtml(meaning)}</div><div style="font-size:var(--font-xs);color:#2d9e6b;margin-top:4px">Lagt til i ordbanken!</div>`;
      manualWrap.style.display="none";
      addBtn.style.display="none";
      toast(`✓ «${headword}» lagt til i ordbanken`);
      try{
        const r=await api("/api/words",{method:"POST",body:JSON.stringify(payload)});
        if(r.ok){const sv=await r.json();const idx=state.words.findIndex(w=>w.id===tempId);if(idx>=0){state.words[idx]={...state.words[idx],...sv,createdAt:new Date(sv.created_at).getTime()};saveStorage();}}
      }catch{}
    }

    addBtn.textContent="+ Legg til i ordbanken";
    addBtn.style.display="block";

    if(proposed){
      let head=`<strong>${escapeHtml(headword)}</strong> — ${escapeHtml(proposed)}`;
      if(p.explanation) head+=`<div style="font-size:var(--font-xs);color:#666;margin-top:3px">${escapeHtml(p.explanation)}</div>`;
      if(p.normalised) head+=`<div style="font-size:var(--font-xs);color:#8a6d1a;margin-top:3px">Lagres som «${escapeHtml(headword)}»</div>`;
      resultBox.innerHTML=head;
      addBtn.disabled=false;
      addBtn.onclick=()=>addWord(proposed);
    } else {
      // Say which of the two happened — a learner who reads "ingen forbindelse"
      // knows to retry, one who reads "fant ingen oversettelse" does not.
      resultBox.innerHTML=p
        ?`<strong>${escapeHtml(headword)}</strong><div style="font-size:var(--font-xs);color:var(--color-text-muted);margin-top:3px">Fant ingen oversettelse. Skriv den selv, så kan du legge til ordet.</div>`
        :`<span style="color:var(--color-text-muted)">Ingen forbindelse akkurat nå. Skriv betydningen selv, så kan du legge til ordet.</span>`;
      manualWrap.style.display="block";
      manualInput.value="";
      addBtn.disabled=true;
      addBtn.onclick=()=>{
        const typed=manualInput.value.trim();
        if(typed) addWord(typed); // guarded: the backend rejects an empty meaning
      };
    }
  }

  lookupInput.addEventListener("keydown",e=>{ if(e.key==="Enter") doLookup(); });
  // The add button stays disabled until there is something to save, so the learner
  // cannot trigger the 422 the backend would return for an empty meaning.
  manualInput.addEventListener("input",()=>{ addBtn.disabled=!manualInput.value.trim(); });
  manualInput.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!addBtn.disabled) addBtn.onclick(); });
  const lookupBtn=el("button",{class:"btn",style:{width:"100%",marginBottom:"var(--s-2)",justifyContent:"center"},click:doLookup},"Slå opp");
  panelCard.appendChild(lookupBtn);
  panelCard.appendChild(resultBox);
  panelCard.appendChild(manualWrap);
  panelCard.appendChild(addBtn);
  orbLink.textContent="Se i Bokmålsordboka →";
  panelCard.appendChild(orbLink);
  panel.appendChild(panelCard);

  // Key words as quick-lookup chips
  if(text.keyWords&&text.keyWords.length){
    const kwCard=el("div",{class:"card"});
    kwCard.appendChild(el("div",{class:"card__title",style:{marginBottom:"3px"}},"Nøkkelord"));
    kwCard.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-2)"}},"Klikk for å slå opp"));
    const kwWrap=el("div",{style:{display:"flex",flexWrap:"wrap",gap:"6px"}});
    text.keyWords.forEach(kw=>{
      const inBank=state.words.find(w=>w.word.toLowerCase()===kw.toLowerCase());
      // aria-pressed alone drives the ✓ via .pill[aria-pressed="true"]::after
      // (b2-norsk.css) — no separate icon needed here.
      const chip=el("button",{class:"pill","aria-pressed":inBank?"true":"false",
        click(){lookupInput.value=kw; doLookup();}
      },kw);
      kwWrap.appendChild(chip);
    });
    kwCard.appendChild(kwWrap);
    panel.appendChild(kwCard);
  }

  layout.appendChild(panel);
  frag.appendChild(layout);

  // Navigation (prev/next in filtered list)
  if(lesingState.texts){
    let filtered=lesingState.texts.filter(t=>{
      if(lesingState.topicFilter && t.topic!==lesingState.topicFilter) return false;
      if(lesingState.grammarFilter && !t.grammarFocus.some(g=>g.includes(lesingState.grammarFilter.split("-")[0]))) return false;
      return true;
    });
    const idx=filtered.findIndex(t=>t.id===text.id);
    // A teacher's custom text (`asgn-<item_id>`) is not in the list, so it has no
    // neighbours — without this guard the "next" branch would offer filtered[0].
    if(idx>=0 && filtered.length>1){
      const navRow=el("div",{style:{display:"flex",justifyContent:"space-between",maxWidth:"720px",margin:"14px auto 0"}});
      if(idx>0){
        const prevBtn=el("button",{class:"btn",click(){setLesingText(filtered[idx-1]);trackEvent("text_read",{textId:filtered[idx-1].id,title:filtered[idx-1].title,topic:filtered[idx-1].topic,level:filtered[idx-1].level||"B2"});renderContent();window.scrollTo(0,0);}},"← "+filtered[idx-1].title.substring(0,30));
        navRow.appendChild(prevBtn);
      } else { navRow.appendChild(el("span",{})); }
      if(idx<filtered.length-1){
        const nextBtn=el("button",{class:"btn",click(){setLesingText(filtered[idx+1]);trackEvent("text_read",{textId:filtered[idx+1].id,title:filtered[idx+1].title,topic:filtered[idx+1].topic,level:filtered[idx+1].level||"B2"});renderContent();window.scrollTo(0,0);}},(filtered[idx+1].title.substring(0,30))+" →");
        navRow.appendChild(nextBtn);
      }
      frag.appendChild(navRow);
    }
  }
  return frag;
}

// ── ORDSTILLING (Sentence building) TAB ─────────────────────────────
function extractSentences(text){
  // Split on sentence-ending punctuation followed by whitespace or end
  const matches = text.match(/[^.!?]+[.!?]+/g) || [];
  return matches.map(s=>s.trim()).filter(s=>{
    const words = s.split(/\s+/);
    return words.length >= 8 && words.length <= 14;
  });
}

async function startWordSort(){
  await loadLesingTexts();
  let pool = lesingState.texts || [];
  if(ws.topicFilter) pool = pool.filter(t=>t.topic===ws.topicFilter);
  if(!pool.length && lesingState.texts && lesingState.texts.length) pool = lesingState.texts;
  if(!pool.length){ toast("Ingen tekster funnet."); return; }

  const allSents = [];
  pool.forEach(t => extractSentences(t.text).forEach(s => allSents.push(s)));
  const picked = shuffle(allSents).slice(0, 10);
  if(!picked.length){ toast("Ingen passende setninger funnet."); return; }

  ws.sentences = picked.map(orig => {
    const tokens = orig.split(/\s+/);
    return { original:orig, tokens, pool:shuffle([...tokens]), answer:[], checked:false, correct:null };
  });
  ws.idx = 0; ws.score = 0; ws.started = true; ws.tracked = false;
  // Completing the game emits `wordsort_session`, but a learner who plays five
  // of ten sentences and leaves has still used the feature — and used to
  // register as nothing at all. Adoption asks whether a feature is touched, so
  // starting is the honest signal; the completion event still measures finishing.
  trackEvent("setningsbygging.session_started",{count:ws.sentences.length,topicFilter:ws.topicFilter||null});
  renderContent();
}

function wsMoveToAnswer(sent, tokenIdx){
  sent.answer.push(sent.pool[tokenIdx]);
  sent.pool.splice(tokenIdx, 1);
  refreshWsRound();
}

function wsMoveToPool(sent, answerIdx){
  sent.pool.push(sent.answer[answerIdx]);
  sent.answer.splice(answerIdx, 1);
  refreshWsRound();
}

function wsCheck(sent){
  const userAnswer = sent.answer.join(" ");
  sent.correct = userAnswer === sent.original;
  sent.checked = true;
  if(sent.correct) ws.score++;
  refreshWsRound();
}

function refreshWsRound(){
  const old = $("ws-round-container");
  if(old) old.replaceWith(buildWsRound(ws.sentences[ws.idx]));
}

function wsAnswerClick(sent, i){
  if(ws.selectedAnswerIdx === null){
    ws.selectedAnswerIdx = i; // select
  } else if(ws.selectedAnswerIdx === i){
    ws.selectedAnswerIdx = null; // deselect
  } else {
    // Insert selected word before clicked position
    const sel = ws.selectedAnswerIdx;
    const [token] = sent.answer.splice(sel, 1);
    const insertAt = i > sel ? i - 1 : i;
    sent.answer.splice(insertAt, 0, token);
    ws.selectedAnswerIdx = null;
  }
  refreshWsRound();
}

function wsPoolClick(sent, i){
  ws.selectedAnswerIdx = null;
  wsMoveToAnswer(sent, i);
}

function buildWsRound(sent){
  const div = el("div", {id:"ws-round-container"});
  const sel = ws.selectedAnswerIdx;

  // Answer area label
  const answerLabel = sel !== null
    ? "Klikk et annet ord for å flytte det dit, eller klikk det samme for å avvelge:"
    : "Din setning:";
  div.appendChild(el("div",{class:"label-mono",style:{color:sel!==null?"var(--green)":"var(--ink-3)",marginBottom:"6px"}},answerLabel));

  const answerArea = el("div", {class:"ws-answer-area"+(sent.answer.length===0?" empty":"")});
  if(sent.answer.length === 0){
    answerArea.appendChild(el("span",{class:"card__note",style:{alignSelf:"center"}},"Klikk på ord nedenfor for å bygge setningen..."));
  }
  sent.answer.forEach((tok, i) => {
    const isSelected = sel === i;
    const btn = el("button",{class:"ws-token"+(isSelected?" selected":"")},tok);
    if(!sent.checked) btn.addEventListener("click", ()=>wsAnswerClick(sent, i));
    else btn.disabled = true;
    answerArea.appendChild(btn);
  });
  div.appendChild(answerArea);

  // Pool area
  div.appendChild(el("div",{class:"label-mono",style:{marginBottom:"6px"}},"Tilgjengelige ord:"));
  const poolArea = el("div", {class:"ws-pool-area"});
  if(sent.pool.length === 0 && !sent.checked){
    poolArea.appendChild(el("span",{class:"card__note",style:{alignSelf:"center"}},"Alle ord er plassert — sjekk svaret ditt!"));
  }
  sent.pool.forEach((tok, i) => {
    const btn = el("button",{class:"ws-token in-pool"},tok);
    if(!sent.checked) btn.addEventListener("click", ()=>wsPoolClick(sent, i));
    else btn.disabled = true;
    poolArea.appendChild(btn);
  });
  div.appendChild(poolArea);

  // Actions
  const actRow = el("div",{class:"action-row"});
  if(!sent.checked){
    const canCheck = sent.pool.length === 0 && sent.answer.length > 0;
    const checkBtn = el("button",{
      class:"btn btn--primary",
      style:{opacity:canCheck?"1":".4"},
      click(){if(canCheck){ws.selectedAnswerIdx=null;wsCheck(sent);}}
    },"Sjekk svar");
    actRow.appendChild(checkBtn);
    actRow.appendChild(el("button",{class:"btn",click(){
      ws.selectedAnswerIdx = null;
      sent.pool = shuffle([...sent.tokens]);
      sent.answer = [];
      refreshWsRound();
    }},"Nullstill"));
  } else {
    const isLast = ws.idx + 1 >= ws.sentences.length;
    actRow.appendChild(el("button",{class:"btn btn--primary",click(){
      ws.idx++;
      renderContent();
    }}, isLast ? "Se resultat →" : "Neste →"));
  }
  div.appendChild(actRow);

  // Feedback
  if(sent.checked){
    if(sent.correct){
      div.appendChild(el("div",{class:"ws-correct-box"},"✓ Riktig!"));
    } else {
      const wrongBox = el("div",{class:"ws-wrong-box"});
      wrongBox.appendChild(el("div",{},"✗ Ikke helt riktig."));
      wrongBox.appendChild(el("div",{class:"ws-wrong-original"},`Riktig: ${sent.original}`));
      div.appendChild(wrongBox);
    }
  }

  return div;
}

function buildOrdstilling(){
  const frag = document.createDocumentFragment();

  if(!ws.started){
    // Setup screen
    const card = el("div",{class:"card"});
    card.appendChild(el("div",{class:"card__title",style:{marginBottom:"6px"}},"Setningsbygging"));
    card.appendChild(el("p",{class:"card__sub",style:{marginBottom:"var(--s-4)"}},

    // Filters — same filter-panel/facet/pill component as Ordbank, Setninger and
    // Flashcards. Topics are the canonical VALID_TOPIC_LIST (built-in texts cover

    {

      if(!isOpen && ws.topicFilter) headLeft.appendChild(buildRemovablePill(ws.topicFilter,()=>{ws.topicFilter="";renderContent();}));
      head.appendChild(headLeft);
      const headRight=el("div",{style:{display:"flex",alignItems:"center",gap:"14px"}});
      if(activeCount) headRight.appendChild(el("button",{class:"btn--link",click(){ws.topicFilter="";renderContent();}},"Nullstill"));
      headRight.appendChild(el("button",{style:{background:"none",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:"6px",fontSize:"13px",color:"var(--ink-2)",fontWeight:"500"},
        click(){ ws.filtersOpen=!isOpen; trackEvent("filters.toggled",{tab:"setningsbygging",state:isOpen?"collapsed":"expanded"}); renderContent(); }
      },(isOpen?"Skjul filtre":"Vis filtre")+" ",el("span",{style:{fontSize:"10px"}},"▼")));
      head.appendChild(headRight);
      panel.appendChild(head);

      const body=el("div",{class:"filter-panel__body"});

      opts.appendChild(buildFacetPill("Alle tekster",ws.topicFilter==="",()=>{ws.topicFilter="";renderContent();}));
      VALID_TOPIC_LIST.filter(t=>t!=="generelt").forEach(t=>

      facet.appendChild(opts);

    }

    card.appendChild(el("button",{class:"btn btn--primary",style:{marginTop:"var(--s-2)"},
      click(){startWordSort();}},"Start spillet"));
    frag.appendChild(card);
    return frag;
  }

  if(ws.idx >= ws.sentences.length){
    // Done screen
    const total = ws.sentences.length;
    const pct = total ? Math.round(ws.score/total*100) : 0;
    // ⚠️ This sits in a render path: renderContent() runs on every tab switch,
    // so an unguarded emit counts *views of the done screen*, not games played.
    // Flashcards already guards its own session event with fc.tracked; this one
    // never did, and 019 is what made the inflation visible.
    if(!ws.tracked){
      ws.tracked = true;
      trackEvent("wordsort_session",{correct:ws.score,total,pct,topicFilter:ws.topicFilter||null,
        sentences:ws.sentences.map(s=>({original:s.original,correct:s.correct,given:s.answer.join(" ")}))});
    }
    const msg = pct>=80?"Utmerket!":pct>=60?"Bra jobbet!":"Øv mer – du klarer det!";
    // Reuses Flashcards' .fc-done component — the same "session finished, here's
    // the score" screen, not a new one invented for this tab.
    const done = el("div",{class:"fc-done"});
    done.appendChild(el("div",{class:"fc-done-score"},`${ws.score} / ${total} riktig`));
    done.appendChild(el("div",{class:"fc-done-pct"},`${pct}% — ${msg}`));
    const nav = el("div",{class:"fc-nav"});
    nav.appendChild(el("button",{class:"btn btn--primary",click:startWordSort},"Spill igjen"));
    nav.appendChild(el("button",{class:"btn",
      click(){ws.started=false;renderContent();}},"Endre innstillinger"));
    done.appendChild(nav);
    frag.appendChild(done);
    return frag;
  }

  // Progress bar — same shape as Flashcards' buildFcHeader (a .card meta row
  // plus a thin token-colored track), not a new component invented for this tab.
  const bar=el("div",{class:"card",style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"var(--s-2)",flexWrap:"wrap",gap:"var(--s-2)"}});
  bar.appendChild(el("span",{class:"card__note"},`Setning ${ws.idx+1} av ${ws.sentences.length}`));
  bar.appendChild(el("span",{style:{fontSize:"var(--t-base)",fontWeight:"700",color:"var(--status-learned)"}},`Score: ${ws.score} ✓`));
  frag.appendChild(bar);
  const prog=el("div",{style:{height:"5px",background:"var(--line)",borderRadius:"var(--r-pill)",marginBottom:"var(--s-4)",overflow:"hidden"}});
  prog.appendChild(el("div",{style:{height:"100%",background:"var(--green)",borderRadius:"var(--r-pill)",transition:"width .35s",width:(ws.idx/ws.sentences.length*100)+"%"}}));
  frag.appendChild(prog);

  // Game card
  const card = el("div",{class:"card"});
  card.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-3)"}},"Klikk på ordene for å sette dem i riktig rekkefølge. Klikk på et ord i svaret for å flytte det tilbake."));
  card.appendChild(buildWsRound(ws.sentences[ws.idx]));
  frag.appendChild(card);

  return frag;
}
