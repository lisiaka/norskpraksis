                // `source_text_kind: "custom"` — without it the origin is written into
                // the built-in id space and never resolves back.
                setLesingText({id:`asgn-${item.item_id}`,title:item.content.title||"Tekst",topic:item.content.topic||"",text:item.content.body||"",isCustom:true});
                setTab("lesing");
              }
            }
          },"📖 Les teksten →");
          btnRow.appendChild(openBtn);

        } else {
          const promptDiv = el("div",{style:{
            background:"#f9f9f9",border:"1.5px solid #eee",borderRadius:"8px",
            padding:"10px 14px",fontSize:"13px",color:"#333",lineHeight:"1.6",marginBottom:"8px",
          }});
          promptDiv.textContent = item.content.prompt_text || "";
          itemWrap.appendChild(promptDiv);
          const writeBtn = el("button",{class:"btn-primary",style:{fontSize:"13px",padding:"7px 16px"},
            click: ()=>{
              const raw=item.content.topic||"";
              // TOPICS uses ASCII keys (miljo, sprak); convert canonical strings if needed
              const topicKey=TOPICS[raw]?raw:raw.replace(/ø/g,"o").replace(/å/g,"a").replace(/æ/g,"ae");
              state.currentTopic=TOPICS[topicKey]?topicKey:Object.keys(TOPICS)[0];
              state.currentPrompt={title:item.content.prompt_title||"Skriveoppgave",text:item.content.prompt_text||""};
              state.essay="";
              setTab("skriv");
            }
          },"✍️ Skriv stilen →");
          btnRow.appendChild(writeBtn);
        }

        // Mark done button (for reading + essay items)
        if(!item.done && item.item_type!=="word_list"){
          const doneBtn = el("button",{
            class:"btn-secondary",
            style:{fontSize:"13px",padding:"7px 14px"},
            click: async ()=>{
              doneBtn.disabled=true; doneBtn.textContent="Lagrer…";
              const r2 = await api(`/api/assignments/items/${encodeURIComponent(item.item_id)}/done`,{
                method:"PATCH",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({done:true})
              }).catch(()=>null);
              if(r2?.ok){ trackEvent("mineoppgaver.item_completed",{kind:item.item_type}); load(); }
              else { doneBtn.disabled=false; doneBtn.textContent="✓ Marker som gjort"; toast("Kunne ikke lagre"); }
            }
          },"✓ Marker som gjort");
          btnRow.appendChild(doneBtn);
        }

        itemWrap.appendChild(btnRow);

        card.appendChild(itemWrap);
      });
      wrap.appendChild(card);
    });
  }
  load();
  return frag;
}

// ── GI OPPGAVER panel (teacher roster) ────────────────────────────────────

// The roster and the class list are needed by four surfaces — the roster view, both
// banks, and the Ordbank share bar — and three of those are reachable without ever
// passing through the roster. One loader, so a new surface cannot fetch half of it
// and silently lose the class quick-select.
async function ensureTeacherRoster(){
  if(teacherState.students===null){
    const r = await api("/api/teacher/students").catch(()=>null);
    teacherState.students = r?.ok ? await r.json() : [];
  }
  if(teacherState.classes===null){
    const rc = await api("/api/teacher/classes").catch(()=>null);
    teacherState.classes = rc?.ok ? await rc.json() : [];
  }
}

// Feature 018. Once classes existed, the assign surfaces still offered only "alle
// elever" or one student at a time, so a teacher with two classes could not give work
// to just one of them. This ticks the members of a class.
//
// It selects checkboxes rather than sending a class id, so the request stays the same
// explicit student_ids list as before — no backend change. That also keeps the
// semantics identical to "alle elever": membership is resolved now, at assignment
// time, so a student who joins the class afterwards does not retroactively receive it.
//
// Returns null when the teacher has no classes with members on this roster, in which
// case the caller renders nothing — a teacher without classes needs no explanation,
// the Klasser panel is on the same screen.
function buildClassQuickSelect(students, onPick){
  const withMembers = (teacherState.classes||[])
    .map(c=>({c, ids:(students||[]).filter(s=>s.class_id===c.id).map(s=>s.id)}))
    .filter(x=>x.ids.length);
  if(!withMembers.length) return null;

  const row = el("div",{style:{display:"flex",alignItems:"center",gap:"6px",
    flexWrap:"wrap",marginBottom:"8px"}});
  row.appendChild(el("span",{style:{fontSize:"12px",color:"#888"}},"Hele klassen:"));
  withMembers.forEach(({c,ids})=>{
    row.appendChild(el("button",{type:"button",
      style:{fontSize:"12px",padding:"3px 10px",borderRadius:"12px",
        border:"1px solid #ccc",background:"#fff",cursor:"pointer"},
      click:(e)=>{ e.preventDefault(); e.stopPropagation();
        // The one teacher feature with no server call site: "Hele klassen"
        // ticks checkboxes and sends nothing, by design — membership resolves
        // when the assignment is created, from the same explicit student_ids
        // list. So the browser is the only place it can be observed.
        trackEvent("laerer.whole_class_selected",{studentCount:ids.length});
        onPick(ids); }},
      `${c.name} (${ids.length})`));
  });
  return row;
}

function buildGiOppgaver(students){
  const wrap = el("div",{class:"card",style:{marginTop:"24px"}});
  wrap.appendChild(el("h3",{style:{margin:"0 0 16px"}},"📤 Gi oppgaver"));

  // Mode selector. There used to be a third mode, "📚 Ordliste", which rebuilt a second
  // word list here — its own topic dropdown, its own checkboxes, and a "Legg til valgte
  // ord →" bridge into manual text rows. Sending words now happens in the teacher's own
  // Ordbank, using the same filter-and-tick bar students share with, so that mode was
  // deleted rather than maintained twice. The consequence, accepted knowingly: a teacher
  // can only send words they have banked themselves. See specs/BACKLOG.md.
  let mode = "lese-skriv";
  const modeWrap = el("div",{style:{display:"flex",gap:"0",marginBottom:"20px",borderRadius:"10px",overflow:"hidden",border:"1.5px solid #dde"}});
  const modeContent = el("div",{});

  function modeBtn(key, label){
    return el("button",{
      "data-mode":key,
      style:{
        flex:"1",border:"none",padding:"8px 4px",fontSize:"13px",cursor:"pointer",
        background: key===mode ? "#1a6b4a" : "#f8f8f8",
        color: key===mode ? "#fff" : "#444",
        fontWeight: key===mode ? "700" : "400",
        transition:"background 0.15s",
      },
      click:()=>{ mode=key; updateModeBtns(); renderMode(); }
    }, label);
  }

  function updateModeBtns(){
    modeWrap.querySelectorAll("[data-mode]").forEach(b=>{
      const active = b.dataset.mode===mode;
      b.style.background = active?"#1a6b4a":"#f8f8f8";
      b.style.color = active?"#fff":"#444";
      b.style.fontWeight = active?"700":"400";
    });
  }

  modeWrap.appendChild(modeBtn("lese-skriv","📖 Lese- og skriveoppgave"));
  modeWrap.appendChild(modeBtn("full","📋 Full plan"));
  wrap.appendChild(modeWrap);

  // Student multi-select
  const studentSec = el("div",{style:{marginBottom:"16px"}});
  studentSec.appendChild(el("div",{style:{fontWeight:"600",fontSize:"13px",marginBottom:"8px"}},"Velg elever:"));
  let selectedIds = new Set();
  const studentCbs = [];

  const allRow = el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"6px"}});
  const allCb = el("input",{type:"checkbox",id:"gi-all"});
  allCb.addEventListener("change",()=>{
    if(allCb.checked) students.forEach(s=>selectedIds.add(s.id));
    else selectedIds.clear();
    studentCbs.forEach(({cb})=>{ cb.checked=allCb.checked; });
    updateAssignBtns();
  });
  allRow.appendChild(allCb);
  allRow.appendChild(el("label",{for:"gi-all",style:{fontWeight:"600",fontSize:"13px",cursor:"pointer"}},"Alle elever"));
  studentSec.appendChild(allRow);

  const giClassRow = buildClassQuickSelect(students,(ids)=>{
    selectedIds = new Set(ids);
    studentCbs.forEach(({cb,sid})=>{ cb.checked = selectedIds.has(sid); });
    allCb.checked = students.length>0 && students.every(st=>selectedIds.has(st.id));
    updateAssignBtns();
  });
  if(giClassRow) studentSec.appendChild(giClassRow);

  students.forEach(s=>{
    const id = "gi-s-"+s.id.replace(/[^a-z0-9]/gi,"-");
    const cb = el("input",{type:"checkbox",id});
    studentCbs.push({cb, sid:s.id});
    cb.addEventListener("change",()=>{
      if(cb.checked) selectedIds.add(s.id); else selectedIds.delete(s.id);
      allCb.checked = students.every(st=>selectedIds.has(st.id));

    txtSrcWrap.appendChild(makeSrcBtn("custom","Skriv ny tekst"));
    txtSec.appendChild(txtSrcWrap);

    function renderTxtSourceBtns(){
      txtSrcWrap.querySelectorAll("[data-txtsrc]").forEach(b=>{
        const active=b.dataset.txtsrc===txtSource;
        b.style.background=active?"#1a6b4a":"#f0f0f0";
        b.style.color=active?"#fff":"#333";
      });
    }

    const txtPickerWrap = el("div",{});
    txtSec.appendChild(txtPickerWrap);

    // Selected texts: array of {item_type, content}
    const selectedTexts = [];
    const selectedTextsDisplay = el("div",{style:{marginTop:"8px"}});
    txtSec.appendChild(selectedTextsDisplay);

    function updateSelectedTextsDisplay(){
      selectedTextsDisplay.innerHTML="";
      if(!selectedTexts.length) return;
      selectedTexts.forEach((t,i)=>{
        const row=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",background:"#e8f5ee",borderRadius:"6px",padding:"4px 8px",marginBottom:"4px",fontSize:"12px"}});
        row.appendChild(el("span",{style:{flex:"1"}},$esc(t.content.title||"Tekst "+(i+1))));
        row.appendChild(el("button",{style:{background:"none",border:"none",cursor:"pointer",color:"#c0392b",fontSize:"14px",padding:"0 2px"},
          click:()=>{ selectedTexts.splice(i,1); updateSelectedTextsDisplay(); }
        },"×"));
        selectedTextsDisplay.appendChild(row);
      });
    }

    let allLesingTexts = null;
    let teacherBankTextsCache = null;

    async function renderTxtPicker(){
      txtPickerWrap.innerHTML="";

      if(txtSource==="bank"){
        // Topic filter + text list from app text bank
        if(!allLesingTexts) allLesingTexts = await loadLesingTexts().catch(()=>null);
        const texts = allLesingTexts || [];
        const topicFilter = el("select",{style:{width:"100%",marginBottom:"8px",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px"}});
        topicFilter.appendChild(el("option",{value:""},"Alle temaer"));
        const topicsInBank = [...new Set(texts.map(t=>t.topic||"").filter(Boolean))].sort();
        topicsInBank.forEach(t=>topicFilter.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
        txtPickerWrap.appendChild(topicFilter);

        const listWrap = el("div",{style:{maxHeight:"200px",overflowY:"auto",border:"1px solid #eee",borderRadius:"6px"}});
        txtPickerWrap.appendChild(listWrap);

        function renderTextList(){
          listWrap.innerHTML="";
          const topic = topicFilter.value;
          const filtered = topic ? texts.filter(t=>(t.topic||"")=== topic) : texts;
          if(!filtered.length){
            listWrap.appendChild(el("div",{style:{padding:"10px",color:"#888",fontSize:"13px"}},"Ingen tekster for dette temaet."));
            return;
          }
          filtered.forEach(t=>{
            const alreadyAdded = selectedTexts.some(st=>st.content.text_id===t.id);
            const row=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"7px 10px",borderBottom:"1px solid #f0f0f0",cursor:"pointer",background:alreadyAdded?"#e8f5ee":"#fff"},
              click:()=>{
                if(alreadyAdded){ selectedTexts.splice(selectedTexts.findIndex(st=>st.content.text_id===t.id),1); }
                else { selectedTexts.push({item_type:"reading_text",content:{source:"bank",text_id:t.id,title:t.title||"",topic:t.topic||"",body:t.body||t.content||t.text||""}}); }
                updateSelectedTextsDisplay(); renderTextList();
              }
            });
            row.appendChild(el("span",{style:{fontSize:"18px"}},$esc(alreadyAdded?"✓":"")));
            const info=el("div",{style:{flex:"1"}});
            info.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"600"}},$esc(t.title||t.id)));
            if(t.topic) info.appendChild(el("div",{style:{fontSize:"11px",color:"#888"}},$esc(t.topic)));
            row.appendChild(info);
            listWrap.appendChild(row);
          });
        }
        topicFilter.addEventListener("change",renderTextList);
        renderTextList();

      } else if(txtSource==="mine"){
        // Teacher's own bank texts
        if(!teacherBankTextsCache){
          const r=await api("/api/teacher/bank/texts").catch(()=>null);
          teacherBankTextsCache = r?.ok ? await r.json() : [];
        }
        const myTexts = teacherBankTextsCache;
        if(!myTexts.length){
          const msg=el("div",{style:{fontSize:"13px",color:"#888",padding:"8px 0"}});
          msg.innerHTML='Ingen egne tekster ennå. <a href="#" style="color:#1a6b4a">Gå til tekstbank</a> for å lagre tekster.';
          msg.querySelector("a").addEventListener("click",(e)=>{e.preventDefault();teacherState.view="bank-texts";renderContent();});
          txtPickerWrap.appendChild(msg);
          return;
        }
        const topicFilter=el("select",{style:{width:"100%",marginBottom:"8px",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px"}});
        topicFilter.appendChild(el("option",{value:""},"Alle temaer"));
        const topics=[...new Set(myTexts.map(t=>t.topic||"").filter(Boolean))].sort();
        topics.forEach(t=>topicFilter.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
        txtPickerWrap.appendChild(topicFilter);

        const listWrap=el("div",{style:{maxHeight:"180px",overflowY:"auto",border:"1px solid #eee",borderRadius:"6px"}});
        txtPickerWrap.appendChild(listWrap);

        function renderMineList(){
          listWrap.innerHTML="";
          const topic=topicFilter.value;
          const filtered=topic?myTexts.filter(t=>(t.topic||"")===topic):myTexts;
          filtered.forEach(t=>{
            const alreadyAdded=selectedTexts.some(st=>st.content.bank_text_id===t.id);
            const row=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"7px 10px",borderBottom:"1px solid #f0f0f0",cursor:"pointer",background:alreadyAdded?"#e8f5ee":"#fff"},
              click:()=>{
                if(alreadyAdded){ selectedTexts.splice(selectedTexts.findIndex(st=>st.content.bank_text_id===t.id),1); }
                else { selectedTexts.push({item_type:"reading_text",content:{source:"teacher_bank",bank_text_id:t.id,title:t.title,topic:t.topic||"",body:t.body}}); }
                updateSelectedTextsDisplay(); renderMineList();
              }
            });
            row.appendChild(el("span",{style:{fontSize:"18px"}},$esc(alreadyAdded?"✓":"")));
            const info=el("div",{style:{flex:"1"}});
            info.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"600"}},$esc(t.title)));
            if(t.topic) info.appendChild(el("div",{style:{fontSize:"11px",color:"#888"}},$esc(t.topic)));
            row.appendChild(info);
            listWrap.appendChild(row);
          });
          if(!filtered.length) listWrap.appendChild(el("div",{style:{padding:"10px",color:"#888",fontSize:"13px"}},"Ingen tekster for dette temaet."));
        }
        topicFilter.addEventListener("change",renderMineList);
        renderMineList();

      } else {
        // Custom text entry with option to save to bank
        const titleIn=el("input",{type:"text",placeholder:"Tittel (påkrevd)",style:{width:"100%",padding:"5px 8px",marginBottom:"6px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px",boxSizing:"border-box"}});
        const topicSel=el("select",{style:{width:"100%",marginBottom:"6px",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px"}});
        topicSel.appendChild(el("option",{value:""},"Velg tema (valgfritt)"));
        VALID_TOPIC_LIST.forEach(t=>topicSel.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
        const bodyIn=el("textarea",{placeholder:"Teksten…",style:{width:"100%",minHeight:"80px",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"12px",boxSizing:"border-box",resize:"vertical",marginBottom:"2px"}});
        const bodyCount=attachWordCounter(bodyIn, CUSTOM_TEXT_MAX_WORDS);
        const saveBankRow=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"6px"}});
        const saveBankCb=el("input",{type:"checkbox",id:"txt-save-bank"}); saveBankCb.checked=true;
        saveBankRow.appendChild(saveBankCb);
        saveBankRow.appendChild(el("label",{for:"txt-save-bank",style:{fontSize:"12px",cursor:"pointer"}},"Lagre i min tekstbank for gjenbruk"));
        const addTxtBtn=el("button",{style:{fontSize:"12px",padding:"5px 12px",background:"#1a6b4a",color:"#fff",border:"none",borderRadius:"6px",cursor:"pointer"},
          click: async ()=>{
            const title=(titleIn.value||"").trim();
            const body=(bodyIn.value||"").trim();
            if(!title||!body){ toast("Fyll inn tittel og tekst"); return; }
            if(bodyCount.isOver()){ toast(`Teksten er for lang (${countWords(body)} ord). Maks ${CUSTOM_TEXT_MAX_WORDS} ord.`); return; }
            const item={item_type:"reading_text",content:{source:"custom",title,topic:topicSel.value,body}};
            // Optionally save to bank
            if(saveBankCb.checked){
              const r=await api("/api/teacher/bank/texts",{method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({title,topic:topicSel.value,body})}).catch(()=>null);
              if(r?.ok){ teacherBankTextsCache=null; teacherState.bankTexts=null; }
            }
            selectedTexts.push(item);
            updateSelectedTextsDisplay();
            titleIn.value=""; topicSel.value=""; bodyIn.value="";
            toast("Tekst lagt til i oppgaven");
          }
        },"Legg til tekst →");
        txtPickerWrap.appendChild(titleIn);
        txtPickerWrap.appendChild(topicSel);
        txtPickerWrap.appendChild(bodyIn);
        txtPickerWrap.appendChild(bodyCount);
        txtPickerWrap.appendChild(saveBankRow);
        txtPickerWrap.appendChild(addTxtBtn);
      }
    }

    items._getTexts = () => [...selectedTexts];
    renderTxtPicker();
    modeContent.appendChild(txtSec);

    // ── Essay section (bank + teacher bank + custom with save) ────────────
    const essaySec = el("div",{style:{marginBottom:"14px",padding:"12px",background:"#f9fafb",borderRadius:"8px",border:"1px solid #eee"}});
    essaySec.appendChild(el("div",{style:{fontWeight:"600",fontSize:"13px",marginBottom:"8px"}},"✍️ Skriveoppgave (valgfritt):"));

    let essaySource = "bank"; // "bank" | "mine" | "custom"
    const essaySrcWrap = el("div",{style:{display:"flex",gap:"6px",marginBottom:"8px",flexWrap:"wrap"}});
    function makeEssaySrcBtn(key, label){
      return el("button",{"data-essaysrc":key,style:{fontSize:"11px",padding:"3px 10px",border:"1px solid #ccc",borderRadius:"6px",cursor:"pointer",
        background:key===essaySource?"#1a6b4a":"#f0f0f0",color:key===essaySource?"#fff":"#333"},
        click:()=>{ essaySource=key; renderEssaySrcBtns(); renderEssayPicker(); }
      },label);
    }
    essaySrcWrap.appendChild(makeEssaySrcBtn("bank","Fra oppgavebank"));
    essaySrcWrap.appendChild(makeEssaySrcBtn("mine","Egne oppgaver"));
    essaySrcWrap.appendChild(makeEssaySrcBtn("custom","Skriv ny oppgave"));
    essaySec.appendChild(essaySrcWrap);

    function renderEssaySrcBtns(){
      essaySrcWrap.querySelectorAll("[data-essaysrc]").forEach(b=>{
        const active=b.dataset.essaysrc===essaySource;
        b.style.background=active?"#1a6b4a":"#f0f0f0";
        b.style.color=active?"#fff":"#333";
      });
    }

    const essayPickerWrap = el("div",{});
    essaySec.appendChild(essayPickerWrap);

    let selectedEssay = null; // single essay item
    const essaySelectedDisplay = el("div",{style:{marginTop:"8px"}});
    essaySec.appendChild(essaySelectedDisplay);

    function updateEssayDisplay(){
      essaySelectedDisplay.innerHTML="";
      if(!selectedEssay) return;
      const row=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",background:"#e8f5ee",borderRadius:"6px",padding:"4px 8px",fontSize:"12px"}});
      row.appendChild(el("span",{style:{flex:"1"}},$esc(selectedEssay.content.prompt_title||selectedEssay.content.prompt_text.substring(0,60)+"…")));
      row.appendChild(el("button",{style:{background:"none",border:"none",cursor:"pointer",color:"#c0392b",fontSize:"14px"},
        click:()=>{ selectedEssay=null; updateEssayDisplay(); }
      },"×"));
      essaySelectedDisplay.appendChild(row);
    }

    let teacherBankPromptsCache = null;

    function renderEssayPicker(){
      essayPickerWrap.innerHTML="";

      if(essaySource==="bank"){
        const topicSel=el("select",{style:{width:"100%",marginBottom:"6px",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px"}});
        topicSel.appendChild(el("option",{value:""},"Velg tema…"));
        Object.entries(TOPICS).forEach(([key,meta])=>topicSel.appendChild(el("option",{value:key},$esc(meta.name))));
        const promptSel=el("select",{style:{width:"100%",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px"}});
        promptSel.appendChild(el("option",{value:""},"Velg oppgave…"));
        topicSel.addEventListener("change",()=>{
          promptSel.innerHTML="";
          promptSel.appendChild(el("option",{value:""},"Velg oppgave…"));
          const t=topicSel.value;
          if(t&&PROMPTS[t]) PROMPTS[t].forEach((p,i)=>promptSel.appendChild(el("option",{value:String(i)},p.title||p.text.substring(0,60)+"…")));
        });
        promptSel.addEventListener("change",()=>{
          const topicKey=topicSel.value;
          const idx=parseInt(promptSel.value);
          if(!topicKey||isNaN(idx)||!PROMPTS[topicKey]?.[idx]) return;
          const p=PROMPTS[topicKey][idx];
          selectedEssay={item_type:"essay_prompt",content:{source:"bank",topic:topicKey,prompt_text:p.text,prompt_title:p.title}};
          updateEssayDisplay();
        });
        essayPickerWrap.appendChild(topicSel);
        essayPickerWrap.appendChild(promptSel);

      } else if(essaySource==="mine"){
        // Load teacher bank prompts
        const loadAndRender = async () => {
          if(!teacherBankPromptsCache){
            const r=await api("/api/teacher/bank/prompts").catch(()=>null);
            teacherBankPromptsCache=r?.ok?await r.json():[];
          }
          essayPickerWrap.innerHTML="";
          if(!teacherBankPromptsCache.length){
            const msg=el("div",{style:{fontSize:"13px",color:"#888",padding:"8px 0"}});
            msg.innerHTML='Ingen egne oppgaver ennå. <a href="#" style="color:#1a6b4a">Gå til oppgavebank</a> for å lagre oppgaver.';
            msg.querySelector("a").addEventListener("click",(e)=>{e.preventDefault();teacherState.view="bank-prompts";renderContent();});
            essayPickerWrap.appendChild(msg);
            return;
          }
          const topicFilter=el("select",{style:{width:"100%",marginBottom:"6px",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px"}});
          topicFilter.appendChild(el("option",{value:""},"Alle temaer"));
          const topics=[...new Set(teacherBankPromptsCache.map(p=>p.topic||"").filter(Boolean))].sort();
          topics.forEach(t=>topicFilter.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
          essayPickerWrap.appendChild(topicFilter);

          const listWrap=el("div",{style:{maxHeight:"160px",overflowY:"auto",border:"1px solid #eee",borderRadius:"6px"}});
          essayPickerWrap.appendChild(listWrap);

          function renderMyPrompts(){
            listWrap.innerHTML="";
            const topic=topicFilter.value;
            const filtered=topic?teacherBankPromptsCache.filter(p=>(p.topic||"")===topic):teacherBankPromptsCache;
            filtered.forEach(p=>{
              const active=selectedEssay?.content?.bank_prompt_id===p.id;
              const row=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"7px 10px",borderBottom:"1px solid #f0f0f0",cursor:"pointer",background:active?"#e8f5ee":"#fff"},
                click:()=>{
                  selectedEssay={item_type:"essay_prompt",content:{source:"teacher_bank",bank_prompt_id:p.id,topic:p.topic||"",prompt_text:p.prompt_text,prompt_title:p.title}};
                  updateEssayDisplay(); renderMyPrompts();
                }
              });
              row.appendChild(el("span",{style:{fontSize:"16px"}},$esc(active?"✓":"")));
              const info=el("div",{style:{flex:"1"}});
              info.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"600"}},$esc(p.title)));
              row.appendChild(info);
              listWrap.appendChild(row);
            });
            if(!filtered.length) listWrap.appendChild(el("div",{style:{padding:"10px",color:"#888",fontSize:"13px"}},"Ingen oppgaver for dette temaet."));
          }
          topicFilter.addEventListener("change",renderMyPrompts);
          renderMyPrompts();
        };
        loadAndRender();

      } else {
        // Custom prompt
        const titleIn=el("input",{type:"text",placeholder:"Tittel / navn på oppgaven",style:{width:"100%",padding:"5px 8px",marginBottom:"6px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px",boxSizing:"border-box"}});
        const topicSel=el("select",{style:{width:"100%",marginBottom:"6px",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"13px"}});
        topicSel.appendChild(el("option",{value:""},"Velg tema (valgfritt)"));
        VALID_TOPIC_LIST.forEach(t=>topicSel.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
        const promptIn=el("textarea",{placeholder:"Skriv inn oppgaveteksten her…",style:{width:"100%",minHeight:"80px",padding:"5px 8px",borderRadius:"6px",border:"1.5px solid #dde",fontSize:"12px",boxSizing:"border-box",resize:"vertical",marginBottom:"6px"}});
        const saveBankRow=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"6px"}});
        const saveBankCb=el("input",{type:"checkbox",id:"essay-save-bank"}); saveBankCb.checked=true;
        saveBankRow.appendChild(saveBankCb);
        saveBankRow.appendChild(el("label",{for:"essay-save-bank",style:{fontSize:"12px",cursor:"pointer"}},"Lagre i min oppgavebank for gjenbruk"));
        const addEssayBtn=el("button",{style:{fontSize:"12px",padding:"5px 12px",background:"#1a6b4a",color:"#fff",border:"none",borderRadius:"6px",cursor:"pointer"},
          click: async ()=>{
            const title=(titleIn.value||"").trim();
            const prompt_text=(promptIn.value||"").trim();
            if(!title||!prompt_text){ toast("Fyll inn tittel og oppgavetekst"); return; }
            if(saveBankCb.checked){
              const r=await api("/api/teacher/bank/prompts",{method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify({title,topic:topicSel.value,prompt_text})}).catch(()=>null);
              if(r?.ok){ teacherBankPromptsCache=null; teacherState.bankPrompts=null; }
            }
            selectedEssay={item_type:"essay_prompt",content:{source:"custom",topic:topicSel.value,prompt_text,prompt_title:title}};
            updateEssayDisplay();
            titleIn.value=""; topicSel.value=""; promptIn.value="";
            toast("Oppgave lagt til");
          }
        },"Bruk denne oppgaven →");
        essayPickerWrap.appendChild(titleIn);
        essayPickerWrap.appendChild(topicSel);
        essayPickerWrap.appendChild(promptIn);
        essayPickerWrap.appendChild(saveBankRow);
        essayPickerWrap.appendChild(addEssayBtn);
      }
    }

    items._getEssay = () => selectedEssay;
    renderEssayPicker();
    modeContent.appendChild(essaySec);

    const errDiv2 = el("div",{style:{color:"#c0392b",fontSize:"13px",marginBottom:"8px",display:"none"}});
    modeContent.appendChild(errDiv2);

    const assignBtn2 = el("button",{class:"btn-cta",disabled:selectedIds.size===0,
      click: async ()=>{
        const itemsArr = [];
        if(includeWords && items._getWordList) { const w=items._getWordList(); if(w) itemsArr.push(w); }
        const texts=items._getTexts(); texts.forEach(t=>itemsArr.push(t));
        const e=items._getEssay(); if(e) itemsArr.push(e);

        if(!itemsArr.length){errDiv2.textContent="Legg til minst én oppgavetype";errDiv2.style.display="";return;}

        errDiv2.style.display="none";
        assignBtn2.disabled=true; assignBtn2.textContent="Sender…";

        const body={student_ids:[...selectedIds],all_students:false,items:itemsArr};
        const r=await api("/api/teacher/assignments",{
          method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
        }).catch(()=>null);

        if(r?.ok){
          const d=await r.json();
          toast(`Oppgave sendt til ${d.student_count} elev${d.student_count===1?"":"er"}`);
          renderMode();
        } else if(r?.status===409){
          const d=await r.json().catch(()=>({detail:"Duplikat"}));
          errDiv2.textContent=d.detail||"Denne oppgaven er allerede tildelt disse elevene";
          errDiv2.style.display="";
          assignBtn2.disabled=selectedIds.size===0; assignBtn2.textContent="Gi oppgave";
        } else {
          const d=await r?.json().catch(()=>({detail:"Ukjent feil"}));
          errDiv2.textContent=d?.detail||"Noe gikk galt"; errDiv2.style.display="";
          assignBtn2.disabled=selectedIds.size===0; assignBtn2.textContent="Gi oppgave";
        }
      }
    },"Gi oppgave");
    assignBtns.push(assignBtn2);
    modeContent.appendChild(assignBtn2);
  }

  function renderMode(){
    if(mode==="lese-skriv") renderLeseSkrivMode();
    else renderFullPlanMode();
  }
  renderMode();
  return wrap;
}

// ── TEACHER: Student assignments progress view ─────────────────────────────

function buildLaererAssignments(){
  const frag = document.createDocumentFragment();
  const s = teacherState.selectedStudent;
  frag.appendChild(el("button",{class:"btn-secondary",style:{marginBottom:"16px"},
    click:()=>laererSetView("progress")},"← Tilbake"));
  frag.appendChild(el("h2",{style:{marginBottom:"16px"}},`Oppgaver: ${$esc(s?.name||"")}`));
  const wrap = el("div",{});
  frag.appendChild(wrap);

  async function load(){
    if(!teacherState.studentAssignments){
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/assignments`).catch(()=>null);
      if(r?.ok) teacherState.studentAssignments=await r.json();
      else teacherState.studentAssignments=[];
    }
    wrap.innerHTML="";
    const asgns = teacherState.studentAssignments;
    if(!asgns.length){
      wrap.appendChild(el("p",{style:{color:"#888"}},"Ingen oppgaver tildelt ennå."));
      return;
    }
    asgns.forEach(asgn=>{
      const card = el("div",{class:"card",style:{marginBottom:"16px"}});
      const hdr = el("div",{style:{display:"flex",alignItems:"baseline",gap:"10px",marginBottom:"10px",flexWrap:"wrap"}});
      hdr.appendChild(el("span",{style:{fontWeight:"700",fontSize:"15px"}},$esc(asgn.label||"Oppgave")));
      hdr.appendChild(el("span",{style:{fontSize:"12px",color:"#888"}},new Date(asgn.assigned_at).toLocaleDateString("nb-NO")));
      const done = asgn.items.filter(i=>i.done).length;
      const total = asgn.items.length;
      const pct = total ? Math.round(done/total*100) : 0;
      const badge = el("span",{style:{
        marginLeft:"auto",background:pct===100?"#d4edda":"#fff3cd",
        color:pct===100?"#155724":"#856404",
        borderRadius:"20px",padding:"2px 10px",fontSize:"12px",fontWeight:"700"
      }},`${done}/${total} gjort`);
      hdr.appendChild(badge);
      card.appendChild(hdr);
      asgn.items.forEach(item=>{
        const row = el("div",{style:{
          display:"flex",alignItems:"center",gap:"10px",borderTop:"1px solid #eee",
          paddingTop:"8px",marginTop:"4px",opacity:item.done?"0.5":"1"
        }});
        const typeLabel = item.item_type==="word_list"?"📚 Ordliste"
          :item.item_type==="reading_text"?"📖 Lesetekst":"✍️ Skriveoppgave";
        row.appendChild(el("span",{style:{fontSize:"13px",color:"#1a6b4a",fontWeight:"600",minWidth:"100px"}},typeLabel));
        const title = item.content.title||item.content.prompt_title
          ||(item.content.words?`${(item.content.words||[]).length} ord`:"");
        row.appendChild(el("span",{style:{fontSize:"13px",flex:"1",color:"#333"}},$esc(title)));
        row.appendChild(el("span",{style:{
          fontSize:"12px",fontWeight:"700",

// Custom reading texts feed the Gjenfortell AI prompt, the comprehension questions
// and Setningsbygging, all of which assume roughly the length of the built-in B2
// texts (~250 words). Long texts also inflate the AI response past its token budget.
const CUSTOM_TEXT_MAX_WORDS = 500;
function countWords(s){ return (String(s||"").trim().match(/\S+/g)||[]).length; }

// Live "x / 500 ord" counter bound to a textarea. Returns the counter element with
// an isOver() method so the save handler can gate on it.
function attachWordCounter(textarea, max){
  const out = el("div",{style:{fontSize:"12px",color:"#888",marginBottom:"8px",textAlign:"right"}});
  const update = ()=>{
    const n = countWords(textarea.value);
    const over = n > max;
    out.textContent = over ? `${n} / ${max} ord — for langt` : `${n} / ${max} ord`;
    out.style.color = over ? "#c0392b" : (n > max*0.9 ? "#a06010" : "#888");
    out.style.fontWeight = over ? "700" : "400";
  };
  textarea.addEventListener("input", update);
  update();
  out.isOver = ()=>countWords(textarea.value) > max;
  return out;
}

// Shared selectable card for Tekstbank and Oppgavebank. The whole card is the hit
// target — no checkbox, no expand chevron. The body is clamped to two lines and the
// "Vis mer" link only appears when the text actually overflows, so most items need
// no click at all to read.
function renderPickCard({item, title, meta, body, selectedItems, onChange, onDelete}){
  const card = el("div",{class:"pick-card"});
  const isPicked = ()=>selectedItems.some(i=>i._key===item._key);
  const sync = ()=>card.classList.toggle("picked", isPicked());

  card.appendChild(el("div",{class:"pick-check"},"✓"));
  card.appendChild(el("div",{class:"pick-title"},$esc(title)));
  if(meta) card.appendChild(el("div",{class:"pick-meta"},$esc(meta)));

  if(body){
    const preview = el("div",{class:"pick-preview"});
    preview.textContent = body;
    card.appendChild(preview);
    const more = el("span",{class:"pick-more",style:{display:"none"},
      click:e=>{
        e.stopPropagation();               // expanding must not toggle selection
        const open = preview.classList.toggle("open");
        more.textContent = open ? "Vis mindre" : "… Vis mer";
      }
    },"… Vis mer");
    card.appendChild(more);
    // Measure after layout — only offer the link when two lines genuinely clip it.
    requestAnimationFrame(()=>{
      if(preview.scrollHeight > preview.clientHeight + 2) more.style.display="";
    });
  }

  card.addEventListener("click",()=>{
    if(isPicked()){
      const i = selectedItems.findIndex(x=>x._key===item._key);
      if(i!==-1) selectedItems.splice(i,1);
    } else selectedItems.push(item);
    sync();
    onChange();
  });

  if(onDelete){
    card.appendChild(el("button",{class:"btn-danger",
      style:{fontSize:"12px",padding:"5px 12px",marginTop:"10px"},
      click:e=>{ e.stopPropagation(); onDelete(); }
    },"Slett"));
  }

  sync();
  return card;
}

    }

  return frag;

      Object.keys(PROMPTS).forEach(k=>topicFilter.appendChild(el("option",{value:k},$esc(PROMPT_TOPIC_LABELS[k]||k))));
      tabContent.appendChild(topicFilter);
      const listWrap=el("div",{});
      tabContent.appendChild(listWrap);
      function renderSystemList(){
        listWrap.innerHTML="";
        const topicKey=topicFilter.value;
        const keys=topicKey?[topicKey]:Object.keys(PROMPTS);
        keys.forEach(k=>{
          if(!PROMPTS[k]?.length) return;
          if(!topicKey){
            listWrap.appendChild(el("div",{style:{fontWeight:"700",fontSize:"12px",color:"#888",
              marginBottom:"4px",marginTop:"14px",textTransform:"uppercase",letterSpacing:"0.06em"}},
              $esc(PROMPT_TOPIC_LABELS[k]||k)));
          }
          PROMPTS[k].forEach(p=>listWrap.appendChild(renderPromptCard(p,k,false)));
        });
      }
      topicFilter.addEventListener("change",renderSystemList);
      renderSystemList();

    } else if(bankTab==="mine"){
      if(!teacherState.bankPrompts){
        const r=await api("/api/teacher/bank/prompts").catch(()=>null);
        teacherState.bankPrompts=r?.ok?await r.json():[];
      }
      if(!teacherState.bankPrompts.length){
        tabContent.appendChild(el("p",{style:{color:"#888"}},"Ingen egne oppgaver ennå. Bruk «+ Ny oppgave» for å legge til."));
        return;
      }
      const topicFilter=el("select",{style:{width:"100%",marginBottom:"12px",padding:"7px 10px",borderRadius:"7px",border:"1.5px solid #dde",fontSize:"14px",boxSizing:"border-box"}});
      topicFilter.appendChild(el("option",{value:""},"Alle temaer"));
      const topics=[...new Set(teacherState.bankPrompts.map(p=>p.topic||"").filter(Boolean))].sort();
      topics.forEach(t=>topicFilter.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
      tabContent.appendChild(topicFilter);
      const listWrap=el("div",{});
      tabContent.appendChild(listWrap);
      function renderMineList(){
        listWrap.innerHTML="";
        const topic=topicFilter.value;
        const filtered=topic?teacherState.bankPrompts.filter(p=>(p.topic||"")===topic):teacherState.bankPrompts;
        if(!filtered.length){listWrap.appendChild(el("p",{style:{color:"#888"}},"Ingen oppgaver for dette temaet."));return;}
        filtered.forEach(p=>listWrap.appendChild(renderPromptCard(p,null,true)));
      }
      topicFilter.addEventListener("change",renderMineList);
      renderMineList();

    } else {
      const addCard=el("div",{class:"card",style:{padding:"16px"}});
      const titleIn=el("input",{type:"text",placeholder:"Tittel / navn på oppgaven",style:{width:"100%",padding:"7px 10px",marginBottom:"8px",borderRadius:"7px",border:"1.5px solid #dde",fontSize:"14px",boxSizing:"border-box"}});
      const topicSel=el("select",{style:{width:"100%",padding:"7px 10px",marginBottom:"8px",borderRadius:"7px",border:"1.5px solid #dde",fontSize:"14px",boxSizing:"border-box"}});
      topicSel.appendChild(el("option",{value:""},"Velg tema (valgfritt)"));
      VALID_TOPIC_LIST.forEach(t=>topicSel.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
      const promptIn=el("textarea",{placeholder:"Oppgaveteksten…",style:{width:"100%",minHeight:"80px",padding:"7px 10px",marginBottom:"8px",borderRadius:"7px",border:"1.5px solid #dde",fontSize:"13px",boxSizing:"border-box",resize:"vertical"}});
      const addErr=el("div",{style:{color:"#c0392b",fontSize:"13px",marginBottom:"6px",display:"none"}});
      const addBtn=el("button",{class:"btn-cta",
        click:async ()=>{
          const title=(titleIn.value||"").trim();
          const prompt_text=(promptIn.value||"").trim();
          if(!title){addErr.textContent="Tittel er påkrevd";addErr.style.display="";return;}
          if(!prompt_text){addErr.textContent="Oppgavetekst er påkrevd";addErr.style.display="";return;}
          addErr.style.display="none";
          addBtn.disabled=true; addBtn.textContent="Lagrer…";
          const r=await api("/api/teacher/bank/prompts",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({title,topic:topicSel.value,prompt_text})}).catch(()=>null);
          if(r?.ok){
            teacherState.bankPrompts=null;
            titleIn.value=""; topicSel.value=""; promptIn.value="";
            addBtn.disabled=false; addBtn.textContent="Lagre oppgave";
            bankTab="mine"; renderBankTab();
          } else {
            const d=await r?.json().catch(()=>({detail:"Ukjent feil"}));
            addErr.textContent=d?.detail||"Kunne ikke lagre";addErr.style.display="";
            addBtn.disabled=false; addBtn.textContent="Lagre oppgave";
          }
        }
      },"Lagre oppgave");
      addCard.appendChild(titleIn); addCard.appendChild(topicSel); addCard.appendChild(promptIn);
      addCard.appendChild(addErr); addCard.appendChild(addBtn);
      tabContent.appendChild(addCard);
    }
  }

  renderAssignPanel();
  renderBankTab();
  return frag;
}

// ── ADMIN PAGE ────────────────────────────────────────────────────────────
(function initAdmin(){
  const hash = window.location.hash;
  if(!hash.startsWith("#admin/")) return;
  const secret = hash.slice(7);
  if(!secret) return;

  const screen = document.getElementById("admin-screen");
  screen.style.display = "block";
  screen.innerHTML = "<p style='color:#888'>Laster admin-oversikt…</p>";

  const get = path => fetch(`${API_BASE}${path}?secret=${encodeURIComponent(secret)}`)
    .then(r => {
      if(r.status === 403) throw new Error("Feil hemmelig nøkkel.");
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });

  // Adoption is fetched beside the user overview, not instead of it — they
  // answer different questions ("is this feature alive" vs "what has this
  // learner done") and neither substitutes for the other. It is allowed to
  // fail on its own: a backend without the endpoint should still render the
  // user table rather than a bare error page.
  Promise.all([
    get("/api/admin/overview"),
    get("/api/admin/adoption").catch(() => null),
    get("/api/admin/failures").catch(() => null),
    get("/api/admin/calls").catch(() => null),
    get("/api/admin/templates").catch(() => null),
  ])
    .then(([overview, adoption, failures, calls, templates]) => {
      renderAdminDashboard(screen, overview);
      if(adoption) renderAdoption(screen, adoption);
      if(failures) renderFailureLog(screen, failures);
      // Calls need the templates to show a prompt body: the calls endpoint
      // carries only the template's hash, because the alternative is repeating
      // the same long Norwegian prompt on every single row. Joining the two
      // here is the whole reason the registry is deduplicated.
      if(calls) renderAiCalls(screen, calls, templates);
      if(templates) renderPromptTemplates(screen, templates);
    })
    .catch(err => {
      screen.innerHTML = `<p style='color:#c0392b;font-weight:600'>Feil: ${err.message}</p>`;
    });
})();

// ── Feature adoption (019) ────────────────────────────────────────────────
// Renders one row per *declared* feature, including ones nobody has touched.
// That is the whole point: a table built from the events alone can only list
// features somebody used, and a missing row is indistinguishable from a
// feature that was never instrumented.
function renderAdoption(container, data){
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };
  const dt = iso => iso ? new Date(iso).toLocaleDateString("no") : "aldri";

  container.appendChild(h("h2",{style:"font-size:16px;margin:32px 0 6px"},"📊 Funksjonsbruk"));

  // The honesty line. Without it the first read looks like proof that half the
  // product is dead, when it is really proof that we only started counting.
  const started = new Date(data.recording_started_on).toLocaleDateString("no");
  container.appendChild(h("p",{style:"color:#888;font-size:12.5px;margin:0 0 4px;line-height:1.5"},
    `Registrering startet ${started}. «Aldri» for tiden før dette betyr at ingenting ble målt — ikke at funksjonen er ubrukt. `
    + "Der en dato kan utledes fra lagrede data (ord, setninger, stiler, gjenfortellinger) vises den, merket «utledet»."));
  if(data.excluded_test_users){
    container.appendChild(h("p",{style:"color:#888;font-size:12.5px;margin:0 0 14px"},
      `${data.excluded_test_users} testkonto(er) holdt utenfor.`));
  }

  const tdStyle = "padding:7px 12px;border-bottom:1px solid #eee;vertical-align:top";
  const thStyle = "background:#1a6b4a;color:#fff;padding:8px 12px;text-align:left;white-space:nowrap";

  (data.areas||[]).forEach(area => {
    container.appendChild(h("h3",{style:"font-size:13.5px;margin:18px 0 6px;color:#1a6b4a"},area.area));
    const wrap = h("div",{style:"overflow-x:auto"});
    const t = document.createElement("table");
    t.setAttribute("style","border-collapse:collapse;width:100%;font-size:13px");

    const hr = t.createTHead().insertRow();
    ["Funksjon","Brukt","Brukere","Sist brukt"].forEach(label => {
      const th = document.createElement("th");
      th.setAttribute("style", thStyle);
      th.textContent = label;
      hr.appendChild(th);
    });

    const tbody = t.createTBody();
    area.surfaces.forEach((s, i) => {
      const tr = tbody.insertRow();
      // Declared a fortnight ago and never once seen is more likely an unwired
      // emit call than a genuinely unloved feature — and for browser-emitted
      // features this is the only drift signal there is.
      if(s.never_observed) tr.setAttribute("style","background:#fff6e5");
      else if(i % 2 === 1) tr.setAttribute("style","background:#f9f9f9");

      const name = tr.insertCell();
      name.setAttribute("style", tdStyle);
      name.appendChild(document.createTextNode(s.label));
      name.appendChild(h("div",{style:"color:#aaa;font-size:11px;font-family:ui-monospace,monospace"}, s.id));

      const uses = tr.insertCell();
      uses.setAttribute("style", tdStyle + (s.uses ? "" : ";color:#bbb"));
      uses.textContent = String(s.uses);

      const users = tr.insertCell();
      users.setAttribute("style", tdStyle + (s.distinct_users ? "" : ";color:#bbb"));
      users.textContent = String(s.distinct_users);

      const last = tr.insertCell();
      last.setAttribute("style", tdStyle + (s.last_used ? "" : ";color:#bbb"));
      last.textContent = dt(s.last_used);
      if(s.last_used_is_derived){
        last.appendChild(h("span",{style:"color:#888;font-size:11px;margin-left:6px"},"(utledet)"));
      }
      if(s.never_observed){
        // A hint, not a verdict. Only browser-emitted features reach here —
        // server ones are proved wired by a test, so guessing from traffic
        // would only produce false positives on the rare-by-nature ones.
        last.appendChild(h("div",{style:"color:#b8860b;font-size:11px;margin-top:2px"},
          `registrert ${new Date(s.registered_on).toLocaleDateString("no")}, aldri observert — sjekk om den er koblet opp`));
      }
    });

    wrap.appendChild(t);
    container.appendChild(wrap);
  });

  // Accept-and-flag: types that arrived without a registry entry are kept and
  // shown here rather than discarded, so a missing registration is visible
  // instead of lossy.
  if((data.unknown_types||[]).length){
    container.appendChild(h("h3",{style:"font-size:13.5px;margin:22px 0 6px;color:#b8860b"},
      `Ukjente hendelsestyper (${data.unknown_types.length})`));
    container.appendChild(h("p",{style:"color:#888;font-size:12px;margin:0 0 8px"},
      "Registrert, men ikke deklarert i koden — sannsynligvis en funksjon som mangler oppføring."));
    container.appendChild(buildAdminTable(h,
      ["Type","Brukt","Sist sett"],
      data.unknown_types.map(u => [u.event_type, u.uses, dt(u.last_seen)])
    ));
  }
}

// ── AI failure log (019) ──────────────────────────────────────────────────
// Counts answer "is this widespread"; the recent list answers "what actually
// happened". Both are needed: a learner reporting "the AI didn't work" is
// otherwise unanswerable without reproducing it.
function renderFailureLog(container, data){
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };

  container.appendChild(h("h2",{style:"font-size:16px;margin:32px 0 6px"},"⚠️ AI-feil"));
  container.appendChild(h("p",{style:"color:#888;font-size:12.5px;margin:0 0 12px"},
    `Siste ${data.days} dager.`
    + (data.excluded_test_users ? ` ${data.excluded_test_users} testkonto(er) holdt utenfor.` : "")));

  if(!(data.by_reason||[]).length){
    container.appendChild(h("p",{style:"color:#1a6b4a;font-size:13px"},"Ingen registrerte feil i perioden."));
    return;
  }

  container.appendChild(buildAdminTable(h,
    ["Årsak","Antall","Brukere"],
    data.by_reason.map(r => [r.reason, r.count, r.distinct_users])
  ));

  container.appendChild(h("h3",{style:"font-size:13.5px;margin:18px 0 6px;color:#1a6b4a"},"Siste feil"));
  container.appendChild(buildAdminTable(h,
    ["Tid","Flate","Årsak","Oppdaget","HTTP","stop_reason","Tokens inn/ut","Lengder sys/bruker/svar","Svarhale"],
    (data.recent||[]).map(f => [
      new Date(f.created_at).toLocaleString("no"),
      f.surface,
      f.reason,
      f.detected_by,
      f.http_status == null ? "—" : f.http_status,
      f.stop_reason || "—",
      `${f.input_tokens ?? "—"}/${f.output_tokens ?? "—"}`,
      `${f.system_len ?? "—"}/${f.user_len ?? "—"}/${f.response_len ?? "—"}`,
      // The model's own answer, never the prompt or the learner's writing.
      f.response_excerpt || "—",
    ])
  ));
}

// ── AI-kall: hva ble spurt om, og hva kom tilbake (020) ───────────────────
//
// ⚠️ **This cannot show one literal prompt string, and must not pretend to.**
// A prompt has three layers and only one is stored word for word:
//
//   * the base template — kept in full, and shown here;
//   * the teacher's steering block — only a reference and a hash are kept, so
//     what is shown is the *current* instruction text, flagged when it no
//     longer matches what was sent;
//   * the learner's own writing — never stored, only hashed.
//
// The panel says so in Norwegian rather than leaving the operator to infer it,
// because a view that looks complete but silently omits a layer is worse than
// one that admits the gap.
function renderAiCalls(container, data, templates){
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };
  const PRE = "white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;"
    + "background:#fbfbfa;border:1px solid #e8e8e4;border-radius:6px;padding:10px;margin:4px 0 12px;max-height:340px;overflow:auto";
  const LABEL = "font-size:12px;font-weight:700;color:#1a6b4a;margin:10px 0 2px";

  // Join on the hash: the calls endpoint carries the template's fingerprint,
  // the registry carries its text.
  const bodyByHash = {};
  (templates && templates.templates || []).forEach(t => { bodyByHash[t.content_hash] = t; });

  container.appendChild(h("h2",{style:"font-size:16px;margin:32px 0 6px"},"🤖 AI-kall"));
  container.appendChild(h("p",{style:"color:#888;font-size:12.5px;margin:0 0 12px"},
    `Vellykkede kall siste ${data.days} dager.`
    + (data.excluded_test_users ? ` ${data.excluded_test_users} testkonto(er) holdt utenfor.` : "")
    + " Feilede kall står under AI-feil."));

  if(!(data.recent||[]).length){
    container.appendChild(h("p",{style:"color:#888;font-size:13px"},"Ingen registrerte kall i perioden."));
    return;
  }

  if((data.by_site||[]).length){
    container.appendChild(buildAdminTable(h,
      ["Kallsted","Antall","Brukere","Tokens inn","Tokens ut"],
      data.by_site.map(s => [s.call_site, s.count, s.distinct_users, s.input_tokens, s.output_tokens])
    ));
  }

  container.appendChild(h("h3",{style:"font-size:13.5px;margin:18px 0 6px;color:#1a6b4a"},"Siste kall — klikk for å se prompt og svar"));

  data.recent.forEach(c => {
    const tpl = bodyByHash[c.template && c.template.content_hash];
    const when = new Date(c.created_at).toLocaleString("no");
    const head = `${when} · ${c.call_site}${c.surface ? " / " + c.surface : ""}`
      + ` · ${c.input_tokens ?? "—"}/${c.output_tokens ?? "—"} tokens`
      + (c.template && c.template.verified ? "" : " · ⚠️ uverifisert mal");

    const box = h("details",{style:"border:1px solid #e8e8e4;border-radius:8px;padding:8px 12px;margin-bottom:8px"});
    box.appendChild(h("summary",{style:"cursor:pointer;font-size:13px"}, head));

    const meta = [
      ["Modell", c.model],
      ["Mal", c.template ? `${c.template.declared_id} v${c.template.declared_version}` : "—"],
      ["Variant", c.variant],
      ["Lærerinstruks", c.steering_applied
        ? (c.steering_drifted ? "ja — ⚠️ endret siden kallet" : "ja")
        : "nei"],
      ["Innhold", c.content_ref
        ? `${c.content_ref.kind} ${c.content_ref.id}`
          + (c.content_ref.present === false ? " (slettet)" : "")
          + (c.content_ref.changed_since_call ? " — ⚠️ endret siden kallet" : "")
        : `${c.content_kind} (ikke lagret da kallet ble gjort)`],
    ];
    box.appendChild(buildAdminTable(h, ["Felt","Verdi"], meta));

    // Lead with the whole thing. The layers are shown below for anyone who
    // needs to see which part came from where, but the first question is
    // almost always "what did the model actually read", and answering that
    // with three separate fragments and a disclaimer was not answering it.
    if(c.system_composed){
      const exact = c.template && c.template.verified && c.steering_drifted !== true;
      box.appendChild(h("div",{style:LABEL},
        exact ? "📄 Hele prompten — nøyaktig som modellen fikk den"
              : "📄 Hele prompten — satt sammen på nytt"));
      box.appendChild(h("p",{style:`font-size:12px;margin:2px 0 4px;color:${exact ? "#1a6b4a" : "#a06000"}`},
        exact
          ? "Grunnmal + lærerinstruks, satt sammen slik serveren gjorde det. Sjekksummene stemmer, så dette er ordrett."
          : "⚠️ Noe har endret seg siden kallet, så dette er dagens deler satt sammen — ikke et referat av selve kallet."));
      box.appendChild(h("pre",{style:PRE}, c.system_composed));
      box.appendChild(h("p",{style:"color:#888;font-size:12px;margin:-6px 0 12px"},
        "Elevens egen tekst kommer i tillegg til dette, som en egen melding. Den lagres aldri."));
    }

    box.appendChild(h("div",{style:LABEL},"Prompt — grunnmal (nøyaktig som sendt)"));
    if(tpl && tpl.body){
      box.appendChild(h("pre",{style:PRE}, tpl.body));
    }else if(c.template && !c.template.verified){
      // Actionable, not just descriptive. The overwhelmingly common cause of a
      // legacy row is a browser tab opened before the frontend deploy — the HTML
      // is `must-revalidate`, so a reload fixes it, but an already-open tab keeps
      // running the old build indefinitely. Saying only "this is pre-020" leaves
      // the operator to work that out at exactly the wrong moment.
      const warn = h("p",{style:"color:#a06000;font-size:12.5px;margin:2px 0 12px"},
        "Dette kallet sendte prompten ferdig sammensatt, slik appen gjorde før 020. "
        + "Grunnmalen kan derfor ikke skilles ut, og er ikke lagret.");
      warn.appendChild(h("br"));
      warn.appendChild(h("span",{style:"color:#666"},
        "Er kallet nyere enn frontend-deployen? Da kjørte fanen fortsatt den gamle "
        + "bygningen. Last siden på nytt (Cmd/Ctrl+Shift+R) og prøv igjen — nye kall "
        + "lagrer malen."));
      box.appendChild(warn);
    }else{
      box.appendChild(h("p",{style:"color:#888;font-size:12.5px;margin:2px 0 12px"},"Malen er ikke funnet."));
    }

    // The steering block is not stored, but it is *resolvable* — the record
    // points at a real instruction row. The hash decides what we may claim:
    // matching means this text is provably what was sent, differing means it is
    // only the current wording. Showing the text without that distinction would
    // be exactly the confident lie the drift flag exists to prevent.
    if(c.steering_applied){
      box.appendChild(h("div",{style:LABEL},
        c.steering_drifted === false
          ? "Prompt — lærerinstruks (nøyaktig som sendt)"
          : "Prompt — lærerinstruks"));
      if(c.steering_text && c.steering_drifted === false){
        box.appendChild(h("p",{style:"color:#1a6b4a;font-size:12px;margin:2px 0 4px"},
          "Sjekksummen stemmer, så dette er ordrett teksten som ble sendt."));
        box.appendChild(h("pre",{style:PRE}, c.steering_text));
      }else if(c.steering_text){
        box.appendChild(h("p",{style:"color:#a06000;font-size:12.5px;margin:2px 0 4px"},
          "⚠️ Instruksen er endret etter kallet. Teksten under er den som gjelder "
          + "nå — ikke den som ble sendt. Originalen er ikke lagret."));
        box.appendChild(h("pre",{style:PRE}, c.steering_text));
      }else{
        box.appendChild(h("p",{style:"color:#888;font-size:12.5px;margin:2px 0 12px"},
          "Instruksen som gjaldt er slettet, så teksten kan ikke hentes fram."));
      }
    }

    // What genuinely cannot be shown, and why.
    box.appendChild(h("div",{style:LABEL},"Elevens egen tekst"));
    box.appendChild(h("p",{style:"color:#888;font-size:12.5px;margin:2px 0 12px"},
      "Lagres aldri — bare en sjekksum, slik at det er mulig å se om teksten er "
      + "endret etterpå. Det er derfor prompten ikke kan gjenskapes ord for ord i "
      + "sin helhet, og det er med vilje."));

    box.appendChild(h("div",{style:LABEL},"Svar fra modellen (ordrett)"));
    box.appendChild(h("pre",{style:PRE}, c.response_text || "—"));

    container.appendChild(box);
  });
}

// ── Promptmaler: én rad per distinkt prompttekst (020) ────────────────────
// Two rows sharing a name and version but differing in checksum is **template
// drift** — a build declaring a version it is no longer running. Seeing that
// is the point of this table, not a fault in it.
function renderPromptTemplates(container, data){
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };
  const PRE = "white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;"
    + "background:#fbfbfa;border:1px solid #e8e8e4;border-radius:6px;padding:10px;margin:4px 0 0;max-height:340px;overflow:auto";

  const rows = data.templates || [];
  container.appendChild(h("h2",{style:"font-size:16px;margin:32px 0 6px"},"📝 Promptmaler"));
  container.appendChild(h("p",{style:"color:#888;font-size:12.5px;margin:0 0 12px"},
    "Én rad per distinkt promptekst. To rader med samme navn og versjon, men "
    + "ulik sjekksum, betyr at teksten er endret uten at versjonen ble satt opp — "
    + "det er nettopp det denne tabellen skal avsløre."));

  if(!rows.length){
    container.appendChild(h("p",{style:"color:#888;font-size:13px"},"Ingen maler registrert ennå."));
    return;
  }

  rows.forEach(t => {
    const box = h("details",{style:"border:1px solid #e8e8e4;border-radius:8px;padding:8px 12px;margin-bottom:8px"});
    box.appendChild(h("summary",{style:"cursor:pointer;font-size:13px"},
      `${t.declared_id} v${t.declared_version} · ${t.call_count} kall · ${t.content_hash.slice(0,12)}…`
      + (t.verified ? "" : " · ⚠️ uverifisert")));
    box.appendChild(h("pre",{style:PRE}, t.body || "(tom — eldre prompt sendt ferdig sammensatt)"));
    container.appendChild(box);
  });
}

function renderAdminDashboard(container, data){
  const users = data.users || [];
  const generated = data.generated_at ? new Date(data.generated_at).toLocaleString("no") : "";

  const students = users.filter(u => u.role === "student");
  const teachers = users.filter(u => u.role === "teacher");

  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };
  const t = s => document.createTextNode(s);

  container.innerHTML = "";

  // Header
  container.appendChild(h("h1",{style:"margin:0 0 4px;font-size:22px"},"Admin — Brukeroversikt"));
  container.appendChild(h("p",{style:"color:#888;font-size:13px;margin:0 0 24px"},`Generert: ${generated} · ${users.length} brukere totalt`));

  // Summary cards
  const summary = h("div",{style:"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px"});
  [
    ["👥 Brukere totalt", users.length],
    ["🎓 Elever", students.length],
    ["👩‍🏫 Lærere", teachers.length],
    ["📚 Ord opprettet", users.reduce((s,u)=>s+u.words,0)],
    ["✍️ Setninger", users.reduce((s,u)=>s+u.sentences,0)],
    ["📝 Essays", users.reduce((s,u)=>s+u.essays,0)],
  ].forEach(([label, val]) => {
    const card = h("div",{style:"background:#f8f9fa;border-radius:10px;padding:14px 20px;min-width:120px;text-align:center"});
    card.appendChild(h("div",{style:"font-size:22px;font-weight:700;color:#1a6b4a"},String(val)));
    card.appendChild(h("div",{style:"font-size:12px;color:#888;margin-top:2px"},label));
    summary.appendChild(card);
  });
  container.appendChild(summary);

  // Teachers section
  if(teachers.length){
    container.appendChild(h("h2",{style:"font-size:16px;margin:0 0 10px"},"👩‍🏫 Lærere"));
    const tTable = buildAdminTable(h,
      ["Navn","E-post","Elever","Oppgaver gitt","Sist aktiv","Opprettet"],
      teachers.map(u => [
        u.name,
        u.email,
        u.students.length ? u.students.join(", ") : "—",
        u.assignments_given || 0,
        u.last_active ? new Date(u.last_active).toLocaleDateString("no") : "—",
        new Date(u.created_at).toLocaleDateString("no"),
      ])
    );
    container.appendChild(tTable);
  }

  // Students section
  container.appendChild(h("h2",{style:"font-size:16px;margin:24px 0 10px"},"🎓 Elever"));
  const sTable = buildAdminTable(h,
    ["Navn","E-post","Lærer","Ord","Setninger","Essays","Sammendrag","Plan","Hendelser","Sist aktiv","Opprettet"],
    students.map(u => [
      u.name,
      u.email,
      u.teacher || "—",
      u.words,
      u.sentences,
      u.essays,
      u.summaries,
      u.has_plan ? "✓" : "—",
      u.events,
      u.last_active ? new Date(u.last_active).toLocaleDateString("no") : "—",
      new Date(u.created_at).toLocaleDateString("no"),
    ])
  );
  container.appendChild(sTable);
}

function buildAdminTable(h, headers, rows){
  const style = "border-collapse:collapse;width:100%;font-size:13px;margin-bottom:16px";
  const thStyle = "background:#1a6b4a;color:#fff;padding:8px 12px;text-align:left;white-space:nowrap";
  const tdStyle = "padding:7px 12px;border-bottom:1px solid #eee;vertical-align:top";
  const trEvenStyle = "background:#f9f9f9";

  const table = h("div",{style:"overflow-x:auto"});
  const t = document.createElement("table");
  t.setAttribute("style", style);

  const thead = t.createTHead();
  const hr = thead.insertRow();
  headers.forEach(hdr => {
    const th = document.createElement("th");
    th.setAttribute("style", thStyle);
    th.textContent = hdr;
    hr.appendChild(th);
  });

  const tbody = t.createTBody();
  rows.forEach((row, i) => {
    const tr = tbody.insertRow();
    if(i % 2 === 1) tr.setAttribute("style", trEvenStyle);
    row.forEach(cell => {
      const td = tr.insertCell();
      td.setAttribute("style", tdStyle);
      td.textContent = String(cell);
    });
  });

  table.appendChild(t);
  return table;
}
</script>
