  // Settings moved to Innstillinger tab

  // ── Word list container (populated separately so form is never re-rendered) ──
  const wlDiv=el("div",{id:"word-list"});
  frag.appendChild(wlDiv);
  requestAnimationFrame(()=>renderWordList());

  return frag;
}

// Returns words matching current topic + time + practiced + search filters
function getFilteredWords(){
  let filtered=state.words;
  if(state.topicFilter) filtered=filtered.filter(w=>w.topic===state.topicFilter);
  if(state.timeFilter){
    const cutoff=Date.now()-state.timeFilter*24*60*60*1000;
    filtered=filtered.filter(w=>(w.createdAt||0)>=cutoff);
  }
  if(state.practicedFilter==="not_practiced"){
    const lastAnswers=buildLastAnswerMap();
    filtered=filtered.filter(w=>{
      const hasSentence=!!(state.sentences[w.id]?.trim());
      const wasCorrect=lastAnswers[w.word.toLowerCase()]===true;
      return !hasSentence&&!wasCorrect;
    });
  }
  // Learnt is a separate axis from practised — a word can be practised but not learnt,
  // or marked learnt without ever being practised — so this filter stacks with the one
  // above rather than replacing it. Unlike flashcards, the bank shows everything by
  // default: this is the learner's record of what they know, not a practice pool.
  if(state.learntFilter==="hide_learnt") filtered=filtered.filter(w=>!isLearnt(w));
  if(state.search) filtered=filtered.filter(w=>
    w.word.toLowerCase().includes(state.search.toLowerCase())||
    w.meaning.toLowerCase().includes(state.search.toLowerCase()));
  return filtered;
}

// Renders only the word-list section — never touches the form inputs
function renderWordList(){
  const container=$("word-list"); if(!container)return;
  refreshShareBar();          // filters changed -> re-seed and re-count
  container.innerHTML="";
  const filtered=getFilteredWords();

  if(state.words.length===0){
    container.appendChild(el("div",{class:"empty-state"},
      el("div",{class:"big"},"📖"),
      el("p",{style:{fontSize:"16px",marginBottom:"6px"}},"Ingen ord ennå!"),
      el("p",{style:{fontSize:"14px"}},"Legg til ord fra boken din ovenfor, eller importer en fil.")));
    return;
  }
  let anyShown=false;
  CATS.forEach(cat=>{
    const cw=filtered.filter(w=>(w.category===cat.key || (w.category==="temaord" && cat.key==="enkeltord")));
    if(!cw.length)return;
    anyShown=true;
    const sec=el("div",{class:"cat-section"});
    const title=el("div",{class:"cat-title"});
    title.appendChild(el("span",{class:"cat-dot",style:{background:cat.color}}));
    title.appendChild(document.createTextNode(`${cat.label} (${cw.length})`));
    sec.appendChild(title);
    const grid=el("div",{class:"word-grid"});
    cw.forEach(w=>{
      const wrap=el("div",{style:{gridColumn:"span 1"}});
      const chip=el("div",{class:"word-chip",style:{borderLeftColor:cat.color,cursor:"pointer"}});

      // Share mode: the card itself carries the selected state, matching how the
      // teacher's bank cards work — green border, tinted background, check badge,
      // and the whole card is the hit target rather than a separate checkbox.
      const sharing = state.shareOpen && state.shareSelected;
      const picked = sharing && state.shareSelected.has(w.id);
      if(sharing){
        chip.style.borderColor = picked ? "#1a6b4a" : "#dde";
        chip.style.borderWidth = "1.5px";
        chip.style.borderStyle = "solid";
        chip.style.background = picked ? "#eef7f2" : "";
        chip.style.borderLeftColor = cat.color;
        chip.addEventListener("click",(e)=>{
          // Let the row's own buttons (lyd, lært, slett, rediger) win.
          if(e.target.closest("button")) return;
          e.preventDefault();
          // stopImmediatePropagation, not stopPropagation: the chip carries a second
          // click listener further down that expands the word. It is on the *same*
          // element, so only the immediate form suppresses it — and this works only
          // because this listener is registered first.
          e.stopImmediatePropagation();
          toggleShareWord(w.id);
        });
      }

      const info=el("div",{style:{flex:"1",minWidth:"0"}});
      const wn=el("div",{class:"wn"},w.word);
      if(sharing){
        wn.appendChild(el("span",{style:{marginLeft:"6px",fontSize:"11px",fontWeight:"700",
          color: picked ? "#1a6b4a" : "#bbb"}}, picked ? "✓ deles" : "○"));
      }
      if(w.topic) wn.appendChild(el("span",{class:"word-topic-tag"},w.topic));
      info.appendChild(wn);
      if(w.meaning)info.appendChild(el("div",{class:"wm"},w.meaning));
      // The Norwegian explanation sits directly under the English translation, so the
      // learner meets the word in the language they are learning it in (FR-010).
      if(w.explanation)info.appendChild(el("div",{class:"w-forklaring"},w.explanation));
      chip.appendChild(info);
      // Pronunciation is the half of a word the bank cannot show in writing. The button
      // stops the click from reaching the chip, so hearing a word does not also open its
      // edit panel.
      const wordSpeak=ttsButton(()=>w.word,`Hør uttalen av «${w.word}»`);
      if(wordSpeak) chip.appendChild(wordSpeak);
      // Marking a word learnt is a sweep across many words, so it has to be one click
      // on the card — opening the detail panel first would make it a three-click job.
      chip.appendChild(el("button",{
        class:"btn-learnt"+(isLearnt(w)?" on":""),
        title:learntOriginLabel(w)+" Klikk for å endre.",
        click(e){e.stopPropagation();setWordLearnt(w.id,!isLearnt(w));}
      },"✓"));
      chip.appendChild(el("button",{class:"btn-del",title:"Fjern",
        click(e){e.stopPropagation();const wid=w.id;const wtopic=w.topic;state.words=state.words.filter(x=>x.id!==wid);if(state.openWordId===wid)state.openWordId=null;saveStorage();renderWordList();renderTabs();trackEvent("ordbank.word_deleted",{topic:wtopic});api(`/api/words/${encodeURIComponent(wid)}`,{method:"DELETE"}).catch(()=>{});}
      },"×"));
      chip.addEventListener("click",()=>{state.openWordId=state.openWordId===w.id?null:w.id;renderWordList();});
      wrap.appendChild(chip);

      if(state.openWordId===w.id){
        const panel=el("div",{style:{background:"#f8fdf9",border:"1px solid #c8e6d4",borderRadius:"10px",padding:"14px 16px",marginTop:"6px",fontSize:"13px"}});
        const mkField=(label,val,id)=>{
          const row=el("div",{style:{marginBottom:"10px"}});
          row.appendChild(el("label",{style:{display:"block",fontWeight:"700",color:"#1a6b4a",marginBottom:"3px",fontSize:"12px"}},label));
          row.appendChild(el("input",{id,type:"text",value:val||"",style:{width:"100%",boxSizing:"border-box",padding:"6px 10px",border:"1px solid #c8e6d4",borderRadius:"7px",fontSize:"13px"}}));
          return row;
        };
        panel.appendChild(mkField("Ord",w.word,"dp-word"));
        panel.appendChild(mkField("Betydning",w.meaning,"dp-meaning"));
        panel.appendChild(mkField("Forklaring på norsk",w.explanation,"dp-explanation"));
        // Tema — select dropdown
        {
          const tRow=el("div",{style:{marginBottom:"10px"}});
          tRow.appendChild(el("label",{style:{display:"block",fontWeight:"700",color:"#1a6b4a",marginBottom:"3px",fontSize:"12px"}},"Tema"));
          const tSel=el("select",{id:"dp-topic",style:{width:"100%",boxSizing:"border-box",padding:"6px 10px",border:"1px solid #c8e6d4",borderRadius:"7px",fontSize:"13px"}});
          tSel.appendChild(el("option",{value:""},"— Ingen tema —"));
          VALID_TOPIC_LIST.forEach(t=>{
            const o=el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1));
            if(t===(w.topic||"")) o.selected=true;
            tSel.appendChild(o);
          });
          tRow.appendChild(tSel);
          panel.appendChild(tRow);
        }
        panel.appendChild(mkField("Bøyningsformer (kommaseparert)",(w.forms||[]).join(", "),"dp-forms"));
        panel.appendChild(mkField("Distraktorer – flervalg-svar (kommaseparert)",(w.flashcard_options||[]).join(", "),"dp-distractors"));

        // Example sentences — read-only. They are generated to use the word in context,
        // and there is nothing for the learner to correct in them (FR-005, FR-010).
        {
          const ex=(w.examples||[]).filter(e=>typeof e==="string"&&e.trim());
          if(ex.length){
            const exRow=el("div",{style:{marginBottom:"10px"}});
            exRow.appendChild(el("label",{style:{display:"block",fontWeight:"700",color:"#1a6b4a",marginBottom:"3px",fontSize:"12px"}},"Eksempler"));
            const list=el("ul",{style:{margin:"0",paddingLeft:"18px",color:"#4a5a52",lineHeight:"1.6"}});
            ex.forEach(s=>list.appendChild(el("li",{},s)));
            exRow.appendChild(list);
            panel.appendChild(exRow);
          }
        }

        // Where the word was met. Absent for words typed straight into the bank, and
        // absent again when the text no longer resolves — neither is an error state,
        // so nothing at all is rendered in either case (FR-041).
        {
          // The index is fetched the first time an open card actually needs it, then
          // the panel is re-rendered with the link in place. Learners who never open a
          // word met while reading never pay for the two requests.
          if(w.source_text_id && !sourceTextIndex.map) loadSourceTextIndex().then(renderWordList);
          const src=resolveSourceText(w);
          if(src){
            const sRow=el("div",{style:{marginBottom:"10px"}});
            sRow.appendChild(el("label",{style:{display:"block",fontWeight:"700",color:"#1a6b4a",marginBottom:"3px",fontSize:"12px"}},"Møtt i teksten"));
            sRow.appendChild(el("button",{
              style:{background:"none",border:"none",padding:"0",color:"#1a6b4a",fontSize:"13px",
                textDecoration:"underline",cursor:"pointer",textAlign:"left"},
              click(){ setLesingText(src); setTab("lesing"); window.scrollTo(0,0); }
            },`${src.title} →`));
            panel.appendChild(sRow);
          }
        }

        // Learnt toggle. The label states who set the current state, because an
        // automatic mark and a deliberate one are undone for different reasons (FR-037).
        {
          const lRow=el("div",{style:{marginBottom:"12px",paddingTop:"4px",borderTop:"1px solid #dcefe4"}});
          lRow.appendChild(el("div",{style:{fontSize:"12px",color:"#4a7a62",marginBottom:"6px"}},
            learntOriginLabel(w)));
          const learnt=isLearnt(w);
          lRow.appendChild(el("button",{
            style:{padding:"7px 16px",fontSize:"13px",borderRadius:"9px",fontWeight:"600",cursor:"pointer",
              background:learnt?"#fff":"#1a6b4a",color:learnt?"#1a6b4a":"#fff",border:"1px solid #1a6b4a"},
            click(){setWordLearnt(w.id,!learnt);} // re-renders on its own
          },learnt?"↺ Marker som ikke lært":"✓ Marker som lært"));
          panel.appendChild(lRow);
        }

        const btnRow=el("div",{style:{display:"flex",gap:"8px",marginTop:"4px",flexWrap:"wrap"}});
        const saveBtn=el("button",{class:"btn-add",style:{padding:"7px 18px",fontSize:"13px"},
          async click(){
            const upd={
              word:panel.querySelector("#dp-word").value.trim()||w.word,
              meaning:panel.querySelector("#dp-meaning").value.trim()||w.meaning,
              topic:panel.querySelector("#dp-topic").value.trim()||w.topic,
              explanation:panel.querySelector("#dp-explanation").value.trim()||null,
              forms:panel.querySelector("#dp-forms").value.split(",").map(s=>s.trim()).filter(Boolean),
              flashcard_options:panel.querySelector("#dp-distractors").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,4),
            };
            const r=await api(`/api/words/${encodeURIComponent(w.id)}`,{method:"PATCH",body:JSON.stringify(upd)});
            if(r.ok){const sv=await r.json();const idx=state.words.findIndex(x=>x.id===w.id);if(idx>=0)state.words[idx]={...state.words[idx],...sv,createdAt:new Date(sv.created_at).getTime()};saveStorage();}
            renderWordList();
          }
        },"Lagre");
        const aiBtn=el("button",{style:{padding:"7px 18px",fontSize:"13px",background:"#fff",border:"1px solid #1a6b4a",color:"#1a6b4a",borderRadius:"9px",fontWeight:"600",cursor:"pointer"},
          async click(){
            aiBtn.disabled=true; aiBtn.textContent="Genererer…";
            const ok=await enrichWord(w.id);
            // The learner pressed this, so silence would read as a broken button —
            // unlike the automatic paths, where failing quietly is right.
            if(!ok){ toast("AI-hjelp er ikke tilgjengelig akkurat nå. Prøv igjen om litt."); }
            renderWordList();
          }
        },"✨ Generer med AI");
        btnRow.appendChild(saveBtn); btnRow.appendChild(aiBtn);
        panel.appendChild(btnRow);
        wrap.appendChild(panel);
      }
      grid.appendChild(wrap);
    });
    sec.appendChild(grid); container.appendChild(sec);
  });
  if(!anyShown) container.appendChild(el("div",{class:"empty-state"},el("p",{},state.search?`Ingen ord matcher søket "${state.search}"`:state.topicFilter?`Ingen ord i tema "${state.topicFilter}"`:"Ingen ord i denne kategorien")));
}

// ── WORD LOOKUP ──────────────────────────────────────────────────────
// Replaces the old MyMemory call. The backend searches every user's bank first
// and only generates when nothing is found, so the same word gets the same
// description across learners and a hit costs nothing.
async function lookupWord(){
  const word=($("fi-word")?.value||form.word).trim();
  if(!word){$("fi-word")?.focus();return;}

  const btn=$("btn-lookup"), status=$("lookup-status");
  if(!status)return;
  btn.disabled=true;
  btn.innerHTML='<span class="spinning">⏳</span>';
  status.innerHTML='<span style="color:#999">Slår opp ordet…</span>';
  const orbUrl=ordbokeneUrl(word);

  try{
    const body={term:word};
    if(form.sourceTextId){body.source_text_id=form.sourceTextId;body.source_text_kind=form.sourceTextKind||"builtin";}
    const r=await api("/api/words/lookup",{method:"POST",body:JSON.stringify(body)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const p=await r.json();

    applyProposalToForm(p);
    // `hit` is what makes this worth counting: a lookup that never returns
    // anything useful is a different story from one that does.
    trackEvent("ordbank.lookup",{hit:p.origin!=="unavailable"});

    if(p.origin==="unavailable"){
      // Not an error: the word is still saveable, just without classification.
      // It is marked so it can be completed later rather than silently left thin.
      status.innerHTML=`<span style="color:#e8901a">Kunne ikke hente forslag nå — du kan fylle ut selv og lagre.</span>&ensp;<a href="${orbUrl}" target="_blank">Slå opp i Bokmålsordboka →</a>`;
    } else {
      const bits=[];
      if(p.meaning) bits.push(`<strong>${escapeHtml(p.meaning)}</strong>`);
      if(p.normalised && p.word) bits.push(`oppslagsform: <strong>${escapeHtml(p.word)}</strong>`);
      const src=p.origin==="shared_bank"?"fra ordbanken":"foreslått";
      let html=`<span style="color:#2d9e6b">✓ ${bits.join("&ensp;·&ensp;")} <span style="color:#8a8a8a">(${src})</span></span>`;
      // The learner typed an inflected form and the headword changed under them.
      // Say so explicitly rather than silently swapping the field (US1 scenario 2).
      if(p.normalised){
        html+=`<div style="color:#8a6d1a;margin-top:3px">Lagres som <strong>${escapeHtml(p.word)}</strong> — «${escapeHtml(p.original_term)}» er tatt vare på som bøyningsform.</div>`;
      }
      if(p.already_in_bank){
        html+=`<div style="color:#8a6d1a;margin-top:3px">Du har allerede dette ordet i ordbanken.</div>`;
      }
      html+=`&ensp;·&ensp;<a href="${orbUrl}" target="_blank">Se i Bokmålsordboka →</a>`;
      status.innerHTML=html;
    }
  }catch{
    form.classificationStatus="unclassified";
    status.innerHTML=`<span style="color:#e8901a">Ingen forbindelse — du kan fylle ut selv og lagre.</span>&ensp;<a href="${orbUrl}" target="_blank">Slå opp i Bokmålsordboka →</a>`;
  }
  btn.disabled=false; btn.textContent="🔍";
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Fill the form from a proposal. Every field stays editable afterwards.
function applyProposalToForm(p){
  form.originalTerm=p.original_term||form.word;
  form.normalised=!!p.normalised;
  form.baseForm=p.base_form||"";
  form.forms=Array.isArray(p.forms)?p.forms.slice():[];
  form.examples=Array.isArray(p.examples)?p.examples.slice():[];
  // Feature 015: the proposal now carries flashcard distractors, generated by the
  // same classifier call that produced `forms` — or copied from the source record
  // on a shared-bank hit. Previously the client fired a second AI request straight
  // after saving to regenerate what it had just been handed.
  form.flashcardOptions=Array.isArray(p.flashcard_options)?p.flashcard_options.slice():[];
  form.classificationStatus=p.origin==="unavailable"?"unclassified":(p.origin==="shared_bank"?"reused":"classified");

  if(p.word){form.word=p.word;const wi=$("fi-word");if(wi)wi.value=p.word;}
  if(p.meaning){form.meaning=p.meaning;const mi=$("fi-meaning");if(mi)mi.value=p.meaning;}
  if(p.explanation){form.explanation=p.explanation;const ei=$("fi-explanation");if(ei)ei.value=p.explanation;}
  if(p.category){form.category=p.category;const ci=$("fi-cat");if(ci)ci.value=p.category;}
  // The topic is proposed rather than chosen by the learner — the main reason the
  // existing bank was mis-classified. The dropdown remains for override.
  if(p.topic){form.topic=p.topic;const ti=$("fi-topic");if(ti)ti.value=p.topic;}
}

async function addWord(){
  const word=form.word.trim(); if(!word){$("fi-word")?.focus();return;}
  const tempId="tmp_"+Date.now();
  const entry={
    id:tempId, word, meaning:form.meaning.trim(), category:form.category,
    topic:form.topic.trim()||FALLBACK_TOPIC, createdAt:Date.now(),
    forms:form.forms.slice(), flashcard_options:form.flashcardOptions.slice(),
    explanation:form.explanation.trim()||null,
    examples:form.examples.slice(),
    base_form:form.baseForm||null,
    source_text_id:form.sourceTextId||null,
    source_text_kind:form.sourceTextKind||null,
    classification_status:form.classificationStatus,
  };
  state.words.push(entry);
  const savedForms=entry.forms, savedExamples=entry.examples;
  const savedOptions=entry.flashcard_options;
  const payloadTopic=entry.topic, payloadStatus=entry.classification_status;
  const payloadExplanation=entry.explanation, payloadBase=entry.base_form;
  const payloadSrcId=entry.source_text_id, payloadSrcKind=entry.source_text_kind;
  resetWordForm();
  saveStorage();
  const wi=$("fi-word"),mi=$("fi-meaning"),ti=$("fi-topic"),ei=$("fi-explanation");
  if(wi){wi.value="";wi.focus();} if(mi)mi.value=""; if(ti)ti.value=""; if(ei)ei.value="";
  const st=$("lookup-status"); if(st)st.innerHTML="";
  renderWordList(); renderTabs();
  // Persist to server and swap temp ID with server UUID
  try{
    const r=await api("/api/words",{method:"POST",body:JSON.stringify({
      word:entry.word, meaning:entry.meaning||"-", category:entry.category,
      topic:payloadTopic, forms:savedForms, flashcard_options:savedOptions,
      explanation:payloadExplanation, examples:savedExamples,
      base_form:payloadBase, source_text_id:payloadSrcId,
      source_text_kind:payloadSrcKind, classification_status:payloadStatus,
    })});
    if(r.ok){
      const sv=await r.json();
      const idx=state.words.findIndex(w=>w.id===tempId);
      if(idx>=0){state.words[idx]={...state.words[idx],...sv,createdAt:new Date(sv.created_at).getTime()};}
      saveStorage(); renderWordList();
      // Recorded here rather than at the optimistic insert above: a word that
      // never reached the server is not a use (FR-017).
      trackEvent("ordbank.word_added",{topic:payloadTopic,category:entry.category,source:payloadSrcKind||"manual"});
      // No follow-up AI call: the distractors travelled with the proposal.
    }
  }catch{}
}

// ── IMPORT / EXPORT ───────────────────────────────────────────────────
function exportWords(){
  if(!state.words.length){toast("Ingen ord å eksportere.");return;}
  const data=JSON.stringify(state.words.map(({word,meaning,category,topic,createdAt})=>({word,meaning,category,topic:topic||"",createdAt:createdAt||Date.now()})),null,2);
  const a=el("a",{href:URL.createObjectURL(new Blob([data],{type:"application/json"})),download:"ordbank.json"});
  a.click(); URL.revokeObjectURL(a.href);
  trackEvent("ordbank.export",{count:state.words.length,format:"json"});
  toast(`✓ ${state.words.length} ord eksportert som ordbank.json`);
}

function importWords(file){
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result; let imported=[];
    try{
      if(file.name.endsWith(".json")){
        const p=JSON.parse(text);
        if(Array.isArray(p)) imported=p.filter(w=>w.word).map(w=>({
          word:String(w.word).trim(),
          meaning:String(w.meaning||"").trim(),
          category:CAT_MAP[w.category]?w.category:"enkeltord",
          topic:normalizeTopic(String(w.topic||"")),
          createdAt:w.createdAt||Date.now(),
        }));
      } else {
        text.split(/\r?\n/).filter(l=>l.trim()&&!l.startsWith("#")).forEach(line=>{
          const parts=line.split(/[,;\t]/).map(s=>s.trim());
          if(parts[0]){
            let word=parts[0], meaning=parts[1]||"", category=parts[2]||"enkeltord", topic=parts[3]||"";
            if(parts.length===1){
              const m=line.match(/^(.+?)\s*[-:]\s*(.+)$/);
              if(m){word=m[1].trim();meaning=m[2].trim();}
            }
            if(!CAT_MAP[category])category="enkeltord";
            imported.push({word,meaning,category,topic:normalizeTopic(topic),createdAt:Date.now()});
          }
        });
      }
    }catch{toast("Kunne ikke lese filen. Sjekk formatet.");return;}
    if(!imported.length){toast("Ingen ord funnet i filen.");return;}
    const existing=new Set(state.words.map(w=>w.word.toLowerCase()));
    const toAdd=imported.filter(w=>!existing.has(w.word.toLowerCase()));
    const skipped=imported.length-toAdd.length;
    if(!toAdd.length){toast(`Ingen nye ord (${skipped} duplikater hoppet over)`);return;}
    // Assign temp IDs and add to local state immediately
    const tempEntries=toAdd.map(w=>({id:"tmp_"+Date.now()+Math.random()*9999,...w,forms:[],flashcard_options:[]}));
    tempEntries.forEach(e=>state.words.push(e));
    saveStorage(); renderWordList(); renderTabs();
    trackEvent("ordbank.import",{count:toAdd.length,format:file.name.endsWith(".json")?"json":"text"});
    toast(`✓ ${toAdd.length} nye ord importert! (${skipped} duplikater hoppet over)`);
    // Persist to backend in background
    api("/api/words/batch",{method:"POST",body:JSON.stringify(toAdd.map(w=>({
      word:w.word, meaning:w.meaning||"-", category:w.category||"enkeltord",
      topic:w.topic||FALLBACK_TOPIC, forms:[], flashcard_options:[],
    })))}).then(async r=>{
      if(!r.ok){console.error("Batch import failed",r.status);return;}
      const saved=await r.json();
      saved.forEach((sv,i)=>{
        const idx=state.words.findIndex(w=>w.id===tempEntries[i].id);
        if(idx>=0) state.words[idx]={...state.words[idx],...sv,createdAt:new Date(sv.created_at).getTime()};
      });
      saveStorage();
      // Generate forms+distractors for up to first 5 imported words (sequential to avoid rate limits).
      // Imported words never pass through the lookup form, so nothing else fills these in.
      const toGenerate=saved.slice(0,5);
      (async()=>{for(const sv of toGenerate) await enrichWord(sv.id); renderWordList();})();
    }).catch(()=>{});
  };
  reader.readAsText(file,"UTF-8");
}

// ── SETNINGER TAB ────────────────────────────────────────────────────
function buildSetninger(){
  const frag=document.createDocumentFragment();

  if(state.words.length===0){
    frag.appendChild(el("div",{class:"empty-state",style:{padding:"60px 20px"}},
      el("div",{class:"big"},"💬"),
      el("p",{style:{fontSize:"16px",marginBottom:"8px"}},"Ingen ord i ordbanken ennå!"),
      el("p",{style:{fontSize:"14px",marginBottom:"16px"}},"Legg til ord først, så kan du øve på å bruke dem i setninger."),
      el("button",{style:{padding:"10px 24px",background:"#1a6b4a",color:"#fff",border:"none",borderRadius:"9px",fontSize:"14px",fontWeight:"700"},
        click(){setTab("ordbank");}
      },"+ Legg til ord")));
    return frag;
  }

  // ── Topic filter bar ──
  const topics=VALID_TOPIC_LIST.filter(t=>state.words.some(w=>w.topic===t));
  if(topics.length>0){
    const filterBar=el("div",{class:"topic-filter-bar",style:{marginBottom:"14px"}});
    filterBar.appendChild(el("span",{style:{fontSize:"11px",color:"#aaa",fontWeight:"700",textTransform:"uppercase",letterSpacing:".5px",marginRight:"6px",alignSelf:"center"}},"TEMA:"));
    const allCount=state.words.length;
    filterBar.appendChild(el("button",{class:"topic-chip"+(state.sentTopicFilter===""?" active":""),
      click(){state.sentTopicFilter="";state.wordIdx=0;renderContent();}},`Alle (${allCount})`));
    topics.forEach(topic=>{
      const count=state.words.filter(w=>w.topic===topic).length;
      filterBar.appendChild(el("button",{class:"topic-chip"+(state.sentTopicFilter===topic?" active":""),
        click(){state.sentTopicFilter=topic;state.wordIdx=0;renderContent();}},`${topic} (${count})`));
    });
    frag.appendChild(filterBar);
  }

  const sentWords=getSentWords();
  if(sentWords.length===0){
    frag.appendChild(el("div",{class:"empty-state"},
      el("p",{style:{fontSize:"15px"}},`Ingen ord med tema "${state.sentTopicFilter}".`)));
    return frag;
  }

  // Clamp index
  if(state.wordIdx>=sentWords.length) state.wordIdx=0;
  const word=sentWords[state.wordIdx];
  const actualCat=word.category==="temaord"?"enkeltord":word.category;
  const cat=CAT_MAP[actualCat]||CATS[0];
  const total=sentWords.length;
  const doneCount=sentWords.filter(w=>state.sentences[w.id]?.trim()).length;
  const currentSentence=state.sentences[word.id]||"";

  // ── Navigation bar ──
  const nav=el("div",{class:"sent-nav"});
  nav.appendChild(el("button",{class:"btn-nav",disabled:state.wordIdx===0?"":null,
    click(){state.wordIdx--;renderContent();}
  },"← Forrige"));
  nav.appendChild(el("div",{class:"sent-progress"},
    el("strong",{},`${state.wordIdx+1} / ${total}`),` ord  ·  ${doneCount} setninger skrevet`));
  nav.appendChild(el("button",{class:"btn-nav",disabled:state.wordIdx===total-1?"":null,
    click(){state.wordIdx++;renderContent();}
  },"Neste →"));
  frag.appendChild(nav);

  // ── Word card ──
  const card=el("div",{class:"sent-card"});
  card.appendChild(el("div",{class:"sent-word"},word.word));
  const meta=el("div",{class:"sent-meta"});
  meta.appendChild(el("span",{class:"sent-cat",style:{background:cat.color+"18",color:cat.color}},cat.label));
  if(word.topic) meta.appendChild(el("span",{class:"sent-topic-badge"},word.topic));
  if(word.meaning) meta.appendChild(el("span",{class:"sent-meaning"},word.meaning));
  card.appendChild(meta);

  const hints={
    enkeltord:`Bruk ordet "${word.word}" i en fullstendig setning. Tenk på riktig bøyning!`,
    uttrykk:`Bruk uttrykket "${word.word}" naturlig i en setning. Jobb med kontekst og flyt.`,
    koblingsord:`Koble to tanker med "${word.word}". Koblingsord skaper logisk sammenheng mellom setningsdeler.`,
  };
  card.appendChild(el("p",{class:"sent-prompt"},hints[actualCat]||`Lag en setning med "${word.word}".`));

  const ta=el("textarea",{id:"sent-ta",class:"sent-area",
    placeholder:`Skriv én setning med "${word.word}" her…`,
    input:onSentenceInput});
  ta.value=currentSentence;
  card.appendChild(ta);

  const fb=el("div",{id:"sent-feedback",class:"sent-feedback"});
  fillSentenceFeedback(fb,currentSentence,word);
  card.appendChild(fb);

  const grammarDiv=el("div",{id:"grammar-result",class:"grammar-result",style:{display:"none"}});
  card.appendChild(grammarDiv);

  // Action buttons
  const actions=el("div",{class:"sent-actions"});
  actions.appendChild(el("button",{class:"btn-next-sent",
    click(){
      const t=$("sent-ta"); if(t) state.sentences[word.id]=t.value;
      saveSentences();
      // Find the next word without a sentence (prefer higher index, then wrap)
      const unwritten=sentWords.map((w,i)=>({w,i})).filter(({w})=>!state.sentences[w.id]?.trim());
      if(unwritten.length){
        const after=unwritten.find(x=>x.i>state.wordIdx);
        state.wordIdx=(after||unwritten[0]).i;
      }
      renderContent();
    }
  },sentWords.some((w,i)=>i!==state.wordIdx&&!state.sentences[w.id]?.trim())?"Lagre og neste ord →":"Lagre"));

  actions.appendChild(el("button",{class:"btn-sec",title:"Grammatikksjekk via Claude AI",
    click:()=>checkGrammar(word.word, $("sent-ta")?.value||currentSentence, word.id)},"🤖 Sjekk med Claude"));

  if(currentSentence.trim()){
    actions.appendChild(el("button",{class:"btn-skip",
      click(){
        const t=$("sent-ta"); if(t){t.value="";state.sentences[word.id]="";}
        saveSentences(); updateSentencePanel();
      }
    },"Slett setning"));
  }
  actions.appendChild(el("button",{class:"btn-skip",
    click(){
      const unwritten=sentWords.map((w,i)=>({w,i})).filter(({w})=>!state.sentences[w.id]?.trim());
      if(unwritten.length){state.wordIdx=unwritten[Math.floor(Math.random()*unwritten.length)].i;renderContent();}
      else toast("Alle ord har setninger!");
    }
  },"Tilfeldig ord"));
  card.appendChild(actions);
  frag.appendChild(card);

  // ── Previously written sentences ──
  const written=sentWords.filter(w=>state.sentences[w.id]?.trim()&&w.id!==word.id);
  if(written.length){
    const prev=el("div",{class:"prev-sentences"});
    prev.appendChild(el("h3",{},"Setninger du har skrevet"));
    written.slice().reverse().forEach(w=>{
      const item=el("div",{class:"prev-sent-item",
        click(){state.wordIdx=sentWords.indexOf(w);renderContent();}});
      item.style.cursor="pointer";
      item.appendChild(el("div",{class:"prev-sent-word"},w.word));
      item.appendChild(el("div",{class:"prev-sent-text"},state.sentences[w.id]));
      prev.appendChild(item);
    });
    frag.appendChild(prev);
  }

  const exportBtn=el("button",{class:"btn-io",style:{marginTop:"14px",marginBottom:"14px"},
    click:exportSentencesByTopic},"⬇️ Eksporter setninger");
  frag.appendChild(exportBtn);
  return frag;
}

async function checkGrammar(word, sentence, wordId){
  if(!sentence.trim()){toast("Skriv en setning først.");return;}
  const grammarDiv=$("grammar-result");
  if(!grammarDiv)return;
  grammarDiv.innerHTML='';
  grammarDiv.style.display="block";

  // Loading indicator
  const loading=el("div",{style:{color:"#888",fontSize:"13px",padding:"8px 0"}},"🤖 Spør Claude…");
  grammarDiv.appendChild(loading);

  await checkWithClaude(word, sentence, grammarDiv, wordId);
}

// ── Claude API grammar check ──────────────────────────────────────────
async function checkWithClaude(word, sentence, container, wordId){
  // Claude API is blocked from file:// by browser CORS rules.
  // Must be served via localhost — run start_server.py.
  if(window.location.protocol==="file:"){
    container.innerHTML="";
    const box=el("div",{style:{background:"#fffdf0",borderLeft:"4px solid #f0c040",borderRadius:"10px",padding:"14px 16px",fontSize:"13px",lineHeight:"1.7",color:"#555"}});
    box.appendChild(el("div",{style:{fontWeight:"700",marginBottom:"6px",color:"#b8860b"}},"⚠️ Kan ikke nå Claude API fra en lokal fil"));
    box.appendChild(document.createTextNode("Nettleseren blokkerer API-kall fra "));
    box.appendChild(el("code",{style:{background:"#f0f0f0",padding:"2px 6px",borderRadius:"4px"}},"file://"));
    box.appendChild(document.createTextNode(" av sikkerhetsgrunner. Løsningen er enkel:"));
    box.appendChild(el("ol",{style:{marginTop:"8px",marginLeft:"18px",lineHeight:"2"}},
      el("li",{},"Åpne en terminal i samme mappe som HTML-filen"),
      el("li",{},el("span",{},"Kjør: "),el("code",{style:{background:"#f0f0f0",padding:"2px 8px",borderRadius:"4px",fontWeight:"700"}},"python3 start_server.py")),
      el("li",{},"Åpne ",el("a",{href:"http://localhost:8080/norsk_b2_pro.html",target:"_blank",style:{color:"#1a6b4a",fontWeight:"700"}},"http://localhost:8080/norsk_b2_pro.html"))
    ));
    container.appendChild(box);
    return;
  }
  // No steering block appended here any more — the backend composes it (020).
  const systemPrompt=`Du er en norsklærer som vurderer setninger skrevet av en elev på B2-nivå. Svar KUN med gyldig JSON — ingen prosa, ingen markdown — i nøyaktig denne strukturen:
{
  "correct": boolean,
  "natural": boolean,
  "overall": "1–2 setningers vurdering på norsk",
  "errors": [{"text":"problematisk ord eller uttrykk","issue":"kort forklaring på norsk","fix":"korrigert form"}],
  "improved": "full forbedret setning på norsk, eller null om den allerede er korrekt og naturlig",
  "tip": "ett kort pedagogisk tips på norsk, eller null"
}`;

  const userMsg=`Jeg er en norsk-elev på B2-nivå og øver på ordet/uttrykket: "${word}"\n\nVennligst vurder denne setningen:\n"${sentence}"`;

  let diag=null;
  try{
    const data=await requestAiFeedback(AI_SURFACE.SENTENCE, systemPrompt, userMsg,
      "Svaret ble avkuttet fordi det ble for langt. Prøv med en kortere setning.",
      // The one surface where a real reference exists at call time: the word is
      // already in the bank. The sentence itself is not saved by this flow.
      {templateId:AI_TEMPLATE.SENTENCE, contentKind:"sentence", wordId});
    diag=claudeDiag(data,systemPrompt,userMsg);
    // Truncated responses produce invalid JSON — report it as a length problem, not a parse error
    if(data.stop_reason==="max_tokens") throw new Error("Svaret ble avkuttet fordi det ble for langt. Prøv med en kortere setning.");
    const rawText=claudeText(data);
    // Strip any accidental markdown fences
    const jsonText=rawText.replace(/```json?\n?/gi,"").replace(/```/g,"").trim();
    const result=JSON.parse(jsonText);
    renderClaudeResult(result, container);

  }catch(err){
    container.innerHTML="";
    container.appendChild(el("div",{style:{background:"#fff5f5",borderLeft:"3px solid #e05c5c",borderRadius:"8px",padding:"10px 14px",fontSize:"13px",color:"#555"}},
      err.aiHandled ? `❌ ${err.message}` : `❌ Feil: ${err.message}. Prøv igjen om litt.`
    ));
    // Only the failures the backend cannot see. `aiHandled` means the request
    // itself failed, and the server already recorded that — reporting it again
    // here would double-count it.
    if(!err.aiHandled) reportAiFailure(AI_SURFACE.SENTENCE, aiFailureReasonFor(diag), diag);
    appendClaudeDiag(container, diag);
  }
}

// Fill in inflected forms and flashcard distractors for a word already saved.
//
// Feature 015 replaced `generateFormsAndDistractors()` here: that function built its
// own prompt, asked Claude through the Cloudflare proxy, and PATCHed the answer back.
// The classifier already generates `forms` for the same word, so half of it was
// duplicated work — and it was the reason the edge platform needed its own copy of
// the API key. The prompt now lives in `word_classifier`; this is one authenticated
// POST to our own backend.
//
// Words added through the lookup form no longer come here at all: their distractors
// arrive with the proposal. This covers the two paths a proposal cannot reach — bulk
// import, and the "✨ Generer med AI" button on an existing word.
//
// Returns true on success so the button can report failure. The automatic callers
// ignore the result: enrichment is a bonus, and a learner who imported 40 words
// should not be shown an error about the fifth.
async function enrichWord(wordId){
  try{
    const r=await api(`/api/words/${encodeURIComponent(wordId)}/enrich`,{method:"POST"});
    if(!r.ok) return false;
    const sv=await r.json();
    const idx=state.words.findIndex(w=>w.id===wordId);
    if(idx>=0){state.words[idx]={...state.words[idx],forms:sv.forms,flashcard_options:sv.flashcard_options};}
    saveStorage();
    return true;
  }catch{ return false; }
}

function renderClaudeResult(r, container){
  container.innerHTML="";
  const isOk=r.correct&&r.natural;
  const isPartial=r.correct&&!r.natural;

  // Header
  const hdr=el("div",{class:`claude-header ${isOk?"ok":isPartial?"warn":"err"}`});
  hdr.appendChild(document.createTextNode(
    isOk?"✓ Korrekt og naturlig!":isPartial?"~ Grammatisk riktig, men litt unaturlig":"✗ Feil funnet"
  ));
  const resultBox=el("div",{class:"claude-result"});
  resultBox.appendChild(hdr);

  const body=el("div",{class:"claude-body"});
  if(r.overall) body.appendChild(el("div",{class:"claude-overall"},r.overall));

  // Errors
  if(r.errors&&r.errors.length){
    r.errors.forEach(e=>{
      const card=el("div",{class:"claude-error-card"});
      if(e.text)  card.appendChild(el("div",{class:"claude-error-text"},`"${e.text}"`));
      if(e.issue) card.appendChild(el("div",{class:"claude-error-issue"},e.issue));
      if(e.fix)   card.appendChild(el("div",{class:"claude-error-fix"},`→ ${e.fix}`));
      body.appendChild(card);
    });
  }

  // Improved sentence
  if(r.improved){
    const imp=el("div",{class:"claude-improved"});
    imp.appendChild(el("div",{class:"claude-improved-label"},"Forbedret setning"));
    imp.appendChild(el("div",{class:"claude-improved-text"},r.improved));
    body.appendChild(imp);
  }

  // Tip
  if(r.tip) body.appendChild(el("div",{class:"claude-tip"},`💡 ${r.tip}`));

  resultBox.appendChild(body);
  container.appendChild(resultBox);
}

// ── LanguageTool fallback ─────────────────────────────────────────────
async function checkWithLanguageTool(sentence, container){
  try{
    const res=await fetch("https://api.languagetool.org/v2/check",{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:`text=${encodeURIComponent(sentence)}&language=nb`,
    });
    const data=await res.json();
    container.innerHTML="";
    if(!data.matches||data.matches.length===0){
      container.appendChild(el("div",{class:"grammar-ok"},"✓ Ingen grammatikkfeil funnet (LanguageTool)"));
    } else {
      data.matches.forEach(m=>{
        const card=el("div",{class:"grammar-error"});
        card.appendChild(el("div",{},el("span",{class:"em"},m.message)));
        if(m.replacements?.length)
          card.appendChild(el("div",{style:{fontSize:"12px",color:"#2d9e6b",marginTop:"3px"}},
            `Forslag: ${m.replacements.slice(0,3).map(r=>r.value).join(", ")}`));
        container.appendChild(card);
      });
    }
  }catch{
    container.innerHTML='<span style="color:#e8901a;font-size:13px">Ingen internettforbindelse. Legg til Claude API-nøkkel for offline-bruk.</span>';
  }
}

function exportSentencesByTopic(){
  const byTopic = {};
  const noTopic = [];

  state.words.forEach(w=>{
    const sent = state.sentences[w.id];
    if(sent && sent.trim()){
      if(w.topic && w.topic.trim()){
        if(!byTopic[w.topic]) byTopic[w.topic] = [];
        byTopic[w.topic].push({word: w.word, sent});
      } else {
        noTopic.push({word: w.word, sent});
      }
    }
  });

  let content = "";
  Object.keys(byTopic).sort().forEach(topic=>{
    content += `=== TEMA: ${topic.charAt(0).toUpperCase() + topic.slice(1)} ===\n\n`;
    byTopic[topic].forEach(({word, sent})=>{
      content += `${word}\n→ ${sent}\n\n`;
    });
  });

  if(noTopic.length>0){
    content += `=== UTEN TEMA ===\n\n`;
    noTopic.forEach(({word, sent})=>{
      content += `${word}\n→ ${sent}\n\n`;
    });
  }

  const a=el("a",{href:URL.createObjectURL(new Blob([content],{type:"text/plain"})),download:"setninger.txt"});
  a.click(); URL.revokeObjectURL(a.href);
  toast("✓ Setninger eksportert som setninger.txt");
}

function pickPrompt(topicKey){
  state.currentPrompt=pickRandom(PROMPTS[topicKey]);
  state.currentTopic=topicKey; state.essay=""; state.tab="skriv";
  renderTabs(); renderContent();
}
function shufflePrompt(){
  const others=PROMPTS[state.currentTopic].filter(p=>p.text!==state.currentPrompt.text);
  state.currentPrompt=pickRandom(others.length?others:PROMPTS[state.currentTopic]);
  state.essay=""; renderContent();
}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  }

  const systemPrompt=`Du er en norsklærer som vurderer et essay skrevet av en elev på B2-nivå. Svar KUN med gyldig JSON — ingen prosa, ingen markdown — i nøyaktig denne strukturen:
{
  "level": "A1|A2|B1|B2|C1|C2",
  "levelComment": "1-2 setninger som forklarer nivåvurderingen på norsk",
  "grammarErrors": [{"text":"problematisk ord eller uttrykk","issue":"kort forklaring på norsk","fix":"korrigert form"}],
  "strengths": ["styrke 1 på norsk","styrke 2 på norsk"],
  "improvements": ["forbedringsforslag 1 på norsk","forbedringsforslag 2 på norsk"],
  "overall": "2-3 setningers helhetsvurdering på norsk"
}
Hold grammarErrors til de 3-5 viktigste feilene. Hold strengths og improvements til 2-4 elementer hver.`;

  const userMsg=`Please evaluate this Norwegian essay written by a B2-level learner:\n\n${essay}`;

  let diag=null;
  try{
    const data=await requestAiFeedback(AI_SURFACE.ESSAY, systemPrompt, userMsg,
      "Svaret ble avkuttet fordi det ble for langt. Prøv med en kortere tekst.",
      // No essay id: the essay is still a draft in localStorage at this point and
      // is only PATCHed to the server *after* this reply arrives. The kind alone
      // is the honest record.
      {templateId:AI_TEMPLATE.ESSAY, contentKind:"essay"});
    diag=claudeDiag(data,systemPrompt,userMsg);
    // Truncated responses produce invalid JSON — report it as a length problem, not a parse error
    if(data.stop_reason==="max_tokens") throw new Error("Svaret ble avkuttet fordi det ble for langt. Prøv med en kortere tekst.");
    const rawText=claudeText(data);
    const jsonText=rawText.replace(/```json?\n?/gi,"").replace(/```/g,"").trim();
    const result=JSON.parse(jsonText);
    renderEssayClaudeResult(result, container);
    // Save Claude level + feedback back into the essay bank and to the server
    if(result.level){
      const ta=$("essay-ta");
      const currentText=(ta?ta.value:state.essay).trim();
      const bank=loadEssayBank();
      const idx=bank.findIndex(e=>e.text.trim()===currentText);
      if(idx>=0){
        bank[idx].claudeLevel=result.level;
        bank[idx].claudeFeedback=JSON.stringify(result);
        saveEssayBank(bank);
        refreshEssayBank();
        // Persist feedback to backend if the essay has a server id
        const serverId=bank[idx].id;
        if(serverId && !serverId.startsWith("local-")){
          api(`/api/essays/${encodeURIComponent(serverId)}`,{
            method:"PATCH",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({claude_feedback:JSON.stringify(result)}),
          }).catch(()=>{});
        }
      }
    }
  }catch(err){
    container.innerHTML="";
    container.appendChild(el("div",{style:{background:"#fff5f5",borderLeft:"3px solid #e05c5c",borderRadius:"8px",padding:"10px 14px",fontSize:"13px",color:"#555"}},
      err.aiHandled ? `❌ ${err.message}` : `❌ Feil: ${err.message}. Prøv igjen.`
    ));
    if(!err.aiHandled) reportAiFailure(AI_SURFACE.ESSAY, aiFailureReasonFor(diag), diag);
    appendClaudeDiag(container, diag);
  }
}

function updateWritePanel(){
  const used=detectUsed(state.essay,state.words);
  const wc=wcCount(state.essay);
  const goal=Math.min(5,state.words.length);
  const relTopics=getEssayRelevantTopics();
  const stats=$("write-stats"); if(stats)fillWriteStats(stats,used,wc,goal);
  const meta=$("essay-meta");  if(meta)fillEssayMeta(meta,wc);
  const chips=$("sb-chips");   if(chips)fillSidebarChips(chips,used,relTopics);
  const title=$("sb-title");   if(title)title.textContent=`📚 Ordbank (${used.size}/${state.words.length} brukt)`;
}

function fillWriteStats(el2,used,wc,goal){
  el2.innerHTML="";
  const pm=document.createElement("div"); pm.className="progress-meta";
  const s1=document.createElement("span");
  s1.innerHTML=`Ordbank-ord brukt: <strong style="color:${used.size>=goal?"#1a6b4a":"#e8901a"}">${used.size}</strong> / ${state.words.length}`;
  const s2=document.createElement("span");

  s2.style.color=wc>=250&&wc<=350?"#1a6b4a":wc>350?"#e05c5c":"#aaa";
  pm.appendChild(s1); pm.appendChild(s2); el2.appendChild(pm);
  const track=document.createElement("div"); track.className="progress-track";
  const fill=document.createElement("div"); fill.className="progress-fill";
  fill.style.width=(goal>0?Math.min(100,(used.size/goal)*100):0)+"%";
  fill.style.background=used.size>=goal?"#2d9e6b":"#e8901a";
  track.appendChild(fill); el2.appendChild(track);
  if(used.size>=goal){ const sm=document.createElement("div"); sm.className="success-msg"; sm.textContent="🎉 Bra! Du har nådd målet ditt med ordbank-ord!"; el2.appendChild(sm); }
}

function fillSidebarChips(container, used, relevantTopics){
  container.innerHTML="";
  const relTopics = relevantTopics && relevantTopics.length ? relevantTopics : null;

  function makeUsedChip(w){
    const c=el("div",{class:"wb-chip used"});
    c.appendChild(el("div",{class:"wn"},`✓ ${w.word}`));
    if(w.meaning)c.appendChild(el("div",{class:"wm"},w.meaning));
    container.appendChild(c);
  }
  function makeUnusedChip(w, highlight){
    const actualCat=w.category==="temaord"?"enkeltord":w.category;
    const col=(CAT_MAP[actualCat]||CATS[0]).color;
    const style=highlight
      ?{background:"#f0faf5",borderLeftColor:"#2d9e6b"}
      :{borderLeftColor:col};
    const c=el("div",{class:"wb-chip",style});
    const wn=el("div",{class:"wn",style:highlight?{color:"#1a6b4a"}:{}},w.word);
    c.appendChild(wn);
    if(w.meaning)c.appendChild(el("div",{class:"wm"},w.meaning));
    if(highlight&&w.topic)c.appendChild(el("div",{style:{fontSize:"10px",color:"#2d9e6b",fontWeight:"600",marginTop:"2px"}},w.topic));
    container.appendChild(c);
  }
  function sectionLabel(text, color){
    container.appendChild(el("div",{style:{fontSize:"10px",fontWeight:"700",textTransform:"uppercase",
      letterSpacing:".5px",color:color||"#bbb",margin:"8px 0 4px",
      paddingBottom:"3px",borderBottom:"1px solid "+(color?"#2d9e6b22":"#eee")}},text));
  }

  if(relTopics){
    const relUsed    = state.words.filter(w=>used.has(w.id)   &&  relTopics.includes(w.topic));
    const relUnused  = state.words.filter(w=>!used.has(w.id)  &&  relTopics.includes(w.topic));
    const otherUsed  = state.words.filter(w=>used.has(w.id)   && !relTopics.includes(w.topic));
    const otherUnused= state.words.filter(w=>!used.has(w.id)  && !relTopics.includes(w.topic));

    if(relUsed.length||relUnused.length){
      sectionLabel("✨ Anbefalt for dette temaet","#2d9e6b");
      relUsed.forEach(makeUsedChip);
      relUnused.forEach(w=>makeUnusedChip(w,true));
    }
    if(otherUsed.length||otherUnused.length){
      if(relUsed.length||relUnused.length) sectionLabel("Andre ord i ordbanken",null);
      otherUsed.forEach(makeUsedChip);
      otherUnused.forEach(w=>makeUnusedChip(w,false));
    }
  } else {
    state.words.filter(w=>used.has(w.id)).forEach(makeUsedChip);
    state.words.filter(w=>!used.has(w.id)).forEach(w=>makeUnusedChip(w,false));
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────
function detectUsed(essay,words){
  const used=new Set(); if(!essay.trim())return used;
  const low=essay.toLowerCase();
  words.forEach(w=>{
    const forms=[w.word,...(w.forms||[])];
    if(forms.some(f=>f.length>=2&&low.includes(f.toLowerCase()))) used.add(w.id);
  });
  return used;
}
function wcCount(t){return t.trim()?t.trim().split(/\s+/).length:0;}

      click(){fc.includeLearnt=!fc.includeLearnt;renderContent();}},
      "✓ Ta med lærte ord"));
    card.appendChild(lBar);
  }

  const avail=getFcWords();
  const learntHidden=fc.includeLearnt?0:state.words.filter(isLearnt).length;
  card.appendChild(el("p",{style:{marginTop:"16px",fontSize:"13px",color:"#999"}},
    `${avail.length} ord tilgjengelig med gjeldende filter`
    +(learntHidden?` (${learntHidden} lærte ord er holdt utenfor)`:"")));

  // An empty pool is nearly always the learnt exclusion doing its job. Say so, and
  // offer the way out in place rather than making the learner find the chip (FR-033).
  if(avail.length<2&&learntHidden){
    const hint=el("div",{style:{marginTop:"10px",padding:"12px 14px",background:"#fffbe6",border:"1px solid #f0e0a0",borderRadius:"10px",fontSize:"13px",color:"#6b5a1a"}});
    hint.appendChild(el("div",{style:{marginBottom:"8px"}},
      "Ingen ord igjen å øve på med disse filtrene — de er markert som lærte."));
    hint.appendChild(el("button",{class:"btn-sec",style:{padding:"8px 16px",fontSize:"13px"},
      click(){fc.includeLearnt=true;renderContent();}},"Ta med lærte ord"));
    card.appendChild(hint);
  }

  card.appendChild(el("button",{
    class:"btn-add",style:{marginTop:"18px",padding:"13px 36px",fontSize:"15px"},
    disabled:avail.length<2?"":null,
    click:startFlashcards,
  },avail.length>=2?"▶  Start spill":"Trenger minst 2 ord"));

  frag.appendChild(card);
  return frag;
}

// Shared score bar + progress for all card types
function buildFcHeader(frag){
  const bar=el("div",{class:"fc-score-bar"});
  const nums=el("div",{class:"fc-score-nums"});
  nums.appendChild(el("span",{class:"fc-score-ok"},`✓ ${fc.correct}`));
  nums.appendChild(el("span",{class:"fc-score-err"},`✗ ${fc.wrong}`));
  bar.appendChild(nums);
  bar.appendChild(el("span",{style:{fontSize:"13px",color:"#aaa"}},`${fc.idx+1} / ${fc.queue.length}`));
  bar.appendChild(el("button",{class:"btn-skip",style:{fontSize:"12px",padding:"6px 12px"},
    click(){fc.started=false;renderContent();}},"⏹ Avslutt"));
  frag.appendChild(bar);
  const prog=el("div",{class:"fc-progress-wrap"});
  prog.appendChild(el("div",{class:"fc-progress-fill",style:{width:(fc.idx/fc.queue.length*100)+"%"}}));
  frag.appendChild(prog);
}

function buildFcCard(frag){
  const item=fc.queue[fc.idx];
  buildFcHeader(frag);
  if(item._type==="write") buildFcWriteCard(frag,item);
  else                      buildFcChoiceCard(frag,item);
  return frag;
}

// ── Choice card: show Norwegian word → pick English meaning ──
function buildFcChoiceCard(frag,word){
  const opts=word._options;

  const card=el("div",{class:"fc-card"});
  const typeBadge=el("div",{style:{fontSize:"11px",color:"#aaa",fontWeight:"700",textTransform:"uppercase",letterSpacing:".6px",marginBottom:"12px"}},"📖 Velg oversettelse");
  card.appendChild(typeBadge);
  card.appendChild(el("div",{class:"fc-word"},word.word));
  if(word.topic) card.appendChild(el("div",{class:"fc-sub"},el("span",{class:"sent-topic-badge"},word.topic)));
  card.appendChild(el("div",{class:"fc-question"},"— Hva betyr dette ordet? —"));
  frag.appendChild(card);

  const grid=el("div",{class:"fc-options"});
  opts.forEach((opt,i)=>{
    let cls="fc-opt";
    if(fc.answered){
      if(opt.correct) cls+=" correct";
      else if(i===fc.chosenIdx) cls+=" wrong";
      else cls+=" reveal";
    }
    grid.appendChild(el("button",{class:cls,disabled:fc.answered?"":null,
      click(){
        if(fc.answered)return;
        fc.answered=true; fc.chosenIdx=i;
        const w=fc.queue[fc.idx];
        if(opt.correct){fc.correct++;fc.log.push({wordId:w.id,word:w.word,meaning:w.meaning,correct:true,mode:"choice"});}
        else{fc.wrong++;fc.log.push({wordId:w.id,word:w.word,meaning:w.meaning,correct:false,mode:"choice",chosen:opt.text});}
        renderContent();
      }
    },opt.text));
  });
  frag.appendChild(grid);

  if(fc.answered){
    const wasOk=opts[fc.chosenIdx]?.correct;
    const fb=el("div",{class:"fc-feedback"});
    fb.appendChild(el("div",{class:wasOk?"fc-feedback-ok":"fc-feedback-err"},wasOk?"✓ Riktig!":"✗ Feil"));
    if(!wasOk){
      const right=opts.find(o=>o.correct);
      fb.appendChild(el("div",{class:"fc-correct-hint"},`Riktig svar: ${right?.text||""}`));
    }
    frag.appendChild(fb);
    frag.appendChild(el("div",{class:"fc-nav"},
      el("button",{class:"btn-fc-next",click(){
        fc.idx++; fc.answered=false; fc.chosenIdx=null; renderContent();
      }},fc.idx<fc.queue.length-1?"Neste →":"Se resultat →")));
  }
}

// ── Write card: show English meaning → type Norwegian word ──
function buildFcWriteCard(frag,word){
  const meaning=word.meaning||"(ingen oversettelse)";
  const actualCat=word.category==="temaord"?"enkeltord":word.category;
  const cat=CAT_MAP[actualCat]||CATS[0];

  const card=el("div",{class:"fc-card"});
  card.appendChild(el("div",{style:{fontSize:"11px",color:"#aaa",fontWeight:"700",textTransform:"uppercase",letterSpacing:".6px",marginBottom:"12px"}},"✍️ Skriv det norske ordet"));
  card.appendChild(el("div",{class:"fc-word",style:{fontSize:"28px",color:"#333",fontWeight:"700"}},meaning));
  card.appendChild(el("div",{class:"fc-sub"},el("span",{class:"sent-cat",style:{background:cat.color+"18",color:cat.color}},cat.label)));
  card.appendChild(el("div",{class:"fc-question"},"— Hva er det norske ordet? —"));
  frag.appendChild(card);

  if(!fc.writeChecked){
    // Input row
    const row=el("div",{style:{display:"flex",gap:"10px",maxWidth:"520px",margin:"0 auto 16px"}});
    const inp=el("input",{
      id:"fc-write-inp",class:"text-input",type:"text",
      placeholder:"Skriv norsk ord her…",
      style:{fontSize:"16px",padding:"12px 16px",flex:"1"},
      keydown(e){if(e.key==="Enter")fcCheckWrite(inp.value,word);}
    });
    inp.value=fc.writeInput;
    row.appendChild(inp);
    row.appendChild(el("button",{class:"btn-add",style:{whiteSpace:"nowrap",padding:"12px 20px",flexShrink:"0"},
      click(){fcCheckWrite(inp.value,word);}
    },"Sjekk →"));
    frag.appendChild(row);
    requestAnimationFrame(()=>{const i=$("fc-write-inp");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}});
  } else {
    // Result
    const wasOk=fc.writeResult;
    const fb=el("div",{class:"fc-feedback"});
    fb.appendChild(el("div",{style:{fontSize:"13px",color:"#bbb",marginBottom:"6px"}},`Du svarte: "${fc.writeInput}"`));
    fb.appendChild(el("div",{class:wasOk?"fc-feedback-ok":"fc-feedback-err"},wasOk?"✓ Riktig!":"✗ Feil"));
    if(!wasOk) fb.appendChild(el("div",{class:"fc-correct-hint"},`Riktig svar: ${word.word}`));
    frag.appendChild(fb);
    frag.appendChild(el("div",{class:"fc-nav"},
      el("button",{class:"btn-fc-next",click(){
        fc.idx++; fc.answered=false; fc.chosenIdx=null;
        fc.writeInput=""; fc.writeChecked=false; fc.writeResult=false;
        renderContent();
      }},fc.idx<fc.queue.length-1?"Neste →":"Se resultat →")));
  }
}

function fcCheckWrite(input,word){
  fc.writeInput=input.trim();
  const normalize=s=>s.toLowerCase().trim().replace(/^å\s+/,"").replace(/\s+/g," ");
  fc.writeResult=normalize(fc.writeInput)===normalize(word.word);
  fc.writeChecked=true;
  // `wordId` is what keeps this answer attached to the word after a rename; `word` is
  // kept because every event logged before feature 013 has only the text (R4).
  if(fc.writeResult){fc.correct++;fc.log.push({wordId:word.id,word:word.word,meaning:word.meaning,correct:true,mode:"write"});}
  else{fc.wrong++;fc.log.push({wordId:word.id,word:word.word,meaning:word.meaning,correct:false,mode:"write",written:fc.writeInput});}
  renderContent();
}

function buildFcDone(frag){
  const total=fc.correct+fc.wrong;
  const pct=total?Math.round(fc.correct/total*100):0;
  if(!fc.tracked){
    fc.tracked=true;
    // The threshold is evaluated server-side on this write (R9), so the ids come back
    // in the response rather than being computed here.
    trackEvent("flashcard_session",{correct:fc.correct,wrong:fc.wrong,total,pct,topicFilter:fc.topicFilter||null,words:fc.log})
      .then(res=>{
        const ids=res?.auto_learnt||[];
        if(!ids.length)return;
        fc.autoLearnt=ids;
        ids.forEach(id=>{const w=state.words.find(x=>x.id===id); if(w) w.learnt_state="learnt_auto";});
        saveStorage();
        if(fc.started)renderContent();
      });
  }
  const emoji=pct>=80?"🎉":pct>=60?"👍":"💪";
  const msg=pct>=80?"Utmerket!":pct>=60?"Bra jobbet!":"Øv mer – du klarer det!";

  const done=el("div",{class:"fc-done"});
  done.appendChild(el("div",{class:"fc-done-emoji"},emoji));
  done.appendChild(el("div",{class:"fc-done-score"},`${fc.correct} / ${total} riktig`));
  done.appendChild(el("div",{class:"fc-done-pct"},`${pct}% — ${msg}`));

  // Say which words this session marked learnt, and where to undo it. An exclusion the
  // learner cannot account for is the failure this notice exists to prevent (FR-037).
  if(fc.autoLearnt.length){
    const names=fc.autoLearnt.map(id=>state.words.find(w=>w.id===id)?.word).filter(Boolean);
    const note=el("div",{style:{margin:"14px auto 0",maxWidth:"460px",padding:"12px 14px",background:"#f0f9f4",border:"1px solid #c8e6d4",borderRadius:"10px",fontSize:"13px",color:"#1a6b4a",textAlign:"left"}});
    note.appendChild(el("div",{style:{fontWeight:"700",marginBottom:"4px"}},
      `✓ Markert som lært automatisk: ${names.join(", ")}`));
    note.appendChild(el("div",{style:{color:"#4a7a62"}},
      "Disse holdes utenfor øvingen framover. Du kan angre i Ordbanken."));
    done.appendChild(note);
  }

  const nav=el("div",{class:"fc-nav"});
  nav.appendChild(el("button",{class:"btn-fc-next",click:startFlashcards},"🔄 Spill igjen"));
  nav.appendChild(el("button",{class:"btn-sec",style:{padding:"12px 28px",fontSize:"14px"},
    click(){fc.started=false;renderContent();}},"⚙️ Endre innstillinger"));
  done.appendChild(nav);
  frag.appendChild(done);
  return frag;
}

function buildLastAnswerMap(){
  // Returns {wordLower: wasCorrect} for the MOST RECENT answer for each word.
  // Events in statsCache are newest-first, so first occurrence = most recent answer.
  const last={};
  (statsCache?.events||[]).filter(e=>e.type==="flashcard_session").forEach(session=>{
    (session.words||[]).forEach(w=>{
      const key=w.word?.toLowerCase();
      if(key && !(key in last)) last[key]=w.correct;
    });
  });
  return last;
}

function getNetMissedWords(){
  // Returns [{word,meaning,id,...bankWord, netErrors}] from all flashcard sessions
  const wrong={}, correct={}, meanings={};
  (statsCache?.events||[]).filter(e=>e.type==="flashcard_session").forEach(session=>{
    (session.words||[]).forEach(w=>{
      if(!w.correct) wrong[w.word]=(wrong[w.word]||0)+1;
      else           correct[w.word]=(correct[w.word]||0)+1;
      if(w.meaning)  meanings[w.word]=w.meaning;
    });
  });
  return Object.entries(wrong)
    .filter(([word,cnt])=>cnt>(correct[word]||0))
    .sort((a,b)=>(b[1]-(correct[b[0]]||0))-(a[1]-(correct[a[0]]||0)))
    .map(([word,cnt])=>{
      const bankWord=state.words.find(w=>w.word.toLowerCase()===word.toLowerCase());
      return bankWord
        ? {...bankWord, netErrors:cnt-(correct[word]||0), wrong:cnt, rightCount:correct[word]||0}
        : {id:"err_"+word, word, meaning:meanings[word]||"", category:"enkeltord", topic:"", netErrors:cnt-(correct[word]||0), wrong:cnt, rightCount:correct[word]||0};
    });
}

function getFcWords(){
  let w=state.words.slice();
  if(fc.topicFilter) w=w.filter(x=>x.topic===fc.topicFilter);
  if(fc.timeFilter){const cut=Date.now()-fc.timeFilter*24*60*60*1000;w=w.filter(x=>(x.createdAt||0)>=cut);}
  // Learnt words are excluded by default (FR-032). This reads the stored flag rather
  // than inferring learnt status from the most recent answer, which was the previous
  // "Ikke lært ennå" filter: an inference over a local stats cache cannot agree
  // across devices, and it could not represent "the learner said this is not learnt".
  if(!fc.includeLearnt) w=w.filter(x=>!isLearnt(x));
  if(fc.learningFilter==="error_only"){
    const missed=new Set(getNetMissedWords().map(x=>x.word.toLowerCase()));
    w=w.filter(x=>missed.has(x.word.toLowerCase()));
  }
  if(fc.maxWords>0) w=shuffle(w).slice(0,fc.maxWords);
  return w;
}

function startFlashcards(){
  const words=getFcWords();
  if(words.length<2){toast("Trenger minst 2 ord med gjeldende filter.");return;}
  // Randomly assign card type and pre-generate options so they never reshuffle on re-render
  fc.queue=shuffle(words).map(w=>{
    const type=Math.random()<0.5?"write":"choice";
    return {...w,_type:type,_options:type==="choice"?fcGetOptions(w):null};
  });
  fc.idx=0; fc.correct=0; fc.wrong=0; fc.log=[]; fc.tracked=false; fc.autoLearnt=[];
  fc.answered=false; fc.chosenIdx=null;
  fc.writeInput=""; fc.writeChecked=false; fc.writeResult=false;
  fc.started=true;
  renderContent();
}

function fcGetOptions(word){
  const correct=word.meaning||word.word;
  const stored=(word.flashcard_options||[]).filter(d=>d&&d.trim());
  const wrongPool=stored.length>=3
    ? shuffle(stored).slice(0,3)
    : (()=>{
        const fromStored=shuffle(stored).slice(0,stored.length);
        const needed=3-fromStored.length;
        const fromBank=shuffle(state.words.filter(w=>w.id!==word.id&&w.meaning&&w.meaning.trim())).slice(0,needed).map(w=>w.meaning);
        const pool=[...fromStored,...fromBank];
        while(pool.length<3) pool.push("—");
        return pool;
      })();
  return shuffle([{text:correct,correct:true},...wrongPool.map(t=>({text:t,correct:false}))]);
}
