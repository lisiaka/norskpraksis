<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>B2 Norsk Trening</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;color:#1a1a1a;font-size:15px;line-height:1.5;}
button{cursor:pointer;font-family:inherit;transition:all .15s;}
button:hover{opacity:.88;}
button:active{transform:scale(.98);}
input,select,textarea{font-family:inherit;outline:none;}
input:focus,select:focus,textarea:focus{border-color:#2d9e6b!important;box-shadow:0 0 0 3px rgba(45,158,107,.15);}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#c8d4f8;border-radius:3px;}
#app{max-width:none;margin:0;padding:0 32px 40px 252px;min-height:100vh;}
.header{background:transparent;border:none;border-radius:0;padding:16px 0;margin-bottom:20px;color:#1a1a1a;}
.header h1,.header p{display:none;}
.header-top{display:flex;justify-content:flex-end;align-items:center;gap:12px;}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e0e4ec;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:#444;white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0;}
.user-badge:hover{border-color:#1a6b4a;color:#1a6b4a;background:#f0fdf8;}
.user-badge .ub-icon{font-size:15px;}
/* ── Login screen ── */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#e8f5ff 0%,#f0e8ff 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.login-card{background:#fff;border-radius:32px;padding:48px 40px;max-width:400px;width:100%;box-shadow:0 12px 48px rgba(79,110,247,.14);text-align:center;}
.login-card .login-flag{font-size:56px;margin-bottom:16px;}
.login-card h2{font-size:24px;font-weight:800;color:#1a1a2e;margin-bottom:6px;letter-spacing:-.3px;}
.login-card p{font-size:14px;color:#888;margin-bottom:28px;line-height:1.6;}
.login-input{width:100%;padding:14px 18px;border-radius:50px;border:2px solid #e0e4ff;font-size:16px;text-align:center;font-family:inherit;margin-bottom:12px;transition:border-color .2s;background:#f8f9ff;}
.login-input:focus{border-color:#2d9e6b!important;outline:none;box-shadow:0 0 0 3px rgba(45,158,107,.15);}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#1a6b4a,#2d9e6b);color:#fff;border:none;border-radius:50px;font-size:16px;font-weight:800;cursor:pointer;transition:opacity .15s;}
.login-btn:hover{opacity:.88;}
.login-btn:disabled{opacity:.4;cursor:default;}
.login-hint{font-size:12px;color:#bbb;margin-top:10px;}
/* ── Sidebar navigation ── */
.tabs{position:fixed;top:0;left:0;bottom:0;width:236px;background:#fff;border-right:1px solid #e0e4ec;display:flex;flex-direction:column;padding:0;overflow-y:auto;z-index:100;border-radius:0;box-shadow:none;margin:0;gap:0;}
.sidebar-brand{padding:24px 20px 16px;font-size:17px;font-weight:800;color:#1a1a1a;border-bottom:1px solid #f0f0f0;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nav-section-label{padding:12px 20px 4px;font-size:10px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.8px;}
.tab-btn{display:flex;align-items:center;width:calc(100% - 16px);padding:10px 14px;border-radius:10px;margin:0 8px 2px;border:none;background:none;color:#555;font-weight:600;font-size:14px;text-align:left;justify-content:flex-start;transition:all .15s;white-space:nowrap;box-shadow:none;}
.tab-btn:hover{background:#f0f6ff;color:#1a6b4a;opacity:1;}
.tab-btn.active{background:#edfaf3;color:#1a6b4a;font-weight:700;box-shadow:none;}
.card{background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:1px solid #e8ecf0;margin-bottom:14px;}
.card h2{font-size:15px;color:#1a6b4a;font-weight:800;margin-bottom:14px;letter-spacing:-.1px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-row2{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:flex-end;margin-bottom:10px;}
.field-label{font-size:11px;color:#777;display:block;margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.text-input{width:100%;padding:10px 13px;border-radius:9px;border:1.5px solid #e0e4ec;font-size:14px;background:#fff;}
.sel{padding:10px 13px;border-radius:9px;border:1.5px solid #e0e4ec;font-size:14px;background:#fff;width:100%;}
.btn-add{padding:10px 22px;background:#1a6b4a;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;white-space:nowrap;}
.btn-add:disabled{background:#c3d6cc;cursor:not-allowed;}
.hint{font-size:12px;color:#bbb;margin-top:6px;}
.io-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.btn-io{padding:8px 16px;background:#fff;border:1.5px solid #e0e4ec;border-radius:9px;font-size:13px;color:#555;font-weight:600;}
.btn-io:hover{border-color:#2d9e6b;color:#1a6b4a;}
.io-hint{font-size:12px;color:#bbb;margin-left:4px;}
.search-box{width:100%;padding:10px 14px;border-radius:9px;border:1.5px solid #e0e4ec;font-size:14px;background:#fff;margin-bottom:14px;}
.topic-filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:12px;background:#fff;border-radius:12px;border:1px solid #e8ecf0;align-items:center;}
.topic-chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:#f5f7fa;border:1.5px solid #e0e4ec;color:#555;cursor:pointer;transition:all .2s;}
.topic-chip:hover{border-color:#2d9e6b;background:#e8f5ee;}
.topic-chip.active{background:#1a6b4a;color:#fff;border-color:#1a6b4a;}
.word-topic-tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#f0e68c;color:#776;}
.cat-section{background:#fff;border-radius:12px;padding:18px;margin-bottom:12px;border:1px solid #e8ecf0;}
.cat-title{font-size:12px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.word-chip{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 12px;background:#f8fdf9;border-radius:9px;border-left:3px solid #ddd;}
.word-chip .wn{font-weight:600;color:#222;font-size:14px;word-break:break-word;}
.word-chip .wm{color:#999;font-size:12px;margin-top:2px;word-break:break-word;}
.word-chip .w-forklaring{color:#4a7a62;font-size:12px;font-style:italic;margin-top:3px;word-break:break-word;}
.btn-del{background:none;border:none;color:#ccc;font-size:18px;padding:0 3px;line-height:1;flex-shrink:0;margin-left:6px;}
.btn-del:hover{color:#e05c5c;opacity:1;}
.btn-learnt{background:none;border:none;color:#ccc;font-size:15px;padding:0 3px;line-height:1;flex-shrink:0;margin-left:6px;cursor:pointer;}
.btn-learnt:hover{color:#2d9e6b;}
.btn-learnt.on{color:#1a6b4a;font-weight:700;}
.empty-state{text-align:center;padding:56px 20px;background:#fff;border-radius:14px;color:#bbb;}
.empty-state .big{font-size:48px;margin-bottom:12px;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.topic-card{background:#fff;border-radius:12px;padding:22px 20px;border:1px solid #e8ecf0;cursor:pointer;transition:border-color .15s;text-align:left;}
.topic-card:hover{border-color:#2d9e6b;}
.topic-emoji{font-size:36px;margin-bottom:10px;}
.topic-name{font-weight:700;font-size:16px;color:#222;margin-bottom:4px;}
.topic-count{font-size:13px;color:#999;margin-bottom:14px;}
.topic-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600;}
.prompt-panel{margin-top:20px;background:#fff;border-radius:16px;border:2px solid #e8e8e8;overflow:hidden;}
.prompt-panel-header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #f0f0f0;font-weight:700;font-size:15px;}
.prompt-list-item{display:flex;align-items:flex-start;gap:12px;padding:13px 18px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .15s;}
.prompt-list-item:last-child{border-bottom:none;}
.prompt-list-item:hover{background:#f8f8ff;}
.prompt-list-item-title{font-weight:700;font-size:14px;margin-bottom:3px;}
.prompt-list-item-text{font-size:13px;color:#555;line-height:1.5;}
.prompt-list-arrow{flex-shrink:0;font-size:18px;margin-top:2px;color:#bbb;}
.custom-oppgave-box{padding:16px 18px;background:#f9f9ff;border-top:2px dashed #dde;}
.custom-oppgave-box textarea{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1.5px solid #ccd;font-size:14px;font-family:inherit;line-height:1.6;resize:vertical;min-height:80px;}
.write-layout{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start;}
@media(max-width:720px){.write-layout{grid-template-columns:1fr;}}
.prompt-box{border-radius:14px;padding:20px;margin-bottom:14px;}
.prompt-box .prompt-tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.prompt-box .prompt-text{font-size:15px;line-height:1.7;color:#2a2a2a;}
.prompt-box .hint-bar{margin-top:12px;padding:8px 12px;background:#fff;border-radius:8px;font-size:13px;color:#444;}
.progress-wrap{margin-bottom:10px;}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:#666;}
.progress-track{background:#e8eef0;border-radius:6px;height:7px;overflow:hidden;}
.progress-fill{height:100%;border-radius:6px;transition:width .4s;}
.success-msg{text-align:center;color:#2d9e6b;font-size:13px;margin-top:6px;font-weight:600;}
.essay-area{width:100%;min-height:340px;padding:18px;border-radius:13px;border:1.5px solid #dde;font-size:15px;line-height:1.8;resize:vertical;background:#fff;}
.essay-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#999;}
.action-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.btn-sec{padding:9px 18px;background:#f5f7fa;border:1.5px solid #e0e4ec;border-radius:9px;font-size:13px;color:#555;font-weight:500;}
/* Primary call-to-action — used for the bank save/assign actions, which were
   previously easy to miss against the form fields above them. */
.btn-cta{display:block;width:100%;max-width:320px;margin:0 auto;padding:11px 24px;background:#1a6b4a;color:#fff;border:none;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(26,107,74,.22);transition:background .15s,box-shadow .15s,transform .05s;}
.btn-cta:hover:not(:disabled){background:#15583d;box-shadow:0 5px 16px rgba(26,107,74,.32);}
.btn-cta:active:not(:disabled){transform:translateY(1px);}
.btn-cta:disabled{background:#cfd8d3;color:#fff;box-shadow:none;cursor:not-allowed;}
/* Selectable bank card — click anywhere to pick, no checkbox, body clamped to
   two lines so the common case needs no expand click. */
.pick-card{position:relative;border:2px solid #e8ecf0;border-radius:12px;background:#fff;margin-bottom:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s;}
.pick-card:hover{border-color:#9fc7b4;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.pick-card.picked{border-color:#1a6b4a;background:#f2faf6;box-shadow:0 0 0 3px rgba(26,107,74,.12);}
.pick-title{font-weight:700;font-size:15px;color:#222;padding-right:36px;line-height:1.4;}
.pick-meta{font-size:12px;color:#8a94a0;margin-top:3px;}
.pick-preview{font-size:13px;color:#555;line-height:1.6;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pick-preview.open{display:block;overflow:visible;white-space:pre-wrap;}
.pick-more{font-size:12px;color:#1a6b4a;font-weight:700;margin-top:6px;display:inline-block;cursor:pointer;}
.pick-more:hover{text-decoration:underline;}
.pick-check{position:absolute;top:13px;right:14px;width:24px;height:24px;border-radius:50%;border:2px solid #d8dee5;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:transparent;background:#fff;transition:background .15s,border-color .15s,color .15s;}
.pick-card.picked .pick-check{background:#1a6b4a;border-color:#1a6b4a;color:#fff;}
.sidebar{position:sticky;top:16px;}
.sidebar .card{margin-bottom:12px;}
.sidebar .card h3{font-size:14px;color:#1a6b4a;font-weight:700;margin-bottom:12px;}
.sidebar-chips{max-height:440px;overflow-y:auto;padding-right:2px;display:grid;gap:5px;}
.wb-chip{padding:7px 10px;border-radius:8px;border-left:3px solid #ddd;background:#f9f9f9;}
.wb-chip.used{background:#edfaf3;border-left-color:#2d9e6b;}
.wb-chip.used .wn{color:#1a6b4a;font-weight:700;}
.wb-chip .wn{font-size:13px;font-weight:600;color:#444;}
.wb-chip .wm{font-size:11px;color:#bbb;margin-top:1px;}
.essay-word-list{max-height:300px;overflow-y:auto;padding-right:2px;display:grid;gap:4px;font-size:12px;}
.essay-word-item{padding:6px 8px;border-radius:7px;background:#f8fdf9;border-left:3px solid #2d9e6b;}
.essay-word-item .wn{font-weight:600;color:#1a6b4a;margin-bottom:2px;}
.essay-word-item .wm{color:#999;font-size:11px;}
.essay-word-item .sent{color:#555;font-size:11px;margin-top:3px;font-style:italic;max-height:40px;overflow-y:auto;}
.tips-box{background:#fffdf0;border-radius:12px;padding:14px;border:1px solid #f0e68c;}
.tips-title{font-size:12px;font-weight:700;color:#b8860b;margin-bottom:8px;}
.tip-item{font-size:12px;color:#776;margin-bottom:4px;display:flex;gap:6px;}
.tip-dot{color:#f0c040;flex-shrink:0;}
/* Settings card */
.settings-card{background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:14px;border:1.5px dashed #e0e4ec;}
.settings-card h3{font-size:13px;color:#888;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.key-row{display:flex;gap:8px;align-items:center;}
.key-input{flex:1;padding:8px 12px;border-radius:8px;border:1.5px solid #dde;font-size:13px;font-family:monospace;background:#fafafa;letter-spacing:.5px;}
.key-input:focus{border-color:#2d9e6b!important;box-shadow:0 0 0 3px rgba(45,158,107,.1);}
.btn-save-key{padding:8px 16px;background:#1a6b4a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.key-status{font-size:12px;margin-top:6px;min-height:16px;}
/* Grammar / Claude result */
.grammar-result{margin-top:14px;}
.grammar-ok{padding:10px 14px;background:#edfaf3;border-left:4px solid #2d9e6b;color:#1a6b4a;border-radius:8px;font-weight:600;font-size:13px;}
.grammar-error{background:#fff5f5;border-left:3px solid #e05c5c;padding:8px 10px;margin-bottom:6px;border-radius:6px;font-size:12px;color:#555;}
.grammar-error .em{color:#e05c5c;font-weight:700;}
.claude-result{border-radius:12px;overflow:hidden;border:1px solid #e0e8e0;}
.claude-header{padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;}
.claude-header.ok{background:#edfaf3;color:#1a6b4a;}
.claude-header.err{background:#fff5f5;color:#c0392b;}
.claude-header.warn{background:#fffdf0;color:#b8860b;}
.claude-body{padding:14px 16px;background:#fff;}
.claude-overall{font-size:13px;color:#444;margin-bottom:10px;line-height:1.55;}
.claude-error-card{background:#fff5f5;border-left:3px solid #e05c5c;border-radius:6px;padding:8px 12px;margin-bottom:7px;}
.claude-error-text{font-weight:700;color:#e05c5c;font-size:12px;margin-bottom:2px;}
.claude-error-issue{font-size:12px;color:#666;margin-bottom:3px;}
.claude-error-fix{font-size:12px;color:#2d9e6b;font-weight:600;}
.claude-improved{background:#f0f8f4;border-left:3px solid #2d9e6b;border-radius:6px;padding:10px 12px;margin-top:8px;}
.claude-improved-label{font-size:10px;color:#2d9e6b;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
.claude-improved-text{font-size:14px;color:#222;font-style:italic;line-height:1.5;}
.claude-tip{background:#fffdf0;border-left:3px solid #f0c040;border-radius:6px;padding:8px 12px;margin-top:8px;font-size:12px;color:#776;line-height:1.5;}
.grammar-error .sug{color:#2d9e6b;margin-left:4px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 24px;border-radius:12px;font-size:14px;font-weight:500;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;}
.toast.show{opacity:1;}
.word-input-row{display:flex;gap:6px;}
.btn-lookup{padding:10px 13px;background:#f0f4f8;border:1.5px solid #dde;border-radius:9px;font-size:16px;flex-shrink:0;color:#555;line-height:1;}
.btn-lookup:hover{background:#e8f5ee;border-color:#2d9e6b;}
.btn-lookup:disabled{opacity:.45;cursor:default;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{display:inline-block;animation:spin .8s linear infinite;}
/* ── Essay bank ── */
.essay-bank-panel{background:#f8fdf9;border-radius:14px;border:1.5px solid #d4edda;padding:16px;margin-top:14px;}
.essay-bank-panel h3{font-size:13px;color:#1a6b4a;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.essay-bank-empty{font-size:13px;color:#bbb;text-align:center;padding:18px 0;}
.saved-essay-row{background:#fff;border-radius:10px;border:1.5px solid #e8f0e8;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;transition:border-color .2s,background .15s;cursor:pointer;}
.saved-essay-row:hover{border-color:#2d9e6b;background:#f4fbf7;}
.saved-essay-info{flex:1;min-width:0;}
.saved-essay-title{font-weight:700;font-size:14px;color:#222;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.saved-essay-meta{font-size:12px;color:#999;line-height:1.5;}
.saved-essay-level{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-left:6px;}
.saved-essay-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-load-essay{padding:5px 12px;background:#edfaf3;border:1.5px solid #2d9e6b;border-radius:7px;font-size:12px;color:#1a6b4a;font-weight:700;}
.btn-del-essay{padding:5px 10px;background:#fff5f5;border:1.5px solid #e05c5c;border-radius:7px;font-size:12px;color:#e05c5c;font-weight:700;}
/* ── Lesing reader layout ── */
.lesing-reader-layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start;}
@media(max-width:780px){.lesing-reader-layout{grid-template-columns:1fr;}}
.lesing-lookup-panel{position:sticky;top:16px;}
.lesing-lookup-panel .card{margin-bottom:10px;}
.lesing-lookup-panel .card h3{font-size:13px;color:#1a6b4a;font-weight:700;margin-bottom:10px;}
.lookup-word-input{width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid #dde;font-size:14px;font-family:inherit;margin-bottom:8px;}
.lookup-word-input:focus{border-color:#2d9e6b!important;outline:none;box-shadow:0 0 0 3px rgba(45,158,107,.13);}
.lookup-result-box{background:#f8fdf9;border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.6;min-height:36px;}
.lookup-in-bank{background:#edfaf3;border-left:3px solid #2d9e6b;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:8px;}
.lookup-in-bank .wn{font-weight:700;color:#1a6b4a;}
.lookup-in-bank .wm{color:#777;font-size:12px;}
/* ── Tekst til tale ── */
.tts-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;background:#f8fdf9;border:1.5px solid #d4edda;border-radius:10px;margin-bottom:16px;}
.btn-tts-main{display:flex;align-items:center;gap:6px;padding:7px 14px;background:#2d9e6b;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:700;font-family:inherit;}
.btn-tts-main:hover{background:#268a5c;}
.btn-tts-stop{padding:7px 11px;background:#fff;border:1.5px solid #dde;border-radius:8px;font-size:13px;color:#666;font-family:inherit;}
.btn-tts-stop:hover{border-color:#e05c5c;color:#e05c5c;}
.btn-tts-stop:disabled{opacity:.4;}
.tts-rate{margin-left:auto;display:flex;gap:4px;}
.tts-rate button{padding:5px 10px;background:#fff;border:1.5px solid #dde;border-radius:7px;font-size:12px;color:#666;font-family:inherit;font-weight:600;}
.tts-rate button.active{background:#edfaf3;border-color:#2d9e6b;color:#1a6b4a;}
.btn-tts{padding:2px 6px;background:none;border:none;font-size:14px;line-height:1;opacity:.55;flex-shrink:0;}
.btn-tts:hover{opacity:1;}
.btn-tts.speaking{opacity:1;animation:ttsPulse 1s ease-in-out infinite;}
@keyframes ttsPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.22);}}
.tts-word{border-radius:3px;transition:background .08s linear;}
.tts-word.tts-now{background:#ffe9a8;box-shadow:0 0 0 2px #ffe9a8;}
/* ── Word Sort (Setningsbygging) game ── */
.ws-pool-area{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:12px;background:#f8fdf9;border-radius:10px;border:1.5px dashed #c8e6c9;margin-bottom:12px;align-content:flex-start;}
.ws-answer-area{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;background:#fff;border-radius:10px;border:2px solid #2d9e6b;margin-bottom:14px;align-items:flex-start;align-content:flex-start;}
.ws-answer-area.empty{border-color:#dde;background:#fafafa;}
.ws-token{padding:8px 14px;border-radius:20px;background:#e8f5ee;border:1.5px solid #2d9e6b;color:#1a6b4a;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;line-height:1.3;}
.ws-token:hover{background:#d4edda;transform:translateY(-1px);box-shadow:0 2px 6px rgba(45,158,107,.2);}
.ws-token.in-pool{background:#f0f4f8;border-color:#ccd;color:#555;}
.ws-token.in-pool:hover{background:#e4eaf2;border-color:#2d9e6b;color:#1a6b4a;}
.ws-token.selected{background:#1a6b4a;color:#fff;border-color:#1a6b4a;box-shadow:0 2px 8px rgba(26,107,74,.3);}
.ws-token.selected:hover{background:#1a6b4a;transform:none;}
.ws-correct-box{background:#edfaf3;border-left:4px solid #2d9e6b;border-radius:8px;padding:12px 16px;font-size:15px;color:#1a6b4a;font-weight:700;margin-top:14px;line-height:1.6;}
.ws-wrong-box{background:#fff5f5;border-left:4px solid #e05c5c;border-radius:8px;padding:12px 16px;font-size:14px;color:#555;margin-top:14px;line-height:1.6;}
.ws-wrong-original{color:#1a6b4a;font-style:italic;margin-top:6px;font-size:13px;}
.ws-done{background:#fff;border-radius:14px;padding:50px 30px;text-align:center;border:1px solid #e8ecf0;}
.ws-done-emoji{font-size:60px;margin-bottom:14px;}
.ws-done-score{font-size:28px;font-weight:800;color:#1a6b4a;margin-bottom:6px;}
.ws-done-pct{font-size:17px;color:#888;margin-bottom:28px;}
/* ── Read indicator on text cards ── */
.lesing-read-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;background:#edfaf3;color:#2d9e6b;border:1px solid #b6e8ce;margin-bottom:8px;}
.lesing-unread-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;background:#f5f5f5;color:#bbb;border:1px solid #e0e0e0;margin-bottom:8px;}
/* ── Paywall overlay ── */
.paywall-overlay{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;z-index:2;}
.paywall-overlay .paywall-icon{font-size:28px;}
.paywall-overlay .paywall-title{font-weight:800;font-size:14px;color:#1a1a1a;}
.paywall-overlay .paywall-sub{font-size:12px;color:#666;line-height:1.4;}
.paywall-overlay .paywall-btn{margin-top:4px;padding:8px 18px;background:#1a6b4a;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;}
.paywall-overlay .paywall-btn:hover{background:#15573c;}
/* Subscription status badge in Innstillinger */
.sub-status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:10px;font-size:12px;font-weight:700;}
.sub-status-badge.active{background:#edfaf3;color:#2d9e6b;border:1px solid #b6e8ce;}
.sub-status-badge.inactive{background:#f5f5f5;color:#999;border:1px solid #e0e0e0;}
.sub-status-badge.grace{background:#fff8e1;color:#e6a817;border:1px solid #ffe082;}
.sub-status-badge.cancelled{background:#ffeaea;color:#c0392b;border:1px solid #f5b7b1;}
/* ── Statistics tab ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.stat-box{background:#fff;border-radius:12px;padding:20px 18px;border:1px solid #e8ecf0;text-align:center;}
.stat-box .stat-val{font-size:36px;font-weight:800;color:#1a6b4a;line-height:1;}
.stat-box .stat-lbl{font-size:12px;color:#999;margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.stat-box .stat-sub{font-size:13px;color:#555;margin-top:4px;}
.stat-section{font-size:13px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:.7px;margin:20px 0 10px;}
.stat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.stat-bar-label{font-size:13px;color:#444;min-width:120px;font-weight:600;}
.stat-bar-track{flex:1;background:#eee;border-radius:6px;height:10px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:6px;background:#2d9e6b;transition:width .4s;}
.stat-bar-count{font-size:12px;color:#888;min-width:30px;text-align:right;}
.stat-word-row{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-radius:8px;margin-bottom:4px;font-size:13px;}
.stat-word-row.wrong{background:#fff5f5;color:#c0392b;}
.stat-word-row.right{background:#f0fdf4;color:#1a6b4a;}
.stat-missed-list{max-height:340px;overflow-y:auto;border:1px solid #f5e0e0;border-radius:10px;padding:6px;}
/* ── Donut chart ── */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:8px;}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:150px;}
.donut-legend-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.donut-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.donut-legend-label{color:#555;flex:1;}
.donut-legend-val{font-weight:700;color:#222;}
/* ── FC error-only toggle ── */
.fc-toggle-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff5f5;border-radius:10px;border:1.5px solid #f5cece;margin-bottom:8px;}
.fc-toggle-label{font-size:13px;color:#c0392b;font-weight:600;flex:1;}
.toggle-btn{padding:5px 14px;border-radius:18px;border:1.5px solid #dde;background:#f0f4f8;font-size:12px;font-weight:700;color:#666;cursor:pointer;}
.toggle-btn.on{background:#c0392b;border-color:#c0392b;color:#fff;}
/* ── Plan tab ── */
.plan-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.plan-chip{padding:8px 18px;border-radius:20px;border:1.5px solid #e0e4ec;background:#f5f7fa;font-size:14px;font-weight:600;color:#555;cursor:pointer;transition:all .15s;}
.plan-chip.on{background:#1a6b4a;border-color:#1a6b4a;color:#fff;}
.plan-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.plan-nav-btn{padding:8px 18px;border-radius:9px;border:1.5px solid #e0e4ec;background:#fff;font-size:14px;font-weight:600;color:#555;cursor:pointer;transition:all .15s;}
.plan-nav-btn:hover{background:#f5f7fa;border-color:#2d9e6b;}
.plan-nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.plan-nav-center{flex:1;text-align:center;font-weight:700;font-size:15px;color:#333;}
.plan-week-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8ecf0;}
.plan-week-card.current{border-color:#1a6b4a;border-width:2px;}
.plan-week-hdr{padding:16px 20px;display:flex;align-items:center;gap:14px;background:#f9fafb;}
.plan-week-hdr.current{background:#f0fdf4;}
.plan-week-num{font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.6px;min-width:52px;}
.plan-week-topic{font-weight:800;font-size:16px;flex:1;}
.plan-week-dates{font-size:12px;color:#aaa;}
.plan-week-body{padding:6px 20px 18px;}
.plan-session{padding:12px 0;border-top:1px solid #f3f3f3;}
.plan-session:first-child{border-top:none;padding-top:10px;}
.plan-session-title{font-weight:700;font-size:13px;color:#333;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.plan-done-badge{background:#d4f5e2;color:#1a6b4a;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.plan-text-link{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f0f4ff;border-radius:8px;margin-bottom:5px;cursor:pointer;transition:background .15s;text-decoration:none;}
.plan-text-link:hover{background:#dde8ff;}
.plan-text-link-title{flex:1;font-weight:600;color:#2d4e9e;font-size:13px;}
.plan-text-read{opacity:.6;text-decoration:line-through;}
.plan-go-btn{display:inline-block;margin-top:8px;padding:7px 16px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;background:#1a6b4a;color:#fff;transition:opacity .15s;}
.plan-go-btn:hover{opacity:.88;}
.plan-go-btn.sec{background:#eef2fb;color:#2d4e9e;border:1.5px solid #c5d3f5;}
.plan-go-btn.sec:hover{background:#dce5f8;}
.plan-prog-wrap{background:#e8e8e8;border-radius:6px;height:7px;margin-bottom:3px;overflow:hidden;}
.plan-prog-fill{height:7px;border-radius:6px;background:#1a6b4a;transition:width .4s;}
.plan-summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.plan-summary-box{background:#fff;border-radius:10px;padding:14px 12px;text-align:center;border:1px solid #e8ecf0;}
.plan-summary-val{font-size:22px;font-weight:800;color:#1a6b4a;}
.plan-summary-lbl{font-size:12px;color:#888;margin-top:3px;}
.plan-week-mini{display:flex;gap:4px;align-items:center;padding:8px 12px;border-radius:10px;cursor:pointer;transition:background .15s;font-size:13px;}
.plan-week-mini:hover{background:#f0f4f8;}
.plan-week-mini.cur{background:#e8f5ee;font-weight:700;}
.plan-week-mini-num{min-width:26px;font-size:11px;color:#aaa;font-weight:700;}
.plan-week-mini-topic{flex:1;font-weight:600;}
.plan-week-mini-dots{display:flex;gap:3px;}
.plan-week-mini-dot{width:8px;height:8px;border-radius:50%;background:#eee;}
.plan-week-mini-dot.done{background:#1a6b4a;}
/* ── Print / PDF export ── */
#pdf-print-area{display:none;}
@media print{
  body>*{display:none!important;}
  #pdf-print-area{display:block!important;font-family:'Georgia',serif;max-width:720px;margin:0 auto;padding:20px;}
  #pdf-print-area .pdf-header{border-bottom:2px solid #1a6b4a;padding-bottom:12px;margin-bottom:20px;}
  #pdf-print-area .pdf-app-name{font-size:11px;color:#888;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
  #pdf-print-area .pdf-title{font-size:22px;font-weight:bold;color:#1a1a1a;margin-bottom:4px;}
  #pdf-print-area .pdf-topic{font-size:13px;color:#555;}
  #pdf-print-area .pdf-prompt{background:#f5f5f5;border-left:4px solid #1a6b4a;padding:10px 14px;border-radius:4px;margin-bottom:20px;font-size:13px;line-height:1.6;color:#333;}
  #pdf-print-area .pdf-body{font-size:15px;line-height:1.9;color:#222;white-space:pre-wrap;}
  #pdf-print-area .pdf-footer{border-top:1px solid #ddd;margin-top:24px;padding-top:10px;font-size:11px;color:#aaa;display:flex;justify-content:space-between;}
}
.lookup-status{font-size:12px;margin-top:5px;min-height:16px;line-height:1.5;}
.lookup-status a{color:#1a6b4a;text-decoration:none;font-weight:600;}
.lookup-status a:hover{text-decoration:underline;}
/* ── Sentence practice ── */
.sent-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.sent-progress{font-size:13px;color:#888;}
.sent-progress strong{color:#444;}
.btn-nav{padding:8px 18px;background:#fff;border:1.5px solid #e0e4ec;border-radius:9px;font-size:13px;color:#444;font-weight:600;}
.btn-nav:hover{border-color:#2d9e6b;color:#1a6b4a;}
.btn-nav:disabled{opacity:.3;cursor:default;pointer-events:none;}
.sent-card{background:#fff;border-radius:14px;padding:30px 28px 24px;border:1px solid #e8ecf0;margin-bottom:14px;}
.sent-word{font-size:34px;font-weight:800;color:#1a6b4a;margin-bottom:10px;word-break:break-word;line-height:1.2;}
.sent-meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.sent-cat{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.sent-topic-badge{display:inline-block;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:700;background:#f0e68c;color:#776;}
.sent-meaning{font-size:14px;color:#777;font-style:italic;}
.sent-prompt{font-size:14px;font-weight:600;color:#333;margin-bottom:8px;}
.sent-area{width:100%;padding:14px 16px;border-radius:10px;border:1.5px solid #dde;font-size:15px;line-height:1.6;resize:none;min-height:88px;background:#fff;font-family:inherit;}
.sent-area:focus{border-color:#2d9e6b!important;box-shadow:0 0 0 3px rgba(45,158,107,.13);}
.sent-feedback{font-size:13px;margin-top:10px;min-height:20px;display:flex;align-items:center;gap:8px;}
.sent-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center;}
.btn-next-sent{padding:10px 22px;background:#1a6b4a;border:none;border-radius:9px;font-size:14px;color:#fff;font-weight:700;}
.btn-skip{padding:10px 16px;background:#f5f7fa;border:1.5px solid #e0e4ec;border-radius:9px;font-size:13px;color:#666;font-weight:500;}
.sent-badge{background:#edfaf3;color:#2d9e6b;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.sent-saved-label{font-size:12px;color:#aaa;}
.sent-done-box{background:#fff;border-radius:14px;padding:50px 30px;text-align:center;border:1px solid #e8ecf0;}
.prev-sentences{margin-top:20px;}
.prev-sentences h3{font-size:13px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;}
.prev-sent-item{background:#f8fdf9;border-radius:9px;padding:10px 14px;margin-bottom:8px;border-left:3px solid #2d9e6b;}
.prev-sent-word{font-size:12px;color:#1a6b4a;font-weight:700;margin-bottom:3px;}
.prev-sent-text{font-size:14px;color:#333;line-height:1.5;}
/* ── Flashcards ── */
.fc-setup{background:#fff;border-radius:14px;padding:24px;border:1px solid #e8ecf0;margin-bottom:14px;}
.fc-section-label{font-size:11px;color:#aaa;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:block;}
.fc-mode-row{display:flex;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.fc-mode-btn{flex:1;min-width:180px;padding:14px 16px;border-radius:12px;border:1.5px solid #e0e4ec;background:#f5f7fa;font-size:14px;font-weight:600;color:#555;text-align:left;cursor:pointer;transition:all .2s;}
.fc-mode-btn.active{border-color:#1a6b4a;background:#edfaf3;color:#1a6b4a;}
.fc-mode-btn .mode-icon{font-size:24px;display:block;margin-bottom:6px;}
.fc-mode-btn .mode-desc{font-size:12px;font-weight:400;color:#999;margin-top:3px;}
.fc-mode-btn.active .mode-desc{color:#2d9e6b;}
.fc-filter-bar{background:#f9f9f9;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.fc-score-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:10px 16px;background:#fff;border-radius:10px;border:1px solid #e8ecf0;flex-wrap:wrap;gap:8px;}
.fc-score-nums{display:flex;gap:16px;}
.fc-score-ok{font-size:15px;font-weight:700;color:#2d9e6b;}
.fc-score-err{font-size:15px;font-weight:700;color:#e05c5c;}
.fc-progress-wrap{height:5px;background:#eee;border-radius:4px;margin-bottom:18px;overflow:hidden;}
.fc-progress-fill{height:100%;background:#2d9e6b;border-radius:4px;transition:width .35s;}
.fc-card{background:#fff;border-radius:16px;padding:36px 28px 28px;text-align:center;border:1px solid #e8ecf0;margin-bottom:18px;}
.fc-word{font-size:38px;font-weight:800;color:#1a6b4a;margin-bottom:8px;word-break:break-word;line-height:1.2;}
.fc-sub{font-size:14px;color:#aaa;margin-bottom:6px;font-style:italic;}
.fc-question{font-size:13px;font-weight:600;color:#888;margin-top:10px;text-transform:uppercase;letter-spacing:.4px;}
.fc-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(max-width:520px){.fc-options{grid-template-columns:1fr;}}
.fc-opt{padding:14px 16px;border-radius:10px;border:1.5px solid #e0e4ec;background:#fff;font-size:14px;font-weight:600;color:#333;text-align:center;cursor:pointer;transition:all .15s;line-height:1.4;}
.fc-opt:hover:not([disabled]){border-color:#2d9e6b;background:#edfaf3;color:#1a6b4a;}
.fc-opt.correct{border-color:#2d9e6b!important;background:#edfaf3!important;color:#1a6b4a!important;}
.fc-opt.wrong{border-color:#e05c5c!important;background:#fff5f5!important;color:#e05c5c!important;}
.fc-opt.reveal{border-color:#2d9e6b;background:#f0fdf6;color:#1a6b4a;opacity:.65;}
.fc-opt[disabled]{cursor:default;}
.fc-feedback{text-align:center;margin-bottom:14px;min-height:48px;}
.fc-feedback-ok{font-size:20px;font-weight:800;color:#2d9e6b;margin-bottom:4px;}
.fc-feedback-err{font-size:20px;font-weight:800;color:#e05c5c;margin-bottom:4px;}
.fc-correct-hint{font-size:13px;color:#888;}
.fc-nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-fc-next{padding:12px 32px;background:#1a6b4a;border:none;border-radius:9px;font-size:15px;color:#fff;font-weight:700;cursor:pointer;}
.fc-done{background:#fff;border-radius:14px;padding:50px 30px;text-align:center;border:1px solid #e8ecf0;}
.fc-done-emoji{font-size:60px;margin-bottom:14px;}
.fc-done-score{font-size:28px;font-weight:800;color:#1a6b4a;margin-bottom:6px;}
.fc-done-pct{font-size:17px;color:#888;margin-bottom:28px;}
</style>
</head>
<body>
<div id="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-flag">🇳🇴</div>
    <h2>B2 Norsk Treningsverktøy</h2>
    <p id="login-subtitle">Logg inn med e-postadressen din.</p>
    <input id="reg-name" class="login-input" type="text" placeholder="Ditt navn" autocomplete="name" style="display:none;margin-bottom:10px"/>
    <div id="reg-role" style="display:none;margin-bottom:12px;text-align:left;font-size:14px;color:#444">
      <div style="margin-bottom:6px;font-weight:600">Jeg er:</div>
      <label style="margin-right:20px;cursor:pointer"><input type="radio" name="reg-role-choice" value="student" checked style="margin-right:5px"/>Elev</label>
      <label style="cursor:pointer"><input type="radio" name="reg-role-choice" value="teacher" style="margin-right:5px"/>Lærer</label>
    </div>
    <input id="login-input" class="login-input" type="email" placeholder="E-postadresse" autocomplete="email" autocapitalize="off"/>
    <input id="login-password" class="login-input" type="password" placeholder="Passord" autocomplete="current-password" style="margin-top:10px"/>
    <div id="login-error" style="display:none;color:#c0392b;font-size:13px;margin-top:6px;text-align:center;"></div>

// Deep link into Bokmålsordboka. The old `bm,nn/search?q=` form now 404s, and their
// SPA turns that into a mangled `/bm,nn/undefined/bm,nn/<word>` route rather than an
// error page — so a stale URL here looks like our bug, not theirs.
//
// The infinitive marker is stripped because the dictionary is keyed on the bare
// headword: "å fremme" resolves, but only as a near match, while "fremme" lands on the
// article itself. Feature 013 stores verbs with the marker, so this is now the common
// case rather than an edge one.
function ordbokeneUrl(word){
  const headword=(word||"").trim().replace(/^å\s+/i,"");
  return `https://ordbokene.no/nob/bm,nn/${encodeURIComponent(headword)}`;
}

function learntOriginLabel(w){

    case "not_learnt_manual": return "Du har markert dette ordet som ikke lært. Det blir ikke markert automatisk.";
    default:                  return "Ikke markert som lært.";
  }
}

// A manual mark is terminal against the automatic threshold, in both directions — the
// server records which of the two manual states was chosen, so unmarking survives any
// number of further correct answers.
//
// Applied optimistically: marking words learnt is a sweep down a list, and waiting for
// a round trip per click turns that into a stutter. A failure reverts the card and says
// so, which is a rarer and more visible outcome than a laggy one.
async function setWordLearnt(wordId, learnt){
  const idx=state.words.findIndex(x=>x.id===wordId);
  if(idx<0)return false;
  const before=state.words[idx].learnt_state;
  state.words[idx]={...state.words[idx],learnt_state:learnt?"learnt_manual":"not_learnt_manual"};
  renderWordList();

  const r=await api(`/api/words/${encodeURIComponent(wordId)}/learnt`,
    {method:"PATCH",body:JSON.stringify({learnt})}).catch(()=>null);
  const cur=state.words.findIndex(x=>x.id===wordId);
  if(cur<0)return false; // deleted while the request was in flight
  if(!r||!r.ok){
    state.words[cur]={...state.words[cur],learnt_state:before};
    renderWordList();
    toast("Kunne ikke lagre. Prøv igjen.");
    return false;
  }
  const sv=await r.json();
  state.words[cur]={...state.words[cur],learnt_state:sv.learnt_state,learnt_at:sv.learnt_at};
  saveStorage();
  return true;
}

// ── Word provenance ────────────────────────────────────────────────────────
// A word added while reading records the text it came from. The two kinds live in
// separate id spaces: `builtin` ids index lesing-tekster.json, `custom` ids are the
// `asgn-<item_id>` handles minted in Mine oppgaver for teacher-written texts.
//
// The index is built once per session and only when a word actually has an origin —
// most learners have none, and neither fetch is worth making on their behalf. It is
// deliberately never invalidated: a text's body does not change under a learner.
const sourceTextIndex = {map:null, loading:null};

async function loadSourceTextIndex(){
  if(sourceTextIndex.map) return sourceTextIndex.map;
  if(sourceTextIndex.loading) return sourceTextIndex.loading;
  sourceTextIndex.loading = (async()=>{
    const map={};
    const texts = await loadLesingTexts().catch(()=>[]);
    (texts||[]).forEach(t=>{ map[`builtin:${t.id}`]={...t,isCustom:false}; });
    // Custom texts are only reachable through the assignment that delivered them, so
    // that request is made only when a word actually points into the custom id space —
    // otherwise a built-in origin would wait on a round trip that cannot resolve it.
    const r = state.words.some(w=>w.source_text_kind==="custom")
      ? await api("/api/assignments/mine").catch(()=>null) : null;
    if(r?.ok){
      const assignments = await r.json().catch(()=>[]);
      (assignments||[]).forEach(a=>(a.items||[]).forEach(it=>{
        if(it.item_type!=="reading_text" || it.content?.source==="bank") return;
        map[`custom:asgn-${it.item_id}`]={
          id:`asgn-${it.item_id}`, title:it.content?.title||"Egen tekst",
          topic:it.content?.topic||"", text:it.content?.body||"", isCustom:true,
        };
      }));
    }
    sourceTextIndex.map=map;
    sourceTextIndex.loading=null;
    return map;
  })();
  return sourceTextIndex.loading;
}

// Returns the originating text, or null when the word has no origin or the reference
// no longer resolves — a deleted assignment or a retired text id. Both are silent:
// provenance is a convenience, and an error where a learner expects a word is worse
// than the missing link (FR-041).
function resolveSourceText(w){
  if(!w || !w.source_text_id || !sourceTextIndex.map) return null;
  const kind = w.source_text_kind || "builtin";

/**
 * Returns true if the current user can open a text.
 * Subscribers: always true.
 * Free users: max 3 texts total, max 1 per topic (already-opened texts are always accessible).
 */
function canOpenText(textId, topicKey){
  // Active subscriber — unrestricted
  if(isActiveSubscriber()) return true;
  // Already opened this text — allow re-read
  if(state.freeAccess.openedTexts.includes(textId)) return true;
  // Enforce limits
  if(state.freeAccess.openedTexts.length >= 3) return false;
  if(state.freeAccess.topicsUsed.includes(topicKey)) return false;
  return true;
}

/**
 * Record that a free user has opened a text.
 */
function recordTextOpened(textId, topicKey){
  if(isActiveSubscriber()) return; // subscribers don't need tracking
  if(!state.freeAccess.openedTexts.includes(textId)){
    state.freeAccess.openedTexts.push(textId);
  }
  if(!state.freeAccess.topicsUsed.includes(topicKey)){
    state.freeAccess.topicsUsed.push(topicKey);
  }
  saveFreeAccess(state.userId);
}

/**
 * Returns true if state.subscription grants active subscriber status.
 * Active = status "active", "grace", or "cancelled" with renewalDate still in future.
 */
function isActiveSubscriber(){
  if(!SUBSCRIPTION_ENABLED) return true; // paywall disabled — everyone has full access
  const sub=state.subscription;
  if(!sub) return false;
  if(sub.status==="active"||sub.status==="grace") return true;
  if(sub.status==="cancelled"&&sub.renewalDate){
    return new Date(sub.renewalDate)>new Date();
  }
  return false;
}

// A Claude response can arrive as several text blocks. Reading only content[0]
// silently drops the rest, which shows up as a JSON parse error on a response
// that was actually complete — always concatenate.
function claudeText(data){
  const t = (data?.content||[]).filter(b=>b&&b.type==="text").map(b=>b.text||"").join("");
  return t || "{}";
}

// Snapshot of what Claude actually returned, captured before parsing so a failure
// can be reported precisely.
function claudeDiag(data, systemPrompt, userMsg){
  return {stop:data.stop_reason, usage:data.usage,
    blocks:(data.content||[]).map(b=>b.type).join(","),
    raw:claudeText(data), sysLen:systemPrompt.length, userLen:userMsg.length};
}

// Collapsible technical panel shown after a Claude failure, so the exact stop_reason,

  det.appendChild(el("pre",{style:{whiteSpace:"pre-wrap",wordBreak:"break-word",background:"#faf9f7",padding:"8px",borderRadius:"6px",marginTop:"6px"}},info));

// ── AI feedback transport (feature 015) ───────────────────────────────────
// The three feedback surfaces used to POST straight to /api/proxy/claude, a
// Cloudflare Function that forwarded the body verbatim — model, max_tokens,
// system and messages all the caller's choice, under the operator's credential.
// They now go to the backend, which picks the model and the answer length itself.
// We still compose the wording: the three Norwegian prompts stay here.

// Canonical vocabulary, mirroring AiSurface in backend/app/schemas/ai.py. Both
// literals are spelled the same on purpose — the backend rejects anything else
// with a 422 rather than defaulting, so a typo here fails loudly.
const AI_SURFACE={SENTENCE:"sentence",ESSAY:"essay",READING_SUMMARY:"reading_summary"};

// Which prompt body each surface sends, mirroring `TemplateId` in
// `backend/app/schemas/ai_record.py`. The backend refuses an unregistered id
// rather than guessing, so a typo here fails loudly.
const AI_TEMPLATE={SENTENCE:"sentence_feedback",ESSAY:"essay_feedback",READING_SUMMARY:"reading_summary_feedback"};

// ⚠️ **Bump this whenever one of the three prompt bodies below is edited.** It is
// what the operator sees against a recorded call. It is *not* trusted — the backend
// hashes the body it actually received, so a stale cached build declaring an old
// version is detected rather than believed. Leaving it stale therefore does not
// corrupt the data; it just makes the drift report harder to read.
const AI_TEMPLATE_VERSION="2026-09-04";

// A learner cannot act on the difference between a missing credential, a rejected
// one and an exhausted quota — all three mean "carry on without it". The operator
// gets the distinction from the backend log; the learner gets one honest sentence.
function aiFailureMessage(status, reason, truncatedHint){
  if(status===401) return "Sesjonen er utløpt. Logg inn på nytt.";
  if(reason==="unusable_response" && truncatedHint) return truncatedHint;
  if(status===503) return reason==="quota_exhausted"
    ? "AI-hjelp er midlertidig utilgjengelig. Prøv igjen om litt."
    : "AI-hjelp er ikke tilgjengelig akkurat nå. Du kan fortsette uten den.";
  if(status===502) return "AI-hjelp svarte ikke som forventet. Prøv igjen om litt.";
  return `AI-hjelp feilet (${status}). Prøv igjen om litt.`;
}

// ── Failure reporting (019) ───────────────────────────────────────────────
// The backend records the five failures it classifies itself. This covers the
// ones it cannot see — above all a response that arrives *successfully* and
// then fails to parse, which the server counts as a success and which,
// before this, left no trace anywhere.
//
// Fire-and-forget, exactly like trackEvent: the learner already has an error on
// screen, and a second one caused by the reporting would be strictly worse than
// no report at all.
// A truncated answer and an unparseable one are both "the JSON did not parse",
// but they are different problems: one says ask for less, the other says the
// model returned the wrong shape. `stop_reason` is what tells them apart.
function aiFailureReasonFor(diag){
  return diag && diag.stop === "max_tokens" ? "unusable_response" : "unparseable_response";
}

function reportAiFailure(surface, reason, diag){
  try{
    const body = {surface, reason};
    if(diag){
      // Shape only. `raw` is the model's own answer and is capped here as a
      // courtesy — the backend truncates again, and that is the real limit.
      if(diag.stop) body.stop_reason = String(diag.stop).slice(0,32);
      if(diag.usage){
        body.input_tokens = diag.usage.input_tokens;
        body.output_tokens = diag.usage.output_tokens;
      }
      if(typeof diag.sysLen === "number") body.system_len = diag.sysLen;
      if(typeof diag.userLen === "number") body.user_len = diag.userLen;
      if(typeof diag.raw === "string"){
        body.response_len = diag.raw.length;
        body.response_excerpt = diag.raw.slice(-400);
      }
    }
    return api("/api/ai/failures", {method:"POST", body:JSON.stringify(body)})
      .then(()=>null).catch(()=>null);
  }catch(e){ return Promise.resolve(null); }
}

// Throws an Error whose message is already learner-ready Norwegian, flagged with
// `aiHandled` so the catch block prints it as-is instead of wrapping a raw
// technical string in "❌ Feil: ...".
// `systemBase` is the prompt body **without** the teacher steering block — the
// backend resolves that itself and composes the two (feature 020). `meta` carries
// the template identity and, where one exists, a reference to the content the call
// is about.
//
// ⚠️ `meta.contentKind` is required by convention; a content **id** is not, and
// usually cannot be given. All three surfaces ask for feedback before the thing
// being assessed is saved — an essay lives in localStorage until after the reply
// arrives — so "essay, no id" is the ordinary case, not a gap to fill in.
//
// ⚠️ This shape needs a backend from 2026-09-04 or later. Deploy the backend
// first; an older one answers 422 because it has nowhere to put `system_base`.
async function requestAiFeedback(surface, systemBase, userMsg, truncatedHint, meta){
  meta = meta || {};
  const res=await api("/api/ai/feedback",{
    method:"POST",
    body:JSON.stringify({
      surface,
      template_id: meta.templateId,
      template_version: AI_TEMPLATE_VERSION,
      system_base: systemBase,
      content_kind: meta.contentKind,
      essay_id: meta.essayId || null,
      sentence_id: meta.sentenceId || null,
      word_id: meta.wordId || null,
      reading_text_id: meta.readingTextId || null,
      messages:[{role:"user",content:userMsg}],
    }),
  });
  if(!res.ok){
    const body=await res.json().catch(()=>({}));
    const err=new Error(aiFailureMessage(res.status, body?.detail?.reason||"", truncatedHint));
    err.aiHandled=true;
    throw err;
  }
  return res.json();
}

async function saveCurrentEssay(){
  const ta=$("essay-ta");
  const essayText=(ta?ta.value:state.essay).trim();
  if(!essayText){toast("Ingen tekst å lagre – skriv noe først!");return;}
  const bank=loadEssayBank();
  const promptId=state.currentPrompt?.id||"";
  const snippet=essayText.substring(0,80);
  const existIdx=bank.findIndex(e=>e.promptId===promptId&&e.text.substring(0,80)===snippet);
  const entry={
    id: existIdx>=0?bank[existIdx].id:"essay_"+Date.now(),
    title: state.currentPrompt?.title||"Uten tittel",
    topic: state.currentTopic||"",
    topicName: state.currentTopic?(TOPICS[state.currentTopic]?.name||state.currentTopic):"",
    promptId,
    promptText: state.currentPrompt?.text||"",
    text: essayText,
    wordCount: wcCount(essayText),
    savedAt: new Date().toISOString(),
    claudeLevel: null,
  };
  if(existIdx>=0){ bank[existIdx]=entry; }else{ bank.unshift(entry); }
  saveEssayBank(bank);
  // Sync to server (fire-and-forget; on success update local id with server id)
  try{
    const r = await api("/api/essays",{method:"POST",body:JSON.stringify({
      title:entry.title, text:entry.text,
      topic:entry.topic||"annet",
      prompt_id:entry.promptId||null,
      claude_level:entry.claudeLevel||null,
      claude_feedback:entry.claudeFeedback||null,
    })});
    if(r.ok){
      const sv=await r.json();
      const b=loadEssayBank();
      const i=b.findIndex(e=>e.id===entry.id);
      if(i>=0){b[i].id=sv.id; saveEssayBank(b);}
    }
  }catch{}
  trackEvent("essay_saved",{title:entry.title,topic:entry.topic,topicName:entry.topicName,wordCount:entry.wordCount,promptId:entry.promptId});
  toast("✅ Essayet er lagret!");
  refreshEssayBank();
}

function deleteEssay(id){

  refreshEssayBank();
  api(`/api/essays/${encodeURIComponent(id)}`,{method:"DELETE"}).catch(()=>{});
}

async function loadEssayIntoEditor(entry){
  state.essay=entry.text;
  state.loadedEssayReview=entry.teacherReview||null;
  const ta=$("essay-ta"); if(ta) ta.value=entry.text;
  // Restore topic/prompt if different
  if(entry.topic && TOPICS[entry.topic]){
    state.currentTopic=entry.topic;
    const prompts=PROMPTS[entry.topic]||[];
    const found=prompts.find(p=>p.id===entry.promptId||p.text===entry.promptText);
    if(found) state.currentPrompt=found; else if(prompts.length) state.currentPrompt=prompts[0];
  }
  updateWritePanel();
  renderTabs(); renderContent();

  // Restore saved Claude feedback if available
  if(entry.claudeFeedback){
    try{
      const result = typeof entry.claudeFeedback==="string" ? JSON.parse(entry.claudeFeedback) : entry.claudeFeedback;
      const container=$("essay-grammar-result");
      if(container){ container.style.display="block"; renderEssayClaudeResult(result, container); }
    }catch{}
  }

  // If no teacher review cached, fetch fresh from server in case it was added since last sync
  if(!entry.teacherReview && entry.id && !entry.id.startsWith("essay_")){
    const r = await api("/api/essays").catch(()=>null);
    if(r?.ok){
      const essays = await r.json().catch(()=>null);
      const fresh = Array.isArray(essays) && essays.find(e=>e.id===entry.id);
      if(fresh?.teacher_review){
        state.loadedEssayReview = fresh.teacher_review;
        renderContent();
      }
    }
  }

  toast("📂 Essay lastet inn!");
}

// ── MINI DOM HELPER ───────────────────────────────────────────────────
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class") e.className=v;
    else if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(typeof v==="function") e.addEventListener(k,v);
    else if(v!==null&&v!==undefined&&v!==false) e.setAttribute(k,v);
  }
  kids.flat(3).forEach(c=>{ if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
const $=id=>document.getElementById(id);

let toastTimer;
function toast(msg){

}

function setTab(tab){
  state.tab=tab;
  if(tab==="statistik"||tab==="plan"||tab==="mineoppgaver") statsCache=null;
  // Opening Statistikk is the only "use" that tab has — there is nothing to
  // submit — so the tab switch is the event.
  if(tab==="statistik") trackEvent("statistikk.viewed",{});
  renderTabs(); renderContent();
  // Opening Ordbank re-reads the bank from the server. Words can arrive without the
  // learner doing anything — a teacher pushing a word list, or a classmate's shared
  // word being accepted — and before this the only refresh was at login, so a
  // teacher-assigned list stayed invisible until the student logged out and back in.
  if(tab==="ordbank" && state.sessionToken){
    syncWordsFromServer();
    if(state.userRole !== "teacher") refreshSharing().then(()=>{
      // The inbox is rendered inline in Ordbank rather than behind a click, so
      // arriving here with pending offers *is* opening it. Recorded on the tab
      // switch, not in the panel builder — that runs on every re-render.
      const pending = pendingShareCount();
      if(pending) trackEvent("ordbank.inbox_opened",{pending});
      renderContent();
    });
  }
}

// Pending words a classmate has offered. Nothing here has touched the learner's
// bank: an offer becomes a word only when they press "Legg til".
function buildSharedInboxPanel(){
  const inbox = state.sharedInbox;
  if(!inbox || !inbox.items || !inbox.items.length) return null;

  const card = el("div",{class:"card",style:{borderLeft:"4px solid #1a6b4a"}});
  const hdr = el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",marginBottom:"10px"}});
  hdr.appendChild(el("h2",{style:{margin:0,fontSize:"18px"}},
    `📬 Delte ord fra klassen (${inbox.items.length})`));
  hdr.appendChild(el("span",{style:{flex:"1"}}));

  async function bulk(action){
    const label = action==="accept" ? "Legge til alle i ordbanken?" : "Forkaste alle?";
    if(!confirm(label)) return;
    const r = await api("/api/me/shared-words/bulk",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({action})}).catch(()=>null);
    if(!r?.ok){ toast("Kunne ikke oppdatere"); return; }
    const res = await r.json();
    if(action==="accept"){
      const dup = res.duplicates ? ` (${res.duplicates} hadde du fra før)` : "";
      toast(`La til ${res.accepted} ord${dup}`);
    } else toast(`Forkastet ${res.discarded} ord`);
    await syncWordsFromServer();
    await refreshSharing();
    renderContent();
  }
  hdr.appendChild(el("button",{style:{fontSize:"12px",padding:"4px 10px"},
    click:()=>bulk("accept")},"Legg til alle"));
  hdr.appendChild(el("button",{style:{fontSize:"12px",padding:"4px 10px"},
    click:()=>bulk("discard")},"Forkast alle"));
  card.appendChild(hdr);

  inbox.items.forEach(item=>{
    const row = el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",
      padding:"8px 0",borderBottom:"1px solid #f0f0f0"}});
    const info = el("div",{style:{flex:"1",minWidth:"180px"}});
    const title = el("div",{style:{fontWeight:"600"}},$esc(item.word));
    if(item.already_in_bank){
      title.appendChild(el("span",{style:{marginLeft:"8px",fontSize:"11px",color:"#8a6d3b",
        background:"#fcf8e3",padding:"2px 6px",borderRadius:"8px"}},"allerede i ordbanken din"));
    }
    info.appendChild(title);
    info.appendChild(el("div",{style:{fontSize:"13px",color:"#888"}},
      `${$esc(item.meaning||"")} · ${$esc(item.topic||"")} · fra ${$esc(item.sender_name)}`));
    row.appendChild(info);

    async function resolve(action){
      const r = await api(`/api/me/shared-words/${encodeURIComponent(item.id)}/${action}`,
        {method:"POST"}).catch(()=>null);
      if(!r?.ok){
        // 409 means the sender is no longer a classmate — the offer lapsed while the
        // list was on screen. Say so plainly rather than showing a generic failure.
        toast(r?.status===409 ? "Dette ordet er ikke lenger tilgjengelig" : "Kunne ikke oppdatere");
        await refreshSharing(); renderContent(); return;
      }
      if(action==="accept"){
        const res = await r.json();
        toast(res.duplicate ? "Du hadde dette ordet fra før" : "Lagt til i ordbanken");
        await syncWordsFromServer();
      }
      await refreshSharing();
      renderContent();
    }
    row.appendChild(el("button",{class:"btn-cta",style:{fontSize:"12px",padding:"4px 10px"},
      click:()=>resolve("accept")},"Legg til"));
    row.appendChild(el("button",{style:{fontSize:"12px",padding:"4px 10px"},
      click:()=>resolve("discard")},"Forkast"));
    card.appendChild(row);
  });
  return card;
}

// Filter chips call renderWordList() but not renderContent(), so the share row —
// which lives in the filter block — has to refresh itself rather than wait for a
// full rebuild. Rebuilding the whole Ordbank here would also wipe whatever the
// learner had typed into the add-word form.
function refreshShareBar(){
  const old = document.getElementById("share-bar");
  if(old) old.replaceWith(buildShareBar());
}

// The filters propose a selection; the learner disposes. Opening the share row ticks
// everything the filters currently show, and each word can then be unticked (or a
// hidden one is simply not in play). Changing a filter re-seeds, because a new filter
// is a new intention — otherwise stale ticks from a previous topic would ride along
// invisibly.
function shareFilterKey(){
  return [state.topicFilter,state.search,state.practicedFilter,state.learntFilter,state.timeFilter].join("|");
}

// The per-send cap exists to stop one classmate filling another's inbox. A teacher
// writes into a bank, not into an inbox, so nothing there needs capping.
function shareCap(){
  return state.userRole === "teacher" ? Infinity : MAX_SHARE_WORDS;
}

function shareSeedIfNeeded(){
  const key = shareFilterKey();
  if(state.shareSelected && state.shareSeedKey === key) return;
  state.shareSeedKey = key;
  state.shareSelected = new Set(getFilteredWords().slice(0,shareCap()).map(w=>w.id));
}

// What would actually be sent: ticked *and* currently visible, so the request can
// never include a word the learner cannot see.
function shareSelectedVisible(){
  if(!state.shareOpen || !state.shareSelected) return [];
  return getFilteredWords().filter(w=>state.shareSelected.has(w.id)).slice(0,shareCap());
}

function toggleShareWord(id){
  if(!state.shareSelected) return;
  if(state.shareSelected.has(id)) state.shareSelected.delete(id);
  else {
    if(state.shareSelected.size >= shareCap()){
      toast(`Maks ${MAX_SHARE_WORDS} ord per sending`);
      return;
    }
    state.shareSelected.add(id);
  }
  renderWordList();
}

// FastAPI returns a plain string `detail` for our own errors but a list of objects for
// a schema rejection. Rendering the latter straight into a toast prints "[object
// Object]" and hides the actual complaint.
function apiErrorText(detail, fallback){
  if(typeof detail === "string") return detail;
  if(Array.isArray(detail) && detail[0]?.msg) return detail[0].msg;
  return fallback;
}

// One share bar, two verbs. Picking the words is the same act for both roles, so the
// selection UI is shared; what happens on send is not, and the wording must not
// pretend otherwise. A student *offers* — nothing reaches the recipient's bank until
// they press "Legg til". A teacher *writes* — straight into the bank, no accept step.
// That asymmetry is authority versus suggestion, and is deliberate; do not collapse it
// by giving both roles the same button label.
function shareModeConfig(){
  if(state.userRole === "teacher"){
    const students = teacherState.students;
    if(students === null) return null;              // roster not loaded yet
    return {
      teacher: true,
      kicker: "SEND:",
      blocked: students.length ? "" :
        "Du har ingen elever ennå — legg dem til under «Klassen min».",
      recipients: students,
      openLabel: "📤 Send ord til elevene",
      closeLabel: "📤 Avbryt sending",
      allLabel: "Alle elever",
      sendLabel: "Send til ordbank",
      nothingToSend: "Ingen ord matcher filtrene dine, så det er ingenting å sende.",
      nonePicked: "Ingen ord er valgt. Klikk på ordene du vil sende, eller bruk «Velg alle».",
      send: sendWordsAsTeacher,
    };
  }
  const mine = state.myClass;
  if(!mine) return null;                            // not loaded yet
  return {
    teacher: false,
    kicker: "DEL:",
    // Both empty states are explained rather than hidden. A control that simply
    // vanishes is unexplainable to a learner whose teacher can change the situation.
    blocked: !mine.class ? "Du er ikke i en klasse ennå — da har du ingen å dele med."
           : !mine.classmates.length ? `Du er alene i «${$esc(mine.class.name)}» akkurat nå.`
           : "",
    recipients: mine.classmates,
    openLabel: "🤝 Del ord med klassen",
    closeLabel: "🤝 Avbryt deling",
    allLabel: "Hele klassen",
    sendLabel: "Send",
    nothingToSend: "Ingen ord matcher filtrene dine, så det er ingenting å dele.",
    nonePicked: "Ingen ord er valgt. Klikk på ordene du vil dele, eller bruk «Velg alle».",
    send: shareWordsWithClassmates,
  };
}

// Both senders return {ok, message} so buildShareBar never has to know which endpoint
// it just called.
async function shareWordsWithClassmates(words, recipientIds){
  const r = await api("/api/me/shared-words",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({word_ids:words.map(w=>w.id), recipient_ids:recipientIds})
  }).catch(()=>null);
  if(!r?.ok){
    const d = await r?.json().catch(()=>null);
    return {ok:false, message: apiErrorText(d?.detail,"Kunne ikke dele ordene")};
  }
  const res = await r.json();
  // Report the parts separately: a full inbox refuses one classmate while the rest
  // succeeds, and a bare "sent" would hide that.
  let msg = `Delte ${res.sent} ord`;
  if(res.skipped_duplicates) msg += ` · ${res.skipped_duplicates} var sendt fra før`;
  if(res.refused?.length) msg += ` · ${res.refused.length} har full innboks`;
  return {ok:true, message:msg};
}

// The words travel with the category and topic they already carry in the teacher's own
// bank, so one send can span several topics. The form this replaced could not: it
// stamped a single topic onto every word in the send.
async function sendWordsAsTeacher(words, studentIds, includeTranslation){
  const payload = words.map(w=>({
    word: w.word,
    meaning: w.meaning || "",
    // The backend rejects a category or topic outside its own valid set rather than
    // defaulting to one, after teacher-pushed words with an unknown category landed in
    // student banks and were never rendered. Legacy bank rows — category "temaord", a
    // blank topic — are mapped here so they stay sendable.
    category: CAT_MAP[w.category] ? w.category : "enkeltord",
    topic: VALID_TOPIC_LIST.includes(w.topic) ? w.topic : FALLBACK_TOPIC,
  }));
  const r = await api("/api/teacher/students/words/bulk",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({student_ids:studentIds, all_students:false,
      include_translation:includeTranslation, words:payload})
  }).catch(()=>null);
  if(!r?.ok){
    const d = await r?.json().catch(()=>null);
    return {ok:false, message: apiErrorText(d?.detail,"Kunne ikke sende ordene")};
  }
  const d = await r.json();
  let msg = `Ord sendt til ${d.student_count} elev${d.student_count===1?"":"er"} (${d.inserted} nye)`;
  if(d.skipped_duplicates) msg += ` · ${d.skipped_duplicates} hadde dem fra før`;
  return {ok:true, message:msg};
}

// Sharing lives with the filters, because the filters are what propose the selection:
// whatever the Ordbank is showing is what gets ticked. There is no second word list,
// so nothing can disagree with what is on screen.
function buildShareBar(){
  // Always an element, never null. refreshShareBar() replaces this node in place, so a
  // bar that returned nothing while its recipients were still loading could never
  // appear once they arrived — there would be no node left to replace.
  const bar = el("div",{id:"share-bar",class:"topic-filter-bar",style:{marginBottom:"8px",flexWrap:"wrap"}});
  const cfg = shareModeConfig();
  if(!cfg){ bar.style.display="none"; return bar; }
  const cap = shareCap();

  bar.appendChild(el("span",{style:{fontSize:"11px",color:"#aaa",fontWeight:"700",
    textTransform:"uppercase",letterSpacing:".5px",marginRight:"6px",alignSelf:"center"}},cfg.kicker));

  if(cfg.blocked){
    bar.appendChild(el("span",{style:{fontSize:"12px",color:"#888",alignSelf:"center"}},cfg.blocked));
    return bar;
  }

  const visible = getFilteredWords();

  bar.appendChild(el("button",{class:"topic-chip"+(state.shareOpen?" active":""),
    click(){
      state.shareOpen=!state.shareOpen;
      if(state.shareOpen) shareSeedIfNeeded();
      renderWordList();
    }},
    state.shareOpen ? cfg.closeLabel : cfg.openLabel));

  if(!state.shareOpen){
    if(visible.length){
      bar.appendChild(el("span",{style:{fontSize:"12px",color:"#888",alignSelf:"center"}},
        `${Math.min(visible.length,cap)} ord klare — filtrene bestemmer utvalget`));
    }
    return bar;
  }

  shareSeedIfNeeded();
  const chosen = shareSelectedVisible();

  bar.appendChild(el("span",{style:{fontSize:"12px",color:"#888",alignSelf:"center"}},
    `${chosen.length} av ${visible.length} valgt`));

  // Velg alle / Fjern alle over the filtered set. Clicking a word card toggles it
  // individually — see renderWordList().
  const allOn = visible.length>0 && chosen.length >= Math.min(visible.length,cap);
  bar.appendChild(el("button",{class:"topic-chip",
    click(){
      if(allOn) state.shareSelected = new Set();
      else state.shareSelected = new Set(visible.slice(0,cap).map(w=>w.id));
      renderWordList();
    }}, allOn ? "Fjern alle" : "Velg alle"));

  if(visible.length > cap){
    // Say both numbers. Not silent truncation — the cap is what stops one classmate
    // filling another's inbox, and hiding it would make the result confusing.
    bar.appendChild(el("span",{style:{fontSize:"12px",color:"#8a6d3b",alignSelf:"center"}},
      `⚠ maks ${cap} av ${visible.length}`));
  }

  const panel = el("div",{style:{width:"100%",marginTop:"8px",padding:"10px",
    background:"#f7faf9",border:"1px solid #dde",borderRadius:"8px"}});

  if(!visible.length){
    panel.appendChild(el("p",{style:{margin:0,fontSize:"13px",color:"#888"}},cfg.nothingToSend));
    bar.appendChild(panel);
    return bar;
  }
  if(!chosen.length){
    panel.appendChild(el("p",{style:{margin:0,fontSize:"13px",color:"#888"}},cfg.nonePicked));
    bar.appendChild(panel);
    return bar;
  }

  // Sending without the translations makes the student look each word up — a real
  // teaching choice, and the one control the old Gi oppgave form had that the bank
  // words do not carry themselves.
  let transCb = null;
  if(cfg.teacher){
    transCb = el("input",{type:"checkbox",id:"share-trans"}); transCb.checked = true;
    const transRow = el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px"}});
    transRow.appendChild(transCb);
    transRow.appendChild(el("label",{for:"share-trans",style:{fontSize:"13px",cursor:"pointer"}},
      "Inkluder oversettelse"));
    panel.appendChild(transRow);
  }

  panel.appendChild(el("div",{style:{fontWeight:"600",fontSize:"13px",marginBottom:"6px"}},"Send til:"));
  const allCb = el("input",{type:"checkbox",id:"share-all"});
  const mateCbs = [];
  function picked(){
    return allCb.checked ? cfg.recipients.map(m=>m.id)
                         : mateCbs.filter(({cb})=>cb.checked).map(({id})=>id);
  }
  function sync(){ sendBtn.disabled = picked().length===0; }

  const allRow = el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"4px"}});
  allCb.addEventListener("change",()=>{ mateCbs.forEach(({cb})=>{cb.checked=allCb.checked;}); sync(); });
  allRow.appendChild(allCb);
  allRow.appendChild(el("label",{for:"share-all",style:{fontSize:"13px",fontWeight:"600",cursor:"pointer"}},cfg.allLabel));
  panel.appendChild(allRow);

  // A teacher may have several classes; a student sees only their own classmates and
  // so has nothing to narrow down.
  if(cfg.teacher){
    const classRow = buildClassQuickSelect(cfg.recipients,(ids)=>{
      const want = new Set(ids);
      mateCbs.forEach(({cb,id})=>{ cb.checked = want.has(id); });
      allCb.checked = cfg.recipients.length>0 && cfg.recipients.every(s=>want.has(s.id));
      sync();
    });
    if(classRow) panel.appendChild(classRow);
  }

  cfg.recipients.forEach(m=>{
    const id="share-m-"+m.id.replace(/[^a-z0-9]/gi,"-");
    const cb=el("input",{type:"checkbox",id});
    cb.addEventListener("change",()=>{
      allCb.checked = mateCbs.every(({cb:c})=>c.checked);
      sync();
    });
    mateCbs.push({cb,id:m.id});
    const row=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"4px"}});
    row.appendChild(cb);
    row.appendChild(el("label",{for:id,style:{fontSize:"13px",cursor:"pointer"}},$esc(m.name)));
    panel.appendChild(row);
  });

  const sendBtn = el("button",{class:"btn-cta",style:{marginTop:"10px"},disabled:true,
    click: async ()=>{
      const recipients = picked();
      if(!recipients.length) return;
      // Re-read at click time: both the filters and the ticks may have changed since
      // the panel opened, and what is marked on screen is what the sender means.
      const words = shareSelectedVisible();
      if(!words.length) return;
      sendBtn.disabled=true; sendBtn.textContent="Sender…";
      const res = await cfg.send(words, recipients, transCb ? transCb.checked : true);
      sendBtn.textContent=cfg.sendLabel;
      if(!res.ok){
        toast(res.message);
        sendBtn.disabled=false;
        return;
      }
      toast(res.message);
      state.shareOpen=false;
      state.shareSelected=null; state.shareSeedKey=null;   // next open re-seeds
      renderContent(); renderWordList();
    }},cfg.sendLabel);
  panel.appendChild(sendBtn);
  bar.appendChild(panel);
  return bar;
}

  // ── Filter section (topic + time) + print buttons ──
  if(state.words.length>0){

        topicBar.appendChild(el("button",{class:"topic-chip"+(state.topicFilter===val?" active":""),

      });
      filterSection.appendChild(topicBar);
    }

    // Practiced filter row
    const pracBar=el("div",{class:"topic-filter-bar",style:{marginBottom:"8px"}});
    pracBar.appendChild(el("span",{style:{fontSize:"11px",color:"#aaa",fontWeight:"700",textTransform:"uppercase",letterSpacing:".5px",marginRight:"6px",alignSelf:"center"}},"ØVELSE:"));

          e.currentTarget.classList.add('active');
          if(val) loadStats().then(()=>renderWordList()); else renderWordList();
        }},label));
    });
    filterSection.appendChild(pracBar);

    // Learnt filter row. Deliberately always present and without a hidden-count in the

    const learntBar=el("div",{class:"topic-filter-bar",style:{marginBottom:"8px"}});
    learntBar.appendChild(el("span",{style:{fontSize:"11px",color:"#aaa",fontWeight:"700",textTransform:"uppercase",letterSpacing:".5px",marginRight:"6px",alignSelf:"center"}},"LÆRT:"));
    [["","Alle ord"],["hide_learnt","Skjul lærte"]].forEach(([val,label])=>{
      learntBar.appendChild(el("button",{class:"topic-chip"+(state.learntFilter===val?" active":""),
        click(e){
          state.learntFilter=val;
          e.currentTarget.parentNode.querySelectorAll('.topic-chip').forEach(b=>b.classList.remove('active'));
          e.currentTarget.classList.add('active');
          renderWordList();
        }},label));
    });
    filterSection.appendChild(learntBar);

    // Time filter row
    const timeBar=el("div",{class:"topic-filter-bar",style:{marginBottom:"8px"}});
    timeBar.appendChild(el("span",{style:{fontSize:"11px",color:"#aaa",fontWeight:"700",textTransform:"uppercase",letterSpacing:".5px",marginRight:"6px",alignSelf:"center"}},"TID:"));
    [[0,"Alle"],[7,"Siste 7 dager"],[30,"Siste 30 dager"],[90,"Siste 3 måneder"]].forEach(([val,label])=>{
      timeBar.appendChild(el("button",{class:"topic-chip"+(state.timeFilter===val?" active":""),
        click(e){state.timeFilter=val;e.currentTarget.parentNode.querySelectorAll('.topic-chip').forEach(b=>b.classList.remove('active'));e.currentTarget.classList.add('active');renderWordList();}},label));
    });
    filterSection.appendChild(timeBar);

    // Share row (feature 018). Sits with the filters because the filters are what
    // decide *what* gets shared — there is no separate word picker, and no way for
    // the two to disagree about which words are in play. Serves both roles: a student
    // offers words to classmates, a teacher pushes them into students' banks.
    filterSection.appendChild(buildShareBar());
    // A teacher reaches Ordbank straight from the sidebar, so the recipient list has to
    // load itself rather than assume the roster view has already run. Until it lands the
    // row renders hidden, then swaps itself in.
    if(state.userRole==="teacher") ensureTeacherRoster().then(refreshShareBar);

    // Print buttons row
    const printBar=el("div",{class:"io-bar",style:{marginBottom:"0",paddingTop:"4px"}});
    printBar.appendChild(el("button",{class:"btn-io",click(){printWords("cloud");}},"🖨️ Skriv ut ordsky"));
    printBar.appendChild(el("button",{class:"btn-io",click(){printWords("list");}},"🖨️ Skriv ut ordliste"));
    filterSection.appendChild(printBar);

    frag.appendChild(filterSection);
  }

  // ── Import / Export bar ──
  const ioBar=el("div",{class:"io-bar"});
  ioBar.appendChild(el("button",{class:"btn-io",click:exportWords},"⬇️ Eksporter ordbank"));

  ioBar.appendChild(el("span",{class:"io-hint"},"JSON, CSV, eller tekst (ett ord per linje)"));
