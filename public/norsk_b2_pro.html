    click:()=>laererSetView("progress")},"← Tilbake"));
  frag.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"var(--s-1)"}},`Gjenfortellinger: ${$esc(s?.name||"")}`));

  const wrap = el("div",{style:{display:"flex",flexDirection:"column",gap:"var(--s-3)"}});
  frag.appendChild(wrap);

  async function load(){
    if(!teacherState.studentSummaries){
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/reading-summaries`).catch(()=>null);
      teacherState.studentSummaries = r?.ok ? await r.json() : [];
    }
    wrap.innerHTML="";
    if(!teacherState.studentSummaries.length){
      wrap.appendChild(el("p",{class:"card__note"},"Ingen gjenfortellinger skrevet ennå.")); return;
    }

    // Load texts so we can show titles
    const texts = await loadLesingTexts().catch(()=>[]);
    const textMap = Object.fromEntries((texts||[]).map(t=>[t.id,t]));

    // Custom texts a teacher assigned are opened as `asgn-<item_id>` (see setLesingText in
    // Mine oppgaver) and are not in lesing-tekster.json, so their titles have to come from
    // the assignments themselves — otherwise the card falls back to showing the raw id.
    const ar = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/assignments`).catch(()=>null);
    if(ar?.ok){
      const assignments = await ar.json().catch(()=>[]);
      (assignments||[]).forEach(a=>(a.items||[]).forEach(it=>{
        if(it.item_type!=="reading_text") return;
        textMap[`asgn-${it.item_id}`] = {title:it.content?.title||"Egen tekst", topic:it.content?.topic||""};
      }));
    }

    const note = el("p",{class:"card__note",style:{margin:"var(--s-1) 0 var(--s-1)"}});
    note.textContent=`${teacherState.studentSummaries.length} gjenfortelling${teacherState.studentSummaries.length!==1?"er":""}`;
    wrap.appendChild(note);

    teacherState.studentSummaries.forEach(sm=>{
      const tx = textMap[sm.text_id];
      const card = el("div",{class:"card"});

      // Header: text title + topic badge + date
      const hdr = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",flexWrap:"wrap",marginBottom:"var(--s-3)"}});
      hdr.appendChild(el("span",{class:"card__title",style:{fontSize:"14.5px",flex:"1"}},$esc(tx?.title||sm.text_id)));
      if(tx?.topic){ const tema=topicTema(tx.topic); hdr.appendChild(el("span",{class:"tag",style:{background:tema.bg,color:tema.fg}},$esc(tx.topic))); }
      hdr.appendChild(el("span",{class:"card__note"},new Date(sm.updated_at).toLocaleDateString("nb-NO")));
      card.appendChild(hdr);

      // Summary text
      const textBox = el("div",{style:{background:"var(--surface-head)",borderRadius:"var(--r-btn)",padding:"12px 14px",fontSize:"var(--t-base)",lineHeight:"1.7",color:"var(--ink)",whiteSpace:"pre-wrap",fontFamily:"Georgia,serif",marginBottom:sm.claude_feedback?"var(--s-3)":"0"}});
      textBox.textContent=sm.summary_text;
      card.appendChild(textBox);

      // AI feedback (if present)
      if(sm.claude_feedback){
        try{
          const parsed=JSON.parse(sm.claude_feedback);
          const fbContainer=el("div",{});
          renderGjenfortellResult(parsed,fbContainer);
          card.appendChild(fbContainer);
        }catch{
          const raw=el("p",{class:"card__note",style:{marginTop:"var(--s-2)",whiteSpace:"pre-wrap"}});
          raw.textContent=sm.claude_feedback;
          card.appendChild(raw);
        }
        card.appendChild(buildAiRatingWidget("retell", sm.text_id));
      }

      wrap.appendChild(card);
    });
  }
  load();
  return frag;
}

// Escape helper (used in teacher dashboard if not already defined globally)
function $esc(str){ return String(str||""); }

// ── MINE OPPGAVER TAB (student plan replacement) ───────────────────────────

// B2 Norsk design system: no icon in the heading itself (§ "Icons"), type
// badges use .tag (they carry load-bearing meaning — distinguishing an
// assignment item's kind — same as Mine oppgaver's badges always have, per
// feature 025's icon-usage rule), done state is .status, actions are
// .btn/.btn--primary/.btn (outline for the secondary "Marker som gjort").
function buildMineOppgaver(){
  const frag = document.createDocumentFragment();
  frag.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"var(--s-3)"}},"Mine oppgaver"));

  const wrap = el("div",{});
  frag.appendChild(wrap);

  const ITEM_TYPE_META = {
    word_list:    {label:"Ordliste",       iconName:"words"},
    reading_text: {label:"Lesetekst",      iconName:"book"},
    essay:        {label:"Skriveoppgave",  iconName:"pen"},
  };

  async function load(){
    wrap.innerHTML = "";
    const r = await api("/api/assignments/mine").catch(()=>null);
    if(!r?.ok){
      wrap.appendChild(el("p",{class:"card__note"},"Kunne ikke laste oppgaver."));
      return;
    }
    const assignments = await r.json();
    if(!assignments.length){
      // "Empty because new" (§ "Empty and loading states") — nothing to add
      // here, assignments come from a teacher, so no primary action to offer.
      wrap.appendChild(el("div",{class:"card",style:{textAlign:"center",padding:"32px 20px"}},
        el("p",{class:"card__sub"},"Ingen oppgaver ennå.")));
      return;
    }
    assignments.forEach(asgn => {
      const card = el("div",{class:"card",style:{marginBottom:"var(--s-3)"}});
      // Assignment header
      const asgnHdr = el("div",{style:{display:"flex",alignItems:"baseline",gap:"10px",marginBottom:"var(--s-3)",flexWrap:"wrap"}});
      asgnHdr.appendChild(el("span",{class:"card__title"}, $esc(asgn.label || "Oppgave")));
      asgnHdr.appendChild(el("span",{class:"card__note"},
        "Fra: "+$esc(asgn.teacher_name)+" · "+new Date(asgn.assigned_at).toLocaleDateString("nb-NO")));
      card.appendChild(asgnHdr);

      asgn.items.forEach(item => {
        const itemWrap = el("div",{style:{
          borderTop:"1px solid var(--line-soft)",paddingTop:"var(--s-3)",marginTop:"4px",
          opacity: item.done ? "0.6" : "1",
        }});

        // Type badge — load-bearing (the only signal of an item's kind in this
        // list), so it keeps its icon per the icon-usage rule.
        const meta = ITEM_TYPE_META[item.item_type] || ITEM_TYPE_META.essay;
        const badgeRow = el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"var(--s-2)"}});
        const typeTag = el("span",{class:"tag",style:{display:"inline-flex",alignItems:"center",gap:"5px"}});
        typeTag.appendChild(icon(meta.iconName));
        typeTag.appendChild(document.createTextNode(meta.label));
        badgeRow.appendChild(typeTag);
        if(item.done){
          const doneStatus=el("div",{class:"status status--learned"});
          doneStatus.appendChild(el("span",{class:"status__dot"}));
          doneStatus.appendChild(document.createTextNode("gjort"));
          badgeRow.appendChild(doneStatus);
        }
        itemWrap.appendChild(badgeRow);

        // Content display + action buttons
        const btnRow = el("div",{style:{display:"flex",gap:"8px",flexWrap:"wrap",marginTop:"var(--s-2)"}});

        if(item.item_type==="word_list"){
          const words = item.content.words || [];
          const tbl = el("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:"13.5px",marginBottom:"var(--s-2)",border:"1px solid var(--line)",borderRadius:"var(--r-card)"}});
          const head = el("tr",{style:{background:"var(--surface-head)"}});
          head.appendChild(el("th",{style:{padding:"6px 10px",textAlign:"left",fontWeight:"600",color:"var(--ink-2)"}},"Ord"));
          if(item.content.include_translation)
            head.appendChild(el("th",{style:{padding:"6px 10px",textAlign:"left",fontWeight:"600",color:"var(--ink-2)"}},"Oversettelse"));
          head.appendChild(el("th",{style:{padding:"6px 10px",textAlign:"left",fontWeight:"600",color:"var(--ink-2)"}},"Tema"));
          tbl.appendChild(head);
          words.forEach(w => {
            const row = el("tr",{});
            row.appendChild(el("td",{style:{padding:"6px 10px",borderTop:"1px solid var(--line-soft)"}},$esc(w.word)));
            if(item.content.include_translation)
              row.appendChild(el("td",{style:{padding:"6px 10px",borderTop:"1px solid var(--line-soft)",color:"var(--ink-2)"}},$esc(w.meaning)));
            row.appendChild(el("td",{style:{padding:"6px 10px",borderTop:"1px solid var(--line-soft)",color:"var(--ink-3)",fontSize:"12.5px"}},$esc(w.topic)));
            tbl.appendChild(row);
          });
          itemWrap.appendChild(tbl);
          if(!item.done){
            const importBtn = el("button",{class:"btn btn--primary",
              click: async ()=>{
                importBtn.disabled=true; importBtn.textContent="Legger til…";
                let added=0;
                for(const w of words){
                  const rw=await api("/api/words",{method:"POST",headers:{"Content-Type":"application/json"},
                    // Assignment word lists created before the category fix carry
                    // "substantiv", which is not a valid category — map anything
                    // unrecognised onto a real member rather than passing it through.
                    body:JSON.stringify({word:w.word,meaning:w.meaning,category:CAT_MAP[w.category]?w.category:"enkeltord",topic:w.topic||""})
                  }).catch(()=>null);
                  if(rw?.ok||rw?.status===409) added++;
                }
                await api(`/api/assignments/items/${encodeURIComponent(item.item_id)}/done`,{
                  method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({done:true})
                }).catch(()=>null);
                trackEvent("mineoppgaver.wordlist_imported",{count:added});
                toast(`${added} ord lagt til i ordbanken!`);
                load();
              }
            },icon("words"),"Legg til i ordbank");
            btnRow.appendChild(importBtn);
          }

        } else if(item.item_type==="reading_text"){
          itemWrap.appendChild(el("div",{class:"card__title",style:{marginBottom:"4px"}},$esc(item.content.title||"")));
          const bodyDiv = el("div",{class:"card__sub",style:{
            maxHeight:"80px",overflow:"hidden",position:"relative",marginBottom:"var(--s-2)",
          }});
          bodyDiv.textContent = (item.content.body||"").substring(0,200)+(item.content.body?.length>200?"…":"");
          itemWrap.appendChild(bodyDiv);
          const openBtn = el("button",{class:"btn btn--primary",
            click: async ()=>{
              openBtn.disabled=true; openBtn.textContent="Laster…";
              if(item.content.source==="bank"){
                const texts=await loadLesingTexts().catch(()=>[]);
                const found=texts.find(t=>t.id===item.content.text_id);
                if(found){ setLesingText(found); setTab("lesing"); }
                else{ openBtn.disabled=false; openBtn.innerHTML=""; openBtn.appendChild(icon("book")); openBtn.appendChild(document.createTextNode("Les teksten")); toast("Teksten ble ikke funnet"); }
              } else {
                // isCustom is what makes a word looked up in this text record
                // `source_text_kind: "custom"` — without it the origin is written into
                // the built-in id space and never resolves back.
                setLesingText({id:`asgn-${item.item_id}`,title:item.content.title||"Tekst",topic:item.content.topic||"",text:item.content.body||"",isCustom:true});
                setTab("lesing");
              }
            }
          },icon("book"),"Les teksten");
          btnRow.appendChild(openBtn);

        } else {
          const promptDiv = el("div",{class:"card__sub",style:{
            background:"var(--surface-sunk)",border:"1px solid var(--line-soft)",borderRadius:"var(--r-card)",
            padding:"10px 14px",marginBottom:"var(--s-2)",
          }});
          promptDiv.textContent = item.content.prompt_text || "";
          itemWrap.appendChild(promptDiv);
          const writeBtn = el("button",{class:"btn btn--primary",
            click: ()=>{
              const raw=item.content.topic||"";
              // TOPICS uses ASCII keys (miljo, sprak); convert canonical strings if needed
              const topicKey=TOPICS[raw]?raw:raw.replace(/ø/g,"o").replace(/å/g,"a").replace(/æ/g,"ae");
              state.currentTopic=TOPICS[topicKey]?topicKey:Object.keys(TOPICS)[0];
              state.currentPrompt={title:item.content.prompt_title||"Skriveoppgave",text:item.content.prompt_text||""};
              state.essay="";
              setTab("skriv");
            }
          },icon("pen"),"Skriv stilen");
          btnRow.appendChild(writeBtn);
        }

        // Mark done button (for reading + essay items)
        if(!item.done && item.item_type!=="word_list"){
          const doneBtn = el("button",{
            class:"btn",
            click: async ()=>{
              doneBtn.disabled=true; doneBtn.textContent="Lagrer…";
              const r2 = await api(`/api/assignments/items/${encodeURIComponent(item.item_id)}/done`,{
                method:"PATCH",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({done:true})
              }).catch(()=>null);
              if(r2?.ok){ trackEvent("mineoppgaver.item_completed",{kind:item.item_type}); load(); }
              else { doneBtn.disabled=false; doneBtn.innerHTML=""; doneBtn.appendChild(icon("check")); doneBtn.appendChild(document.createTextNode("Marker som gjort")); toast("Kunne ikke lagre"); }
            }
          },icon("check"),"Marker som gjort");
          btnRow.appendChild(doneBtn);
        }

        itemWrap.appendChild(btnRow);

        card.appendChild(itemWrap);
      });
      wrap.appendChild(card);
    });
  }
  load();
  return frag;
}

// ── GI OPPGAVER panel (teacher roster) ────────────────────────────────────

// The roster and the class list are needed by four surfaces — the roster view, both
// banks, and the Ordbank share bar — and three of those are reachable without ever
// passing through the roster. One loader, so a new surface cannot fetch half of it
// and silently lose the class quick-select.
async function ensureTeacherRoster(){
  if(teacherState.students===null){
    const r = await api("/api/teacher/students").catch(()=>null);
    teacherState.students = r?.ok ? await r.json() : [];
  }
  if(teacherState.classes===null){
    const rc = await api("/api/teacher/classes").catch(()=>null);
    teacherState.classes = rc?.ok ? await rc.json() : [];
  }
}

// Feature 023. Separate from ensureTeacherRoster() — only the Ordbank share bar
// needs tags, unlike students/classes which four surfaces need.
async function ensureWordTags(){
  if(teacherState.wordTags===null){
    const r = await api("/api/teacher/word-tags").catch(()=>null);
    teacherState.wordTags = r?.ok ? (await r.json()).tags : [];
  }
}

// Feature 018. Once classes existed, the assign surfaces still offered only "alle
// elever" or one student at a time, so a teacher with two classes could not give work
// to just one of them. This ticks the members of a class.
//
// It selects checkboxes rather than sending a class id, so the request stays the same
// explicit student_ids list as before — no backend change. That also keeps the
// semantics identical to "alle elever": membership is resolved now, at assignment
// time, so a student who joins the class afterwards does not retroactively receive it.
//
// Returns null when the teacher has no classes with members on this roster, in which
// case the caller renders nothing — a teacher without classes needs no explanation,
// the Klasser panel is on the same screen.
function buildClassQuickSelect(students, onPick){
  const withMembers = (teacherState.classes||[])
    .map(c=>({c, ids:(students||[]).filter(s=>s.class_id===c.id).map(s=>s.id)}))
    .filter(x=>x.ids.length);
  if(!withMembers.length) return null;

  const row = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",
    flexWrap:"wrap",marginBottom:"var(--s-2)"}});
  row.appendChild(el("span",{class:"card__note"},"Hele klassen:"));
  withMembers.forEach(({c,ids})=>{
    row.appendChild(el("button",{type:"button",class:"btn",
      click:(e)=>{ e.preventDefault(); e.stopPropagation();
        // The one teacher feature with no server call site: "Hele klassen"
        // ticks checkboxes and sends nothing, by design — membership resolves
        // when the assignment is created, from the same explicit student_ids
        // list. So the browser is the only place it can be observed.
        trackEvent("laerer.whole_class_selected",{studentCount:ids.length});
        onPick(ids); }},
      `${c.name} (${ids.length})`));
  });
  return row;
}

function buildGiOppgaver(students){
  const wrap = el("div",{class:"card",style:{marginTop:"var(--s-4)"}});

  // ord →" bridge into manual text rows. Sending words now happens in the teacher's own
  // Ordbank, using the same filter-and-tick bar students share with, so that mode was
  // deleted rather than maintained twice. The consequence, accepted knowingly: a teacher
  // can only send words they have banked themselves. See specs/BACKLOG.md.
  let mode = "lese-skriv";
  const modeWrap = el("div",{style:{display:"flex",gap:"var(--s-2)",marginBottom:"var(--s-4)"}});

    }, label);
  }

  function updateModeBtns(){
    modeWrap.querySelectorAll("[data-mode]").forEach(b=>{
      b.setAttribute("aria-pressed", b.dataset.mode===mode ? "true" : "false");
    });
  }

  modeWrap.appendChild(modeBtn("lese-skriv","Lese- og skriveoppgave"));
  modeWrap.appendChild(modeBtn("full","Full plan"));
  wrap.appendChild(modeWrap);

  // Student multi-select
  const studentSec = el("div",{style:{marginBottom:"var(--s-3)"}});
  studentSec.appendChild(el("div",{class:"field__label",style:{marginBottom:"var(--s-2)"}},"Velg elever:"));
  let selectedIds = new Set();
  const studentCbs = [];

  const allRow = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",marginBottom:"var(--s-1)"}});
  const allCb = el("input",{type:"checkbox",id:"gi-all"});
  allCb.addEventListener("change",()=>{
    if(allCb.checked) students.forEach(s=>selectedIds.add(s.id));
    else selectedIds.clear();
    studentCbs.forEach(({cb})=>{ cb.checked=allCb.checked; });
    updateAssignBtns();
  });
  allRow.appendChild(allCb);
  allRow.appendChild(el("label",{for:"gi-all",style:{fontWeight:"600",fontSize:"var(--t-sm)",cursor:"pointer"}},"Alle elever"));
  studentSec.appendChild(allRow);

  const giClassRow = buildClassQuickSelect(students,(ids)=>{
    selectedIds = new Set(ids);
    studentCbs.forEach(({cb,sid})=>{ cb.checked = selectedIds.has(sid); });
    allCb.checked = students.length>0 && students.every(st=>selectedIds.has(st.id));
    updateAssignBtns();
  });
  if(giClassRow) studentSec.appendChild(giClassRow);

  students.forEach(s=>{
    const id = "gi-s-"+s.id.replace(/[^a-z0-9]/gi,"-");
    const cb = el("input",{type:"checkbox",id});
    studentCbs.push({cb, sid:s.id});
    cb.addEventListener("change",()=>{
      if(cb.checked) selectedIds.add(s.id); else selectedIds.delete(s.id);
      allCb.checked = students.every(st=>selectedIds.has(st.id));
      updateAssignBtns();
    });
    const row = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",marginBottom:"4px"}});
    row.appendChild(cb);
    row.appendChild(el("label",{for:id,style:{fontSize:"var(--t-sm)",cursor:"pointer"}},$esc(s.name)));
    studentSec.appendChild(row);
  });
  wrap.appendChild(studentSec);

  const assignBtns = []; // collected across mode renders so we can update disabled state
  function updateAssignBtns(){ assignBtns.forEach(b=>{ b.disabled = selectedIds.size===0; }); }

  wrap.appendChild(modeContent);

  // ── LESE- OG SKRIVEOPPGAVE MODE ───────────────────────────────────────
  function renderLeseSkrivMode(){ renderAssignForm(false); }

  // ── FULL PLAN MODE ────────────────────────────────────────────────────
  function renderFullPlanMode(){ renderAssignForm(true); }

  // ── SHARED ASSIGNMENT FORM (text + essay [+ optional word list]) ───────
  function renderAssignForm(includeWords){
    modeContent.innerHTML="";
    assignBtns.length=0;
    const items = {}; // {word_list, reading_text, essay_prompt} — populated by form

      wSec.appendChild(wTopicSel);

      const wTransRow = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",marginBottom:"var(--s-2)"}});
      const wTransCb = el("input",{type:"checkbox",id:"gi-fp-trans"}); wTransCb.checked=true;

      const wWordsWrap = el("div",{style:{marginBottom:"var(--s-1)"}});

      const wWordRows = [];
      function addWRow(){

    // ── Text section (topic-filtered, multi-select, includes teacher bank) ──

    function makeSrcBtn(key, label){
      return el("button",{"data-txtsrc":key,class:"pill","aria-pressed":key===txtSource?"true":"false",
        click:()=>{ txtSource=key; renderTxtSourceBtns(); renderTxtPicker(); }
      },label);

    const txtPickerWrap = el("div",{});
    txtSec.appendChild(txtPickerWrap);

    const selectedTextsDisplay = el("div",{style:{display:"flex",flexWrap:"wrap",gap:"var(--s-1)",marginTop:"var(--s-2)"}});
    txtSec.appendChild(selectedTextsDisplay);

    function updateSelectedTextsDisplay(){

    let allLesingTexts = null;

    async function renderTxtPicker(){
      txtPickerWrap.innerHTML="";

      if(txtSource==="bank"){
        // Topic filter + text list from app text bank
        if(!allLesingTexts) allLesingTexts = await loadLesingTexts().catch(()=>null);

        const topicFilter = el("select",{class:"select",style:{marginBottom:"var(--s-2)"}});

        const listWrap = el("div",{style:{maxHeight:"200px",overflowY:"auto",border:"1px solid var(--line)",borderRadius:"var(--r-btn)"}});

        function renderTextList(){
          listWrap.innerHTML="";

// Custom reading texts feed the Gjenfortell AI prompt, the comprehension questions
// and Setningsbygging, all of which assume roughly the length of the built-in B2
// texts (~250 words). Long texts also inflate the AI response past its token budget.
const CUSTOM_TEXT_MAX_WORDS = 500;
function countWords(s){ return (String(s||"").trim().match(/\S+/g)||[]).length; }

// Live "x / 500 ord" counter bound to a textarea. Returns the counter element with
// an isOver() method so the save handler can gate on it.
function attachWordCounter(textarea, max){
  const out = el("p",{class:"card__note",style:{marginBottom:"var(--s-2)",textAlign:"right"}});
  const update = ()=>{
    const n = countWords(textarea.value);
    const over = n > max;
    out.textContent = over ? `${n} / ${max} ord — for langt` : `${n} / ${max} ord`;
    out.style.color = over ? "var(--danger)" : (n > max*0.9 ? "var(--status-doing)" : "");
    out.style.fontWeight = over ? "700" : "400";
  };
  textarea.addEventListener("input", update);
  update();
  out.isOver = ()=>countWords(textarea.value) > max;
  return out;
}

// Shared selectable card for Tekstbank and Oppgavebank. The whole card is the hit
// target — no checkbox, no expand chevron. The body is clamped to two lines and the
// "Vis mer" link only appears when the text actually overflows, so most items need
// no click at all to read.
function renderPickCard({item, title, meta, body, selectedItems, onChange, onDelete}){
  // Reuses the app's established "selected card" language (`.card[aria-selected]`
  // border+tint) instead of the bespoke `.pick-*` classes this used to carry — the
  // circular ✓ badge is the one addition, since a dense list of many selectable
  // cards benefits from a scan target the plain border alone doesn't give.
  const card = el("div",{class:"card",style:{cursor:"pointer",position:"relative",paddingRight:"38px"}});
  const isPicked = ()=>selectedItems.some(i=>i._key===item._key);
  const checkBadge = el("span",{class:"icon-btn",style:{position:"absolute",top:"10px",right:"10px",
    borderRadius:"var(--r-pill)",background:"var(--green)",borderColor:"var(--green)",color:"#fff",display:"none"}},
    icon("check"));
  const sync = ()=>{
    const picked = isPicked();
    if(picked) card.setAttribute("aria-selected","true"); else card.removeAttribute("aria-selected");
    checkBadge.style.display = picked ? "inline-flex" : "none";
  };

  card.appendChild(checkBadge);
  card.appendChild(el("div",{class:"card__title",style:{fontSize:"14.5px"}},$esc(title)));
  if(meta) card.appendChild(el("p",{class:"card__note"},$esc(meta)));

  if(body){
    const preview = el("div",{class:"card__sub",style:{marginTop:"var(--s-2)",
      display:"-webkit-box",WebkitLineClamp:"2",WebkitBoxOrient:"vertical",overflow:"hidden"}});
    preview.textContent = body;
    card.appendChild(preview);
    const more = el("span",{class:"btn--link",style:{display:"none",marginTop:"var(--s-1)"},
      click:e=>{
        e.stopPropagation();               // expanding must not toggle selection
        const open = preview.style.display==="block";
        preview.style.display = open ? "-webkit-box" : "block";
        preview.style.overflow = open ? "hidden" : "visible";
        preview.style.whiteSpace = open ? "normal" : "pre-wrap";
        more.textContent = open ? "… Vis mer" : "Vis mindre";
      }
    },"… Vis mer");
    card.appendChild(more);
    // Measure after layout — only offer the link when two lines genuinely clip it.
    requestAnimationFrame(()=>{
      if(preview.scrollHeight > preview.clientHeight + 2) more.style.display="";
    });
  }

  card.addEventListener("click",()=>{
    if(isPicked()){
      const i = selectedItems.findIndex(x=>x._key===item._key);
      if(i!==-1) selectedItems.splice(i,1);
    } else selectedItems.push(item);
    sync();
    onChange();
  });

  if(onDelete){
    card.appendChild(el("button",{class:"btn btn--danger",style:{marginTop:"var(--s-2)"},
      click:e=>{ e.stopPropagation(); onDelete(); }
    },icon("trash"),"Slett"));
  }

  sync();
  return card;
}

        if(!filtered.length){listWrap.appendChild(el("p",{class:"card__note"},"Ingen tekster."));return;}
        filtered.forEach(t=>listWrap.appendChild(renderTextCard(t,false)));
      }
      topicFilter.addEventListener("change",renderSystemList);
      renderSystemList();

    } else if(bankTab==="mine"){
      if(!teacherState.bankTexts){
        const r=await api("/api/teacher/bank/texts").catch(()=>null);
        teacherState.bankTexts=r?.ok?await r.json():[];
      }
      if(!teacherState.bankTexts.length){
        tabContent.appendChild(el("p",{class:"card__note"},"Ingen egne tekster ennå. Bruk «+ Ny tekst» for å legge til."));
        return;
      }
      const topicFilter=el("select",{class:"select",style:{marginBottom:"var(--s-3)"}});
      topicFilter.appendChild(el("option",{value:""},"Alle temaer"));
      const topics=[...new Set(teacherState.bankTexts.map(t=>t.topic||"").filter(Boolean))].sort();
      topics.forEach(t=>topicFilter.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
      tabContent.appendChild(topicFilter);
      const listWrap=el("div",{style:{display:"flex",flexDirection:"column",gap:"var(--s-2)"}});
      tabContent.appendChild(listWrap);
      function renderMineList(){
        listWrap.innerHTML="";
        const topic=topicFilter.value;
        const filtered=topic?teacherState.bankTexts.filter(t=>(t.topic||"")===topic):teacherState.bankTexts;
        if(!filtered.length){listWrap.appendChild(el("p",{class:"card__note"},"Ingen tekster for dette temaet."));return;}
        filtered.forEach(t=>listWrap.appendChild(renderTextCard(t,true)));
      }
      topicFilter.addEventListener("change",renderMineList);
      renderMineList();

    } else {
      const addCard=el("div",{class:"card"});
      const titleIn=el("input",{class:"input",type:"text",placeholder:"Tittel",style:{marginBottom:"var(--s-2)"}});
      const topicSel=el("select",{class:"select",style:{marginBottom:"var(--s-2)"}});
      topicSel.appendChild(el("option",{value:""},"Velg tema (valgfritt)"));
      VALID_TOPIC_LIST.forEach(t=>topicSel.appendChild(el("option",{value:t},t.charAt(0).toUpperCase()+t.slice(1))));
      const bodyIn=el("textarea",{class:"textarea",placeholder:"Teksten…",style:{minHeight:"150px",marginBottom:"4px"}});
      const bodyCount=attachWordCounter(bodyIn, CUSTOM_TEXT_MAX_WORDS);
      const addErr=el("p",{class:"card__note",style:{color:"var(--danger)",marginBottom:"var(--s-2)",display:"none"}});
      const addBtn=el("button",{class:"btn btn--primary",
        click:async ()=>{
          const title=(titleIn.value||"").trim();
          const body=(bodyIn.value||"").trim();
          if(!title){addErr.textContent="Tittel er påkrevd";addErr.style.display="";return;}
          if(!body){addErr.textContent="Tekst er påkrevd";addErr.style.display="";return;}
          if(bodyCount.isOver()){
            addErr.textContent=`Teksten er for lang (${countWords(body)} ord). Maks ${CUSTOM_TEXT_MAX_WORDS} ord — B2-tekstene i appen er rundt 250 ord.`;
            addErr.style.display=""; return;
          }
          addErr.style.display="none";
          addBtn.disabled=true; addBtn.textContent="Lagrer…";
          const r=await api("/api/teacher/bank/texts",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({title,topic:topicSel.value,body})}).catch(()=>null);
          if(r?.ok){
            teacherState.bankTexts=null;
            titleIn.value=""; topicSel.value=""; bodyIn.value="";
            addBtn.disabled=false; addBtn.textContent="Lagre tekst";
            bankTab="mine"; renderBankTab();
          } else {
            const d=await r?.json().catch(()=>({detail:"Ukjent feil"}));
            addErr.textContent=d?.detail||"Kunne ikke lagre";addErr.style.display="";
            addBtn.disabled=false; addBtn.textContent="Lagre tekst";
          }
        }
      },"Lagre tekst");
      addCard.appendChild(titleIn); addCard.appendChild(topicSel); addCard.appendChild(bodyIn);
      addCard.appendChild(bodyCount); addCard.appendChild(addErr); addCard.appendChild(addBtn);
      tabContent.appendChild(addCard);
    }
  }

  renderAssignPanel();
  renderBankTab();
  return frag;
}

function buildLaererBankPrompts(){
  const frag = document.createDocumentFragment();

  // Two-column layout: left=content, right=assignment panel
  const outer=el("div",{style:{display:"flex",gap:"16px",alignItems:"flex-start"}});

  outer.appendChild(leftCol);
  outer.appendChild(rightCol);

  leftCol.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"var(--s-3)"}},"Oppgavebank"));

  // ── Selection state ──
  const selectedItems=[];

  // ── Assignment panel ──
  function renderAssignPanel(){
    rightCol.innerHTML="";
    const panel=el("div",{class:"card",style:{position:"sticky",top:"70px"}});
    panel.appendChild(el("div",{class:"card__title",style:{fontSize:"var(--t-base)",marginBottom:"var(--s-2)"}},

    });
    if(!studentCbs.length) studentList.appendChild(el("p",{class:"card__note"},"Ingen elever i klassen."));
    allCb.addEventListener("change",()=>studentCbs.forEach(({cb})=>{cb.checked=allCb.checked;}));
    const bankClassRow = buildClassQuickSelect(teacherState.students||[],(ids)=>{
      const pick = new Set(ids);
      studentCbs.forEach(({student,cb})=>{ cb.checked = pick.has(student.id); });
      allCb.checked = studentCbs.length>0 && studentCbs.every(({cb})=>cb.checked);
    });
    if(bankClassRow) panel.appendChild(bankClassRow);
    panel.appendChild(studentList);
    const labelIn=el("input",{class:"input",type:"text",placeholder:"Merkelapp (valgfritt)",
      style:{marginBottom:"var(--s-2)"}});
    panel.appendChild(labelIn);

      click:async ()=>{
        if(!selectedItems.length){toast("Velg minst én oppgave");return;}
        const useAll=allCb.checked;
        const studentIds=studentCbs.filter(({cb})=>cb.checked).map(({student})=>student.id);
        if(!useAll&&!studentIds.length){toast("Velg minst én elev");return;}
        assignBtn.disabled=true; assignBtn.textContent="Sender…";
        const r=await api("/api/teacher/assignments",{method:"POST",
          headers:{"Content-Type":"application/json"},

            all_students:useAll,items:selectedItems.map(({item_type,content})=>({item_type,content}))})
        }).catch(()=>null);
        assignBtn.disabled=false; assignBtn.textContent="Gi oppgave";

          toast("Oppgave gitt!");
          selectedItems.length=0;

      click:()=>{ bankTab=key; renderTabBtns(); renderBankTab(); }},label);
  }
  function renderTabBtns(){
    tabBar.querySelectorAll("[data-btab]").forEach(b=>{
      b.setAttribute("aria-pressed", b.dataset.btab===bankTab ? "true" : "false");
    });

  tabBar.appendChild(tabBtn("system","Systemoppgaver"));
  tabBar.appendChild(tabBtn("mine","Mine oppgaver"));

    arbeid:"Arbeid",demokrati:"Demokrati",familie:"Familie",helse:"Helse",
    integrering:"Integrering",internasjonalt:"Internasjonalt",miljo:"Miljø",
    natur:"Natur",politikk:"Politikk",sprak:"Språk",teknologi:"Teknologi",utdanning:"Utdanning"

    return isCustom

      item: makePromptItem(p,topicKey,isCustom),

      meta: isCustom?(p.topic||""):(PROMPT_TOPIC_LABELS[topicKey]||topicKey),

    } else if(bankTab==="mine"){

      tabContent.appendChild(topicFilter);

// ── ADMIN PAGE ────────────────────────────────────────────────────────────
(function initAdmin(){
  const hash = window.location.hash;
  if(!hash.startsWith("#admin/")) return;
  const secret = hash.slice(7);
  if(!secret) return;

  const screen = document.getElementById("admin-screen");
  screen.style.display = "block";
  screen.innerHTML = "<p style='color:var(--color-text-muted)'>Laster admin-oversikt…</p>";

  const get = path => fetch(`${API_BASE}${path}?secret=${encodeURIComponent(secret)}`)
    .then(r => {
      if(r.status === 403) throw new Error("Feil hemmelig nøkkel.");
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });

  // Adoption is fetched beside the user overview, not instead of it — they
  // answer different questions ("is this feature alive" vs "what has this
  // learner done") and neither substitutes for the other. It is allowed to
  // fail on its own: a backend without the endpoint should still render the
  // user table rather than a bare error page.
  Promise.all([
    get("/api/admin/overview"),
    get("/api/admin/adoption").catch(() => null),
    get("/api/admin/failures").catch(() => null),
    get("/api/admin/calls").catch(() => null),
    get("/api/admin/templates").catch(() => null),
  ])
    .then(([overview, adoption, failures, calls, templates]) => {
      renderAdminDashboard(screen, overview);
      if(adoption) renderAdoption(screen, adoption);
      if(failures) renderFailureLog(screen, failures);
      // Calls need the templates to show a prompt body: the calls endpoint
      // carries only the template's hash, because the alternative is repeating
      // the same long Norwegian prompt on every single row. Joining the two
      // here is the whole reason the registry is deduplicated.
      if(calls) renderAiCalls(screen, calls, templates);
      if(templates) renderPromptTemplates(screen, templates);
    })
    .catch(err => {
      screen.innerHTML = `<p style='color:var(--color-danger);font-weight:600'>Feil: ${err.message}</p>`;
    });
})();

// ── Feature adoption (019) ────────────────────────────────────────────────
// Renders one row per *declared* feature, including ones nobody has touched.
// That is the whole point: a table built from the events alone can only list
// features somebody used, and a missing row is indistinguishable from a
// feature that was never instrumented.
function renderAdoption(container, data){
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };
  const dt = iso => iso ? new Date(iso).toLocaleDateString("no") : "aldri";

  container.appendChild(h("h2",{style:"font-size:var(--font-base);margin:32px 0 6px"},"📊 Funksjonsbruk"));

  // The honesty line. Without it the first read looks like proof that half the
  // product is dead, when it is really proof that we only started counting.
  const started = new Date(data.recording_started_on).toLocaleDateString("no");
  container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:0 0 4px;line-height:1.5"},
    `Registrering startet ${started}. «Aldri» for tiden før dette betyr at ingenting ble målt — ikke at funksjonen er ubrukt. `
    + "Der en dato kan utledes fra lagrede data (ord, setninger, stiler, gjenfortellinger) vises den, merket «utledet»."));
  if(data.excluded_test_users){
    container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:0 0 14px"},
      `${data.excluded_test_users} testkonto(er) holdt utenfor.`));
  }

  const tdStyle = "padding:7px 12px;border-bottom:1px solid var(--color-border-light);vertical-align:top";
  const thStyle = "background:#1a6b4a;color:#fff;padding:8px 12px;text-align:left;white-space:nowrap";

  (data.areas||[]).forEach(area => {
    container.appendChild(h("h3",{style:"font-size:var(--font-sm);margin:18px 0 6px;color:#1a6b4a"},area.area));
    const wrap = h("div",{style:"overflow-x:auto"});
    const t = document.createElement("table");
    t.setAttribute("style","border-collapse:collapse;width:100%;font-size:var(--font-sm)");

    const hr = t.createTHead().insertRow();
    ["Funksjon","Brukt","Brukere","Sist brukt"].forEach(label => {
      const th = document.createElement("th");
      th.setAttribute("style", thStyle);
      th.textContent = label;
      hr.appendChild(th);
    });

    const tbody = t.createTBody();
    area.surfaces.forEach((s, i) => {
      const tr = tbody.insertRow();
      // Declared a fortnight ago and never once seen is more likely an unwired
      // emit call than a genuinely unloved feature — and for browser-emitted
      // features this is the only drift signal there is.
      if(s.never_observed) tr.setAttribute("style","background:#fff6e5");
      else if(i % 2 === 1) tr.setAttribute("style","background:#f9f9f9");

      const name = tr.insertCell();
      name.setAttribute("style", tdStyle);
      name.appendChild(document.createTextNode(s.label));
      name.appendChild(h("div",{style:"color:var(--color-text-muted);font-size:var(--font-xs);font-family:ui-monospace,monospace"}, s.id));

      const uses = tr.insertCell();
      uses.setAttribute("style", tdStyle + (s.uses ? "" : ";color:var(--color-text-muted)"));
      uses.textContent = String(s.uses);

      const users = tr.insertCell();
      users.setAttribute("style", tdStyle + (s.distinct_users ? "" : ";color:var(--color-text-muted)"));
      users.textContent = String(s.distinct_users);

      const last = tr.insertCell();
      last.setAttribute("style", tdStyle + (s.last_used ? "" : ";color:var(--color-text-muted)"));
      last.textContent = dt(s.last_used);
      if(s.last_used_is_derived){
        last.appendChild(h("span",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin-left:6px"},"(utledet)"));
      }
      if(s.never_observed){
        // A hint, not a verdict. Only browser-emitted features reach here —
        // server ones are proved wired by a test, so guessing from traffic
        // would only produce false positives on the rare-by-nature ones.
        last.appendChild(h("div",{style:"color:var(--color-warning);font-size:var(--font-xs);margin-top:2px"},
          `registrert ${new Date(s.registered_on).toLocaleDateString("no")}, aldri observert — sjekk om den er koblet opp`));
      }
    });

    wrap.appendChild(t);
    container.appendChild(wrap);
  });

  // Accept-and-flag: types that arrived without a registry entry are kept and
  // shown here rather than discarded, so a missing registration is visible
  // instead of lossy.
  if((data.unknown_types||[]).length){
    container.appendChild(h("h3",{style:"font-size:var(--font-sm);margin:22px 0 6px;color:var(--color-warning)"},
      `Ukjente hendelsestyper (${data.unknown_types.length})`));
    container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:0 0 8px"},
      "Registrert, men ikke deklarert i koden — sannsynligvis en funksjon som mangler oppføring."));
    container.appendChild(buildAdminTable(h,
      ["Type","Brukt","Sist sett"],
      data.unknown_types.map(u => [u.event_type, u.uses, dt(u.last_seen)])
    ));
  }
}

// ── AI failure log (019) ──────────────────────────────────────────────────
// Counts answer "is this widespread"; the recent list answers "what actually
// happened". Both are needed: a learner reporting "the AI didn't work" is
// otherwise unanswerable without reproducing it.
function renderFailureLog(container, data){
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };

  container.appendChild(h("h2",{style:"font-size:var(--font-base);margin:32px 0 6px"},"⚠️ AI-feil"));
  container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:0 0 12px"},
    `Siste ${data.days} dager.`
    + (data.excluded_test_users ? ` ${data.excluded_test_users} testkonto(er) holdt utenfor.` : "")));

  if(!(data.by_reason||[]).length){
    container.appendChild(h("p",{style:"color:#1a6b4a;font-size:var(--font-sm)"},"Ingen registrerte feil i perioden."));
    return;
  }

  container.appendChild(buildAdminTable(h,
    ["Årsak","Antall","Brukere"],
    data.by_reason.map(r => [r.reason, r.count, r.distinct_users])
  ));

  container.appendChild(h("h3",{style:"font-size:var(--font-sm);margin:18px 0 6px;color:#1a6b4a"},"Siste feil"));
  container.appendChild(buildAdminTable(h,
    ["Tid","Flate","Årsak","Oppdaget","HTTP","stop_reason","Tokens inn/ut","Lengder sys/bruker/svar","Svarhale"],
    (data.recent||[]).map(f => [
      new Date(f.created_at).toLocaleString("no"),
      f.surface,
      f.reason,
      f.detected_by,
      f.http_status == null ? "—" : f.http_status,
      f.stop_reason || "—",
      `${f.input_tokens ?? "—"}/${f.output_tokens ?? "—"}`,
      `${f.system_len ?? "—"}/${f.user_len ?? "—"}/${f.response_len ?? "—"}`,
      // The model's own answer, never the prompt or the learner's writing.
      f.response_excerpt || "—",
    ])
  ));
}

// ── AI-kall: hva ble spurt om, og hva kom tilbake (020) ───────────────────
//
// ⚠️ **This cannot show one literal prompt string, and must not pretend to.**
// A prompt has three layers and only one is stored word for word:
//
//   * the base template — kept in full, and shown here;
//   * the teacher's steering block — only a reference and a hash are kept, so
//     what is shown is the *current* instruction text, flagged when it no
//     longer matches what was sent;
//   * the learner's own writing — never stored, only hashed.
//
// The panel says so in Norwegian rather than leaving the operator to infer it,
// because a view that looks complete but silently omits a layer is worse than
// one that admits the gap.
function renderAiCalls(container, data, templates){
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };
  const PRE = "white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;"
    + "background:#fbfbfa;border:1px solid #e8e8e4;border-radius:var(--radius-sm);padding:10px;margin:4px 0 12px;max-height:340px;overflow:auto";
  const LABEL = "font-size:var(--font-xs);font-weight:700;color:#1a6b4a;margin:10px 0 2px";

  // Join on the hash: the calls endpoint carries the template's fingerprint,
  // the registry carries its text.
  const bodyByHash = {};
  (templates && templates.templates || []).forEach(t => { bodyByHash[t.content_hash] = t; });

  container.appendChild(h("h2",{style:"font-size:var(--font-base);margin:32px 0 6px"},"🤖 AI-kall"));
  container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:0 0 12px"},
    `Vellykkede kall siste ${data.days} dager.`
    + (data.excluded_test_users ? ` ${data.excluded_test_users} testkonto(er) holdt utenfor.` : "")
    + " Feilede kall står under AI-feil."));

  if(!(data.recent||[]).length){
    container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-sm)"},"Ingen registrerte kall i perioden."));
    return;
  }

  if((data.by_site||[]).length){
    container.appendChild(buildAdminTable(h,
      ["Kallsted","Antall","Brukere","Tokens inn","Tokens ut"],
      data.by_site.map(s => [s.call_site, s.count, s.distinct_users, s.input_tokens, s.output_tokens])
    ));
  }

  container.appendChild(h("h3",{style:"font-size:var(--font-sm);margin:18px 0 6px;color:#1a6b4a"},"Siste kall — klikk for å se prompt og svar"));

  data.recent.forEach(c => {
    const tpl = bodyByHash[c.template && c.template.content_hash];
    const when = new Date(c.created_at).toLocaleString("no");
    const head = `${when} · ${c.call_site}${c.surface ? " / " + c.surface : ""}`
      + ` · ${c.input_tokens ?? "—"}/${c.output_tokens ?? "—"} tokens`
      + (c.template && c.template.verified ? "" : " · ⚠️ uverifisert mal");

    const box = h("details",{style:"border:1px solid #e8e8e4;border-radius:var(--radius-md);padding:8px 12px;margin-bottom:8px"});
    box.appendChild(h("summary",{style:"cursor:pointer;font-size:var(--font-sm)"}, head));

    const meta = [
      ["Modell", c.model],
      ["Mal", c.template ? `${c.template.declared_id} v${c.template.declared_version}` : "—"],
      ["Variant", c.variant],
      ["Lærerinstruks", c.steering_applied
        ? (c.steering_drifted ? "ja — ⚠️ endret siden kallet" : "ja")
        : "nei"],
      ["Innhold", c.content_ref
        ? `${c.content_ref.kind} ${c.content_ref.id}`
          + (c.content_ref.present === false ? " (slettet)" : "")
          + (c.content_ref.changed_since_call ? " — ⚠️ endret siden kallet" : "")
        : `${c.content_kind} (ikke lagret da kallet ble gjort)`],
    ];
    box.appendChild(buildAdminTable(h, ["Felt","Verdi"], meta));

    // Lead with the whole thing. The layers are shown below for anyone who
    // needs to see which part came from where, but the first question is
    // almost always "what did the model actually read", and answering that
    // with three separate fragments and a disclaimer was not answering it.
    if(c.system_composed){
      const exact = c.template && c.template.verified && c.steering_drifted !== true;
      box.appendChild(h("div",{style:LABEL},
        exact ? "📄 Hele prompten — nøyaktig som modellen fikk den"
              : "📄 Hele prompten — satt sammen på nytt"));
      box.appendChild(h("p",{style:`font-size:var(--font-xs);margin:2px 0 4px;color:${exact ? "#1a6b4a" : "#a06000"}`},
        exact
          ? "Grunnmal + lærerinstruks, satt sammen slik serveren gjorde det. Sjekksummene stemmer, så dette er ordrett."
          : "⚠️ Noe har endret seg siden kallet, så dette er dagens deler satt sammen — ikke et referat av selve kallet."));
      box.appendChild(h("pre",{style:PRE}, c.system_composed));
      box.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:-6px 0 12px"},
        "Elevens egen tekst kommer i tillegg til dette, som en egen melding. Den lagres aldri."));
    }

    box.appendChild(h("div",{style:LABEL},"Prompt — grunnmal (nøyaktig som sendt)"));
    if(tpl && tpl.body){
      box.appendChild(h("pre",{style:PRE}, tpl.body));
    }else if(c.template && !c.template.verified){
      // Actionable, not just descriptive. The overwhelmingly common cause of a
      // legacy row is a browser tab opened before the frontend deploy — the HTML
      // is `must-revalidate`, so a reload fixes it, but an already-open tab keeps
      // running the old build indefinitely. Saying only "this is pre-020" leaves
      // the operator to work that out at exactly the wrong moment.
      const warn = h("p",{style:"color:#a06000;font-size:var(--font-xs);margin:2px 0 12px"},
        "Dette kallet sendte prompten ferdig sammensatt, slik appen gjorde før 020. "
        + "Grunnmalen kan derfor ikke skilles ut, og er ikke lagret.");
      warn.appendChild(h("br"));
      warn.appendChild(h("span",{style:"color:#666"},
        "Er kallet nyere enn frontend-deployen? Da kjørte fanen fortsatt den gamle "
        + "bygningen. Last siden på nytt (Cmd/Ctrl+Shift+R) og prøv igjen — nye kall "
        + "lagrer malen."));
      box.appendChild(warn);
    }else{
      box.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:2px 0 12px"},"Malen er ikke funnet."));
    }

    // The steering block is not stored, but it is *resolvable* — the record
    // points at a real instruction row. The hash decides what we may claim:
    // matching means this text is provably what was sent, differing means it is
    // only the current wording. Showing the text without that distinction would
    // be exactly the confident lie the drift flag exists to prevent.
    if(c.steering_applied){
      box.appendChild(h("div",{style:LABEL},
        c.steering_drifted === false
          ? "Prompt — lærerinstruks (nøyaktig som sendt)"
          : "Prompt — lærerinstruks"));
      if(c.steering_text && c.steering_drifted === false){
        box.appendChild(h("p",{style:"color:#1a6b4a;font-size:var(--font-xs);margin:2px 0 4px"},
          "Sjekksummen stemmer, så dette er ordrett teksten som ble sendt."));
        box.appendChild(h("pre",{style:PRE}, c.steering_text));
      }else if(c.steering_text){
        box.appendChild(h("p",{style:"color:#a06000;font-size:var(--font-xs);margin:2px 0 4px"},
          "⚠️ Instruksen er endret etter kallet. Teksten under er den som gjelder "
          + "nå — ikke den som ble sendt. Originalen er ikke lagret."));
        box.appendChild(h("pre",{style:PRE}, c.steering_text));
      }else if(c.steering_resolvable === false){
        // Not "deleted" — this call type (a teacher's prompt-test) records the
        // teacher as the caller, not the student whose steering was actually
        // resolved and applied, so it genuinely cannot be looked back up here.
        box.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:2px 0 12px"},
          "Instruksen ble brukt (dette var en lærers forhåndsvisning for en elev), "
          + "men kan ikke vises her — denne kalltypen lagrer ikke hvilken elev "
          + "det gjaldt."));
      }else{
        box.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:2px 0 12px"},
          "Instruksen som gjaldt er slettet, så teksten kan ikke hentes fram."));
      }
    }

    // What genuinely cannot be shown, and why.
    box.appendChild(h("div",{style:LABEL},"Elevens egen tekst"));
    box.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:2px 0 12px"},
      "Lagres aldri — bare en sjekksum, slik at det er mulig å se om teksten er "
      + "endret etterpå. Det er derfor prompten ikke kan gjenskapes ord for ord i "
      + "sin helhet, og det er med vilje."));

    box.appendChild(h("div",{style:LABEL},"Svar fra modellen (ordrett)"));
    box.appendChild(h("pre",{style:PRE}, c.response_text || "—"));

    container.appendChild(box);
  });
}

// ── Promptmaler: én rad per distinkt prompttekst (020) ────────────────────
// Two rows sharing a name and version but differing in checksum is **template
// drift** — a build declaring a version it is no longer running. Seeing that
// is the point of this table, not a fault in it.
function renderPromptTemplates(container, data){
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };
  const PRE = "white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;"
    + "background:#fbfbfa;border:1px solid #e8e8e4;border-radius:var(--radius-sm);padding:10px;margin:4px 0 0;max-height:340px;overflow:auto";

  const rows = data.templates || [];
  container.appendChild(h("h2",{style:"font-size:var(--font-base);margin:32px 0 6px"},"📝 Promptmaler"));
  container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-xs);margin:0 0 12px"},
    "Én rad per distinkt promptekst. To rader med samme navn og versjon, men "
    + "ulik sjekksum, betyr at teksten er endret uten at versjonen ble satt opp — "
    + "det er nettopp det denne tabellen skal avsløre."));

  if(!rows.length){
    container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-sm)"},"Ingen maler registrert ennå."));
    return;
  }

  rows.forEach(t => {
    const box = h("details",{style:"border:1px solid #e8e8e4;border-radius:var(--radius-md);padding:8px 12px;margin-bottom:8px"});
    box.appendChild(h("summary",{style:"cursor:pointer;font-size:var(--font-sm)"},
      `${t.declared_id} v${t.declared_version} · ${t.call_count} kall · ${t.content_hash.slice(0,12)}…`
      + (t.verified ? "" : " · ⚠️ uverifisert")));
    box.appendChild(h("pre",{style:PRE}, t.body || "(tom — eldre prompt sendt ferdig sammensatt)"));
    container.appendChild(box);
  });
}

function renderAdminDashboard(container, data){
  const users = data.users || [];
  const generated = data.generated_at ? new Date(data.generated_at).toLocaleString("no") : "";

  const students = users.filter(u => u.role === "student");
  const teachers = users.filter(u => u.role === "teacher");

  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v]) => el.setAttribute(k,v));
    children.forEach(c => el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return el;
  };
  const t = s => document.createTextNode(s);

  container.innerHTML = "";

  // Header
  container.appendChild(h("h1",{style:"margin:0 0 4px;font-size:22px"},"Admin — Brukeroversikt"));
  container.appendChild(h("p",{style:"color:var(--color-text-muted);font-size:var(--font-sm);margin:0 0 24px"},`Generert: ${generated} · ${users.length} brukere totalt`));

  // Summary cards
  const summary = h("div",{style:"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px"});
  [
    ["👥 Brukere totalt", users.length],
    ["🎓 Elever", students.length],
    ["👩‍🏫 Lærere", teachers.length],
    ["📚 Ord opprettet", users.reduce((s,u)=>s+u.words,0)],
    ["✍️ Setninger", users.reduce((s,u)=>s+u.sentences,0)],
    ["📝 Stiler", users.reduce((s,u)=>s+u.essays,0)],
  ].forEach(([label, val]) => {
    const card = h("div",{style:"background:#f8f9fa;border-radius:var(--radius-md);padding:14px 20px;min-width:120px;text-align:center"});
    card.appendChild(h("div",{style:"font-size:22px;font-weight:700;color:#1a6b4a"},String(val)));
    card.appendChild(h("div",{style:"font-size:var(--font-xs);color:var(--color-text-muted);margin-top:2px"},label));
    summary.appendChild(card);
  });
  container.appendChild(summary);

  // Teachers section
  if(teachers.length){
    container.appendChild(h("h2",{style:"font-size:var(--font-base);margin:0 0 10px"},"👩‍🏫 Lærere"));
    const tTable = buildAdminTable(h,
      ["Navn","E-post","Elever","Oppgaver gitt","Sist aktiv","Opprettet"],
      teachers.map(u => [
        u.name,
        u.email,
        u.students.length ? u.students.join(", ") : "—",
        u.assignments_given || 0,
        u.last_active ? new Date(u.last_active).toLocaleDateString("no") : "—",
        new Date(u.created_at).toLocaleDateString("no"),
      ])
    );
    container.appendChild(tTable);
  }

  // Students section
  container.appendChild(h("h2",{style:"font-size:var(--font-base);margin:24px 0 10px"},"🎓 Elever"));
  const sTable = buildAdminTable(h,
    ["Navn","E-post","Lærer","Ord","Setninger","Stiler","Sammendrag","Plan","Hendelser","Sist aktiv","Opprettet"],
    students.map(u => [
      u.name,
      u.email,
      u.teacher || "—",
      u.words,
      u.sentences,
      u.essays,
      u.summaries,
      u.has_plan ? "✓" : "—",
      u.events,
      u.last_active ? new Date(u.last_active).toLocaleDateString("no") : "—",
      new Date(u.created_at).toLocaleDateString("no"),
    ])
  );
  container.appendChild(sTable);
}

function buildAdminTable(h, headers, rows){
  const style = "border-collapse:collapse;width:100%;font-size:var(--font-sm);margin-bottom:16px";
  const thStyle = "background:#1a6b4a;color:#fff;padding:8px 12px;text-align:left;white-space:nowrap";
  const tdStyle = "padding:7px 12px;border-bottom:1px solid var(--color-border-light);vertical-align:top";
  const trEvenStyle = "background:#f9f9f9";

  const table = h("div",{style:"overflow-x:auto"});
  const t = document.createElement("table");
  t.setAttribute("style", style);

  const thead = t.createTHead();
  const hr = thead.insertRow();
  headers.forEach(hdr => {
    const th = document.createElement("th");
    th.setAttribute("style", thStyle);
    th.textContent = hdr;
    hr.appendChild(th);
  });

  const tbody = t.createTBody();
  rows.forEach((row, i) => {
    const tr = tbody.insertRow();
    if(i % 2 === 1) tr.setAttribute("style", trEvenStyle);
    row.forEach(cell => {
      const td = tr.insertCell();
      td.setAttribute("style", tdStyle);
      td.textContent = String(cell);
    });
  });

  table.appendChild(t);
  return table;
}
