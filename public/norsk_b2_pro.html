  else if(teacherState.view === "essays")     wrap.appendChild(buildLaererEssayList());
  else if(teacherState.view === "essay-detail") wrap.appendChild(buildLaererEssayDetail());
  else if(teacherState.view === "texts")      wrap.appendChild(buildLaererTexts());
  else if(teacherState.view === "words")      wrap.appendChild(buildLaererWords());
  else if(teacherState.view === "sentences")  wrap.appendChild(buildLaererSentences());
  else if(teacherState.view === "plan")       wrap.appendChild(buildLaererPlan());
  else if(teacherState.view === "summaries")  wrap.appendChild(buildLaererSummaries());
  else if(teacherState.view === "assignments") wrap.appendChild(buildLaererAssignments());
  else if(teacherState.view === "bank-texts")  wrap.appendChild(buildLaererBankTexts());
  else if(teacherState.view === "bank-prompts") wrap.appendChild(buildLaererBankPrompts());
  else if(teacherState.view === "ai-fokus")    wrap.appendChild(buildLaererAiFokus());
  else if(teacherState.view === "ai-fokus-hub") wrap.appendChild(buildLaererAiFokusHub());

  frag.appendChild(wrap);
  return frag;
}

function laererSetView(view){ teacherState.view=view; renderContent(); }

// ── Roster view ────────────────────────────────────────────────────────────
function buildLaererRoster(){
  const frag = document.createDocumentFragment();

  // Topbar (§ "One primary action per screen"): Legg til elev is the only filled
  // button here; Ny klasse is outline. Both open a dialog rather than pinning a
  // form above the list — same rule Ordbank's "Nytt ord" already follows.
  const topbar=el("div",{class:"topbar",style:{borderRadius:"var(--r-card)",marginBottom:"var(--s-4)"}});
  const topbarTitle=el("div",{});
  topbarTitle.appendChild(el("div",{class:"topbar__title"},"Klassen min"));
  const topbarMeta=el("div",{class:"topbar__meta"},"…");
  topbarTitle.appendChild(topbarMeta);
  topbar.appendChild(topbarTitle);
  const topbarActions=el("div",{class:"actions",style:{flexWrap:"wrap",justifyContent:"flex-end"}});
  topbarActions.appendChild(el("button",{class:"btn",click:openNewClassDialog},icon("plus"),"Ny klasse"));
  topbarActions.appendChild(el("button",{class:"btn btn--primary",click:openAddStudentDialog},icon("plus"),"Legg til elev"));
  topbar.appendChild(topbarActions);
  frag.appendChild(topbar);

  // Klasser (feature 018). Classes group the roster; they do not replace it, so
  // everything below still lists every student whether or not they are in one.
  const classCard = el("div",{class:"card",style:{marginBottom:"var(--s-4)"}});
  classCard.appendChild(el("div",{class:"label-mono",style:{marginBottom:"var(--s-2)"}},"Klasser"));
  const classListWrap = el("div",{style:{display:"flex",flexDirection:"column",gap:"var(--s-2)"}});
  classCard.appendChild(classListWrap);
  frag.appendChild(classCard);

  // Student list
  const listWrap = el("div",{style:{display:"flex",flexDirection:"column",gap:"var(--s-2)"}});
  frag.appendChild(listWrap);
  const giOppgaverWrap = el("div",{});
  frag.appendChild(giOppgaverWrap);

  function openAddStudentDialog(){
    openDialog(close=>{
      let emailVal="";
      const emailIn=el("input",{class:"input",type:"email",placeholder:"navn@skole.no",autofocus:true,
        input(e){emailVal=e.target.value;},
        keydown(e){if(e.key==="Enter"){e.preventDefault();submit();}}});
      const field=buildField({label:"Elevens e-postadresse",req:true,inputEl:emailIn});
      const err=el("p",{class:"card__note",style:{color:"var(--danger)",display:"none"}});
      async function submit(){
        const email=emailVal.trim();
        if(!email){ err.textContent="Skriv inn en e-postadresse"; err.style.display=""; return; }
        err.style.display="none";
        const r = await api("/api/teacher/students",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({student_email:email})});
        if(r.ok){
          teacherState.students=null; // bust cache
          close(); renderContent();
        } else {
          const d=await r.json().catch(()=>({detail:"Ukjent feil"}));
          err.textContent=d.detail||"Kunne ikke legge til eleven";
          err.style.display="";
        }
      }
      return buildDialog({title:"Legg til elev",
        sub:"Eleven må allerede ha en konto i appen.",
        body:el("div",{},field,err),
        primaryLabel:"Legg til", onPrimary:submit, close});
    });
  }

  function openNewClassDialog(){
    openDialog(close=>{
      let nameVal="";
      const nameIn=el("input",{class:"input",type:"text",maxlength:"100",placeholder:"F.eks. Helsfyr B2",autofocus:true,
        input(e){nameVal=e.target.value;},
        keydown(e){if(e.key==="Enter"){e.preventDefault();submit();}}});
      const field=buildField({label:"Navn på klassen",req:true,inputEl:nameIn});
      const err=el("p",{class:"card__note",style:{color:"var(--danger)",display:"none"}});
      async function submit(){
        const name=nameVal.trim();
        if(!name){ err.textContent="Klassen må ha et navn"; err.style.display=""; return; }
        err.style.display="none";
        const r = await api("/api/teacher/classes",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({name})}).catch(()=>null);
        if(r?.ok){ teacherState.classes=null; teacherState.students=null; close(); renderContent(); }
        else { err.textContent="Kunne ikke opprette klassen"; err.style.display=""; }
      }
      return buildDialog({title:"Ny klasse", body:el("div",{},field,err),
        primaryLabel:"Opprett", onPrimary:submit, close});
    });
  }

  async function setStudentClass(studentId, classId){
    const r = await api(`/api/teacher/students/${encodeURIComponent(studentId)}/class`,{
      method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({class_id:classId||null})}).catch(()=>null);
    if(r?.ok){ teacherState.students=null; teacherState.classes=null; renderContent(); }
    else toast("Kunne ikke endre klasse");
  }

  function initials(name){
    return (name||"").trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("").toUpperCase()||"?";
  }

  function studentRow(s){
    const row = el("div",{class:"card",style:{display:"flex",alignItems:"center",gap:"var(--s-3)",cursor:"pointer"}});
    const info = el("div",{style:{flex:"1",display:"flex",alignItems:"center",gap:"var(--s-3)",minWidth:"0"},click:()=>{
      teacherState.selectedStudent=s;
      teacherState.studentProgress=null;
      teacherState.studentEssays=null;
      teacherState.studentTexts=null;
      teacherState.studentWords=null;
      teacherState.studentSentences=null;
      teacherState.studentPlan=null;
      teacherState.studentSummaries=null;
      teacherState.studentAssignments=null;
      laererSetView("progress");
    }});
    info.appendChild(el("span",{class:"avatar"},initials(s.name)));
    const nameCol=el("div",{style:{minWidth:"0"}});
    nameCol.appendChild(el("div",{class:"card__title",style:{fontSize:"14.5px"}},$esc(s.name)));
    nameCol.appendChild(el("div",{class:"card__sub"},$esc(s.email)));
    info.appendChild(nameCol);

    // One control for place, move and unassign — a student is in at most one class,
    // so changing it is a single choice rather than a remove-then-add.
    const sel = el("select",{class:"select",style:{width:"auto",height:"var(--h-pill)",fontSize:"13px"},
      click:(e)=>e.stopPropagation(),
      change:(e)=>{ e.stopPropagation(); setStudentClass(s.id, e.target.value); }});
    sel.appendChild(el("option",{value:""},"Ingen klasse"));
    (teacherState.classes||[]).forEach(c=>{
      sel.appendChild(el("option",{value:c.id},c.name));
    });
    sel.value = s.class_id || "";

    const removeBtn = el("button",{class:"btn btn--danger",
      click: async (e)=>{
        e.stopPropagation();
        if(!confirm(`Fjerne ${s.name} fra elevlisten din?`)) return;
        const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}`,{method:"DELETE"}).catch(()=>null);
        if(r?.ok){ teacherState.students=null; teacherState.classes=null; renderContent(); }
        else toast("Kunne ikke fjerne eleven");
      }
    },icon("trash"),"Fjern");
    row.appendChild(info);
    row.appendChild(sel);
    row.appendChild(removeBtn);
    return row;
  }

  function renderClassAdmin(){
    classListWrap.innerHTML="";
    const list = teacherState.classes||[];
    if(!list.length){
      classListWrap.appendChild(el("p",{class:"card__note"},
        "Ingen klasser ennå. Elevene dine fungerer som før uten en klasse."));
      return;
    }
    list.forEach(c=>{
      const row = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)"}});
      row.appendChild(el("span",{style:{flex:"1",fontSize:"var(--t-base)"}},
        `${c.name} · `, el("span",{class:"pill__count"},`${c.student_count} ${c.student_count===1?"elev":"elever"}`)));
      row.appendChild(el("button",{class:"btn",
        click: async ()=>{
          const name = prompt("Nytt navn på klassen:", c.name);
          if(name===null) return;
          if(!name.trim()){ toast("Klassen må ha et navn"); return; }
          const r = await api(`/api/teacher/classes/${encodeURIComponent(c.id)}`,{method:"PATCH",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name:name.trim()})}).catch(()=>null);
          if(r?.ok){ teacherState.classes=null; teacherState.students=null; renderContent(); }
          else toast("Kunne ikke endre navnet");
        }},icon("edit"),"Gi nytt navn"));
      row.appendChild(el("button",{class:"btn btn--danger",
        click: async ()=>{
          // Say plainly what survives. Deleting a class releases its students; it
          // does not remove them or touch anything they have written.
          if(!confirm(`Slette klassen "${c.name}"?\n\nElevene blir stående uten klasse. Ingenting de har laget blir slettet.`)) return;
          const r = await api(`/api/teacher/classes/${encodeURIComponent(c.id)}`,{method:"DELETE"}).catch(()=>null);
          if(r?.ok){ teacherState.classes=null; teacherState.students=null; renderContent(); }
          else toast("Kunne ikke slette klassen");
        }},icon("trash"),"Slett"));
      classListWrap.appendChild(row);
    });
  }

  async function loadStudents(){
    await ensureTeacherRoster();
    topbarMeta.textContent = `${teacherState.students.length} ${teacherState.students.length===1?"elev":"elever"}`;
    renderClassAdmin();
    listWrap.innerHTML="";
    giOppgaverWrap.innerHTML="";
    if(!teacherState.students.length){
      listWrap.appendChild(el("p",{class:"card__note"},"Ingen elever tilknyttet ennå."));
      return;
    }

    // Grouped by class, with the unassigned last. Unassigned is a normal state, so
    // the group is shown without warning styling and only when it has members.
    const groups = (teacherState.classes||[]).map(c=>({
      label:c.name, students:teacherState.students.filter(s=>s.class_id===c.id)
    }));
    const unassigned = teacherState.students.filter(s=>!s.class_id);
    if(unassigned.length) groups.push({label:"Uten klasse", students:unassigned});

    groups.forEach(g=>{
      if(!g.students.length && g.label!=="Uten klasse"){
        listWrap.appendChild(el("div",{class:"label-mono",style:{marginTop:"var(--s-3)"}},
          `${g.label} — ingen elever`));
        return;
      }
      listWrap.appendChild(el("div",{class:"label-mono",style:{marginTop:"var(--s-3)"}},
        $esc(g.label)));
      g.students.forEach(s=>listWrap.appendChild(studentRow(s)));
    });

    giOppgaverWrap.appendChild(buildGiOppgaver(teacherState.students));
  }
  loadStudents();
  return frag;
}

// ── Progress view ──────────────────────────────────────────────────────────
function buildLaererProgress(){
  const frag = document.createDocumentFragment();
  const s = teacherState.selectedStudent;

  const back = el("button",{class:"btn",style:{marginBottom:"var(--s-3)"},
    click:()=>laererSetView("roster")},"← Tilbake");
  frag.appendChild(back);

  const topbar=el("div",{class:"topbar",style:{borderRadius:"var(--r-card)",marginBottom:"var(--s-4)"}});
  const topbarTitle=el("div",{});
  topbarTitle.appendChild(el("div",{class:"topbar__title"},`Fremgang: ${$esc(s?.name||"")}`));
  if(s?.email) topbarTitle.appendChild(el("div",{class:"topbar__meta"},$esc(s.email)));
  topbar.appendChild(topbarTitle);
  frag.appendChild(topbar);

  const progWrap = el("div",{});
  frag.appendChild(progWrap);

  async function loadProgress(){
    if(!teacherState.studentProgress){
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/progress`).catch(()=>null);
      if(r?.ok) teacherState.studentProgress=await r.json();
    }
    const p = teacherState.studentProgress?.progress;
    progWrap.innerHTML="";
    if(!p){ progWrap.appendChild(el("p",{class:"card__note"},"Kunne ikke laste fremgang.")); return; }

    // No per-card icon (§ "icon only where load-bearing") — each card's label is
    // already a distinct, legible word, so an icon here would be decoration, not a
    // scanning aid. Matches Statistikk's own stat-grid, which is text-only too.
    const grid = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:"var(--s-3)",marginBottom:"var(--s-4)"}});
    [
      ["Mine oppgaver",null,()=>{teacherState.studentAssignments=null;laererSetView("assignments");}],
      ["Studieplan",null,()=>{teacherState.studentPlan=null;laererSetView("plan");}],
      ["Tekster lest",p.texts_read,()=>{teacherState.studentTexts=null;laererSetView("texts");}],
      ["Ord i ordbank",p.words_in_bank,()=>{teacherState.studentWords=null;laererSetView("words");}],
      ["Ord øvd",p.words_practiced,()=>{teacherState.studentWords=null;laererSetView("words");}],
      ["Flashcard-sesjoner",p.flashcard_sessions,null],
      ["Setninger",p.sentences_written,()=>{teacherState.studentSentences=null;laererSetView("sentences");}],
      ["Stiler levert",p.essays_submitted,p.essays_submitted>0?()=>{teacherState.studentEssays=null;laererSetView("essays");}:null],
      ["Gjenfortellinger",(p.summaries_written||0),()=>{teacherState.studentSummaries=null;laererSetView("summaries");}],
      ["AI-fokus",null,()=>{teacherState.aiInstructions=null;teacherState.reportConfigs={essay:null,reading_summary:null};teacherState.promptTestResults=[];laererSetView("ai-fokus");}],
    ].forEach(([label,val,onClick])=>{
      const card=el("div",{class:"card",style:{textAlign:"center",cursor:onClick?"pointer":"default"},
        ...(onClick?{click:onClick}:{})});
      if(val!==null) card.appendChild(el("div",{style:{fontSize:"28px",fontWeight:"700",color:"var(--ink)",lineHeight:"1.1"}},String(val)));
      card.appendChild(el("div",{class:"label-mono",style:{marginTop:val!==null?"var(--s-1)":"0"}},label));
      if(onClick) card.appendChild(el("div",{class:"btn--link",style:{marginTop:"var(--s-2)"}},"Se detaljer →"));
      grid.appendChild(card);
    });
    progWrap.appendChild(grid);
  }
  loadProgress();
  return frag;
}

// ── AI-fokus view (feature 012) ───────────────────────────────────────────
function buildLaererAiFokus(){
  const frag = document.createDocumentFragment();
  const s = teacherState.selectedStudent;

  const back = el("button",{class:"btn",style:{marginBottom:"var(--s-3)"},
    click:()=>laererSetView("progress")},"← Tilbake");
  frag.appendChild(back);
  frag.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"var(--s-1)"}},`AI-fokus: ${$esc(s?.name||"")}`));
  frag.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-4)"}},
    "Instruksjoner du skriver her blir automatisk lagt til i alle Claude-tilbakemeldinger denne eleven får (stiler, setninger og gjenfortellinger)."));

  const card = el("div",{class:"card"});
  frag.appendChild(card);

  const textarea = el("textarea",{class:"textarea",rows:"6", maxlength:"1500",
    placeholder:"F.eks: Denne eleven må jobbe mer med substantivbøying. Neste gang han gjør feil: forklar substantivformene med eksempler."});
  card.appendChild(textarea);

  const err = el("p",{class:"card__note",style:{color:"var(--danger)",marginTop:"var(--s-2)",display:"none"}});
  const btnRow = el("div",{class:"actions",style:{marginTop:"var(--s-3)",flexWrap:"wrap"}});

  async function saveInstructions(value){
    if(!value){ err.textContent="Instruksjoner kan ikke være tomme"; err.style.display=""; return false; }
    err.style.display="none";
    saveBtn.disabled=true; saveBtn.textContent="Lagrer…";
    try{
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/ai-instructions`,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({instructions:value}),
      });
      if(r.ok){
        teacherState.aiInstructions = await r.json();
        textarea.value = value;
        toast("✓ AI-fokus lagret");
        saveBtn.textContent="Lagret ✓";
        saveBtn.disabled=false;
        clearBtn.disabled=false;
        return true;
      }
      const d = await r.json().catch(()=>({detail:"Ukjent feil"}));
      err.textContent = d.detail||"Kunne ikke lagre";
      err.style.display="";
    }catch(e){
      err.textContent="Nettverksfeil";
      err.style.display="";
    }
    saveBtn.textContent="Lagre";
    saveBtn.disabled=false;
    return false;
  }

  const saveBtn = el("button",{class:"btn btn--primary",style:{flex:"1"},
    click: ()=>saveInstructions(textarea.value.trim())
  },"Lagre");
  btnRow.appendChild(saveBtn);

  const clearBtn = el("button",{class:"btn btn--danger",
    disabled: !teacherState.aiInstructions?.instructions,
    click: async ()=>{
      clearBtn.disabled=true;
      try{
        const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/ai-instructions`,{method:"DELETE"});
        if(r.ok){
          teacherState.aiInstructions = {instructions:null, updated_at:null};
          textarea.value="";
          toast("✓ AI-fokus fjernet");
          clearBtn.disabled=true;
        } else {
          clearBtn.disabled=false;
        }
      }catch(e){
        clearBtn.disabled=false;
      }
    }
  },icon("trash"),"Fjern");
  btnRow.appendChild(clearBtn);

  const chatToggleBtn = el("button",{class:"btn",style:{marginLeft:"auto"},
    click: ()=>{
      const willOpen = chatPanel.style.display==="none";
      chatPanel.style.display = willOpen ? "" : "none";
      if(willOpen) renderChatMessages();
    }
  },"Utform med Claude");
  btnRow.appendChild(chatToggleBtn);

  card.appendChild(err);
  card.appendChild(btnRow);

  // ── Refinement chat panel ─────────────────────────────────────────────
  const chatPanel = el("div",{style:{marginTop:"var(--s-4)",paddingTop:"var(--s-4)",borderTop:"1px solid var(--line-soft)",display:"none"}});
  card.appendChild(chatPanel);

  const chatMessagesEl = el("div",{style:{maxHeight:"260px",overflowY:"auto",marginBottom:"var(--s-3)"}});
  const chatLimitMsg = el("p",{class:"card__note",style:{color:"var(--danger)",margin:"var(--s-2) 0",display:"none"}},
    "Samtalen er full — lagre forslaget eller start på nytt.");
  const chatInput = el("input",{class:"input",type:"text",placeholder:"Beskriv hva du vil at AI-en skal fokusere på …",
    style:{marginBottom:"var(--s-2)"}});
  const chatBtnRow = el("div",{class:"actions"});
  const chatSendBtn = el("button",{class:"btn btn--primary",click:()=>sendChatMessage()},"Send");
  const chatResetBtn = el("button",{class:"btn",style:{display:"none"},
    click:()=>{
      teacherState.aiChatMessages=[];
      teacherState.aiChatTurnCount=0;
      chatLimitMsg.style.display="none";
      chatInput.disabled=false; chatSendBtn.disabled=false;
      chatResetBtn.style.display="none";
      renderChatMessages();
    }
  },"Start på nytt");
  chatBtnRow.appendChild(chatSendBtn);
  chatBtnRow.appendChild(chatResetBtn);

  chatPanel.appendChild(chatMessagesEl);
  chatPanel.appendChild(chatLimitMsg);
  chatPanel.appendChild(chatInput);
  chatPanel.appendChild(chatBtnRow);

  function renderChatMessages(){
    chatMessagesEl.innerHTML="";
    teacherState.aiChatMessages.forEach(m=>{
      const bubble = el("div",{style:{
        margin:"6px 0", padding:"8px 10px", borderRadius:"var(--r-btn)", fontSize:"var(--t-sm)", lineHeight:"1.5",
        whiteSpace:"pre-wrap",
        background: m.role==="user" ? "var(--green-tint)" : "var(--surface-head)",
        marginLeft: m.role==="user" ? "20%" : "0",
        marginRight: m.role==="user" ? "0" : "20%",
      }});
      bubble.textContent = m.content;
      chatMessagesEl.appendChild(bubble);
      if(m.proposedInstructions){
        const saveProposalBtn = el("button",{class:"btn btn--primary",style:{marginTop:"4px"},
          click: async ()=>{ await saveInstructions(m.proposedInstructions); }
        },"Lagre som AI-fokus");
        chatMessagesEl.appendChild(saveProposalBtn);
      }
    });
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  async function sendChatMessage(){
    const text = chatInput.value.trim();
    if(!text) return;
    teacherState.aiChatMessages.push({role:"user", content:text});
    teacherState.aiChatTurnCount += 1;
    chatInput.value="";
    renderChatMessages();
    chatSendBtn.disabled=true; chatInput.disabled=true;
    try{
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/ai-chat`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          messages: teacherState.aiChatMessages.map(m=>({role:m.role, content:m.content})),
          turn_count: teacherState.aiChatTurnCount,
        }),
      });
      if(r.status===429){
        chatLimitMsg.style.display="";
        chatInput.disabled=true; chatSendBtn.disabled=true;
        chatResetBtn.style.display="";
        return;
      }
      if(r.ok){
        const data = await r.json();
        teacherState.aiChatMessages.push({role:"assistant", content:data.reply, proposedInstructions:data.proposed_instructions||null});
        renderChatMessages();
      }
    }catch(e){
      // leave the user's message visible; they can retry
    }
    chatInput.disabled=false; chatSendBtn.disabled=false;
  }

  async function loadInstructions(){
    if(!teacherState.aiInstructions){
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/ai-instructions`).catch(()=>null);
      teacherState.aiInstructions = r?.ok ? await r.json() : {instructions:null, updated_at:null};
    }
    textarea.value = teacherState.aiInstructions.instructions || "";
    clearBtn.disabled = !teacherState.aiInstructions.instructions;
  }
  loadInstructions();

  frag.appendChild(buildReportLayoutCard(s));

  return frag;
}

// ── Report layout (feature 021, US1) ─────────────────────────────────────
// Which sections appear in this student's essay/reading-summary feedback,
// and in what order. A separate card from the free-text instruction above —
// different mechanism (structural, not a sentence the model reads), same
// screen. Config is per (student, surface): essay and reading-summary have
// different default shapes, so the two are edited independently via tabs.
const REPORT_BLOCK_TYPES = ["errors","rules","strengths","improvements","prose"];
const REPORT_BLOCK_LABELS = {
  errors:"Grammatikkfeil", rules:"Regler", strengths:"Styrker",
  improvements:"Forbedring", prose:"Fritekst",
};

function buildReportLayoutCard(student){
  const card = el("div",{class:"card",style:{marginTop:"var(--s-4)"}});
  card.appendChild(el("div",{class:"card__title"},"Rapportlayout"));
  card.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-3)"}},
    "Velg hvilke seksjoner denne eleven får i tilbakemeldingen, og i hvilken rekkefølge. Uten endringer her ser eleven akkurat det samme som før."));

  // Two mutually exclusive surfaces — a toggle, styled like any other filter
  // pill pair rather than two competing primary/secondary buttons.
  const tabRow = el("div",{style:{display:"flex",gap:"var(--s-2)",marginBottom:"var(--s-3)"}});
  card.appendChild(tabRow);

  const bodyHost = el("div",{});
  card.appendChild(bodyHost);

  const err = el("p",{class:"card__note",style:{color:"var(--danger)",marginTop:"var(--s-2)",display:"none"}});

  [["essay","Stil"],["reading_summary","Gjenfortelling"]].forEach(([surface,label])=>{
    const active = teacherState.reportConfigSurface===surface;
    tabRow.appendChild(el("button",{
      class:"pill", "aria-pressed": active?"true":"false",
      click: ()=>{ teacherState.reportConfigSurface=surface; renderBody(); }
    }, label));
  });

  // The draft being edited — starts from whatever is loaded (saved config or
  // default), and is only sent to the server on "Lagre". Nothing here writes
  // until then, so switching tabs or reloading discards an unsaved change.
  let draft = null;

  async function loadConfig(surface){
    if(!teacherState.reportConfigs[surface]){
      const r = await api(`/api/teacher/students/${encodeURIComponent(student.id)}/report-config?surface=${surface}`).catch(()=>null);
      teacherState.reportConfigs[surface] = r?.ok ? await r.json() : null;
    }
    return teacherState.reportConfigs[surface];
  }

  function renderBlockRow(list, index, container){
    const block = list[index];
    const row = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",padding:"8px 10px",
      background:"var(--surface-head)",borderRadius:"var(--r-btn)",marginBottom:"var(--s-1)"}});
    row.appendChild(el("span",{style:{flex:"1",fontSize:"var(--t-sm)",fontWeight:"600"}},
      REPORT_BLOCK_LABELS[block.type]||block.type));
    row.appendChild(el("button",{class:"icon-btn",disabled:index===0,
      click:()=>{ [list[index-1],list[index]]=[list[index],list[index-1]]; container(); }},"↑"));
    row.appendChild(el("button",{class:"icon-btn",disabled:index===list.length-1,
      click:()=>{ [list[index+1],list[index]]=[list[index],list[index+1]]; container(); }},"↓"));
    row.appendChild(el("button",{class:"icon-btn",style:{color:"var(--danger)"},
      click:()=>{ list.splice(index,1); container(); }},"✕"));
    return row;
  }

  function renderBody(){
    bodyHost.innerHTML="";
    err.style.display="none";
    const surface = teacherState.reportConfigSurface;
    bodyHost.appendChild(el("p",{class:"card__note"},"Laster…"));

    loadConfig(surface).then(cfg=>{
      bodyHost.innerHTML="";
      if(!cfg){
        bodyHost.appendChild(el("p",{class:"card__note",style:{color:"var(--danger)"}},"Kunne ikke laste rapportlayout."));
        return;
      }
      draft = cfg.blocks.map(b=>({type:b.type, params:b.params||{}, instruction:b.instruction||null}));

      if(cfg.is_default){
        bodyHost.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-2)"}},
          "Standard rapport — ingen endringer lagret for denne eleven."));
      }else{
        bodyHost.appendChild(el("p",{class:"card__note",style:{color:"var(--green)",marginBottom:"var(--s-2)"}},
          "Tilpasset rapport lagret."+ (cfg.updated_at ? " Sist endret "+new Date(cfg.updated_at).toLocaleDateString("nb-NO")+"." : "")));
      }

      const listEl = el("div",{});
      bodyHost.appendChild(listEl);

      function renderList(){
        listEl.innerHTML="";
        draft.forEach((_,i)=>listEl.appendChild(renderBlockRow(draft, i, renderList)));
      }
      renderList();

      const addRow = el("div",{style:{display:"flex",gap:"var(--s-2)",marginTop:"var(--s-2)",marginBottom:"var(--s-3)"}});
      const addSelect = el("select",{class:"select",style:{flex:"1"}},
        ...REPORT_BLOCK_TYPES.map(t=>el("option",{value:t},REPORT_BLOCK_LABELS[t])));
      addRow.appendChild(addSelect);
      addRow.appendChild(el("button",{class:"btn",
        click:()=>{ draft.push({type:addSelect.value, params:{}, instruction:null}); renderList(); }
      },icon("plus"),"Legg til blokk"));
      bodyHost.appendChild(addRow);

      bodyHost.appendChild(err);

      const btnRow = el("div",{class:"actions",style:{marginTop:"var(--s-2)"}});
      const saveBtn = el("button",{class:"btn btn--primary",
        click: async ()=>{
          if(!draft.length){
            err.textContent="Rapporten må ha minst én seksjon.";
            err.style.display="";
            return;
          }
          err.style.display="none";
          saveBtn.disabled=true; saveBtn.textContent="Lagrer…";
          try{
            const r = await api(`/api/teacher/students/${encodeURIComponent(student.id)}/report-config?surface=${surface}`,{
              method:"PUT",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({blocks:draft}),
            });
            if(r.ok){
              teacherState.reportConfigs[surface] = await r.json();
              toast("✓ Rapportlayout lagret");
              renderBody();
            }else{
              const d = await r.json().catch(()=>({detail:"Ukjent feil"}));
              err.textContent = typeof d.detail==="string" ? d.detail : "Kunne ikke lagre";
              err.style.display="";
            }
          }catch(e){
            err.textContent="Nettverksfeil";
            err.style.display="";
          }
          saveBtn.disabled=false; saveBtn.textContent="Lagre rapportlayout";
        }
      },"Lagre rapportlayout");
      btnRow.appendChild(saveBtn);

      if(!cfg.is_default){
        btnRow.appendChild(el("button",{class:"btn",
          click: async ()=>{
            const r = await api(`/api/teacher/students/${encodeURIComponent(student.id)}/report-config?surface=${surface}`,{method:"DELETE"});
            if(r.ok){
              teacherState.reportConfigs[surface] = null;
              toast("✓ Tilbakestilt til standard");
              renderBody();
            }
          }
        },"Tilbakestill til standard"));
      }
      bodyHost.appendChild(btnRow);

      // Prompt testing only covers essay today — the backend has no way to
      // resolve a reading text server-side to test against (see
      // PromptTestRequest.surface's docstring in the backend).
      if(surface==="essay"){
        bodyHost.appendChild(buildPromptTestPanel(student, ()=>draft));
      }
    });
  }

  renderBody();
  return card;
}

// "Test mot essay" (feature 021, US2) — run the draft config (not necessarily
// saved) against one of the student's essays, or pasted text, and see a real
// AI reply before adopting it. `getDraft()` reads the live draft array from
// the enclosing buildReportLayoutCard closure, so a test always reflects
// whatever the teacher currently has on screen, saved or not.
function buildPromptTestPanel(student, getDraft){
  const wrap = el("div",{style:{marginTop:"var(--s-4)",paddingTop:"var(--s-4)",borderTop:"1px solid var(--line-soft)"}});

  const toggleBtn = el("button",{class:"btn",
    click:()=>{
      const willOpen = panel.style.display==="none";
      panel.style.display = willOpen ? "" : "none";
      if(willOpen) renderResults();
    }
  },"Test mot stil");
  wrap.appendChild(toggleBtn);

  const panel = el("div",{style:{marginTop:"var(--s-3)",display:"none"}});
  wrap.appendChild(panel);

  panel.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-3)"}},
    "Kjør den ulagrede layouten over mot en ekte stil. Testen lagres ikke til eleven og påvirker ikke det eleven ser."));

  const sourceRow = el("div",{style:{display:"flex",gap:"var(--s-2)",marginBottom:"var(--s-2)"}});
  const essaySelect = el("select",{class:"select",style:{flex:"1"}});
  sourceRow.appendChild(essaySelect);
  panel.appendChild(sourceRow);

  const pasteArea = el("textarea",{class:"textarea",rows:"4",placeholder:"…eller lim inn en tekst å teste mot",
    style:{marginBottom:"var(--s-2)"}});
  panel.appendChild(pasteArea);

  const err = el("p",{class:"card__note",style:{color:"var(--danger)",marginBottom:"var(--s-2)",display:"none"}});
  panel.appendChild(err);

  const runBtn = el("button",{class:"btn btn--primary",
    click: async ()=>{
      const draft = getDraft();
      if(!draft || !draft.length){
        err.textContent="Rapporten må ha minst én seksjon før du kan teste den.";
        err.style.display=""; return;
      }
      const pasted = pasteArea.value.trim();
      const essayId = essaySelect.value;
      let source, sourceLabel;
      if(pasted){
        source = {kind:"pasted", text:pasted};
        sourceLabel = "Innlimt tekst";
      }else if(essayId){
        source = {kind:"essay", essay_id:essayId};
        sourceLabel = essaySelect.selectedOptions[0]?.textContent || "Stil";
      }else{
        err.textContent="Velg en stil eller lim inn en tekst.";
        err.style.display=""; return;
      }
      err.style.display="none";
      runBtn.disabled=true; runBtn.textContent="Kjører test…";
      try{
        const r = await api(`/api/teacher/students/${encodeURIComponent(student.id)}/prompt-test`,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({surface:"essay", blocks:draft, source}),
        });
        if(r.ok){
          const data = await r.json();
          const rawText = claudeText(data.reply);
          const jsonText = rawText.replace(/```json?\n?/gi,"").replace(/```/g,"").trim();
          let parsed;
          try{ parsed = JSON.parse(jsonText); }
          catch(e){
            err.textContent="Svaret kunne ikke tolkes. Prøv igjen.";
            err.style.display=""; return;
          }
          teacherState.promptTestResults.unshift({sourceLabel, parsed, at:new Date()});
          renderResults();
        }else{
          const d = await r.json().catch(()=>({detail:"Ukjent feil"}));
          err.textContent = aiFailureMessage(r.status, d?.detail?.reason||"", "");
          err.style.display="";
        }
      }catch(e){
        err.textContent="Nettverksfeil";
        err.style.display="";
      }
      runBtn.disabled=false; runBtn.textContent="Kjør test";
    }
  },"Kjør test");
  panel.appendChild(runBtn);

  const resultsHost = el("div",{style:{marginTop:"12px"}});
  panel.appendChild(resultsHost);

  async function loadEssayOptions(){
    if(!teacherState.studentEssays){
      const r = await api(`/api/teacher/students/${encodeURIComponent(student.id)}/essays`).catch(()=>null);
      teacherState.studentEssays = r?.ok ? await r.json() : [];
    }
    essaySelect.innerHTML="";
    essaySelect.appendChild(el("option",{value:""},
      teacherState.studentEssays.length ? "Velg en stil…" : "Ingen stiler levert ennå"));
    teacherState.studentEssays.forEach(essay=>{
      essaySelect.appendChild(el("option",{value:essay.id},
        `${essay.title} (${new Date(essay.created_at).toLocaleDateString("nb-NO")})`));
    });
  }
  loadEssayOptions();

  // FR-008: every run this session stays visible so two or more can be
  // compared side by side — nothing here is persisted past the session.
  function renderResults(){
    resultsHost.innerHTML="";
    if(!teacherState.promptTestResults.length) return;
    resultsHost.appendChild(el("div",{class:"label-mono",style:{marginBottom:"var(--s-2)"}},"Testresultater denne økten"));
    teacherState.promptTestResults.forEach(entry=>{
      const box = el("div",{style:{marginBottom:"var(--s-3)",paddingBottom:"var(--s-3)",borderBottom:"1px solid var(--line-soft)"}});
      box.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-1)"}},
        `${$esc(entry.sourceLabel)} · ${entry.at.toLocaleTimeString("nb-NO")}`));
      const resultContainer = el("div",{});
      box.appendChild(resultContainer);
      renderEssayClaudeResult(entry.parsed, resultContainer);
      resultsHost.appendChild(box);
    });
  }

  return wrap;
}

// ── AI-fokus hub (021 teacher/class scope) ──────────────────────────────
// Reached from the main teacher sidebar, not nested under a student. ONE
// editor — the teacher picks who it applies to (everyone / a class /
// particular students), and that choice only changes *where* "Lagre"/"Bruk"
// writes to, never what's being edited. "Alle elever" is a cascading
// standing default (student_id IS NULL rows, resolved fresh on every real
// feedback call — a new student picks it up for free). A class or
// particular students is a bulk write into each of those students' own
// rows instead, resolved once when the teacher acts — same precedent as
// "Hele klassen" already set for assignments elsewhere in this app: a
// student who joins that class afterward is unaffected until the teacher
// applies again. A student's own override (Klassen min → eleven →
// AI-fokus) always wins over either.
function buildLaererAiFokusHub(){
  const frag = document.createDocumentFragment();
  frag.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"var(--s-1)"}},"AI-fokus"));
  frag.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-4)"}},
    "Skriv instruksjonen og rapportlayouten du vil bruke, velg hvem det skal gjelde for, og forhåndsvis mot en ekte elevtekst før du lagrer. En elevs egen innstilling går alltid foran."));

  // ── Shared draft state for this screen — always reloaded fresh below,
  // never cached across visits, so the editor always starts from what is
  // actually in effect right now, not a possibly stale draft.
  let scopeType = teacherState.aiFokusScope || "all";
  let scopeClassId = teacherState.aiFokusScopeClassId;
  let scopeStudentIds = teacherState.aiFokusScopeStudentIds || new Set();
  let instructionsDraft = "";
  const blocksDraft = {essay:null, reading_summary:null};
  let activeSurface = "essay";

  function currentTarget(){
    if(scopeType==="class") return scopeClassId ? {type:"class", class_id:scopeClassId} : null;
    if(scopeType==="students") return scopeStudentIds.size ? {type:"students", student_ids:[...scopeStudentIds]} : null;
    return null; // "all" has no bulk target — it writes the cascading default instead
  }
  function scopeLabel(){
    if(scopeType==="class"){
      const c=(teacherState.classes||[]).find(c=>c.id===scopeClassId);
      return c ? `klassen ${c.name}` : "valgt klasse";
    }
    if(scopeType==="students") return `${scopeStudentIds.size} valgte elev(er)`;
    return "alle elevene dine";
  }

  // ── Scope ────────────────────────────────────────────────────────────
  const scopeCard = el("div",{class:"card",style:{marginBottom:"var(--s-4)"}});
  scopeCard.appendChild(el("div",{class:"card__title"},"Hvem gjelder dette for?"));
  scopeCard.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-3)"}},
    "«Alle elever» er en levende standard — nye elever får den automatisk, uten at du gjør noe. En klasse eller utvalgte elever skriver rett inn i hver av deres egne innstillinger, med en gang."));
  // Three mutually exclusive scopes — the same pill-toggle treatment as the
  // Stil/Gjenfortelling switch below, not three competing primary buttons.
  const scopeTypeRow = el("div",{style:{display:"flex",gap:"var(--s-2)",marginBottom:"var(--s-3)"}});
  scopeCard.appendChild(scopeTypeRow);
  const scopePickerHost = el("div",{});
  scopeCard.appendChild(scopePickerHost);
  frag.appendChild(scopeCard);

  [["all","Alle elever"],["class","En klasse"],["students","Utvalgte elever"]].forEach(([type,label])=>{
    scopeTypeRow.appendChild(el("button",{
      class:"pill", "aria-pressed": scopeType===type ? "true" : "false",
      click: ()=>{
        scopeType=type; teacherState.aiFokusScope=type;
        [...scopeTypeRow.children].forEach((btn,i)=>{
          btn.setAttribute("aria-pressed", ["all","class","students"][i]===type ? "true" : "false");
        });
        renderScopePicker(); renderPreviewStudentOptions();
        updateInstrButtonLabel(); updateRcButtonLabel();
      }
    }, label));
  });

  function renderScopePicker(){
    scopePickerHost.innerHTML="";
    if(scopeType==="class"){
      const select = el("select",{class:"select"},
        el("option",{value:""},"Velg en klasse…"),
        ...(teacherState.classes||[]).map(c=>el("option",{value:c.id},`${c.name} (${c.student_count} elever)`)),
      );
      select.value = scopeClassId || "";
      select.addEventListener("change",()=>{
        scopeClassId = select.value || null;
        teacherState.aiFokusScopeClassId = scopeClassId;
        renderPreviewStudentOptions(); updateInstrButtonLabel(); updateRcButtonLabel();
      });
      scopePickerHost.appendChild(select);
      if(!(teacherState.classes||[]).length){
        scopePickerHost.appendChild(el("p",{class:"card__note",style:{marginTop:"var(--s-2)"}},
          "Du har ingen klasser ennå — lag en fra Klassen min."));
      }
    }else if(scopeType==="students"){
      const list = el("div",{style:{maxHeight:"200px",overflowY:"auto",border:"1px solid var(--line)",borderRadius:"var(--r-btn)",padding:"var(--s-2)"}});
      (teacherState.students||[]).forEach(s=>{
        const row = el("label",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",padding:"4px 0",fontSize:"var(--t-sm)",cursor:"pointer"}});
        const cb = el("input",{type:"checkbox",checked:scopeStudentIds.has(s.id)});
        cb.addEventListener("change",()=>{
          if(cb.checked) scopeStudentIds.add(s.id); else scopeStudentIds.delete(s.id);
          renderPreviewStudentOptions(); updateInstrButtonLabel(); updateRcButtonLabel();
        });
        row.appendChild(cb);
        row.appendChild(el("span",{},s.name));
        list.appendChild(row);
      });
      if(!(teacherState.students||[]).length){
        list.appendChild(el("p",{class:"card__note"},"Ingen elever på lista ennå."));
      }
      scopePickerHost.appendChild(list);
    }
  }

  // ── Instructions ─────────────────────────────────────────────────────
  const instrCard = el("div",{class:"card",style:{marginBottom:"var(--s-4)"}});
  instrCard.appendChild(el("div",{class:"card__title"},"Instruksjon"));
  const instrDesc = el("p",{class:"card__note",style:{marginBottom:"var(--s-3)"}});
  instrCard.appendChild(instrDesc);
  const instrTextarea = el("textarea",{class:"textarea",rows:"5", maxlength:"1500",
    style:{marginBottom:"var(--s-3)"},
    placeholder:"F.eks: Vær streng på verbbøyning."});
  instrTextarea.addEventListener("input",()=>{ instructionsDraft = instrTextarea.value; });
  instrCard.appendChild(instrTextarea);
  const instrErr = el("p",{class:"card__note",style:{color:"var(--danger)",marginBottom:"var(--s-2)",display:"none"}});
  instrCard.appendChild(instrErr);
  const instrBtn = el("button",{class:"btn btn--primary",
    click: async ()=>{
      const value = instructionsDraft.trim();
      const target = currentTarget();
      if(!value){ instrErr.textContent="Instruksjoner kan ikke være tomme."; instrErr.style.display=""; return; }
      if(scopeType!=="all" && !target){ instrErr.textContent="Velg en klasse eller minst én elev først."; instrErr.style.display=""; return; }
      instrErr.style.display="none"; instrBtn.disabled=true; instrBtn.textContent="Lagrer…";
      const r = scopeType==="all"
        ? await api("/api/teacher/ai-defaults/instructions",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({instructions:value})})
        : await api("/api/teacher/ai-defaults/instructions/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target,instructions:value})});
      if(r.ok){
        const data = await r.json();
        toast(scopeType==="all" ? "✓ Standard lagret" : `✓ Brukt på ${data.student_count} elev(er)`);
      }else{
        const d = await r.json().catch(()=>({detail:"Ukjent feil"}));
        instrErr.textContent = typeof d.detail==="string" ? d.detail : "Kunne ikke lagre";
        instrErr.style.display="";
      }
      instrBtn.disabled=false; updateInstrButtonLabel();
    }
  },"Lagre");
  instrCard.appendChild(instrBtn);
  function updateInstrButtonLabel(){
    instrDesc.textContent = scopeType==="all"
      ? "Gjelder automatisk for enhver elev som ikke har sin egen innstilling."
      : `Skrives rett inn i innstillingene til ${scopeLabel()}.`;
    instrBtn.textContent = scopeType==="all" ? "Lagre som standard" : `Bruk på ${scopeLabel()}`;
  }
  frag.appendChild(instrCard);

  // ── Rapportlayout ────────────────────────────────────────────────────
  const rcCard = el("div",{class:"card",style:{marginBottom:"var(--s-4)"}});
  rcCard.appendChild(el("div",{class:"card__title"},"Rapportlayout"));
  const rcDesc = el("p",{class:"card__note",style:{marginBottom:"var(--s-3)"}});
  rcCard.appendChild(rcDesc);

  const rcTabRow = el("div",{style:{display:"flex",gap:"var(--s-2)",marginBottom:"var(--s-3)"}});
  rcCard.appendChild(rcTabRow);
  [["essay","Stil"],["reading_summary","Gjenfortelling"]].forEach(([surface,label])=>{
    rcTabRow.appendChild(el("button",{
      class:"pill", "aria-pressed": activeSurface===surface ? "true" : "false",
      click: ()=>{
        activeSurface=surface;
        [...rcTabRow.children].forEach((btn,i)=>{
          btn.setAttribute("aria-pressed", ["essay","reading_summary"][i]===surface ? "true" : "false");
        });
        loadAndRenderBlocks();
      }
    }, label));
  });

  const rcBodyHost = el("div",{});
  rcCard.appendChild(rcBodyHost);

  async function loadAndRenderBlocks(){
    rcBodyHost.innerHTML="";
    rcBodyHost.appendChild(el("p",{class:"card__note"},"Laster…"));
    if(!blocksDraft[activeSurface]){
      blocksDraft[activeSurface] = await fetchDefaultBlocks(activeSurface);
    }
    renderBlockRows();
  }

  async function fetchDefaultBlocks(surface){
    const r = await api(`/api/teacher/ai-defaults/report-config?surface=${surface}`).catch(()=>null);
    const cfg = r?.ok ? await r.json() : null;
    return cfg ? cfg.blocks.map(b=>({type:b.type, params:b.params||{}, instruction:b.instruction||null})) : [];
  }

  function renderBlockRows(){
    rcBodyHost.innerHTML="";
    const draft = blocksDraft[activeSurface];
    const listEl = el("div",{});
    rcBodyHost.appendChild(listEl);
    function renderList(){
      listEl.innerHTML="";
      if(!draft.length){
        listEl.appendChild(el("p",{class:"card__note",style:{fontStyle:"italic",padding:"6px 0"}},"Ingen seksjoner valgt."));
      }
      draft.forEach((block,i)=>{
        const row = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",padding:"8px 10px",
          background:"var(--surface-head)",borderRadius:"var(--r-btn)",marginBottom:"var(--s-1)"}});
        row.appendChild(el("span",{style:{flex:"1",fontSize:"var(--t-sm)",fontWeight:"600"}}, REPORT_BLOCK_LABELS[block.type]||block.type));
        row.appendChild(el("button",{class:"icon-btn",disabled:i===0,
          click:()=>{ [draft[i-1],draft[i]]=[draft[i],draft[i-1]]; renderList(); }},"↑"));
        row.appendChild(el("button",{class:"icon-btn",disabled:i===draft.length-1,
          click:()=>{ [draft[i+1],draft[i]]=[draft[i],draft[i+1]]; renderList(); }},"↓"));
        row.appendChild(el("button",{class:"icon-btn",style:{color:"var(--danger)"},
          click:()=>{ draft.splice(i,1); renderList(); }},"✕"));
        listEl.appendChild(row);
      });
    }
    renderList();

    const addRow = el("div",{style:{display:"flex",gap:"var(--s-2)",marginTop:"var(--s-2)",marginBottom:"var(--s-1)"}});
    const addSelect = el("select",{class:"select",style:{flex:"1"}},
      ...REPORT_BLOCK_TYPES.map(t=>el("option",{value:t},REPORT_BLOCK_LABELS[t])));
    addRow.appendChild(addSelect);
    addRow.appendChild(el("button",{class:"btn",
      click:()=>{ draft.push({type:addSelect.value, params:{}, instruction:null}); renderList(); }
    },icon("plus"),"Legg til blokk"));
    rcBodyHost.appendChild(addRow);
  }

  const rcErr = el("p",{class:"card__note",style:{color:"var(--danger)",margin:"var(--s-2) 0",display:"none"}});
  rcCard.appendChild(rcErr);
  const rcBtn = el("button",{class:"btn btn--primary",
    click: async ()=>{
      const draft = blocksDraft[activeSurface];
      const target = currentTarget();
      if(!draft.length){ rcErr.textContent="Rapporten må ha minst én seksjon."; rcErr.style.display=""; return; }
      if(scopeType!=="all" && !target){ rcErr.textContent="Velg en klasse eller minst én elev først."; rcErr.style.display=""; return; }
      rcErr.style.display="none"; rcBtn.disabled=true; rcBtn.textContent="Lagrer…";
      const r = scopeType==="all"
        ? await api(`/api/teacher/ai-defaults/report-config?surface=${activeSurface}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({blocks:draft})})
        : await api(`/api/teacher/ai-defaults/report-config/apply?surface=${activeSurface}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target,blocks:draft})});
      if(r.ok){
        const data = await r.json();
        toast(scopeType==="all" ? "✓ Standard rapportlayout lagret" : `✓ Brukt på ${data.student_count} elev(er)`);
      }else{
        const d = await r.json().catch(()=>({detail:"Ukjent feil"}));
        rcErr.textContent = typeof d.detail==="string" ? d.detail : "Kunne ikke lagre";
        rcErr.style.display="";
      }
      rcBtn.disabled=false; updateRcButtonLabel();
    }
  },"Lagre");
  rcCard.appendChild(rcBtn);
  function updateRcButtonLabel(){
    rcDesc.textContent = scopeType==="all"
      ? "Gjelder automatisk for enhver elev som ikke har sin egen rapportlayout."
      : `Skrives rett inn i rapportlayouten til ${scopeLabel()}.`;
    rcBtn.textContent = scopeType==="all" ? "Lagre som standard" : `Bruk på ${scopeLabel()}`;
  }
  frag.appendChild(rcCard);

  // ── Forhåndsvis ──────────────────────────────────────────────────────
  // Prompt-testing only supports the essay surface (backend constraint —
  // the reading corpus lives only in this file's own lesing-tekster.json,
  // not on the server), so this always previews the essay layout above,
  // regardless of which Rapportlayout tab is open.
  const previewCard = el("div",{class:"card"});
  previewCard.appendChild(el("div",{class:"card__title"},"Forhåndsvis"));
  previewCard.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-3)"}},
    "Kjør instruksjonen og rapportlayouten for stiler over — slik de står nå, ulagret — mot en ekte elevtekst. Påvirker ingenting før du trykker Lagre/Bruk over."));

  const previewStudentSelect = el("select",{class:"select",style:{marginBottom:"var(--s-2)"}});
  previewCard.appendChild(previewStudentSelect);
  const previewEssaySelect = el("select",{class:"select",style:{marginBottom:"var(--s-2)"}});
  previewCard.appendChild(previewEssaySelect);
  const previewPasteArea = el("textarea",{class:"textarea",rows:"4",placeholder:"…eller lim inn en tekst å teste mot",
    style:{marginBottom:"var(--s-2)"}});
  previewCard.appendChild(previewPasteArea);

  const previewErr = el("p",{class:"card__note",style:{color:"var(--danger)",marginBottom:"var(--s-2)",display:"none"}});
  previewCard.appendChild(previewErr);

  const previewBtn = el("button",{class:"btn btn--primary",
    click: async ()=>{
      const studentId = previewStudentSelect.value;
      if(!studentId){ previewErr.textContent="Velg en elev å forhåndsvise mot."; previewErr.style.display=""; return; }
      const pasted = previewPasteArea.value.trim();
      const essayId = previewEssaySelect.value;
      let source, sourceLabel;
      if(pasted){ source={kind:"pasted",text:pasted}; sourceLabel="Innlimt tekst"; }
      else if(essayId){ source={kind:"essay",essay_id:essayId}; sourceLabel=previewEssaySelect.selectedOptions[0]?.textContent||"Stil"; }
      else{ previewErr.textContent="Velg en stil eller lim inn en tekst."; previewErr.style.display=""; return; }
      if(!blocksDraft.essay){ blocksDraft.essay = await fetchDefaultBlocks("essay"); }
      if(!blocksDraft.essay.length){ previewErr.textContent="Rapportlayouten for stiler må ha minst én seksjon."; previewErr.style.display=""; return; }
      previewErr.style.display="none"; previewBtn.disabled=true; previewBtn.textContent="Kjører…";
      const r = await api(`/api/teacher/students/${encodeURIComponent(studentId)}/prompt-test`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({surface:"essay", blocks:blocksDraft.essay, source, instructions_override: instructionsDraft.trim()||null}),
      });
      if(r.ok){
        const data = await r.json();
        const rawText = claudeText(data.reply);
        const jsonText = rawText.replace(/```json?\n?/gi,"").replace(/```/g,"").trim();
        try{
          const parsed = JSON.parse(jsonText);
          const studentName = (teacherState.students||[]).find(s=>s.id===studentId)?.name || "eleven";
          teacherState.aiFokusPreviewResults.unshift({sourceLabel:`${studentName} — ${sourceLabel}`, parsed, at:new Date()});
          renderPreviewResults();
        }catch(e){
          previewErr.textContent="Svaret kunne ikke tolkes. Prøv igjen.";
          previewErr.style.display="";
        }
      }else{
        const d = await r.json().catch(()=>({detail:"Ukjent feil"}));
        previewErr.textContent = aiFailureMessage(r.status, d?.detail?.reason||"", "");
        previewErr.style.display="";
      }
      previewBtn.disabled=false; previewBtn.textContent="Kjør forhåndsvisning";
    }
  },"Kjør forhåndsvisning");
  previewCard.appendChild(previewBtn);

  const previewResultsHost = el("div",{style:{marginTop:"12px"}});
  previewCard.appendChild(previewResultsHost);
  function renderPreviewResults(){
    previewResultsHost.innerHTML="";
    if(!teacherState.aiFokusPreviewResults.length) return;
    previewResultsHost.appendChild(el("div",{class:"label-mono",style:{marginBottom:"var(--s-2)"}},"Forhåndsvisninger denne økten"));
    teacherState.aiFokusPreviewResults.forEach(entry=>{
      const box = el("div",{style:{marginBottom:"var(--s-3)",paddingBottom:"var(--s-3)",borderBottom:"1px solid var(--line-soft)"}});
      box.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-1)"}},
        `${$esc(entry.sourceLabel)} · ${entry.at.toLocaleTimeString("nb-NO")}`));
      const resultContainer = el("div",{});
      box.appendChild(resultContainer);
      renderEssayClaudeResult(entry.parsed, resultContainer);
      previewResultsHost.appendChild(box);
    });
  }

  async function loadPreviewEssayOptions(){
    const studentId = previewStudentSelect.value;
    previewEssaySelect.innerHTML="";
    if(!studentId){
      previewEssaySelect.appendChild(el("option",{value:""},"Velg elev først"));
      return;
    }
    previewEssaySelect.appendChild(el("option",{value:""},"Laster stiler…"));
    const r = await api(`/api/teacher/students/${encodeURIComponent(studentId)}/essays`).catch(()=>null);
    const essays = r?.ok ? await r.json() : [];
    previewEssaySelect.innerHTML="";
    previewEssaySelect.appendChild(el("option",{value:""}, essays.length?"Velg en stil…":"Ingen stiler levert ennå"));
    essays.forEach(e=>previewEssaySelect.appendChild(el("option",{value:e.id},`${e.title} (${new Date(e.created_at).toLocaleDateString("nb-NO")})`)));
  }
  previewStudentSelect.addEventListener("change", loadPreviewEssayOptions);

  function renderPreviewStudentOptions(){
    let ids = null;
    if(scopeType==="students") ids = [...scopeStudentIds];
    else if(scopeType==="class" && scopeClassId) ids = (teacherState.students||[]).filter(s=>s.class_id===scopeClassId).map(s=>s.id);
    const pool = ids ? (teacherState.students||[]).filter(s=>ids.includes(s.id)) : (teacherState.students||[]);
    const prevValue = previewStudentSelect.value;
    previewStudentSelect.innerHTML="";
    previewStudentSelect.appendChild(el("option",{value:""},"Velg en elev…"));
    pool.forEach(s=>previewStudentSelect.appendChild(el("option",{value:s.id},s.name)));
    if(pool.some(s=>s.id===prevValue)){ previewStudentSelect.value=prevValue; }
    loadPreviewEssayOptions();
  }

  frag.appendChild(previewCard);
  renderPreviewResults();

  // ── Initial load ─────────────────────────────────────────────────────
  (async ()=>{
    await ensureTeacherRoster();
    renderScopePicker();
    renderPreviewStudentOptions();

    const r = await api("/api/teacher/ai-defaults/instructions").catch(()=>null);
    const data = r?.ok ? await r.json() : {instructions:null};
    instructionsDraft = data.instructions || "";
    instrTextarea.value = instructionsDraft;
    updateInstrButtonLabel();

    await loadAndRenderBlocks();
    updateRcButtonLabel();
  })();

  return frag;
}

// Rating widget attached under an AI feedback block (essay/retell/sentence).
// Distinct from the teacher→student comment/Like widget — this one is teacher→AI.
function buildAiRatingWidget(sourceType, sourceId){
  const wrap = el("div",{style:{marginTop:"var(--s-3)",paddingTop:"var(--s-3)",borderTop:"1px solid var(--line-soft)"}});
  wrap.appendChild(el("div",{class:"field__label",style:{marginBottom:"2px"}},
    "Vurder AI-tilbakemeldingen"));
  wrap.appendChild(el("p",{class:"card__note",style:{marginBottom:"var(--s-2)"}},
    "Skriv hva AI-en bør gjøre annerledes. Kommentaren sendes ikke til eleven — den brukes til å styre framtidige AI-tilbakemeldinger til denne eleven."));

  const commentInput = el("textarea",{class:"textarea",rows:"3",
    placeholder:"F.eks: Du var for streng på ordstilling. Legg mer vekt på substantivbøying neste gang.",
    style:{marginBottom:"var(--s-2)"}});
  wrap.appendChild(commentInput);

  const hint = el("p",{class:"card__note",style:{marginBottom:"var(--s-2)"}},
    "Velg Bra eller Dårlig for å lagre. Kommentaren lagres ikke av seg selv.");
  wrap.appendChild(hint);

  const btnRow = el("div",{class:"actions"});
  const submitRating = async (rating)=>{
    const s = teacherState.selectedStudent;
    upBtn.disabled = true; downBtn.disabled = true;
    try{
      const r = await api("/api/teacher/ai-ratings",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          student_id: s.id,
          source_type: sourceType,
          source_id: String(sourceId),
          rating,
          comment: commentInput.value.trim()||null,
        }),
      });
      if(r.ok){
        const hadComment = !!commentInput.value.trim();
        commentInput.disabled = true;
        upBtn.className = rating==="up" ? "btn btn--primary" : "btn";
        downBtn.className = rating==="down" ? "btn btn--primary" : "btn";
        // Persistent confirmation — a toast disappears before the teacher can read it,
        // and they need to know the comment will actually reach the next AI call.
        hint.style.color = "var(--green)";
        hint.textContent = hadComment
          ? `Lagret "${rating==="up"?"Bra":"Dårlig"}" med kommentar. Kommentaren blir lagt til i de neste AI-tilbakemeldingene til denne eleven.`
          : `Lagret "${rating==="up"?"Bra":"Dårlig"}". Legg til en kommentar neste gang hvis du vil styre hva AI-en gjør annerledes.`;
      } else {
        upBtn.disabled = false; downBtn.disabled = false;
        hint.style.color = "var(--danger)";
        hint.textContent = "Kunne ikke lagre. Prøv igjen.";
      }
    }catch(e){
      upBtn.disabled = false; downBtn.disabled = false;
      hint.style.color = "var(--danger)";
      hint.textContent = "Kunne ikke lagre. Prøv igjen.";
    }
  };
  const upBtn = el("button",{class:"btn", click:()=>submitRating("up")},"Bra");
  const downBtn = el("button",{class:"btn", click:()=>submitRating("down")},"Dårlig");
  btnRow.appendChild(upBtn);
  btnRow.appendChild(downBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

// ── Study plan view ────────────────────────────────────────────────────────
function buildLaererPlan(){
  const frag = document.createDocumentFragment();
  const s = teacherState.selectedStudent;

  frag.appendChild(el("button",{class:"btn",style:{marginBottom:"var(--s-3)"},
    click:()=>laererSetView("progress")},"← Tilbake"));
  frag.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"var(--s-1)"}},`Studieplan: ${$esc(s?.name||"")}`));

  const wrap = el("div",{style:{display:"flex",flexDirection:"column",gap:"var(--s-2)"}});
  frag.appendChild(wrap);

  async function load(){
    if(!teacherState.studentPlan){
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/plan`).catch(()=>null);
      teacherState.studentPlan = r?.ok ? await r.json() : null;
    }
    wrap.innerHTML="";
    const plan = teacherState.studentPlan;
    if(!plan || !plan.data?.setup){
      wrap.appendChild(el("p",{class:"card__note",style:{marginTop:"var(--s-3)"}},"Eleven har ikke opprettet en studieplan ennå.")); return;
    }

    // Load texts JSON so we can resolve text references
    await loadLesingTexts();

    const {weeks, setup} = plan.data;
    const readIds = new Set(plan.texts_read_ids||[]);
    const essaysDone = new Set(plan.essays_written||[]);

    // ── Summary header
    const totalTexts = weeks.reduce((n,w)=>n+w.texts.length,0);
    const doneTexts  = weeks.reduce((n,w)=>n+w.texts.filter(t=>{
      const tx=getPlanText(t.topicKey,t.textSlot); return tx&&readIds.has(tx.id);
    }).length,0);
    const progPct = totalTexts ? Math.round(doneTexts/totalTexts*100) : 0;

    const hdr = el("div",{class:"card"});
    const meta = el("p",{class:"card__note",style:{marginBottom:"var(--s-2)"}});
    meta.textContent=`${setup.months} mnd · ${setup.daysPerWeek} dag${setup.daysPerWeek>1?"er":""}/uke · ${weeks.length} uker · start: ${new Date(setup.startDate).toLocaleDateString("nb-NO")}`;
    hdr.appendChild(meta);

    const sumRow = el("div",{style:{display:"flex",gap:"var(--s-4)",flexWrap:"wrap",marginBottom:"var(--s-2)",fontSize:"var(--t-base)"}});
    sumRow.appendChild(el("span",{},`Tekster: ${doneTexts}/${totalTexts}`));
    hdr.appendChild(sumRow);

    hdr.appendChild(el("p",{class:"card__note",style:{marginBottom:"4px"}},`Lesefremdrift: ${progPct}%`));
    const pw=el("div",{class:"plan-prog-wrap"});
    pw.appendChild(el("div",{class:"plan-prog-fill",style:{width:progPct+"%"}}));
    hdr.appendChild(pw);

    if(plan.updated_at){
      hdr.appendChild(el("p",{class:"card__note",style:{marginTop:"var(--s-2)"}},
        `Sist oppdatert: ${new Date(plan.updated_at).toLocaleDateString("nb-NO")}`));
    }
    wrap.appendChild(hdr);

    // ── Week list
    const todayISO = new Date().toISOString().slice(0,10);
    weeks.forEach((week,i)=>{
      const isCurrent = week.weekStartISO <= todayISO &&
        (i===weeks.length-1 || weeks[i+1].weekStartISO > todayISO);
      const weekTexts = week.texts.map(t=>getPlanText(t.topicKey,t.textSlot)).filter(Boolean);
      const weekDone  = weekTexts.filter(t=>readIds.has(t.id)).length;
      const essayPrompts = week.essayPrompts || (week.essayPrompt?[week.essayPrompt]:[]);
      const essaysDoneCount = essayPrompts.filter(p=>essaysDone.has(p.title)||essaysDone.has(p.id)).length;

      const sec = el("div",{});
      const hdrRow = el("div",{
        style:{display:"flex",alignItems:"center",gap:"var(--s-2)",padding:"10px 14px",
          background:isCurrent?"var(--green-tint)":"var(--surface-head)",
          borderRadius:"var(--r-btn)",border:`1px solid ${isCurrent?"var(--green)":"var(--line)"}`,cursor:"pointer"},
        click(){
          const body=sec.querySelector(".plan-week-teacher-body");
          body.style.display=body.style.display==="none"?"block":"none";
        }
      });
      if(isCurrent) hdrRow.appendChild(el("span",{class:"tag",style:{background:"var(--green)",color:"#fff",whiteSpace:"nowrap",flexShrink:"0"}},"Nåværende uke"));
      hdrRow.appendChild(el("span",{style:{fontWeight:"700",minWidth:"60px"}},`Uke ${week.weekNum}`));
      const teacherWeekTopic=el("span",{class:"card__note",style:{flex:"1",display:"flex",alignItems:"center",gap:"6px"}});
      teacherWeekTopic.appendChild(el("span",{class:"pill__swatch",style:{background:topicTema(week.topicKey).bg,width:"9px",height:"9px"}}));
      teacherWeekTopic.appendChild(document.createTextNode(week.topicName));
      hdrRow.appendChild(teacherWeekTopic);
      hdrRow.appendChild(el("span",{class:"card__note",style:{whiteSpace:"nowrap"}},$esc(week.dateRange||"")));
      hdrRow.appendChild(el("span",{style:{fontSize:"var(--t-sm)",marginLeft:"var(--s-2)"}},
        `${weekDone}/${weekTexts.length} tekster`+(essayPrompts.length?` · ${essaysDoneCount}/${essayPrompts.length} stiler`:"")));
      sec.appendChild(hdrRow);

      const body = el("div",{class:"plan-week-teacher-body",style:{display:isCurrent?"block":"none",padding:"var(--s-2) 0 4px"}});

      // Texts
      weekTexts.forEach(text=>{
        const done = readIds.has(text.id);
        const row = el("div",{
          style:{display:"flex",alignItems:"center",gap:"var(--s-2)",padding:"6px 10px",
            borderRadius:"var(--r-btn)",marginBottom:"4px",cursor:"pointer",
            background:done?"var(--green-tint)":"var(--surface)",border:"1px solid "+(done?"var(--green)":"var(--line)")},
          click:async()=>{
            setLesingText(text); state.tab="lesing"; renderContent();
          }
        });
        row.appendChild(el("span",{class:"status__dot",style:{display:"inline-block",background:done?"var(--status-learned)":"var(--line-strong)"}}));
        row.appendChild(el("span",{style:{flex:"1",fontSize:"var(--t-sm)",fontWeight:done?"600":"400"}},$esc(text.title)));
        row.appendChild(el("span",{class:"btn--link"},"Åpne →"));
        body.appendChild(row);
      });

      // Essays
      essayPrompts.forEach(prompt=>{
        const done = essaysDone.has(prompt.title)||essaysDone.has(prompt.id);
        const row = el("div",{
          style:{display:"flex",alignItems:"center",gap:"var(--s-2)",padding:"6px 10px",
            borderRadius:"var(--r-btn)",marginBottom:"4px",
            background:done?"var(--green-tint)":"var(--surface)",border:"1px solid "+(done?"var(--green)":"var(--line)")}
        });
        row.appendChild(el("span",{class:"status__dot",style:{display:"inline-block",background:done?"var(--status-learned)":"var(--line-strong)"}}));
        row.appendChild(el("span",{class:"card__note"},$esc(prompt.title)));
        body.appendChild(row);
      });

      // Word target
      if(week.wordTarget){
        const wrow = el("p",{class:"card__note",style:{padding:"4px 10px"}});
        wrow.textContent=`Ordmål: ${week.wordTarget} ord`;
        body.appendChild(wrow);
      }

      sec.appendChild(body);
      wrap.appendChild(sec);
    });
  }
  load();
  return frag;
}

// ── Texts read view ────────────────────────────────────────────────────────
function buildLaererTexts(){
  const frag = document.createDocumentFragment();
  const s = teacherState.selectedStudent;

  frag.appendChild(el("button",{class:"btn",style:{marginBottom:"var(--s-3)"},
    click:()=>laererSetView("progress")},"← Tilbake"));
  frag.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"var(--s-1)"}},`Tekster lest: ${$esc(s?.name||"")}`));

  const wrap = el("div",{style:{display:"flex",flexDirection:"column",gap:"var(--s-2)"}});
  frag.appendChild(wrap);

  async function load(){
    if(!teacherState.studentTexts){
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/texts`).catch(()=>null);
      teacherState.studentTexts = r?.ok ? await r.json() : [];
    }
    wrap.innerHTML="";
    if(!teacherState.studentTexts.length){
      wrap.appendChild(el("p",{class:"card__note"},"Ingen tekster lest ennå.")); return;
    }

    const note = el("p",{class:"card__note",style:{margin:"var(--s-1) 0 var(--s-3)"}});
    note.textContent=`${teacherState.studentTexts.length} tekst${teacherState.studentTexts.length!==1?"er":""} lest`;
    wrap.appendChild(note);

    // Load summaries for badge display (use cache if already loaded)
    if(!teacherState.studentSummaries){
      const sr = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/reading-summaries`).catch(()=>null);
      teacherState.studentSummaries = sr?.ok ? await sr.json() : [];
    }
    const summarizedIds = new Set((teacherState.studentSummaries||[]).map(sm=>sm.text_id));

    teacherState.studentTexts.forEach(t=>{
      const card=el("div",{class:"card",style:{cursor:"pointer"},
        click:async()=>{
          // Navigate to reading tab and open this text
          const texts = await loadLesingTexts();
          const found = texts.find(tx=>tx.id===t.text_id);
          if(found){
            lesingState.currentText=found;
            state.tab="lesing";
            renderContent();
          } else {
            alert(`Kunne ikke åpne teksten (ID: ${t.text_id})`);
          }
        }
      });
      const top=el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",flexWrap:"wrap"}});
      top.appendChild(el("span",{class:"card__title",style:{fontSize:"14.5px",flex:"1"}},$esc(t.title||t.text_id)));
      if(t.topic){ const tema=topicTema(t.topic); top.appendChild(el("span",{class:"tag",style:{background:tema.bg,color:tema.fg}},$esc(t.topic))); }
      if(t.level) top.appendChild(el("span",{class:"tag"},$esc(t.level)));
      if(summarizedIds.has(t.text_id)) top.appendChild(el("span",{class:"tag"},"Sammendrag skrevet"));
      card.appendChild(top);
      const sub=el("div",{style:{display:"flex",gap:"var(--s-4)",marginTop:"4px"}});
      sub.appendChild(el("p",{class:"card__note"},`Lest ${t.times_read}× · Sist: ${new Date(t.last_read).toLocaleDateString("nb-NO")}`));
      sub.appendChild(el("span",{class:"btn--link"},"Åpne tekst →"));
      card.appendChild(sub);
      wrap.appendChild(card);
    });
  }
  load();
  return frag;
}

// ── Word bank view ─────────────────────────────────────────────────────────
function buildLaererWords(){
  const frag = document.createDocumentFragment();
  const s = teacherState.selectedStudent;

  frag.appendChild(el("button",{class:"btn",style:{marginBottom:"var(--s-3)"},
    click:()=>laererSetView("progress")},"← Tilbake"));
  frag.appendChild(el("div",{class:"topbar__title",style:{marginBottom:"var(--s-1)"}},`Ordbank: ${$esc(s?.name||"")}`));

  const wrap = el("div",{});
  frag.appendChild(wrap);

  async function load(){
    if(!teacherState.studentWords){
      const r = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/words`).catch(()=>null);
      teacherState.studentWords = r?.ok ? await r.json() : [];
    }
    wrap.innerHTML="";
    if(!teacherState.studentWords.length){
      wrap.appendChild(el("p",{class:"card__note",style:{marginTop:"var(--s-3)"}},"Ingen ord i ordbanken ennå.")); return;
    }

    // Resolve word provenance to text titles. The teacher's own session index is no use
    // here — a custom text lives in the student's assignments, not the teacher's — so the
    // map is built per student, the same way buildLaererSummaries resolves its titles.
    const srcTitles={};
    const sysTexts = await loadLesingTexts().catch(()=>[]);
    (sysTexts||[]).forEach(t=>{ srcTitles[`builtin:${t.id}`]=t.title; });
    const ar = await api(`/api/teacher/students/${encodeURIComponent(s.id)}/assignments`).catch(()=>null);
    if(ar?.ok){
      const assignments = await ar.json().catch(()=>[]);
      (assignments||[]).forEach(a=>(a.items||[]).forEach(it=>{
        if(it.item_type!=="reading_text") return;
        srcTitles[`custom:asgn-${it.item_id}`]=it.content?.title||"Egen tekst";
      }));
    }
    const srcTitle = w => w.source_text_id
      ? (srcTitles[`${w.source_text_kind||"builtin"}:${w.source_text_id}`]||null) : null;

    const total = teacherState.studentWords.reduce((s,g)=>s+g.total,0);
    const practiced = teacherState.studentWords.reduce((s,g)=>s+g.practiced,0);
    const summary = el("div",{class:"card",style:{marginBottom:"var(--s-4)"}});
    summary.appendChild(el("span",{style:{fontWeight:"700"}},`Totalt: ${total} ord — `));
    summary.appendChild(document.createTextNode(`${practiced} øvd (${total?Math.round(practiced/total*100):0}%), ${total-practiced} ikke øvd`));
    wrap.appendChild(summary);

    teacherState.studentWords.forEach(group=>{
      const sec = el("div",{style:{marginBottom:"var(--s-3)"}});
      const hdr = el("div",{style:{display:"flex",alignItems:"center",gap:"var(--s-2)",cursor:"pointer",padding:"10px 14px",background:"var(--surface-head)",borderRadius:"var(--r-btn)",border:"1px solid var(--line)"},
        click(){
          const body=sec.querySelector(".word-group-body");
          body.style.display=body.style.display==="none"?"block":"none";
        }
      });
      const pct = group.total ? Math.round(group.practiced/group.total*100) : 0;
      hdr.appendChild(el("span",{style:{fontWeight:"700",flex:"1"}},$esc(group.topic)));
      hdr.appendChild(el("span",{class:"card__note"},$esc(`${group.total} ord`)));
      const bar=el("div",{style:{width:"80px",height:"8px",background:"var(--line)",borderRadius:"var(--r-pill)",overflow:"hidden"}});
      bar.appendChild(el("div",{style:{width:`${pct}%`,height:"100%",background:pct>=70?"var(--status-learned)":pct>=30?"var(--status-doing)":"var(--danger)",borderRadius:"var(--r-pill)"}}));
      hdr.appendChild(bar);
      hdr.appendChild(el("span",{class:"card__note"},$esc(`${group.practiced}/${group.total} øvd`)));
      sec.appendChild(hdr);

      const body = el("div",{class:"word-group-body",style:{display:"none",marginTop:"4px"}});
      const tbl = el("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:"var(--t-sm)"}});
      const thead=el("tr",{style:{background:"var(--surface-head)"}});
      ["Ord","Betydning","Forklaring","Kategori","Øvd"].forEach(h=>thead.appendChild(el("th",{style:{padding:"6px 10px",textAlign:"left",fontWeight:"600",borderBottom:"1px solid var(--line)"}},$esc(h))));
      tbl.appendChild(thead);
      group.words.forEach(w=>{
        const examples=(w.examples||[]).filter(e=>typeof e==="string"&&e.trim());
        const origin=srcTitle(w);
        const tr=el("tr",{style:{borderBottom:"1px solid var(--line-soft)",background:w.practiced?"var(--green-tint-2)":"var(--surface)"}});
        tr.appendChild(el("td",{style:{padding:"6px 10px",fontWeight:"500"}},$esc(w.word)));
        tr.appendChild(el("td",{style:{padding:"6px 10px",color:"var(--ink-2)"}},$esc(w.meaning)));
        tr.appendChild(el("td",{style:{padding:"6px 10px",color:"var(--green)",fontStyle:"italic"}},$esc(w.explanation||"")));
        tr.appendChild(el("td",{style:{padding:"6px 10px",color:"var(--ink-3)"}},$esc(w.category)));
        const practicedCell=el("td",{style:{padding:"6px 10px",textAlign:"center"}});
        practicedCell.appendChild(el("span",{class:"status__dot",title:w.practiced?"Øvd":"Ikke øvd",
          style:{display:"inline-block",background:w.practiced?"var(--status-learned)":"var(--line-strong)"}}));
        tr.appendChild(practicedCell);
        tbl.appendChild(tr);

        // Examples and origin go in a detail row that opens on click. Inline they would
        // double the height of a 200-word bank and make it unscannable; a word with
        // neither simply has no detail row, which is not an error (FR-041).
        if(!examples.length && !origin) return;
        const det=el("tr",{style:{display:"none",background:"var(--surface-sunk)"}});
        const cell=el("td",{colSpan:5,style:{padding:"8px 14px 10px 24px",fontSize:"var(--t-mono)",color:"var(--ink-2)",borderBottom:"1px solid var(--line-soft)"}});
        if(examples.length){
          const list=el("ul",{style:{margin:"0",paddingLeft:"16px",lineHeight:"1.6"}});
          examples.forEach(x=>list.appendChild(el("li",{},$esc(x))));
          cell.appendChild(list);
        }
        if(origin) cell.appendChild(el("div",{style:{marginTop:examples.length?"6px":"0",color:"var(--ink-3)"}},$esc(`Møtt i teksten: ${origin}`)));
        det.appendChild(cell);
        tbl.appendChild(det);
        tr.style.cursor="pointer";
        tr.title="Klikk for å se eksempler og kilde";
        tr.addEventListener("click",()=>{ det.style.display=det.style.display==="none"?"table-row":"none"; });
      });
      body.appendChild(tbl);
      sec.appendChild(body);
      wrap.appendChild(sec);
    });
  }
  load();
  return frag;
}

  const frag = document.createDocumentFragment();

  const back=el("button",{class:"btn",style:{marginBottom:"var(--s-3)"},

    aiCard.appendChild(el("div",{class:"card__title",style:{marginBottom:"var(--s-2)"}},"AI-tilbakemelding"));
    try{
      const feedbackData=typeof essay.claude_feedback==="string"
        ?JSON.parse(essay.claude_feedback):essay.claude_feedback;
      const aiContainer=el("div",{});
      renderEssayClaudeResult(feedbackData,aiContainer);
      aiCard.appendChild(aiContainer);
    }catch{
      const aiText=el("div",{style:{whiteSpace:"pre-wrap",lineHeight:"1.7",fontSize:"var(--t-base)"}});
      aiText.textContent=essay.claude_feedback;
      aiCard.appendChild(aiText);
    }
    aiCard.appendChild(buildAiRatingWidget("essay", essay.id));
    frag.appendChild(aiCard);
  }

  // Teacher review form
  const reviewCard=el("div",{class:"card"});
  reviewCard.appendChild(el("div",{class:"card__title",style:{marginBottom:"var(--s-3)"}},"Din tilbakemelding"));

  // Like toggle
  let liked=review?.liked||false;
  const likeBtn=el("button",{
    class: liked ? "btn btn--primary" : "btn",
    style:{marginBottom:"var(--s-3)"},
    click:()=>{
      liked=!liked;
      likeBtn.textContent=liked?"Godkjent ✓":"Godkjenn stilen";
      likeBtn.className=liked?"btn btn--primary":"btn";
    }
  }, liked?"Godkjent ✓":"Godkjenn stilen");
  reviewCard.appendChild(likeBtn);

  // Comment textarea
  reviewCard.appendChild(el("div",{class:"field__label",style:{marginBottom:"var(--s-1)"}},"Kommentar (valgfritt):"));
  const commentArea=el("textarea",{class:"textarea",rows:"4"});
  commentArea.value=review?.comment||"";
  reviewCard.appendChild(commentArea);

  const saveErr=el("p",{class:"card__note",style:{color:"var(--danger)",marginTop:"var(--s-2)",display:"none"}});
  const saveBtn=el("button",{class:"btn btn--primary",style:{marginTop:"var(--s-3)",width:"100%"},
    click: async ()=>{
      saveErr.style.display="none";
      saveBtn.disabled=true; saveBtn.textContent="Lagrer…";
      try{
        const r=await api(`/api/teacher/essays/${encodeURIComponent(essay.id)}/review`,{
          method:"PUT",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({liked, comment:commentArea.value.trim()||null})
        });
        if(r.ok){
          const updated=await r.json();
          // Update cached essay review
          if(teacherState.studentEssays){
            const idx=teacherState.studentEssays.findIndex(e=>e.id===essay.id);
            if(idx>=0) teacherState.studentEssays[idx].teacher_review=updated;
          }
          teacherState.selectedEssay={...essay, teacher_review:updated};
          toast("✓ Tilbakemelding lagret");
          saveBtn.textContent="Lagret ✓";
          saveBtn.disabled=false;
        } else {
          const d=await r.json().catch(()=>({detail:"Ukjent feil"}));
          saveErr.textContent=d.detail||"Kunne ikke lagre";
          saveErr.style.display="";
          saveBtn.textContent="Lagre tilbakemelding";
          saveBtn.disabled=false;
        }
      }catch(e){
        saveErr.textContent="Nettverksfeil";
        saveErr.style.display="";
        saveBtn.textContent="Lagre tilbakemelding";
        saveBtn.disabled=false;
      }
    }
  },"Lagre tilbakemelding");
  reviewCard.appendChild(saveErr);
  reviewCard.appendChild(saveBtn);
  frag.appendChild(reviewCard);

  return frag;
}

function buildLaererSummaries(){
  const frag = document.createDocumentFragment();
